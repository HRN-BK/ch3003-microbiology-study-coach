<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gram+ Vi Sinh</title>
<meta name="description" content="Huấn luyện viên ôn thi cuối kì CH3003 Vi sinh vật học">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F4F4F8; --surface:#FFFFFF; --sunk:#EAEAF2; --line:#D9D9E6;
  --ink:#1B1C2A; --ink2:#55576B; --ink3:#8A8CA0;
  --hema:#3A3F94; --hema-soft:#E3E4F5; --eosin:#C8406F; --eosin-soft:#F8E1EA;
  --good:#1F7A4D; --good-soft:#DDF1E6; --bad:#B3261E; --bad-soft:#F9E0DE; --warn:#9A6400; --warn-soft:#F7ECD6;
  --cb:#3A3F94; --gn:#C8406F;
  --display:"Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12131C; --surface:#1B1C28; --sunk:#242534; --line:#34364A;
    --ink:#E8E8F2; --ink2:#AEB0C4; --ink3:#7E8097;
    --hema:#9CA2F2; --hema-soft:#2A2D55; --eosin:#F08BAE; --eosin-soft:#4A2334;
    --good:#6FD39F; --good-soft:#1C3A2B; --bad:#F2918A; --bad-soft:#452320; --warn:#E8B75C; --warn-soft:#3D2F14;
    --cb:#9CA2F2; --gn:#F08BAE;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12131C; --surface:#1B1C28; --sunk:#242534; --line:#34364A;
  --ink:#E8E8F2; --ink2:#AEB0C4; --ink3:#7E8097;
  --hema:#9CA2F2; --hema-soft:#2A2D55; --eosin:#F08BAE; --eosin-soft:#4A2334;
  --good:#6FD39F; --good-soft:#1C3A2B; --bad:#F2918A; --bad-soft:#452320; --warn:#E8B75C; --warn-soft:#3D2F14;
  --cb:#9CA2F2; --gn:#F08BAE;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.term:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:12px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--eosin) 0 38%,var(--hema) 40% 100%);display:inline-block}
.top .sp{flex:1}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px}
.progress{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.progress>b{display:block;height:100%;background:linear-gradient(90deg,var(--hema),var(--eosin));width:0;transition:width .3s}

/* home */
.hero{padding-block:24px 8px;display:grid;gap:18px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .n{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--hema);font-variant-numeric:tabular-nums}
.count .t{font-size:17px;color:var(--ink2)}
.go{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border:0;border-radius:20px;padding:22px 24px;background:var(--hema);color:#fff;text-align:left;box-shadow:0 10px 30px -12px color-mix(in srgb,var(--hema) 70%,transparent)}
:root[data-theme="dark"] .go{color:#12131C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{color:#12131C}}
.go .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.go .sub{font-size:14px;opacity:.85;margin-top:4px}
.go .arrow{font-size:30px;font-weight:700}
.go:hover{filter:brightness(1.06)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:2px 7px;margin-top:3px;font-family:var(--mono)}
.tag.cb{background:var(--hema-soft);color:var(--cb)}
.tag.gn{background:var(--eosin-soft);color:var(--gn)}
.tag.x{background:var(--sunk);color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;text-align:left}
.stat .v{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--hema);font-weight:600;padding:8px 0;min-height:44px}
.second{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--hema);background:transparent;color:var(--hema);font-weight:600}

/* session */
.sesshead{display:grid;gap:8px;padding-block:4px 14px}
.sesshead .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:grid;gap:16px}
.card h2{font-size:24px}
.hook{background:linear-gradient(160deg,var(--eosin-soft),var(--hema-soft));border:0}
.hook .q{font-size:18px;line-height:1.6}
.stem{font-size:17px;line-height:1.6;white-space:pre-wrap}
.stem pre,.pre{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:4px 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);line-height:1.45}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--hema);background:var(--hema-soft)}
.guess{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);min-height:44px}
.guess input{width:20px;height:20px}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--good)} .fb.no .h{color:var(--bad)}
.note{font-size:14px;background:var(--warn-soft);border-radius:10px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;min-height:32px}
details summary{cursor:pointer;font-weight:600;min-height:32px}
ol.steps{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;border-radius:12px;padding:0 20px;border:0;background:var(--hema);color:var(--surface);font-weight:600}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad)}
.btn.good{background:var(--good)}
.btn.wide{flex:1}
.gloss{font-size:14px;color:var(--ink2);border-left:3px solid var(--eosin);padding-left:10px}
.term{border-bottom:1.5px dotted var(--hema);cursor:help}
.tip{position:fixed;z-index:30;max-width:min(340px,calc(100vw - 32px));background:var(--ink);color:var(--ground);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);display:grid;gap:6px}
.tip b{font-size:15px}
.tip .vi{color:var(--eosin-soft)}
.tip button{justify-self:start;border:1px solid color-mix(in srgb,var(--ground) 40%,transparent);background:transparent;color:var(--ground);border-radius:8px;padding:4px 10px;font-size:13px;min-height:32px}
.flip{min-height:190px;display:grid;place-items:center;text-align:center;font-size:20px;border-radius:16px;border:1.5px dashed var(--line);padding:20px;background:var(--surface);width:100%}
.flip .back{font-size:16px;line-height:1.55;text-align:left}
.vlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.vlist li{border-bottom:1px solid var(--line);padding-bottom:10px}
.vlist .en{font-weight:700}
.vlist .vi{color:var(--gn);font-weight:600}
.we-step{border-left:3px solid var(--line);padding-left:12px;display:grid;gap:8px}
.we-step.done{border-color:var(--good)}
.we-step.now{border-color:var(--hema)}
.numin{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font:inherit;width:160px}
/* mock */
.mockbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.grid40{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid40 button{min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12px;padding:0}
.grid40 .a{background:var(--hema-soft);border-color:var(--hema)}
.grid40 .f{box-shadow:inset 0 -3px 0 var(--warn)}
.grid40 .cur{outline:2px solid var(--ink)}
.grid40 .r{background:var(--good-soft);border-color:var(--good)}
.grid40 .w{background:var(--bad-soft);border-color:var(--bad)}
.score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .t b{display:block;height:100%}
/* progress page */
.heat{display:grid;gap:14px}
.fam{display:grid;gap:6px}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);font-family:var(--mono);font-size:10px;display:grid;place-items:center;color:var(--ink2);background:var(--surface)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field input,.field select,textarea{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--ground);color:var(--ink);padding:8px 12px;font:inherit}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}
.sheetf{display:grid;gap:8px;font-size:15px}
.sheetf h3{font-size:17px;margin-top:6px}
.sheetf ul{margin:0;padding-left:20px}
.sync{font-size:12px;color:var(--ink3)}
/* lessons */
.lesson{display:grid;gap:12px;font-size:16px;line-height:1.65}
.lesson h3{font-size:19px;margin-top:4px}
.lesson p{margin:0}
.lesson ul,.lesson ol{margin:0;padding-left:22px;display:grid;gap:4px}
.lesson ul ul,.lesson ol ul{margin-top:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
.tbl table{border-collapse:collapse;font-size:14px;line-height:1.45;width:max-content;min-width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th,.tbl td{max-width:280px}
.tbl td{min-width:72px}
.tbl th{background:var(--sunk);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.callout{background:var(--hema-soft);border-left:4px solid var(--hema);border-radius:10px;padding:10px 14px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 6px;vertical-align:1px;background:var(--sunk);color:var(--ink2)}
.badge.ext{background:var(--warn-soft);color:var(--warn)}
.badge.fix{background:var(--bad-soft);color:var(--bad)}
.extbox{background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.extbox>summary{color:var(--warn)}
.libunit{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:48px}
.libunit .st{margin-left:auto;flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--ink2)}
.libunit .st.weak,.libunit .st.critical{background:var(--bad-soft);color:var(--bad)}
.libunit .st.ok{background:var(--warn-soft);color:var(--warn)}
.libunit .st.mastered{background:var(--good-soft);color:var(--good)}
.trapl{margin:0;padding-left:20px;display:grid;gap:4px}
@media (max-width:480px){
  .sync{display:none}
  .iconbtn{padding:0 10px}
  .count .n{font-size:52px}
  .go .big{font-size:24px}
  .card{padding:18px 16px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:22px}
  .bar{grid-template-columns:88px 1fr 42px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" aria-label="Về trang chính"><i></i>Gram+</button>
    <span class="sp"></span>
    <span class="sync" id="sync"></span>
    <button class="iconbtn" id="btnLib" aria-label="Thư viện bài học">Bài học</button>
    <button class="iconbtn" id="btnProgress" aria-label="Tiến độ">Tiến độ</button>
    <button class="iconbtn" id="btnSettings" aria-label="Cài đặt">⚙</button>
  </header>
  <main id="app"></main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script type="application/json" id="db">/*__DB__*/</script>
<script>
(function(){
"use strict";
const DB = JSON.parse(document.getElementById('db').textContent);
const $ = s => document.querySelector(s);
const app = $('#app');
const KEY = 'ch3003.coach.v1';

/* ---------- indexes ---------- */
const U = {}; DB.units.forEach(u => U[u.id] = u);
const Q = {}; DB.questions.forEach(q => Q[q.id] = q);
const F = {}; DB.flashcards.forEach(f => F[f.id] = f);
const W = {}; DB.workedExamples.forEach(w => W[w.id] = w);
const V = {}; DB.vocab.forEach((v, i) => { v._i = i; V[v.term.toLowerCase()] = v; });
const byUnit = {}; // unit -> {q:[], f:[], v:[], we:[]}
DB.units.forEach(u => byUnit[u.id] = {q:[], f:[], v:[], we:[]});
DB.questions.forEach(q => byUnit[q.unit] && byUnit[q.unit].q.push(q.id));
DB.flashcards.forEach(f => byUnit[f.unit] && byUnit[f.unit].f.push(f.id));
DB.vocab.forEach(v => byUnit[v.unit] && byUnit[v.unit].v.push(v._i));
DB.workedExamples.forEach(w => { const u = weUnit(w); if (byUnit[u]) byUnit[u].we.push(w.id); });
function weUnit(w){ let u = String(w.unit||'').split('/')[0].trim(); if (!U[u]) { const m = u.match(/^[A-Z]{3}-\d+/); u = m ? m[0] : u; } return u; }
const ORDER = DB.meta.order;
const FAMILIES = DB.meta.families.map(f => f.id);
const FAMNAME = {}, FAMSHORT = {}; DB.meta.families.forEach(f => { FAMNAME[f.id] = f.name; FAMSHORT[f.id] = f.short || f.name; });
const BLUEPRINT = DB.meta.blueprint;
const MOCK_N = FAMILIES.reduce((a,f) => a + (BLUEPRINT[f]||0), 0);
const MOCK_MIN = DB.meta.mockMinutes || 70;
const fam = uid => String(uid||'').slice(0,3);
const scope = fam;
const TONE = {HIS:'cb', BAC:'cb', FUN:'cb', PRO:'cb', VIR:'cb', IDT:'cb', CTL:'gn', GRO:'gn', APP:'gn'};
const itemUnit = id => (Q[id]||F[id]||W[id]) ? (Q[id]||F[id]||{unit:weUnit(W[id]||{})}).unit : vocabById(id) ? vocabById(id).unit : null;
function vocabById(id){ const m = /^VR?-(\d+)$/.exec(id); return m ? DB.vocab[+m[1]] : null; }

/* ---------- dates ---------- */
const DAY = 86400000;
const toNum = s => { const [y,m,d] = s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/DAY); };
const toStr = n => new Date(n*DAY).toISOString().slice(0,10);
const DEV_SHIFT = (() => { try { return +localStorage.getItem('ch3003.dev.shift') || 0; } catch (e) { return 0; } })();
const todayNum = () => { const d = new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/DAY) + DEV_SHIFT; };
const fmtDate = n => { const d = new Date(n*DAY); return d.getUTCDate() + '/' + (d.getUTCMonth()+1); };

/* ---------- state ---------- */
function freshState(){ return {v:1, updatedAt:0, settings:{examDate:DB.meta.defaultExamDate, dailyMin:150}, items:{}, units:{}, we:{}, sessions:{}, mocks:[], resume:null, traps:{}}; }
let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return Object.assign(freshState(), s); } } catch(e){}
  return freshState();
}
let dbRef = null, dbTimer = null, dbBusy = false, dbDirty = false;
function save(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (dbRef) { dbDirty = true; clearTimeout(dbTimer); dbTimer = setTimeout(flushDb, 2500); }
}
async function flushDb(){
  if (!dbRef || dbBusy || !dbDirty) return;
  const body = JSON.stringify(S);
  if (body.length > 240000) { setSync('Tiến độ quá lớn để đồng bộ, vẫn lưu trên máy'); return; }
  dbBusy = true; dbDirty = false;
  try { await dbRef.set({state: body, updatedAt: S.updatedAt}); setSync('Đã lưu ☁'); }
  catch(e){ dbDirty = true; setSync('Lưu trên máy'); }
  dbBusy = false;
  if (dbDirty) { clearTimeout(dbTimer); dbTimer = setTimeout(flushDb, 3000); }
}
function setSync(t){ $('#sync').textContent = t; }
(async function initDb(){
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db');
    if (!db) return;
    const ref = db.doc('progress/state');
    const snap = await ref.get();
    if (snap.exists) {
      const d = snap.data();
      if (d && d.state && (d.updatedAt||0) > (S.updatedAt||0)) {
        try { const s = JSON.parse(d.state); if (s && s.v === 1) { S = Object.assign(freshState(), s); try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} if (view === 'home') renderHome(); } } catch(e){}
      }
    }
    dbRef = ref; setSync('Đồng bộ ☁');
    if ((S.updatedAt||0) > ((snap.exists && snap.data().updatedAt) || 0)) { dbDirty = true; flushDb(); }
  } catch(e){ setSync('Lưu trên máy'); }
})();
window.addEventListener('pagehide', () => { if (dbDirty) flushDb(); });

/* ---------- Leitner ---------- */
const INTERVAL = [0,1,3,7,14];
function st(id){ return S.items[id]; } // [box,due,seen,correct,streak,last]
function register(id, due){ if (!S.items[id]) S.items[id] = [0, due, 0, 0, 0, 0]; }
function capDue(d){ const ex = toNum(S.settings.examDate) - 1; const t = todayNum(); return (ex > t) ? Math.min(d, ex) : d; }
function grade(id, correct, guess){
  const t = todayNum();
  register(id, t);
  const s = S.items[id];
  s[2]++; s[5] = t;
  if (correct && !guess){ s[0] = Math.min(4, Math.max(1, s[0]+1)); s[3]++; s[4]++; s[1] = capDue(t + INTERVAL[s[0]]); }
  else if (correct && guess){ s[0] = Math.max(1, s[0]); s[3]++; s[1] = t + 1; }
  else { s[0] = 1; s[4] = 0; s[1] = t + 1; }
  const u = itemUnit(id);
  if (u && U[u]) { const us = unitSt(u); us.ema = 0.7*us.ema + 0.3*(correct?1:0); }
  if (id[0]==='V' && s[0] >= 2 && id.startsWith('V-')) register('VR-'+id.slice(2), t+1);
}
function unitSt(u){ return S.units[u] || (S.units[u] = {intro:0, ema:0.5, mockErr:0}); }
function mastery(u){
  const b = byUnit[u]; if (!b) return 0;
  const ids = b.q.filter(id => Q[id].pool !== 'mock').concat(b.f);
  if (!ids.length) return 0;
  let sum = 0; ids.forEach(id => { const s = st(id); sum += s ? s[0]/4 : 0; });
  const us = S.units[u];
  return 0.5*(sum/ids.length) + 0.5*(us ? us.ema : 0);
}
function unitState(u){ const us = S.units[u]; if (!us || !us.intro) return 'new'; const m = mastery(u); const b = byUnit[u]; const ids = b.q.concat(b.f); const seen = ids.filter(id => st(id) && st(id)[2]>0).length / Math.max(1,ids.length); if (us.critical && m < 0.6) return 'critical'; if (m < 0.6) return 'weak'; if (m >= 0.85 && seen >= 0.8) return 'mastered'; return 'ok'; }
const introduced = () => DB.units.filter(u => S.units[u.id] && S.units[u.id].intro).map(u => u.id);

/* ---------- utils ---------- */
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function weightedPick(arr, wf, n, avoidSeq){
  const pool = arr.map(x => ({x, w: Math.max(0.01, wf(x))}));
  const out = [];
  while (out.length < n && pool.length){
    let tot = pool.reduce((a,b)=>a+b.w,0), r = Math.random()*tot, i = 0;
    for (; i < pool.length; i++){ r -= pool[i].w; if (r <= 0) break; }
    i = Math.min(i, pool.length-1);
    out.push(pool[i].x); pool.splice(i,1);
  }
  return out;
}
function noSameUnitInRow(ids){
  const out = []; const rest = ids.slice();
  while (rest.length){
    const last = out.length ? itemUnit(out[out.length-1]) : null;
    const lastSc = last ? scope(last) : null;
    let i = rest.findIndex(id => itemUnit(id) !== last && scope(itemUnit(id)||'') !== lastSc);
    if (i < 0) i = rest.findIndex(id => itemUnit(id) !== last);
    if (i < 0) i = 0;
    out.push(rest.splice(i,1)[0]);
  }
  return out;
}

/* ---------- rich text + vocab tooltips ---------- */
const TERMS = [];
DB.vocab.forEach(v => { [v.term].concat(v.aliases||[]).forEach(t => { if (t && t.length > 1) TERMS.push([t, v._i]); }); });
TERMS.sort((a,b) => b[0].length - a[0].length);
const TERMMAP = {}; TERMS.forEach(([t,i]) => { const k = t.toLowerCase(); if (!(k in TERMMAP)) TERMMAP[k] = i; });
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const TERMRE = TERMS.length ? new RegExp('(^|[^\\p{L}\\p{N}])(' + TERMS.map(t => reEsc(esc(t[0]))).join('|') + ')(?![\\p{L}\\p{N}])', 'giu') : null;
let tipsOn = true;
function rich(text, terms, ctx){
  let s = esc(text);
  if (terms && tipsOn && TERMRE){
    const c = ctx || {used:new Set(), count:0, max:3};
    s = s.replace(TERMRE, (m, pre, t) => {
      const k = t.toLowerCase().replace(/&amp;/g,'&');
      const i = TERMMAP[k]; if (i == null || c.used.has(i) || c.count >= c.max) return m;
      c.used.add(i); c.count++;
      return pre + '<span class="term" tabindex="0" data-v="' + i + '">' + t + '</span>';
    });
  }
  // italic first (may sit inside bold: **a *Genus* b**, ***Genus***), then bold
  s = s.replace(/(^|[^*\w]|\*\*)\*([^*\s](?:[^*\n]*?[^*\s])?)\*(?=\*\*|[^*\w]|$)/gm, '$1<i>$2</i>').replace(/\*\*([^*]+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/\[(fig|mở rộng|hiệu chỉnh)\]/g, (m, t) => '<span class="badge' + (t === 'mở rộng' ? ' ext' : t === 'hiệu chỉnh' ? ' fix' : '') + '" title="' + (t === 'fig' ? 'Kiến thức từ hình trong slide' : t === 'mở rộng' ? 'Kiến thức mở rộng ngoài slide' : 'Slide có lỗi, đã hiệu chỉnh') + '">' + (t === 'fig' ? 'hình' : t) + '</span>');
  return s;
}
/* light markdown: paragraphs, - / 1. lists (2-space nesting), | tables |, > callouts */
function md(text, terms){
  const ctx = {used:new Set(), count:0, max:14};
  const R = x => rich(x, terms, ctx);
  const lines = String(text||'').split('\n');
  let out = '', i = 0;
  const isTbl = l => /^\s*\|.*\|\s*$/.test(l);
  const isLi = l => /^(\s*)([-*]|\d+\.)\s+/.exec(l);
  while (i < lines.length){
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (isTbl(l)) {
      const rows = []; while (i < lines.length && isTbl(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      const head = cells(body[0]);
      out += '<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + R(c) + '</th>').join('') + '</tr></thead><tbody>' + body.slice(1).map(r => '<tr>' + cells(r).map(c => '<td>' + R(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if (/^\s*>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out += '<div class="callout">' + buf.map(R).join('<br>') + '</div>';
      continue;
    }
    if (isLi(l)) {
      // build nested list by indentation
      const items = [];
      while (i < lines.length && (isLi(lines[i]) || (lines[i].trim() && /^\s{2,}\S/.test(lines[i]) && items.length))) {
        const m = isLi(lines[i]);
        if (m) items.push({ind: m[1].length, ord: /\d/.test(m[2]), txt: lines[i].slice(m[0].length)});
        else items[items.length-1].txt += ' ' + lines[i].trim();
        i++;
      }
      const build = (from, ind) => {
        let h = '', k = from; const ord = items[from].ord;
        h += ord ? '<ol>' : '<ul>';
        while (k < items.length && items[k].ind >= ind) {
          if (items[k].ind > ind) { const [sub, nk] = build(k, items[k].ind); h = h.replace(/<\/li>$/, '') + sub + '</li>'; k = nk; continue; }
          h += '<li>' + R(items[k].txt) + '</li>'; k++;
        }
        return [h + (ord ? '</ol>' : '</ul>'), k];
      };
      let k = 0; while (k < items.length) { const [h, nk] = build(k, items[k].ind); out += h; k = nk; }
      continue;
    }
    const buf = []; while (i < lines.length && lines[i].trim() && !isTbl(lines[i]) && !isLi(lines[i]) && !/^\s*>/.test(lines[i])) buf.push(lines[i++]);
    out += '<p>' + R(buf.join(' ')) + '</p>';
  }
  return out;
}
function richBlock(text, terms){
  // lines that look like tables go into <pre>
  const lines = String(text||'').split('\n');
  const tableish = l => /\|/.test(l) || /\S {3,}\S/.test(l);
  let out = '', buf = [];
  const flush = () => { if (buf.length){ out += '<pre>' + esc(buf.join('\n')) + '</pre>'; buf = []; } };
  lines.forEach((l, i) => {
    if (tableish(l) && lines.filter(tableish).length >= 2) buf.push(l);
    else { flush(); out += rich(l, terms) + (i < lines.length-1 ? '\n' : ''); }
  });
  flush();
  return out;
}

/* ---------- planner ---------- */
function daysLeft(){ return toNum(S.settings.examDate) - todayNum(); }
function remainingUnits(){
  const ip = (S.inProgress||[]).filter(u => !(S.units[u] && S.units[u].intro));
  return ip.concat(ORDER.filter(u => !(S.units[u] && S.units[u].intro) && !ip.includes(u)));
}
function planToday(){
  const D = daysLeft();
  const rem = remainingUnits();
  const R = rem.length;
  if (D <= 0) return {kind:'review', D, units:[]};
  const M = Math.max(2, Math.min(7, Math.round(D/3)));
  if (R > 0 && (D > M || D > 2)) {
    const L = Math.max(1, D - M);
    const n = Math.min(R, L === 1 ? R : Math.max(1, Math.round(R / L)));
    const units = rem.slice(0, n);
    let minutes = units.reduce((a,u) => a + (U[u].minutes||20), 0);
    const express = new Set();
    if (D <= 4) units.forEach(u => express.add(u));
    else {
      const order = [u => U[u].priority==='L', u => U[u].priority==='M' && (U[u].difficulty||2)===1, u => U[u].priority==='M' && (U[u].difficulty||2)===2];
      for (const f of order){ for (const u of units){ if (minutes <= 100) break; if (f(u) && !express.has(u)){ express.add(u); minutes -= (U[u].minutes||20)*0.5; } } }
    }
    return {kind:'learn', D, units, express:[...express]};
  }
  // reserved phase
  if (D === 1) return {kind:'final', D};
  if (D === 2) return {kind:'light', D};
  const pattern = {3:'mock',4:'drill',5:'mock',6:'marathon',7:'mock'};
  let kind = pattern[D] || 'mock';
  if (D > 7) kind = (D % 2) ? 'mock' : 'drill';
  if (kind === 'mock' && S.mocks.some(m => m.day === todayNum())) kind = 'extra';
  return {kind, D};
}
const KIND_VI = {learn:'Học bài mới + ôn', mock:'Thi thử 50 câu + sửa lỗi', marathon:'Marathon bài tính', drill:'Bẫy "NOT" & đọc dữ liệu', light:'Nhẹ: ôn + mini-mock', final:'Tờ công thức cuối', review:'Ôn tập', extra:'Luyện thêm'};

/* ---------- queue builders ---------- */
function dueItems(filter){
  const t = todayNum();
  return Object.keys(S.items).filter(id => { const s = S.items[id]; return s[1] <= t && (!filter || filter(id)); })
    .sort((a,b) => (S.items[a][1] - S.items[b][1]) || (mastery(itemUnit(a)) - mastery(itemUnit(b))));
}
const isQF = id => id.startsWith('Q-') || id.startsWith('F-');
const isVocab = id => /^VR?-/.test(id);
function balanced(ids, n){
  // round-robin across families so one topic never floods the review block
  const g = {}; ids.forEach(id => { const f = fam(itemUnit(id)); (g[f] = g[f] || []).push(id); });
  const keys = Object.keys(g); const out = [];
  while (out.length < n && keys.some(k => g[k].length)) keys.forEach(k => { if (out.length < n && g[k].length) out.push(g[k].shift()); });
  return out;
}
function scale(n){ return Math.max(1, Math.round(n * (S.settings.dailyMin||150) / 150)); }
function stepFor(id){ return id.startsWith('Q-') ? {t:'q', id} : id.startsWith('F-') ? {t:'fc', id} : isVocab(id) ? {t:'vc', id} : {t:'we', id}; }
function pickUnitQs(u, n, exclude){
  const qs = byUnit[u].q.filter(id => Q[id].pool !== 'mock' && !(exclude && exclude.has(id)));
  const unseen = qs.filter(id => !st(id) || !st(id)[2]);
  const src = unseen.length >= n ? unseen : qs;
  const byType = {}; shuffle(src).forEach(id => (byType[Q[id].type] = byType[Q[id].type] || []).push(id));
  const out = []; const types = Object.keys(byType);
  while (out.length < n && types.some(t => byType[t].length)) types.forEach(t => { if (out.length < n && byType[t].length) out.push(byType[t].shift()); });
  return out.sort((a,b) => (Q[a].difficulty||2) - (Q[b].difficulty||2));
}
function unitSteps(u, express){
  const unit = U[u]; const steps = [];
  const blk = 'Bài mới: ' + FAMNAME[fam(u)];
  steps.push({t:'hook', unit:u, blk});
  (unit.lesson||[]).forEach((c,i) => steps.push({t:'lesson', unit:u, i, blk}));
  if (!express && (unit.extension||[]).length) steps.push({t:'ext', unit:u, blk});
  (unit.keyCards||[]).forEach((c,i) => steps.push({t:'card', unit:u, i, blk}));
  pickUnitQs(u, express ? 3 : 5).forEach(id => steps.push({t:'q', id, blk}));
  steps.push({t:'unitDone', unit:u, blk});
  return steps;
}
function mixedIds(n, exclude, filter){
  const intro = introduced();
  const cand = [];
  intro.forEach(u => byUnit[u].q.forEach(id => { if (Q[id].pool !== 'mock' && !exclude.has(id) && (!filter || filter(id))) cand.push(id); }));
  const t = todayNum();
  const w = id => { const u = Q[id].unit; const m = mastery(u); const s = st(id); const wk = ['weak','critical'].includes(unitState(u)) ? 2 : 1; const fresh = !s || !s[2] ? 1.2 : (s[1] <= t ? 1.1 : 0.6); return (1.05 - m) * wk * fresh; };
  let picked = weightedPick(cand, w, n);
  return noSameUnitInRow(picked);
}
function buildQueue(plan){
  const t = todayNum(); const steps = []; const used = new Set();
  const add = (s, blk) => { s.blk = s.blk || blk; steps.push(s); if (s.id) used.add(s.id); };
  const reviewBlock = (cap) => { balanced(dueItems(id => isQF(id)), cap).forEach(id => add(stepFor(id), 'Ôn cách quãng')); };
  const weDue = () => Object.keys(S.we).filter(id => S.we[id].due <= t);
  if (plan.kind === 'learn'){
    reviewBlock(scale(35));
    S.inProgress = plan.units.slice();
    plan.units.forEach((u, k) => { unitSteps(u, plan.express.includes(u)).forEach(s => add(s)); if (k < plan.units.length - 1) add({t:'break'}, 'Nghỉ'); });
    add({t:'break'}, 'Nghỉ');
    // drill
    const todays = plan.units.slice();
    const newWE = []; todays.forEach(u => byUnit[u].we.forEach(w => newWE.push(w)));
    newWE.forEach(w => add({t:'we', id:w, level:0}, 'Luyện bài tính'));
    shuffle(weDue().filter(w => !newWE.includes(w))).slice(0, 2).forEach(w => add({t:'we', id:w}, 'Luyện bài tính'));
    const calc = mixedIds(scale(4), used, id => Q[id].type === 'calc');
    calc.forEach(id => add({t:'q', id}, 'Luyện bài tính'));
    // mixed (introduced + today's units count as introduced at unitDone; pre-include today's)
    todays.forEach(u => { unitSt(u); });
    const tmpIntro = todays.filter(u => !S.units[u].intro); tmpIntro.forEach(u => S.units[u].intro = -1);
    mixedIds(scale(plan.D <= 14 && (21 - plan.D) % 7 === 6 ? 18 : 9), used).forEach(id => add({t:'q', id}, 'Trộn bài'));
    tmpIntro.forEach(u => S.units[u].intro = 0);
    // vocab
    todays.forEach(u => { if (byUnit[u].v.length) add({t:'vlist', unit:u}, 'Từ vựng'); });
    dueItems(isVocab).slice(0, scale(40)).forEach(id => add({t:'vc', id}, 'Từ vựng'));
  } else if (plan.kind === 'mock'){
    add({t:'mock', k: nextMockK()}, 'Thi thử');
  } else if (plan.kind === 'marathon'){
    Object.keys(S.we).forEach(w => add({t:'we', id:w, level:3}, 'Marathon bài tính'));
    reviewBlock(scale(25));
    mixedIds(scale(15), used, id => Q[id].type !== 'calc').forEach(id => add({t:'q', id}, 'Giữ kiến thức'));
  } else if (plan.kind === 'drill'){
    mixedIds(scale(40), used, id => Q[id].type === 'not' || Q[id].type === 'data').forEach(id => add({t:'q', id}, 'NOT & dữ liệu'));
    Object.keys(S.items).filter(id => isVocab(id) && S.items[id][0] <= 2).slice(0, scale(60)).forEach(id => add({t:'vc', id}, 'Quét từ vựng'));
  } else if (plan.kind === 'light'){
    reviewBlock(scale(25));
    add({t:'mini', n:20}, 'Mini-mock');
    add({t:'traps'}, 'Danh sách bẫy');
  } else if (plan.kind === 'final'){
    add({t:'sheet'}, 'Tờ công thức');
    Object.keys(S.items).filter(id => isQF(id) && S.items[id][0] <= 1).slice(0, 15).forEach(id => add(stepFor(id), 'Thẻ yếu nhất'));
  } else { // review / extra
    reviewBlock(scale(30));
    mixedIds(scale(15), used).forEach(id => add({t:'q', id}, 'Luyện điểm yếu'));
    dueItems(isVocab).slice(0, 30).forEach(id => add({t:'vc', id}, 'Từ vựng'));
  }
  if (!steps.length) mixedIds(10, used).forEach(id => add({t:'q', id}, 'Luyện thêm'));
  add({t:'done'}, 'Xong');
  return steps;
}
function extraQueue(){
  const used = new Set(); const steps = [];
  balanced(dueItems(isQF), 15).forEach(id => { steps.push(Object.assign(stepFor(id), {blk:'Ôn thêm'})); used.add(id); });
  mixedIds(15, used).forEach(id => steps.push({t:'q', id, blk:'Điểm yếu'}));
  if (!steps.length && !introduced().length) return null;
  steps.push({t:'done', blk:'Xong'});
  return steps;
}
function nextMockK(){ return S.mocks.filter(m => !m.mini).length + 1; }
function mockItems(k){
  const out = [];
  FAMILIES.forEach(f => {
    let pool = DB.questions.filter(q => fam(q.unit) === f && q.pool === 'mock' && q.mockSet === k).map(q => q.id);
    // keep every calc item of the set so each mock has its calculation questions
    const calc = shuffle(pool.filter(id => Q[id].type === 'calc'));
    if (pool.length >= BLUEPRINT[f]) { calc.slice(0, BLUEPRINT[f]).forEach(id => out.push(id)); shuffle(pool.filter(id => !calc.includes(id))).slice(0, BLUEPRINT[f] - Math.min(calc.length, BLUEPRINT[f])).forEach(id => out.push(id)); return; }
    if (pool.length < BLUEPRINT[f]) {
      const extra = DB.questions.filter(q => fam(q.unit) === f && q.pool !== 'mock' && !pool.includes(q.id))
        .sort((a,b) => ((st(a.id)||[0,0,0,0,0,0])[5] - (st(b.id)||[0,0,0,0,0,0])[5]) || (((st(a.id)||[])[2]||0) - ((st(b.id)||[])[2]||0))).map(q => q.id);
      pool = pool.concat(shuffle(extra.slice(0, BLUEPRINT[f]*3)));
    }
    shuffle(pool).slice(0, BLUEPRINT[f]).forEach(id => out.push(id));
  });
  return shuffle(out);
}
function miniItems(n){
  const intro = introduced(); const out = [];
  const cand = DB.questions.filter(q => q.pool !== 'mock' && intro.includes(q.unit));
  return noSameUnitInRow(weightedPick(cand.map(q=>q.id), id => { const s = st(id); return (1.05 - mastery(Q[id].unit)) * (!s || !s[2] ? 1.5 : 1); }, n));
}

/* ---------- session engine ---------- */
let view = 'home';
// Keep today's unfinished daily session aside while an extra one (mock, read-ahead, practice) runs.
function parkDaily(){
  const t = todayNum(), r = S.resume;
  if (r && r.day === t && !r.extra && r.pos < r.steps.length) S.parked = r;
  else if (S.parked && S.parked.day !== t) S.parked = null;
}
function startSession(extra){
  const t = todayNum();
  if (!extra && S.parked) { if (S.parked.day === t) S.resume = S.parked; S.parked = null; }
  if (!extra && S.resume && S.resume.day === t && !S.resume.extra && S.resume.pos < S.resume.steps.length) { view = 'session'; return renderStep(); }

/* worked examples */
function weFill(w, level){
  const fl = w.fadeLevels || {};
  const v = fl[String(level)];
  if (v === 'all') return w.steps.map((_, i) => i);
  if (Array.isArray(v)) return v;
  if (level >= 3) return w.steps.map((_, i) => i);

}
function stepAns(st){ return st.input === 'choice' && st.choices && typeof st.answer === 'number' && st.choices[st.answer] != null ? String(st.choices[st.answer]) : String(st.answer); }
function checkStep(step, val){
  if (step.input === 'choice') return String(val) === String(step.answer) || (step.choices && step.choices[+val] === step.answer);
  if (step.input === 'number'){
    const parse = x => { x = String(x).trim().replace(',', '.'); if (/^-?\d+(\.\d+)?\s*\/\s*\d+(\.\d+)?$/.test(x)) { const [a,b] = x.split('/'); return parseFloat(a)/parseFloat(b); } return parseFloat(x.replace('%','')); };
    const a = parse(val), b = parse(step.answer); if (isNaN(a) || isNaN(b)) return false;

    return Math.abs(a-b) <= tol || (String(step.answer).includes('%') && Math.abs(a/100 - b/100) <= 0.005);
  }
  return null;
}

      else { ws.level = Math.max(ws.level, 1); ws.due = t + 2; }

const mmss = x => String(Math.floor(x/60)).padStart(2,'0') + ':' + String(x%60).padStart(2,'0');
function submitMock(s){
  clearInterval(window._mt);
  let right = 0; const byFam = {}; const errUnits = {};
  s.items.forEach(id => {
    const q = Q[id]; const f = fam(q.unit); byFam[f] = byFam[f] || [0,0]; byFam[f][1]++;
    const ok = s.ans[id] === q.answer;
    if (ok) { right++; byFam[f][0]++; } else { errUnits[q.unit] = (errUnits[q.unit]||0) + 1; if (q.trap) S.traps[q.trap] = (S.traps[q.trap]||0)+1; }
    grade(id, ok, false);
  });
  const score = Math.round(100 * right / s.items.length) / 10;
  s.result = {right, n: s.items.length, score, byFam, errUnits, mins: Math.round((Date.now()-s.startedAt)/60000)};
  S.mocks.push({day: todayNum(), k: s.k, mini: s.t === 'mini', score, byFam});
  Object.keys(errUnits).forEach(u => { const us = unitSt(u); us.mockErr = (us.mockErr||0) + errUnits[u]; });
  if (S.mocks.filter(m => !m.mini).length >= 2) introduced().forEach(u => { if (mastery(u) < 0.6) unitSt(u).critical = true; });
  // repair steps
  if (s.t === 'mock') {
    const weak = Object.keys(errUnits).filter(u => errUnits[u] >= 2);
    const rank = introduced().slice().sort((a,b) => ((errUnits[b]||0) - (errUnits[a]||0)) || (mastery(a) - mastery(b)));
    const targets = [...new Set(weak.concat(rank))].slice(0, 3);
    const rs = [{t:'repairIntro', units:targets, blk:'Sửa lỗi'}];
    const used = new Set(s.items);
    targets.forEach(u => {
      (U[u].keyCards||[]).forEach((c,i) => rs.push({t:'card', unit:u, i, blk:'Sửa lỗi'}));
      pickUnitQs(u, 8, used).forEach(id => { used.add(id); rs.push({t:'q', id, blk:'Sửa lỗi'}); });
    });
    S.resume.steps.splice(S.resume.pos + 1, 0, ...rs);

}

  if (b.v.length) h += '<details class="card"><summary>Từ vựng của bài (' + b.v.length + ')</summary><ul class="vlist" style="margin-top:10px">' + b.v.map(i => { const v = DB.vocab[i]; return '<li><div><span class="en">' + esc(v.term) + '</span> — <span class="vi">' + esc(v.vi) + '</span></div><div class="small">' + esc(v.def) + '</div></li>'; }).join('') + '</ul></details>';
  h += '<p class="small muted">Nguồn: ' + esc(u.source||'') + ' · ' + b.q.length + ' câu hỏi · ' + b.we.length + ' bài giải mẫu</p>';
  h += '<div class="actions"><button class="btn wide" id="study">' + (intro ? 'Luyện 8 câu bài này' : 'Học bài này ngay (có câu hỏi)') + '</button></div><button class="second" id="back">← Thư viện</button></section>';
  app.innerHTML = h; window.scrollTo({top:0});
  $('#back').onclick = renderLibrary;
  $('#study').onclick = () => {
    const steps = intro ? pickUnitQs(uid, 8).map(id => ({t:'q', id, blk:'Luyện ' + uid})) : unitSteps(uid, false).map(x => Object.assign(x, {blk:'Học trước ' + uid}));
    if (!intro) byUnit[uid].we.forEach(w => steps.push({t:'we', id:w, level:0, blk:'Bài tính'}));
    steps.push({t:'done', blk:'Xong'});
    startCustom(steps);
  };
}
function startCustom(steps){
  const t = todayNum();
  parkDaily();
  S.resume = {day:t, steps, pos:0, kind:'extra', extra:true, answered:0, correct:0, t0:Date.now()};
  if (!S.sessions[t]) S.sessions[t] = {done:false, answered:0, correct:0, kind:'extra'};
  save(); view = 'session'; renderStep();
}

/* ---------- settings ---------- */
function modal(html){ $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal(){ $('#modal').hidden = true; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function renderSettings(){
  modal('<h2>Cài đặt</h2><div class="field"><label for="exam">Ngày thi cuối kì</label><input type="date" id="exam" value="' + esc(S.settings.examDate) + '"></div><div class="field"><label for="mins">Thời gian mỗi ngày</label><select id="mins">' + [90,120,150,180].map(m => '<option value="' + m + '"' + (m === S.settings.dailyMin ? ' selected' : '') + '>' + m + ' phút</option>').join('') + '</select></div><p class="small muted">Đổi ngày thi thì app tự xếp lại lịch từ hôm nay.</p><div class="actions"><button class="btn" id="saveS">Lưu</button><button class="btn ghost" id="mockNow">Thi thử ngay</button></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="field"><label for="io">Sao lưu tiến độ (sao chép hoặc dán JSON)</label><textarea id="io" spellcheck="false"></textarea></div><div class="actions"><button class="btn ghost" id="exp">Xuất</button><button class="btn ghost" id="imp">Nhập</button><button class="btn ghost" id="reset">Xoá tiến độ</button><button class="btn ghost" id="closeS">Đóng</button></div><div id="smsg" class="small"></div>');
  $('#saveS').onclick = () => { const d = $('#exam').value; if (d) S.settings.examDate = d; S.settings.dailyMin = +$('#mins').value; if (S.resume && S.resume.day === todayNum() && S.resume.pos === 0) S.resume = null; save(); closeModal(); renderHome(); };
  $('#mockNow').onclick = () => { closeModal(); startSession('mock'); };
  $('#exp').onclick = () => { const txt = JSON.stringify(S); $('#io').value = txt; $('#io').select(); try { navigator.clipboard.writeText(txt).then(() => $('#smsg').textContent = 'Đã sao chép vào clipboard.', () => $('#smsg').textContent = 'Đã chọn sẵn, bấm Cmd/Ctrl+C để sao chép.'); } catch(e){ $('#smsg').textContent = 'Đã chọn sẵn, bấm Cmd/Ctrl+C để sao chép.'; } };
  $('#imp').onclick = () => { try { const s = JSON.parse($('#io').value); if (!s || s.v !== 1 || !s.items) throw 0; S = Object.assign(freshState(), s); save(); closeModal(); renderHome(); } catch(e){ $('#smsg').textContent = 'Dữ liệu không hợp lệ. Dán đúng đoạn JSON đã xuất.'; } };
  $('#reset').onclick = () => { $('#smsg').innerHTML = 'Xoá toàn bộ tiến độ? Không hoàn tác được. <button class="btn bad" id="rs2" style="min-height:36px">Xoá</button>'; $('#rs2').onclick = () => { S = freshState(); save(); closeModal(); renderHome(); }; };
  $('#closeS').onclick = closeModal;
}
$('#btnSettings').onclick = renderSettings;
$('#btnProgress').onclick = renderProgress;
$('#btnLib').onclick = () => { clearInterval(window._mt); renderLibrary(); };
$('#brand').onclick = () => { clearInterval(window._mt); renderHome(); };

try { renderHome(); } catch(e) { app.innerHTML = '<div class="card"><h2>Dữ liệu tiến độ bị lỗi</h2><p>Bấm để đặt lại tiến độ và mở lại app.</p><button class="btn" id="fix">Đặt lại</button></div>'; $('#fix').onclick = () => { S = freshState(); save(); location.reload(); }; }
})();
</script>
