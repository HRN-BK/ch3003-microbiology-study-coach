ore.","Đó là zygospore."],"vocab":["conidiospore"],"trap":null,"pool":"learn","source":"8. Molds.pptx slide 24","id":"Q-FUN-05-002"},{"unit":"FUN-05","type":"concept","difficulty":2,"stem":"Put the three phases of fungal sexual reproduction in the correct order.","options":["Karyogamy → plasmogamy → meiosis","Plasmogamy → karyogamy → meiosis","Meiosis → plasmogamy → karyogamy","Plasmogamy → meiosis → karyogamy"],"answer":1,"explanation":"Slide 34: **Plasmogamy** (nhân + vào tế bào chất −) → **Karyogamy** (hợp nhân → 2n) → **Meiosis** (→ n).","distractorNotes":["Không thể hợp nhân khi nhân chưa vào chung tế bào chất.","","Giảm phân cần nhân 2n trước.","Giảm phân trước hợp nhân là sai."],"vocab":["plasmogamy","karyogamy"],"trap":"Karyogamy comes before plasmogamy","pool":"learn","source":"8. Molds.pptx slide 34","id":"Q-FUN-05-003"},{"unit":"FUN-05","type":"concept","difficulty":2,"stem":"Basidiospores differ from ascospores in that basidiospores are formed:","options":["inside an ascus","externally on a club-shaped basidium","by mitosis","inside a sporangium"],"answer":1,"explanation":"**Basidiospore** hình thành **bên ngoài** basidium; **ascospore** hình thành **bên trong** ascus.","distractorNotes":["Đó là ascospore.","","Bào tử hữu tính hình thành sau giảm phân.","Sporangium chứa bào tử vô tính."],"vocab":["basidiospore","basidium"],"trap":"Basidiospores form inside the basidium","pool":"learn","source":"","id":"Q-FUN-05-004"},{"unit":"FUN-05","type":"recall","difficulty":1,"stem":"Rhizopus stolonifer, the black bread mold, belongs to the group that produces:","options":["ascospores","basidiospores","zygospores","zoospores only"],"answer":2,"explanation":"*Rhizopus stolonifer* thuộc **Zygomycota** – bào tử hữu tính là **zygospore**; bào tử vô tính là **sporangiospore**.","distractorNotes":["Ascomycota (Neurospora).","Basidiomycota.","","Sai."],"vocab":["zygospore"],"trap":null,"pool":"learn","source":"8. Molds.pptx slide 17","id":"Q-FUN-05-005"},{"unit":"FUN-05","type":"not","difficulty":2,"stem":"Which is NOT an asexual spore of molds?","options":["Sporangiospore","Conidiospore","Zoospore","Ascospore"],"answer":3,"explanation":"Slide 20–21: bào tử vô tính gồm sporangiospore, conidiospore, zoospore. **Ascospore là bào tử hữu tính**.","distractorNotes":["Vô tính.","Vô tính.","Vô tính.",""],"vocab":["ascospore"],"trap":"Asexual spores are formed by meiosis","pool":"learn","source":"","id":"Q-FUN-05-006"},{"unit":"FUN-05","type":"concept","difficulty":2,"stem":"Asexual spores are produced by:","options":["meiosis after karyogamy","mitosis and subsequent cell division of one individual","fusion of two mating types","binary fission of bacteria"],"answer":1,"explanation":"Slide 21: bào tử vô tính do **một cá thể** tạo ra qua **nguyên phân** và phân chia tế bào.","distractorNotes":["Đó là bào tử hữu tính.","","Đó là hữu tính.","Sai."],"vocab":["mitosis"],"trap":null,"pool":"learn","source":"","id":"Q-FUN-05-007"},{"unit":"FUN-05","type":"application","difficulty":2,"stem":"Under the microscope, a mold shows septate hyphae and chains of spores borne openly on brush-like conidiophores. It most likely is:","options":["Rhizopus","Penicillium","Mucor","Allomyces"],"answer":1,"explanation":"Sợi có vách + **conidia trần xếp chuỗi hình chổi** → ***Penicillium***.","distractorNotes":["Rhizopus: sợi cộng bào, sporangium.","","Mucor: sporangium.","Allomyces: zoospore."],"vocab":["conidiospore"],"trap":null,"pool":"learn","source":"","id":"Q-FUN-05-008"},{"unit":"FUN-05","type":"recall","difficulty":1,"stem":"In the mushroom structure, the order from macroscopic to microscopic is:","options":["basidia → gills → basidiocarp → basidiospores","basidiocarp → gills → basidia → basidiospores","gills → basidiospores → basidiocarp → basidia","ascocarp → asci → ascospores"],"answer":1,"explanation":"Slide 41: **quả thể (basidiocarp) → phiến nấm (gill) → đảm (basidia) → bào tử đảm**.","distractorNotes":["Ngược.","","Sai.","Đó là nấm túi."],"vocab":["basidiocarp"],"trap":null,"pool":"mock","source":"8. Molds.pptx slide 41","id":"Q-FUN-05-009","mockSet":3},{"unit":"FUN-05","type":"concept","difficulty":2,"stem":"During plasmogamy:","options":["a haploid nucleus of a donor (+) cell penetrates the cytoplasm of a recipient (−) cell","two nuclei fuse into a diploid nucleus","the diploid nucleus undergoes meiosis","spores are released from a sporangium"],"answer":0,"explanation":"Slide 34: plasmogamy = nhân đơn bội (+) **xâm nhập tế bào chất** (−). Hợp nhân là karyogamy.","distractorNotes":["","Karyogamy.","Meiosis.","Không."],"vocab":["plasmogamy"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-05-010","mockSet":1},{"unit":"FUN-05","type":"recall","difficulty":1,"stem":"Neurospora crassa is shown in the lecture as an example of which group?","options":["Zygomycota","Ascomycota","Basidiomycota","Oomycota"],"answer":1,"explanation":"Slide 18: *Neurospora crassa* – nấm túi (**Ascomycota**), 8 ascospore trong ascus.","distractorNotes":["Rhizopus.","","Itajahya.","Oomycetes là nguyên sinh vật."],"vocab":["ascomycetes"],"trap":null,"pool":"mock","source":"8. Molds.pptx slide 18","id":"Q-FUN-05-011","mockSet":2},{"unit":"FUN-05","type":"not","difficulty":2,"stem":"Which statement about zoospores is NOT correct?","options":["They are motile","They use flagella for locomotion","They are asexual spores","They are formed inside an ascus"],"answer":3,"explanation":"Zoospore là bào tử **vô tính di động bằng roi**; bào tử trong ascus là **ascospore**.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["zoospore"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-05-012","mockSet":1},{"unit":"FUN-06","type":"recall","difficulty":1,"stem":"A lichen is a symbiotic association between:","options":["a fungus and a bacterium that fixes nitrogen only","a fungus and a green alga or cyanobacterium","two different yeasts","a protozoan and an alga"],"answer":1,"explanation":"Địa y = **nấm + tảo lục hoặc vi khuẩn lam** (đối tác quang hợp).","distractorNotes":["Không đủ; đối tác phải quang hợp.","","Sai.","Sai."],"vocab":["lichen"],"trap":"Lichens are a single organism","pool":"learn","source":"8. Molds.pptx slides 44–46","id":"Q-FUN-06-001"},{"unit":"FUN-06","type":"recall","difficulty":1,"stem":"A leaflike lichen with lobes that lift from the surface is described as:","options":["crustose","foliose","fruticose","coenocytic"],"answer":1,"explanation":"**Foliose** = dạng lá. Crustose = dạng vỏ bám phẳng; fruticose = dạng bụi/cành.","distractorNotes":["Dạng vỏ.","","Dạng bụi.","Thuật ngữ sợi nấm."],"vocab":["foliose"],"trap":null,"pool":"learn","source":"","id":"Q-FUN-06-002"},{"unit":"FUN-06","type":"concept","difficulty":2,"stem":"Which method is most appropriate for measuring mold growth in a shaken liquid culture?","options":["Turbidity at 600 nm","Dry weight of the mycelium","Direct count of individual cells in a counting chamber","Counting endospores"],"answer":1,"explanation":"Sợi nấm **kết viên, không đồng nhất** → OD và đếm tế bào không phù hợp → dùng **khối lượng khô**.","distractorNotes":["Sợi nấm làm độ đục không phản ánh sinh khối.","","Không có tế bào riêng rẽ.","Nấm không tạo nội bào tử."],"vocab":["dry weight","biomass"],"trap":"Molds are measured by turbidity","pool":"learn","source":"","id":"Q-FUN-06-003"},{"unit":"FUN-06","type":"not","difficulty":2,"stem":"Which comparison between molds and yeasts is NOT correct?","options":["Molds are filamentous; yeasts are unicellular","Yeasts typically reproduce by budding; molds by spores and fragmentation","Molds have peptidoglycan walls; yeasts have chitin","Both are eukaryotic fungi"],"answer":2,"explanation":"Cả hai đều **không có peptidoglycan**; nấm mốc chủ yếu **chitin**.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["chitin"],"trap":"Molds are unicellular","pool":"learn","source":"","id":"Q-FUN-06-004"},{"unit":"FUN-06","type":"concept","difficulty":2,"stem":"In a lichen, the main role of the algal or cyanobacterial partner is to:","options":["absorb minerals from rock","provide organic compounds by photosynthesis","form the fruiting body","produce zoospores"],"answer":1,"explanation":"Đối tác quang hợp cung cấp **chất hữu cơ**; nấm tạo cấu trúc, giữ nước, hấp thụ khoáng.","distractorNotes":["Vai trò của nấm.","","Của nấm.","Không."],"vocab":["lichen"],"trap":null,"pool":"learn","source":"","id":"Q-FUN-06-005"},{"unit":"FUN-06","type":"application","difficulty":2,"stem":"A student needs the number of Aspergillus spores per mL to inoculate a fermenter quickly. The best method is:","options":["dry weight of the colony","counting the spore suspension in a counting chamber","measuring colony diameter","Gram staining"],"answer":1,"explanation":"Cần **số bào tử/mL nhanh** → **đếm bào tử bằng buồng đếm**.","distractorNotes":["Cho sinh khối, không phải số bào tử.","","Cho tốc độ lan.","Không định lượng."],"vocab":["spore","counting chamber"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-06-006","mockSet":3},{"unit":"FUN-06","type":"recall","difficulty":1,"stem":"Which lichen form is shrubby or branched?","options":["Crustose","Foliose","Fruticose","Septate"],"answer":2,"explanation":"**Fruticose** = dạng bụi/cành.","distractorNotes":["Dạng vỏ.","Dạng lá.","","Không phải dạng địa y."],"vocab":["fruticose"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-06-007","mockSet":1},{"unit":"FUN-06","type":"concept","difficulty":2,"stem":"Why do colony counts (CFU) of a mold not reflect its biomass well?","options":["Molds cannot form colonies","A clump of spores may give one CFU while fragmented mycelium can give many CFU","CFU counts only dead cells","Molds grow only in liquid"],"answer":1,"explanation":"CFU phụ thuộc số **đơn vị** (bào tử/mảnh sợi) chứ không phụ thuộc **khối lượng** sợi.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["CFU","biomass"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-06-008","mockSet":2},{"unit":"CTL-01","type":"recall","difficulty":1,"stem":"Sterilization is defined as:","options":["killing pathogenic vegetative cells on objects","killing all microorganisms, including endospores","reducing microbes on living tissue","inhibiting microbial growth without killing"],"answer":1,"explanation":"Slide 3: **tiệt trùng** = giết **tất cả** vi khuẩn (**tế bào sinh dưỡng + bào tử**).","distractorNotes":["Đó là disinfection.","","Đó là antisepsis.","Đó là -stasis."],"vocab":["sterilization"],"trap":"Disinfection kills spores","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 3","id":"Q-CTL-01-001"},{"unit":"CTL-01","type":"recall","difficulty":1,"stem":"When disinfection is applied directly to living tissue, it is called:","options":["sterilization","antisepsis","pasteurization","sanitization"],"answer":1,"explanation":"Slide 4: khử trùng trên **mô sống** = **antisepsis**; hóa chất gọi là **antiseptic**.","distractorNotes":["Sai.","","Xử lý nhiệt thực phẩm.","Không đúng định nghĩa slide."],"vocab":["antisepsis"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 4","id":"Q-CTL-01-002"},{"unit":"CTL-01","type":"calc","difficulty":2,"stem":"A suspension contains 10⁸ spores/mL. At 121 °C the D-value is 1.5 min. How long must it be heated to reduce the count to 10² spores/mL?","options":["6 min","9 min","4.5 min","12 min"],"answer":1,"explanation":"Số log cần giảm = 8 − 2 = **6**. t = D × 6 = 1,5 × 6 = **9 phút**.","distractorNotes":["Lấy 6 log × 1 phút.","","Tính 3 log.","Tính 8 log."],"vocab":["D-value"],"trap":null,"pool":"learn","source":"","steps":["Số log giảm = log N₀ − log N = 8 − 2 = 6","t = D × số log = 1,5 × 6","t = 9 phút"],"id":"Q-CTL-01-003"},{"unit":"CTL-01","type":"concept","difficulty":2,"stem":"Why does a plot of log(number of survivors) versus heating time give a straight line?","options":["Because a constant number of cells dies each minute","Because a constant fraction of the surviving cells dies each minute","Because all cells die at the same moment","Because spores germinate during heating"],"answer":1,"explanation":"Slide 5: chết theo **tỉ lệ không đổi** → log(sống) giảm tuyến tính theo thời gian.","distractorNotes":["Nếu vậy thì đường số tuyệt đối mới thẳng, không phải log.","","Sai.","Không liên quan."],"vocab":["microbial death rate"],"trap":"Microbes die at a constant number per minute","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 5","id":"Q-CTL-01-004"},{"unit":"CTL-01","type":"not","difficulty":2,"stem":"Which factor does NOT make microbial killing more difficult or slower?","options":["A larger initial number of microbes","The presence of fats and proteins","The presence of endospores","A lower pH"],"answer":3,"explanation":"Slide 7: **pH càng thấp → càng dễ diệt**. Nhiều vi sinh vật, chất béo/protein, bào tử đều làm việc diệt khó hơn.","distractorNotes":["Làm khó hơn.","Làm khó hơn.","Làm khó hơn.",""],"vocab":["pH"],"trap":"Organic matter increases killing","pool":"learn","source":"4.The Control of Microbial Growth.pptx slides 6–7","id":"Q-CTL-01-005"},{"unit":"CTL-01","type":"concept","difficulty":2,"stem":"According to the lecture, what happens to the required exposure time when the treatment temperature is lowered?","options":["It becomes shorter","It becomes longer","It does not change","Spores are killed faster"],"answer":1,"explanation":"Slide 7: **nhiệt độ càng thấp → thời gian tiếp xúc càng dài**.","distractorNotes":["Ngược lại.","","Sai.","Sai."],"vocab":["time of exposure"],"trap":null,"pool":"learn","source":"","id":"Q-CTL-01-006"},{"unit":"CTL-01","type":"calc","difficulty":3,"stem":"The D121 of Clostridium botulinum spores is 0.21 min. How long at 121 °C is a 12D process?","options":["1.75 min","2.52 min","12.21 min","0.21 min"],"answer":1,"explanation":"12D: t = 12 × 0,21 = **2,52 phút**.","distractorNotes":["Chia thay vì nhân.","","Cộng thay vì nhân.","Chỉ 1D."],"vocab":["D-value","12D"],"trap":null,"pool":"learn","source":"","steps":["12D = 12 × D","12 × 0,21 = 2,52 phút"],"id":"Q-CTL-01-007"},{"unit":"CTL-01","type":"recall","difficulty":1,"stem":"The two major mechanisms by which microbial control agents act are:","options":["alteration of membrane permeability and damage to proteins and nucleic acids","stimulating growth and sporulation","blocking flagella and pili","increasing osmotic pressure and pH"],"answer":0,"explanation":"Slide 8: **thay đổi tính thấm màng** và **phá protein, acid nucleic** (phá liên kết hóa học).","distractorNotes":["","Sai.","Sai.","Chỉ là một vài tác nhân vật lý."],"vocab":[],"trap":null,"pool":"mock","source":"4.The Control of Microbial Growth.pptx slide 8","id":"Q-CTL-01-008","mockSet":3},{"unit":"CTL-01","type":"calc","difficulty":2,"stem":"A product initially contains 10⁵ CFU. Heating at 72 °C (D = 0.5 min) is applied for 2 min. How many CFU are expected to survive?","options":["10⁴","10","10³","1"],"answer":1,"explanation":"Số log giảm = t/D = 2/0,5 = **4** → 10⁵⁻⁴ = **10 CFU**.","distractorNotes":["Chỉ giảm 1 log.","","Giảm 2 log.","Giảm 5 log."],"vocab":["D-value"],"trap":null,"pool":"mock","source":"","steps":["Số log giảm = t / D = 2 / 0,5 = 4","log N = 5 − 4 = 1","N = 10 CFU"],"id":"Q-CTL-01-009","mockSet":1},{"unit":"CTL-01","type":"concept","difficulty":2,"stem":"Why do hospitals clean instruments to remove blood and tissue before disinfecting them?","options":["Blood contains antibiotics","Organic matter such as fats and proteins protects microbes and reduces the agent's effectiveness","Cleaning sterilizes the instruments","Disinfectants only work on dry surfaces"],"answer":1,"explanation":"Slide 7: **chất béo và protein bảo vệ vi khuẩn**; rửa còn giảm số lượng ban đầu.","distractorNotes":["Sai.","","Rửa không phải tiệt trùng.","Sai."],"vocab":["disinfection"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-01-010","mockSet":1},{"unit":"CTL-01","type":"not","difficulty":2,"stem":"Which statement about a bacteriostatic agent is NOT correct?","options":["It inhibits growth","Growth may resume when the agent is removed","It kills all spores","It is different from a bactericide"],"answer":2,"explanation":"-static chỉ **ức chế**; không diệt được bào tử (thậm chí không diệt tế bào sinh dưỡng).","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["bacteriostatic"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-01-011","mockSet":2},{"unit":"CTL-01","type":"data","difficulty":2,"stem":"A heating experiment gives these survivor counts:\n\nTime (min) | 0     | 2     | 4\nCFU/mL     | 10^7  | 10^5  | 10^3\n\nWhat is the D-value?","options":["2 min","1 min","0.5 min","4 min"],"answer":1,"explanation":"Mỗi 2 phút giảm 2 log → giảm 1 log mất **1 phút** → D = 1 phút.","distractorNotes":["Đó là thời gian giảm 2 log.","","Sai.","Sai."],"vocab":["D-value"],"trap":null,"pool":"mock","source":"","steps":["Từ 0 → 2 phút: log giảm 7 → 5 = 2 log","D = 2 phút / 2 log = 1 phút"],"id":"Q-CTL-01-012","mockSet":2},{"unit":"CTL-02","type":"recall","difficulty":1,"stem":"Standard autoclave conditions given in the lecture are:","options":["100 °C at normal pressure","121 °C with about 1 atm of extra pressure","170 °C for 2 hours","72 °C for 15 seconds"],"answer":1,"explanation":"Slide 9: **autoclave 121 °C, 1 atm** (áp suất dư ~15 psi) → diệt tế bào sinh dưỡng **và bào tử**.","distractorNotes":["Đó là đun sôi.","","Đó là tủ sấy khô.","Đó là HTST."],"vocab":["autoclave"],"trap":"Boiling sterilizes","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 9","id":"Q-CTL-02-001"},{"unit":"CTL-02","type":"concept","difficulty":2,"stem":"Moist heat kills microbes mainly by:","options":["oxidation of cell components","breaking hydrogen bonds and coagulating proteins","forming thymine dimers","dissolving the cell wall"],"answer":1,"explanation":"Slide 9: nhiệt ẩm **phá liên kết hydro giữa các chuỗi protein → đông tụ protein**. Nhiệt khô mới oxy hóa.","distractorNotes":["Nhiệt khô.","","UV.","Sai."],"vocab":["moist heat"],"trap":"Dry heat coagulates proteins","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 9","id":"Q-CTL-02-002"},{"unit":"CTL-02","type":"recall","difficulty":1,"stem":"HTST pasteurization of milk uses:","options":["63 °C for 30 min","72 °C for 15 s","140 °C for < 1 s","121 °C for 15 min"],"answer":1,"explanation":"Slide 12: **HTST = 72 °C, 15 giây**. Truyền thống 63 °C/30 phút; UHT 140 °C/<1 giây.","distractorNotes":["Truyền thống.","","UHT.","Autoclave."],"vocab":["HTST","pasteurization"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 12","id":"Q-CTL-02-003"},{"unit":"CTL-02","type":"recall","difficulty":1,"stem":"Hot-air (dry heat) sterilization in an oven requires, according to the lecture:","options":["121 °C for 15 min","170 °C for 2 hours","100 °C for 10 min","63 °C for 30 min"],"answer":1,"explanation":"Slide 13: **tủ sấy 170 °C, 2 giờ**.","distractorNotes":["Autoclave.","","Đun sôi.","Thanh trùng."],"vocab":["dry heat"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 13","id":"Q-CTL-02-004"},{"unit":"CTL-02","type":"application","difficulty":2,"stem":"An autoclave reaches 121 °C, but a tightly sealed empty flask inside is not sterile afterwards. The most likely reason is:","options":["121 °C cannot kill spores","Steam could not contact the inside surfaces of the sealed flask","The pressure was too high","Autoclaves only work on liquids"],"answer":1,"explanation":"Slide 9: hơi nước **phải tiếp xúc với bề mặt**. Bình kín chứa không khí khô → bên trong thực chất là nhiệt khô 121 °C, không đủ.","distractorNotes":["121 °C với hơi ẩm diệt được bào tử.","","Sai.","Sai."],"vocab":["autoclave"],"trap":null,"pool":"learn","source":"","id":"Q-CTL-02-005"},{"unit":"CTL-02","type":"not","difficulty":2,"stem":"Which is NOT a dry heat method?","options":["Direct flaming of an inoculating loop","Incineration of contaminated dressings","Hot-air oven at 170 °C","Autoclaving at 121 °C"],"answer":3,"explanation":"**Autoclave** dùng **hơi nước** – nhiệt ẩm.","distractorNotes":["Nhiệt khô.","Nhiệt khô.","Nhiệt khô.",""],"vocab":["dry heat","autoclave"],"trap":null,"pool":"learn","source":"","id":"Q-CTL-02-006"},{"unit":"CTL-02","type":"concept","difficulty":2,"stem":"In an autoclave, what is the role of the increased pressure?","options":["Pressure itself crushes the microbes","It raises the boiling point of water so steam reaches 121 °C","It removes oxygen to kill aerobes","It dries the instruments"],"answer":1,"explanation":"Áp suất cao **nâng nhiệt độ sôi** của nước lên 121 °C; **nhiệt độ** mới là yếu tố diệt.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["autoclave"],"trap":"Pressure kills microbes in the autoclave","pool":"learn","source":"","id":"Q-CTL-02-007"},{"unit":"CTL-02","type":"concept","difficulty":2,"stem":"Pasteurization is designed to:","options":["kill all microbes including spores","kill organisms causing spoilage or disease without seriously damaging the taste of the product","oxidize cell components","remove microbes by filtration"],"answer":1,"explanation":"Slide 12: đun nóng nhẹ, đủ diệt vi sinh vật gây hỏng mà không làm hỏng hương vị.","distractorNotes":["Đó là tiệt trùng.","","Nhiệt khô.","Lọc."],"vocab":["pasteurization"],"trap":"Pasteurization equals sterilization","pool":"mock","source":"","id":"Q-CTL-02-008","mockSet":3},{"unit":"CTL-02","type":"recall","difficulty":1,"stem":"Dry heat kills microorganisms by:","options":["coagulation of proteins through hydrogen bond breakage","oxidation effects","forming pyrimidine dimers","osmotic lysis"],"answer":1,"explanation":"Slide 13: nhiệt khô giết vi sinh vật bằng **oxy hóa**.","distractorNotes":["Nhiệt ẩm.","","UV.","Áp suất thẩm thấu."],"vocab":["dry heat"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-02-009","mockSet":1},{"unit":"CTL-02","type":"application","difficulty":2,"stem":"Which method is most suitable for sterilizing an inoculating loop between transfers?","options":["Autoclaving for 15 min","Direct flaming until red hot","Pasteurization","UV light for 1 h"],"answer":1,"explanation":"Slide 13: **hơ lửa trực tiếp** tiệt trùng que cấy – nhanh, tiện.","distractorNotes":["Quá chậm giữa các lần cấy.","","Không tiệt trùng.","Không cần thiết, kém hiệu quả."],"vocab":["direct flaming"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-02-010","mockSet":2},{"unit":"CTL-02","type":"not","difficulty":2,"stem":"Which statement about boiling (100 °C) is NOT correct?","options":["It kills most vegetative bacteria","It is a reliable sterilization method for endospores","It is a moist heat method","It kills many viruses and fungi"],"answer":1,"explanation":"Đun sôi **không** diệt chắc chắn nội bào tử → không phải tiệt trùng.","distractorNotes":["Đúng.","","Đúng.","Đúng."],"vocab":["boiling"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-02-011","mockSet":3},{"unit":"CTL-03","type":"recall","difficulty":1,"stem":"Filtration is used to sterilize which of the following?","options":["Glassware","Heat-sensitive solutions such as vaccines, enzymes and antibiotic solutions","Contaminated dressings","Inoculating loops"],"answer":1,"explanation":"Slide 20: lọc dùng cho vật liệu **nhạy nhiệt**: một số môi trường, **enzyme, vaccine, dung dịch kháng sinh**.","distractorNotes":["Tủ sấy.","","Thiêu đốt.","Hơ lửa."],"vocab":["filtration"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 20","id":"Q-CTL-03-001"},{"unit":"CTL-03","type":"concept","difficulty":2,"stem":"UV light is effective at about 260 nm because:","options":["it penetrates deeply into materials","DNA strongly absorbs it, forming bonds between adjacent thymines","it heats water","it ionizes water into free radicals"],"answer":1,"explanation":"Slide 26: UV được **DNA hấp thụ mạnh ở 260 nm**, tạo **dimer thymine** → DNA sao chép sai.","distractorNotes":["UV kém xuyên.","","Vi sóng.","Bức xạ ion hóa."],"vocab":["UV","thymine dimer"],"trap":"UV penetrates deeply","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 26","id":"Q-CTL-03-002"},{"unit":"CTL-03","type":"concept","difficulty":2,"stem":"Why are electron beams, rather than UV, used to sterilize disposable syringes inside sealed packages?","options":["Electron beams are nonionizing","Ionizing radiation carries more energy and penetrates deeply","UV is too expensive","Electron beams work by heating"],"answer":1,"explanation":"Bức xạ ion hóa bước sóng < 1 nm, **năng lượng cao, xuyên sâu** qua bao bì; UV **không xuyên** qua nhựa.","distractorNotes":["Sai: chùm electron là ion hóa.","","Không phải lý do.","Sai."],"vocab":["ionizing radiation"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slides 24–25","id":"Q-CTL-03-003"},{"unit":"CTL-03","type":"concept","difficulty":2,"stem":"Ionizing radiation kills cells mainly by:","options":["forming thymine dimers only","ionizing water into reactive free radicals that damage organic components, especially DNA","dehydrating cells","coagulating proteins by heat"],"answer":1,"explanation":"Slide 25: **ion hóa nước → gốc tự do** → phản ứng với thành phần hữu cơ, **đặc biệt DNA**.","distractorNotes":["Đó là UV.","","Sai.","Sai."],"vocab":["ionizing radiation","free radical"],"trap":null,"pool":"learn","source":"","id":"Q-CTL-03-004"},{"unit":"CTL-03","type":"concept","difficulty":2,"stem":"The principle that desiccated bacteria remain viable and resume growth when water is added underlies:","options":["pasteurization","lyophilization (freeze-drying)","autoclaving","incineration"],"answer":1,"explanation":"Slide 21: làm khô → không sinh trưởng nhưng **vẫn sống** → nguyên lý **đông khô** để bảo quản.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["desiccation","lyophilization"],"trap":"Desiccation kills bacteria","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 21","id":"Q-CTL-03-005"},{"unit":"CTL-03","type":"not","difficulty":2,"stem":"Which statement about nonionizing radiation is NOT correct?","options":["Its wavelength is longer than 1 nm","It penetrates poorly, so direct exposure is needed","UV is an example","It is used to sterilize drugs inside sealed containers"],"answer":3,"explanation":"Tiệt trùng trong bao bì kín cần bức xạ **ion hóa** (xuyên sâu). Bức xạ không ion hóa **kém xuyên**.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["nonionizing radiation"],"trap":null,"pool":"learn","source":"","id":"Q-CTL-03-006"},{"unit":"CTL-03","type":"concept","difficulty":2,"stem":"Microwaves kill pathogenic bacteria in food mainly by:","options":["forming thymine dimers","producing heat","ionizing DNA directly","osmotic lysis"],"answer":1,"explanation":"Vi sóng diệt khuẩn chủ yếu nhờ **nhiệt** sinh ra; nhiệt không đều nên có điểm lạnh.","distractorNotes":["UV.","","Bức xạ ion hóa.","Sai."],"vocab":[],"trap":null,"pool":"mock","source":"","id":"Q-CTL-03-007","mockSet":3},{"unit":"CTL-03","type":"application","difficulty":2,"stem":"Bacteria collected on a membrane filter from 100 mL of water are placed on agar and form colonies. What does this show about filtration?","options":["Filtration kills bacteria","Filtration removes bacteria but does not necessarily kill them","Filtration only removes viruses","Membrane filters dissolve bacteria"],"answer":1,"explanation":"Lọc **giữ lại** vi sinh vật; chúng **vẫn sống** trên màng → dùng được để đếm.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["filtration"],"trap":"Filtration kills microbes","pool":"mock","source":"","id":"Q-CTL-03-008","mockSet":1},{"unit":"CTL-03","type":"recall","difficulty":1,"stem":"Ionizing radiation has a wavelength of:","options":["greater than 1 nm","less than about 1 nm","exactly 260 nm","greater than 1 m"],"answer":1,"explanation":"Slide 24: bức xạ ion hóa **< ~1 nm** → năng lượng cao.","distractorNotes":["Đó là không ion hóa.","","UV diệt khuẩn.","Sóng radio."],"vocab":["ionizing radiation"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-03-009","mockSet":2},{"un  thấm ướt**, **dự trữ iodine tự do**.","distractorNotes":["","Sai.","Sai.","Sai."],"vocab":["iodophor","povidone-iodine"],"trap":"Iodophors release iodine all at once","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 33","id":"Q-CTL-04-003"},{"unit":"CTL-04","type":"recall","difficulty":1,"stem":"Chlorine disinfects water because it forms:","options":["iodophors","hypochlorous acid (HOCl), a strong oxidizing agent","thymine dimers","quaternary ammonium ions"],"answer":1,"explanation":"Slide 34: Cl₂ tạo **HOCl** – **chất oxy hóa mạnh** phá hệ enzyme.","distractorNotes":["Iodine.","","UV.","Quats."],"vocab":["chlorine","hypochlorous acid"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 34","id":"Q-CTL-04-004"},{"unit":"CTL-04","type":"not","difficulty":2,"stem":"Which statement about alcohols (ethanol, isopropanol) is NOT correct?","options":["They kill bacteria and fungi","They denature proteins, which requires water","They dissolve membrane lipids","They reliably kill endospores"],"answer":3,"explanation":"Slide 34: cồn **không diệt nội bào tử** (và virus không vỏ).","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["alcohol"],"trap":"Alcohol kills endospores","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 34","id":"Q-CTL-04-005"},{"unit":"CTL-04","type":"concept","difficulty":2,"stem":"Heavy metal ions such as Ag+, Hg2+ and Cu2+ kill microbes by:","options":["oxidizing DNA with UV","binding sulfhydryl (–SH) groups of proteins, causing denaturation","dissolving the cell wall","forming thymine dimers"],"answer":1,"explanation":"Slide 35: ion kim loại nặng **tương tác nhóm –SH** của protein → biến tính.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["heavy metals","sulfhydryl group"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 35","id":"Q-CTL-04-006"},{"unit":"CTL-04","type":"recall","difficulty":1,"stem":"The antimicrobial action of essential oils is mainly due to:","options":["heavy metals","phenolics (carvacrol) and terpenes (limonene)","chlorine","aldehydes"],"answer":1,"explanation":"Slide 32: nhờ **phenolics (carvacrol)** và **terpenes (limonene)**.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["essential oils"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 32","id":"Q-CTL-04-007"},{"unit":"CTL-04","type":"recall","difficulty":1,"stem":"Phenol and O-phenylphenol kill bacteria mainly by:","options":["damaging the lipid-containing plasma membrane, causing leakage of cytoplasm","inhibiting 70S ribosomes","binding –SH groups","forming HOCl"],"answer":0,"explanation":"Slide 30: phá **màng sinh chất chứa lipid** → **mất thành phần tế bào chất**.","distractorNotes":["","Sai.","Kim loại nặng.","Chlorine."],"vocab":["phenol"],"trap":null,"pool":"mock","source":"4.The Control of Microbial Growth.pptx slide 30","id":"Q-CTL-04-008","mockSet":1},{"unit":"CTL-04","type":"concept","difficulty":2,"stem":"Iodine is thought to impair protein synthesis and alter membranes by:","options":["forming complexes with amino acids and unsaturated fatty acids","forming thymine dimers","cross-linking –NH2 groups like aldehydes","acting as a surfactant cation"],"answer":0,"explanation":"Slide 33: iodine **tạo phức với amino acid và acid béo không no**.","distractorNotes":["","UV.","Aldehyde.","Quats."],"vocab":["iodine"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-04-009","mockSet":2},{"unit":"CTL-04","type":"application","difficulty":2,"stem":"A nurse needs to disinfect skin before surgery and also treat a wound. Which agent does the lecture say is used mainly for this purpose?","options":["Glutaraldehyde","Povidone-iodine (Betadine)","Copper sulfate","Formalin"],"answer":1,"explanation":"Slide 33: iodine chủ yếu dùng **sát khuẩn da và điều trị vết thương**.","distractorNotes":["Quá độc với mô sống.","","Diệt tảo.","Độc, dùng bảo quản mẫu."],"vocab":["povidone-iodine"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-04-010","mockSet":3},{"unit":"CTL-04","type":"not","difficulty":2,"stem":"Which agent does NOT act primarily on the plasma membrane?","options":["Chlorhexidine","O-phenylphenol","Silver ions","Alcohols (lipid dissolution)"],"answer":2,"explanation":"Ion bạc tác động **nhóm –SH của protein**; các tác nhân còn lại đều phá màng.","distractorNotes":["Tác động màng.","Tác động màng.","","Có tác động màng."],"vocab":["heavy metals"],"trap":null,"pool":"mock","source":"","id":"Q-CTL-04-011","mockSet":1},{"unit":"CTL-05","type":"recall","difficulty":1,"stem":"Quaternary ammonium compounds (quats) are strongly bactericidal against:","options":["Gram-negative bacteria","Gram-positive bacteria","endospores","non-enveloped viruses"],"answer":1,"explanation":"Slide 37: quats **mạnh với Gram dương**, **kém hơn với Gram âm**.","distractorNotes":["Kém hơn.","","Không.","Không."],"vocab":["quats"],"trap":"Quats are best against Gram-negatives","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 37","id":"Q-CTL-05-001"},{"unit":"CTL-05","type":"recall","difficulty":1,"stem":"Natamycin (pimaricin) approved for use in foods such as cheese is:","options":["a bacteriocin against endospore formers","an antifungal antibiotic","a nitrite","an aldehyde"],"answer":1,"explanation":"Slide 39: **natamycin** là **kháng sinh kháng nấm** dùng trong thực phẩm, chủ yếu phô mai.","distractorNotes":["Đó là nisin.","","Sai.","Sai."],"vocab":["natamycin"],"trap":"Nisin is antifungal","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 39","id":"Q-CTL-05-002"},{"unit":"CTL-05","type":"concept","difficulty":2,"stem":"Nisin is an example of a bacteriocin, which is:","options":["a synthetic dye","a protein produced by one bacterium that inhibits another","an enzyme that digests peptidoglycan","a heavy metal compound"],"answer":1,"explanation":"Slide 39: bacteriocin = **protein do một vi khuẩn tạo ra, ức chế vi khuẩn khác**.","distractorNotes":["Sai.","","Đó là lysozyme.","Sai."],"vocab":["bacteriocin","nisin"],"trap":null,"pool":"learn","source":"","id":"Q-CTL-05-003"},{"unit":"CTL-05","type":"recall","difficulty":1,"stem":"Nitrates and nitrites preserve meat by:","options":["inhibiting iron-containing enzymes of anaerobic bacteria","forming HOCl","cross-linking proteins","dissolving membranes"],"answer":0,"explanation":"Slide 38: nitrate/nitrite **ức chế enzyme chứa sắt của vi khuẩn kỵ khí** (như *C. botulinum*).","distractorNotes":["","Chlorine.","Aldehyde.","Cồn/quats."],"vocab":["nitrite"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 38","id":"Q-CTL-05-004"},{"unit":"CTL-05","type":"concept","difficulty":2,"stem":"Aldehydes such as glutaraldehyde inactivate proteins by:","options":["oxidizing them with free radicals","forming covalent cross-links with –NH2, –OH, –COOH and –SH groups","binding only to DNA","lowering surface tension"],"answer":1,"explanation":"Slide 40: aldehyde tạo **liên kết chéo cộng hóa trị** với **–NH₂, –OH, –COOH, –SH**.","distractorNotes":["H₂O₂.","","Sai.","Surfactant."],"vocab":["aldehyde","glutaraldehyde"],"trap":null,"pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 40","id":"Q-CTL-05-005"},{"unit":"CTL-05","type":"recall","difficulty":2,"stem":"According to the lecture, 2% glutaraldehyde (Cidex) is sporicidal after how long?","options":["10 minutes","3 to 10 hours","30 seconds","24 days"],"answer":1,"explanation":"Slide 41: Cidex diệt khuẩn, lao, virus trong **10 phút**; diệt **bào tử trong 3–10 giờ**.","distractorNotes":["Đó là thời gian diệt khuẩn/virus.","","Sai.","Sai."],"vocab":["glutaraldehyde"],"trap":"Glutaraldehyde kills spores in 10 minutes","pool":"learn","source":"4.The Control of Microbial Growth.pptx slide 41","id":"Q-CTL-05-006"},{"unit":"CTL-05","type":"recall","difficulty":1,"stem":"For long-term deep-freeze preservation, bacteria are suspended in:","options":["10–30% glycerol and froze it":"GRO-01","type":"concept","difficulty":2,"stem":"Facultative halophiles are organisms that:","options":["require at least 30% salt","do not require high salt but can grow at up to 2% salt (a few up to 15%)","cannot tolerate any salt","grow only in fresh water"],"answer":1,"explanation":"Slide 9: **facultative halophiles** không cần muối cao nhưng mọc được tới **2 %**; một vài loài chịu **15 %**.","distractorNotes":["Đó là extreme halophiles.","","Sai.","Sai."],"vocab":["facultative halophile"],"trap":"Facultative halophiles require high salt","pool":"learn","source":"5.Microbial Growth.pptx slide 9","id":"Q-GRO-01-003"},{"unit":"GRO-01","type":"concept","difficulty":2,"stem":"What happens to a bacterial cell placed in a solution with a much higher solute concentration than its cytoplasm?","options":["It swells and bursts","Water leaves the cell and plasmolysis occurs","Salt enters and the cell grows faster","Nothing, because the wall is impermeable"],"answer":1,"explanation":"Slide 7: môi trường **ưu trương** → nước đi ra → **co nguyên sinh (plasmolysis)**.","distractorNotes":["Xảy ra ở nhược trương khi mất thành.","","Sai.","Thành cho nước đi qua."],"vocab":["plasmolysis","hypertonic"],"trap":null,"pool":"learn","source":"5.Microbial Growth.pptx slide 7","id":"Q-GRO-01-004"},{"unit":"GRO-01","type":"application","difficulty":2,"stem":"Listeria can multiply in refrigerated ready-to-eat foods. It is best described as a:","options":["thermophile","psychrotroph","hyperthermophile","obligate halophile"],"answer":1,"explanation":"Mọc được ở 0–7 °C (tủ lạnh) nhưng tối ưu cao hơn → **psychrotroph**.","distractorNotes":["Ưa nóng.","","Ưa nhiệt cực độ.","Cần muối cao."],"vocab":["psychrotroph"],"trap":"Refrigeration kills bacteria","pool":"learn","source":"","id":"Q-GRO-01-005"},{"unit":"GRO-01","type":"concept","difficulty":2,"stem":"Why are buffers such as peptone, amino acids and phosphate salts added to culture media?","options":["To provide trace elements only","To ulum","a buffer"],"answer":1,"explanation":"Slide 19: **organic growth factor** (vitamin, amino acid, purine, pyrimidine).","distractorNotes":["Vi lượng là nguyên tố vô cơ.","","Sai.","Sai."],"vocab":["organic growth factor"],"trap":null,"pool":"learn","source":"","id":"Q-GRO-02-005"},{"unit":"GRO-02","type":"concept","difficulty":2,"stem":"Why are trace elements usually not added to laboratory media?","options":["They are toxic","They are assumed to be naturally present in tap water and other media components","Bacteria do not need them","They precipitate agar"],"answer":1,"explanation":"Slide 18: vi lượng thường **có sẵn trong nước máy** và các thành phần môi trường.","distractorNotes":["Không phải lý do.","","Vẫn cần, với lượng rất nhỏ.","Sai."],"vocab":["trace elements"],"trap":"Trace elements must always be added","pool":"learn","source":"5.Microbial Growth.pptx slide 18","id":"Q-GRO-02-006"},{"unit":"GRO-02","type":"not","difficulty":2,"stem":"Which statement about nitrogen fixation is NOT correct according to the lecture?","options":["Cyanobacteria can use atmospheric N2","Some nitrogen fixers are free-living in soil","Some live symbiotically with legume roots","The fixed nitrogen is used only by the plant, never by the bacterium"],"answer":3,"explanation":"Slide 16: N cố định trong cộng sinh được **cả cây và vi khuẩn** sử dụng.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["nitrogen fixation"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-02-007","mockSet":2},{"unit":"GRO-02","type":"recall","difficulty":1,"stem":"Most vitamins function in cells as:","options":["structural proteins","coenzymes (organic cofactors of enzymes)","energy storage granules","cell wall components"],"answer":1,"explanation":"Slide 19: phần lớn vitamin là **coenzyme**.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["coenzyme"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-02-008","mockSet":3},{"unit":"GRO-02","type":"concept","difficulty":2,"stem":"Chemoheterotrophs differ from photoautotrophs because chemoheterotrophs:","options":["use light and CO2","obtain both energy and most carbon from organic compounds","use inorganic compounds for energy and CO2 for carbon","cannot use proteins"],"answer":1,"explanation":"Slide 12: chemoheterotroph lấy **carbon từ chính nguồn năng lượng** – chất hữu cơ.","distractorNotes":["Photoautotroph.","","Chemoautotroph.","Sai."],"vocab":["chemoheterotroph"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-02-009","mockSet":1},{"unit":"GRO-03","type":"concept","difficulty":2,"stem":"In a tube of thioglycolate medium, growth appears evenly throughout the tube. The organism is most likely:","options":["an obligate aerobe","an obligate anaerobe","an aerotolerant anaerobe","a microaerophile"],"answer":2,"explanation":"Mọc **đều khắp ống** = không dùng O₂ nhưng **chịu được** → **aerotolerant anaerobe**.","distractorNotes":["Mọc ở bề mặt.","Mọc ở đáy.","","Dải hẹp dưới bề mặt."],"vocab":["aerotolerant anaerobe"],"trap":null,"pool":"learn","source":"5.Microbial Growth.pptx slide 22","id":"Q-GRO-03-001"},{"unit":"GRO-03","type":"concept","difficulty":2,"stem":"Growth appears only as a narrow band slightly below the surface of a thioglycolate tube. The organism is a:","options":["facultative anaerobe","microaerophile","obligate anaerobe","obligate aerobe"],"answer":1,"explanation":"Cần **ít O₂ hơn không khí** → dải hẹp dưới bề mặt → **microaerophile**.","distractorNotes":["Mọc khắp, dày ở trên.","","Ở đáy.","Ở bề mặt."],"vocab":["microaerophile"],"trap":"Microaerophiles grow at the surface","pool":"learn","source":"","id":"Q-GRO-03-002"},{"unit":"GRO-03","type":"recall","difficulty":1,"stem":"Which enzyme converts superoxide radicals into hydrogen peroxide and oxygen?","options":["Catalase","Peroxidase","Superoxide dismutase","Transpeptidase"],"answer":2,"explanation":"**SOD**: O₂•⁻ + O₂•⁻ + 2H⁺ → **H₂O₂ + O₂**.","distractorNotes":["Catalase phân hủy H₂O₂.","Peroxidase khử H₂O₂.","","Enzyme tạo peptidoglycan."],"vocab":["superoxide dismutase"],"trap":null,"pool":"learn","source":"5.Microbial Growth.pptx slide 24","id":"Q-GRO-03-003"},{"unit":"GRO-03","type":"concept","difficulty":2,"stem":"Why must all organisms growing in atmospheric oxygen produce superoxide dismutase?","options":["To produce ATP","Because superoxide radicals formed during aerobic metabolism are extremely toxic","To digest peptidoglycan","To fix nitrogen"],"answer":1,"explanation":"Slide 24: superoxide **rất độc** (cướp electron gây phản ứng dây chuyền) → sinh vật sống trong không khí **phải có SOD**.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["superoxide","superoxide dismutase"],"trap":null,"pool":"learn","source":"5.Microbial Growth.pptx slide 24","id":"Q-GRO-03-004"},{"unit":"GRO-03","type":"recall","difficulty":1,"stem":"Lactic acid bacteria are fermentative and cannot use oxygen for growth but tolerate it well. They are:","options":["obligate aerobes","aerotolerant anaerobes","obligate anaerobes","microaerophiles"],"answer":1,"explanation":"Slide 22: **aerotolerant anaerobes** – vi khuẩn lactic có **SOD** trung hòa superoxide.","distractorNotes":["Sai.","","Bị O₂ làm hại.","Cần O₂ ít."],"vocab":["aerotolerant anaerobe"],"trap":"Aerotolerant anaerobes use O2 for respiration","pool":"learn","source":"5.Microbial Growth.pptx slide 22","id":"Q-GRO-03-005"},{"unit":"GRO-03","type":"concept","difficulty":2,"stem":"Facultative anaerobes grow best near the top of a thioglycolate tube because:","options":["oxygen is toxic to them at the bottom","aerobic respiration yields more energy than fermentation","they are microaerophiles","they need light"],"answer":1,"explanation":"Slide 21: dùng O₂ tạo **nhiều năng lượng hơn** → mọc dày ở phía có O₂, nhưng vẫn mọc khắp ống.","distractorNotes":["O₂ không độc với chúng.","","Sai.","Sai."],"vocab":["facultative anaerobe"],"trap":null,"pool":"learn","source":"","id":"Q-GRO-03-006"},{"unit":"GRO-03","type":"recall","difficulty":1,"stem":"Singlet oxygen is:","options":["an anion formed during respiration","normal molecular oxygen boosted into a higher-energy, extremely reactive state","hydrogen peroxide","an enzyme"],"answer":1,"explanation":"Slide 23: **singlet oxygen** = O₂ được **nâng lên trạng thái năng lượng cao**, cực kỳ hoạt động. Khác superoxide (anion).","distractorNotes":["Đó là superoxide.","","Sai.","Sai."],"vocab":["singlet oxygen"],"trap":"Singlet oxygen is the same as superoxide","pool":"learn","source":"","id":"Q-GRO-03-007"},{"unit":"GRO-03","type":"recall","difficulty":1,"stem":"Organisms that require molecular oxygen to live are:","options":["obligate aerobes","aerotolerant anaerobes","obligate anaerobes","facultative anaerobes"],"answer":0,"explanation":"Slide 21: **obligate aerobes** cần O₂ để sống.","distractorNotes":["","Không dùng O₂.","Bị O₂ hại.","Không bắt buộc cần O₂."],"vocab":["obligate aerobe"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-03-008","mockSet":2},{"unit":"GRO-03","type":"application","difficulty":2,"stem":"A bacterium bubbles vigorously when a drop of H2O2 is added to its colony. It possesses:","options":["superoxide dismutase only","catalase","a capsule","nitrogenase"],"answer":1,"explanation":"Sủi bọt O₂ = **catalase**: 2H₂O₂ → 2H₂O + **O₂**.","distractorNotes":["SOD không phân hủy H₂O₂.","","Sai.","Sai."],"vocab":["catalase"],"trap":"Obligate anaerobes have catalase","pool":"mock","source":"","id":"Q-GRO-03-009","mockSet":3},{"unit":"GRO-03","type":"concept","difficulty":2,"stem":"In an anaerobic jar, the gas-generating packet reacts: NaHCO3 + NaBH4 + H2O → H2 + CO2. How is oxygen then removed?","options":["CO2 displaces O2 out of the jar","H2 combines with O2 on a palladium catalyst to form water","NaBH4 absorbs O2 directly","O2 is frozen out"],"answer":1,"explanation":"H₂ + O₂ → H₂O nhờ **xúc tác palladium** → loại oxy.","distractorNotes":["Không.","","Không.","Không."],"vocab":["anaerobic jar"],"trap":null,"pool":"mock","source":"5.Microbial Growth.pptx slide 26","id":"Q-GRO-03-010","mockSet":1},{"unit":"GRO-03","type":"not","difficulty":2,"stem":"Which statement about obligate anaerobes is NOT correct?","options":["They are unable to use O2 for energy-yielding reactions","Most are harmed by O2","They grow at the bottom of thioglycolate tubes","They grow best at the surface of an agar slant exposed to air"],"answer":3,"explanation":"Kỵ khí bắt buộc **không** mọc ở bề mặt tiếp xúc không khí.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["obligate anaerobe"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-03-011","mockSet":3},{"unit":"GRO-04","type":"recall","difficulty":1,"stem":"Agar melts at about 100 °C. At what temperature does melted agar solidify?","options":["Just below 100 °C","Below about 40 °C","Below 0 °C","At 121 °C"],"answer":1,"explanation":"Slide 29: agar **chảy ~100 °C**, **giữ lỏng tới < 40 °C**.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["agar"],"trap":"Agar solidifies at 100 °C","pool":"learn","source":"5.Microbial Growth.pptx slide 29","id":"Q-GRO-04-001"},{"unit":"GRO-04","type":"recall","difficulty":1,"stem":"A medium whose exact chemical composition is known is called:","options":["complex medium","chemically defined medium","enrichment medium","differential medium"],"answer":1,"explanation":"Slide 30: **chemically defined medium**.","distractorNotes":["Thành phần thay đổi theo lô.","","Chức năng tăng sinh.","Chức năng phân biệt."],"vocab":["chemically defined medium"],"trap":null,"pool":"learn","source":"5.Microbial Growth.pptx slide 30","id":"Q-GRO-04-002"},{"unit":"GRO-04","type":"concept","difficulty":2,"stem":"Sodium thioglycolate is added to some media in order to:","options":["inhibit Gram-positive bacteria","chemically combine with dissolved oxygen so anaerobes can grow","change color with lactose fermentation","solidify the medium"],"answer":1,"explanation":"Slide 32: **reducing media** – thioglycolate **kết hợp với O₂ hòa tan** → loại O₂.","distractorNotes":["Chọn lọc.","","Phân biệt.","Agar."],"vocab":["reducing medium","thioglycolate"],"trap":null,"pool":"learn","source":"5.Microbial Growth.pptx slide 32","id":"Q-GRO-04-003"},{"unit":"GRO-04","type":"concept","difficulty":2,"stem":"What is the main difference between an enrichment medium and a differential medium?","options":["Enrichment media increase very small numbers of a desired organism to detectable levels; differential media make colonies look different","They are identical","Differential media are always liquid","Enrichment media contain no nutrients"],"answer":0,"explanation":"Slide 35–36: **enrichment** (thường lỏng) nâng số lượng ít ỏi lên mức phát hiện; **differential** giúp phân biệt khuẩn lạc trên cùng đĩa.","distractorNotes":["","Khác nhau.","Thường là đĩa thạch.","Sai."],"vocab":["enrichment medium","differential medium"],"trap":"Enrichment media distinguish colonies","pool":"learn","source":"","id":"Q-GRO-04-004"},{"unit":"GRO-04","type":"concept","difficulty":2,"stem":"Why is a complex medium such as nutrient broth said to vary from batch to batch?","options":["It contains extracts or protein digests whose exact composition is not known","It is not sterilized","It contains antibiotics","It uses different agar"],"answer":0,"explanation":"Slide 31: dịch chiết nấm men, thịt, peptone → thành phần **thay đổi nhẹ theo lô**.","distractorNotes":["","Sai.","Sai.","Sai."],"vocab":["complex medium"],"trap":"Complex media have exactly known composition","pool":"learn","source":"","id":"Q-GRO-04-005"},{"unit":"GRO-04","type":"concept","difficulty":2,"stem":"Why is a colony counted as a colony-forming unit (CFU) rather than as one cell?","options":["Colonies always come from exactly one cell","A colony may arise from a single cell or from a clump or chain of cells","Colonies contain only dead cells","CFU is a unit of weight"],"answer":1,"explanation":"Slide 38: khuẩn lạc có thể từ **một tế bào/bào tử** hoặc **một cụm/chuỗi** → đơn vị là CFU.","distractorNotes":["Không luôn đúng.","","Sai.","Sai."],"vocab":["colony","CFU"],"trap":"One colony always comes from one cell","pool":"learn","source":"","id":"Q-GRO-04-006"},{"unit":"GRO-04","type":"recall","difficulty":1,"stem":"Which is NOT a criterion of a culture medium listed in the lecture?","options":["It must contain the right nutrients","It must initially be sterile","It must contain an antibiotic","It should have a properly adjusted pH"],"answer":2,"explanation":"Tiêu chuẩn: đúng dinh dưỡng, đủ ẩm, pH, oxy, **vô trùng ban đầu**, ủ đúng nhiệt độ. Kháng sinh **không** bắt buộc.","distractorNotes":["Có.","Có.","","Có."],"vocab":["culture medium"],"trap":null,"pool":"learn","source":"5.Microbial Growth.pptx slide 28","id":"Q-GRO-04-007"},{"unit":"GRO-04","type":"application","difficulty":2,"stem":"Mannitol salt agar contains 7.5% NaCl (only staphylococci grow) and mannitol with phenol red (S. aureus turns it yellow). It is:","options":["selective only","differential only","selective and differential","reducing"],"answer":2,"explanation":"NaCl 7,5 % → **chọn lọc**; mannitol + phenol red → **phân biệt**.","distractorNotes":["Thiếu phần phân biệt.","Thiếu phần chọn lọc.","","Không liên quan."],"vocab":["selective medium","differential medium"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-04-008","mockSet":2},{"unit":"GRO-04","type":"recall","difficulty":1,"stem":"Microbes introduced into a culture medium to initiate growth are called:","options":["a culture","an inoculum","a colony","a medium"],"answer":1,"explanation":"Slide 29: **inoculum**; vi sinh vật mọc lên gọi là **culture**.","distractorNotes":["Culture là vi sinh vật đang mọc.","","Sai.","Sai."],"vocab":["inoculum"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-04-009","mockSet":3},{"unit":"GRO-04","type":"concept","difficulty":2,"stem":"The streak plate method is used to:","options":["count bacteria precisely","obtain isolated colonies and thus pure cultures","remove oxygen","sterilize media"],"answer":1,"explanation":"Slide 39–41: cấy ria tách tế bào → **khuẩn lạc tách rời** → **nuôi cấy thuần**.","distractorNotes":["Không phải phương pháp định lượng.","","Sai.","Sai."],"vocab":["streak plate","pure culture"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-04-010","mockSet":1},{"unit":"GRO-04","type":"not","difficulty":2,"stem":"Which statement about selective media is NOT correct?","options":["They suppress the growth of unwanted bacteria","They encourage growth of the desired microbes","They always make colonies different colors","They may be combined with differential features"],"answer":2,"explanation":"Tạo **màu khác nhau** là đặc điểm của môi trường **phân biệt**, không bắt buộc ở môi trường chọn lọc.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["selective medium"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-04-011","mockSet":1},{"unit":"GRO-05","type":"calc","difficulty":3,"stem":"A culture grows from 2 × 10³ cells/mL to 6.4 × 10⁴ cells/mL in 2.5 hours of exponential growth. What is the generation time?","options":["20 min","30 min","50 min","25 min"],"answer":1,"explanation":"Nt/N₀ = 6,4 × 10⁴ / 2 × 10³ = 32 = 2⁵ → **n = 5**. g = 150 phút / 5 = **30 phút**.","distractorNotes":["Tính 7,5 thế hệ.","","Tính 3 thế hệ.","Tính 6 thế hệ."],"vocab":["generation time"],"trap":null,"pool":"learn","source":"","steps":["Nt/N₀ = 64000/2000 = 32","n = log 32 / log 2 = 5","g = 150 phút / 5 = 30 phút"],"id":"Q-GRO-05-001"},{"unit":"GRO-05","type":"calc","difficulty":2,"stem":"Starting with 100 cells, how many cells are present after 6 generations of exponential growth?","options":["600","6,400","3,200","12,800"],"answer":1,"explanation":"Nt = 100 × 2⁶ = 100 × 64 = **6.400**.","distractorNotes":["Nhân n thay vì 2ⁿ.","","Chỉ 5 thế hệ.","7 thế hệ."],"vocab":["binary fission"],"trap":null,"pool":"learn","source":"","steps":["Nt = N₀ × 2ⁿ","2⁶ = 64","100 × 64 = 6400"],"id":"Q-GRO-05-002"},{"unit":"GRO-05","type":"concept","difficulty":2,"stem":"During which phase of a batch growth curve are cells most sensitive to antibiotics and radiation?","options":["Lag phase","Log (exponential) phase","Stationary phase","Death phase"],"answer":1,"explanation":"Pha **log**: tế bào phân chia mạnh, tổng hợp thành, DNA liên tục → **nhạy nhất**.","distractorNotes":["Chưa phân chia mạnh.","","Ít phân chia.","Tế bào đang chết."],"vocab":["log phase"],"trap":null,"pool":"learn","source":"","id":"Q-GRO-05-003"},{"unit":"GRO-05","type":"concept","difficulty":2,"stem":"In the stationary phase, the number of viable cells remains constant because:","options":["cells stop metabolism completely","the number of new cells equals the number of dying cells","all cells form spores","the medium is replaced continuously"],"answer":1,"explanation":"Pha cân bằng: **số sinh ra = số chết** do cạn dinh dưỡng, tích tụ chất thải.","distractorNotes":["Vẫn có hoạt động.","","Chỉ một số loài tạo bào tử.","Đó là nuôi liên tục."],"vocab":["stationary phase"],"trap":"Stationary phase means all cells are dead","pool":"learn","source":"","id":"Q-GRO-05-004"},{"unit":"GRO-05","type":"concept","difficulty":2,"stem":"What happens during the lag phase?","options":["Cells divide at maximum rate","There is little or no increase in cell number, but cells are metabolically active and adapting","Cells die faster than they divide","Toxic wastes accumulate and growth stops"],"answer":1,"explanation":"Pha **lag**: số tế bào gần như không tăng nhưng tế bào **tích cực tổng hợp enzyme, thích nghi**.","distractorNotes":["Pha log.","","Pha suy vong.","Pha cân bằng."],"vocab":["lag phase"],"trap":"No metabolic activity in lag phase","pool":"learn","source":"","id":"Q-GRO-05-005"},{"unit":"GRO-05","type":"recall","difficulty":1,"stem":"According to the lecture, the generation time of most bacteria is:","options":["1–3 minutes","1–3 hours","1–3 days","exactly 20 minutes"],"answer":1,"explanation":"Slide 7: **phần lớn 1–3 giờ**; một số > 24 giờ.","distractorNotes":["Quá ngắn.","","Quá dài với đa số.","Chỉ E. coli trong điều kiện tối ưu."],"vocab":["generation time"],"trap":"Generation time is the same for all bacteria","pool":"learn","source":"6.The Growth of Bacterial Cultures.pptx slide 7","id":"Q-GRO-05-006"},{"unit":"GRO-05","type":"calc","difficulty":3,"stem":"Exponential growth: N0 = 10⁵ cells/mL at t0 = 0; Nt = 10⁷ cells/mL at t = 2 h. Calculate the generation time (log 2 = 0.301).","options":["0.301 h","0.602 h","1.0 h","0.15 h"],"answer":0,"explanation":"g = 0,301 × 2/(7 − 5) = 0,301 × 2/2 = **0,301 h** (≈ 18 phút).","distractorNotes":["","Quên chia cho Δlog = 2.","Sai.","Chia đôi thừa."],"vocab":["generation time"],"trap":null,"pool":"learn","source":"","steps":["g = log 2 × (t − t₀)/(log Nt − log N₀)","= 0,301 × 2/(7 − 5)","= 0,301 h"],"id":"Q-GRO-05-007"},{"unit":"GRO-05","type":"calc","difficulty":3,"stem":"How many generations occur when a population increases from 10⁴ to 10⁸ cells? (log 2 = 0.301)","options":["4","about 13.3","about 1.2","40"],"answer":1,"explanation":"n = (8 − 4)/0,301 = 4/0,301 ≈ **13,3** thế hệ.","distractorNotes":["Quên chia log 2.","","Nhân thay vì chia.","Sai."],"vocab":["generation time"],"trap":"Multiply by log 2 instead of dividing to get n","pool":"mock","source":"","steps":["n = (log Nt − log N₀)/log 2","= (8 − 4)/0,301","≈ 13,3"],"id":"Q-GRO-05-008","mockSet":3},{"unit":"GRO-05","type":"not","difficulty":2,"stem":"Which statement about the phases of bacterial growth is NOT correct?","options":["In the lag phase there is little cell division","In the log phase cells divide at a constant rate","In the stationary phase nutrients are plentiful and growth is fastest","In the death phase deaths exceed new cells"],"answer":2,"explanation":"Pha cân bằng: **dinh dưỡng cạn**, chất thải tích tụ; tăng trưởng nhanh nhất là pha log.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["stationary phase"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-05-009","mockSet":2},{"unit":"GRO-05","type":"calc","difficulty":3,"stem":"A bacterium with a generation time of 20 min starts at 50 cells. How many cells are there after 2 hours of exponential growth?","options":["300","3,200","6,400","1,600"],"answer":1,"explanation":"2 h = 120 phút → n = 120/20 = **6** → 50 × 2⁶ = **3.200**.","distractorNotes":["Nhân 50 × 6.","","Tính 7 thế hệ.","Tính 5 thế hệ."],"vocab":["generation time"],"trap":null,"pool":"mock","source":"","steps":["n = 120/20 = 6","2⁶ = 64","50 × 64 = 3200"],"id":"Q-GRO-05-010","mockSet":1},{"unit":"GRO-05","type":"data","difficulty":2,"stem":"A growth curve shows: 0–2 h: 10⁶ cells/mL (constant); 2–6 h: rises to 10⁹; 6–10 h: stays at 10⁹; after 10 h: falls. Which interval is the log phase?","options":["0–2 h","2–6 h","6–10 h","after 10 h"],"answer":1,"explanation":"Tăng từ 10⁶ lên 10⁹ = **pha log (2–6 h)**. 0–2 h lag; 6–10 h stationary; sau 10 h death.","distractorNotes":["Lag.","","Stationary.","Death."],"vocab":["log phase"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-05-011","mockSet":2},{"unit":"GRO-06","type":"calc","difficulty":2,"stem":"0.1 mL of a 10⁻⁴ dilution is spread on a plate and 85 colonies develop. What is the concentration in the original sample?","options":["8.5 × 10⁵ CFU/mL","8.5 × 10⁶ CFU/mL","8.5 × 10⁴ CFU/mL","8.5 × 10⁷ CFU/mL"],"answer":1,"explanation":"CFU/mL = 85 / (0,1 × 10⁻⁴) = 85 × 10⁵ = **8,5 × 10⁶ CFU/mL**.","distractorNotes":["Quên chia cho 0,1 mL.","","Sai hai bậc.","Thừa một bậc."],"vocab":["CFU","serial dilution"],"trap":"Multiply colonies by volume plated","pool":"learn","source":"","steps":["V × d = 0,1 × 10⁻⁴ = 10⁻⁵","85 / 10⁻⁵ = 8,5 × 10⁶ CFU/mL"],"id":"Q-GRO-06-001"},{"unit":"GRO-06","type":"recall","difficulty":1,"stem":"The Petroff-Hausser counting chamber described in the lecture has a total area of 1 mm² and a depth of 0.02 mm. What is the volume over the whole grid?","options":["10⁻⁴ mL","2 × 10⁻⁵ mL","2 × 10⁻² mL","10⁻³ mL"],"answer":1,"explanation":"V = 1 mm² × 0,02 mm = 0,02 mm³ = 0,02 × 10⁻³ mL = **2 × 10⁻⁵ mL**.","distractorNotes":["Đó là buồng sâu 0,1 mm.","","Chưa đổi mm³ sang mL.","Sai."],"vocab":["Petroff-Hausser chamber"],"trap":null,"pool":"learn","source":"6.The Growth of Bacterial Cultures.pptx slide 16","steps":["V = 1 × 0,02 = 0,02 mm³","1 mL = 1000 mm³","0,02 mm³ = 2 × 10⁻⁵ mL"],"id":"Q-GRO-06-002"},{"unit":"GRO-06","type":"calc","difficulty":3,"stem":"In a Petroff-Hausser chamber (whole grid = 2 × 10⁻⁵ mL), 60 bacteria are counted over the entire grid of an undiluted sample. What is the concentration?","options":["1.2 × 10⁶ cells/mL","3.0 × 10⁶ cells/mL","6.0 × 10⁵ cells/mL","1.2 × 10⁻³ cells/mL"],"answer":1,"explanation":"C = 60 / (2 × 10⁻⁵) = **3,0 × 10⁶ tế bào/mL**.","distractorNotes":["Nhân thay vì chia.","","Dùng thể tích 10⁻⁴ mL.","Nhân với thể tích."],"vocab":["Petroff-Hausser chamber"],"trap":null,"pool":"learn","source":"","steps":["C = N / V","60 / (2 × 10⁻⁵) = 3 × 10⁶"],"id":"Q-GRO-06-003"},{"unit":"GRO-06","type":"concept","difficulty":2,"stem":"What is the principle of the MPN method?","options":["Counting colonies on a membrane","The more bacteria in a sample, the more dilution is needed before no bacteria remain to grow in the tubes","Measuring light absorbance","Weighing dried cells"],"answer":1,"explanation":"Slide 23: **càng nhiều vi khuẩn, càng phải pha loãng nhiều** mới hết vi khuẩn trong ống → ước lượng thống kê bằng bảng MPN.","distractorNotes":["Lọc màng.","","Độ đục.","Khối lượng khô."],"vocab":["MPN"],"trap":"MPN is an exact count","pool":"learn","source":"6.The Growth of Bacterial Cultures.pptx slide 23","id":"Q-GRO-06-004"},{"unit":"GRO-06","type":"concept","difficulty":2,"stem":"Why is the plate count reported as colony-forming units rather than cells?","options":["Because dead cells also form colonies","Because a colony may arise from a clump or chain of cells, not necessarily from one cell","Because colonies are counted under a microscope","Because CFU measures dry weight"],"answer":1,"explanation":"Một khuẩn lạc có thể từ **một cụm/chuỗi** tế bào → đơn vị là **CFU**.","distractorNotes":["Tế bào chết không tạo khuẩn lạc.","","Sai.","Sai."],"vocab":["CFU"],"trap":"CFU always equals number of cells","pool":"learn","source":"","id":"Q-GRO-06-005"},{"unit":"GRO-06","type":"not","difficulty":2,"stem":"Which is NOT a characteristic of the direct microscopic count?","options":["It is fast","It requires no incubation","It counts only living cells","It needs a known chamber volume"],"answer":2,"explanation":"Đếm trực tiếp **đếm cả tế bào chết**; plate count mới chỉ đếm tế bào sống.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["direct microscopic count"],"trap":"Direct counts distinguish live and dead cells","pool":"learn","source":"","id":"Q-GRO-06-006"},{"unit":"GRO-06","type":"calc","difficulty":3,"stem":"A 1-mL sample is diluted: 1 mL into 99 mL (tube A), then 1 mL of A into 9 mL (tube B). 1 mL of B is pour-plated and gives 142 colonies. What is the original concentration?","options":["1.42 × 10³ CFU/mL","1.42 × 10⁵ CFU/mL","1.42 × 10⁴ CFU/mL","1.42 × 10⁶ CFU/mL"],"answer":1,"explanation":"Pha loãng: 1/100 × 1/10 = **10⁻³**. CFU/mL = 142/(1 × 10⁻³) = **1,42 × 10⁵**.","distractorNotes":["Chỉ tính 10⁻¹.","","Chỉ tính 10⁻².","Tính 10⁻⁴."],"vocab":["serial dilution"],"trap":null,"pool":"learn","source":"","steps":["Ống A: 1/100 = 10⁻²","Ống B: 10⁻² × 1/10 = 10⁻³","142 / (1 × 10⁻³) = 1,42 × 10⁵ CFU/mL"],"id":"Q-GRO-06-007"},{"unit":"GRO-06","type":"application","difficulty":2,"stem":"Which plate should be used for counting? Dilutions 10⁻⁴, 10⁻⁵, 10⁻⁶ (1 mL plated) gave: too many to count, 215 colonies, 19 colonies.","options":["10⁻⁴ plate","10⁻⁵ plate (215 colonies)","10⁻⁶ plate (19 colonies)","Average all three"],"answer":1,"explanation":"Chọn đĩa có **30–300** khuẩn lạc → đĩa 10⁻⁵ (215). CFU/mL = 215/10⁻⁵ = 2,15 × 10⁷.","distractorNotes":["Không đếm được.","","Dưới 30, sai số thống kê lớn.","Không trộn đĩa ngoài khoảng."],"vocab":["plate count"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-06-008","mockSet":3},{"unit":"GRO-06","type":"recall","difficulty":1,"stem":"The membrane filtration method is most useful when:","options":["the sample contains very few bacteria in a large volume","the sample is very dense","bacteria are dead","measuring dry weight"],"answer":0,"explanation":"Slide 21–22: lọc thể tích lớn → phù hợp mẫu **rất ít vi khuẩn** (nước uống).","distractorNotes":["","Mẫu đặc nên pha loãng và đổ đĩa.","Không phát hiện tế bào chết.","Sai."],"vocab":["membrane filtration"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-06-009","mockSet":1},{"unit":"GRO-06","type":"calc","difficulty":2,"stem":"A yeast suspension is counted in a hemocytometer (depth 0.1 mm). 250 cells are found in 1 mm² of an undiluted sample. What is the concentration?","options":["2.5 × 10⁵ cells/mL","2.5 × 10⁶ cells/mL","2.5 × 10⁷ cells/mL","1.25 × 10⁷ cells/mL"],"answer":1,"explanation":"V = 1 mm² × 0,1 mm = 10⁻⁴ mL → 250/10⁻⁴ = **2,5 × 10⁶ tế bào/mL**.","distractorNotes":["Sai một bậc.","","Dùng thể tích Petroff-Hausser sai.","Dùng 2 × 10⁻⁵ mL."],"vocab":["counting chamber"],"trap":null,"pool":"mock","source":"","steps":["V = 10⁻⁴ mL","250 / 10⁻⁴ = 2,5 × 10⁶"],"id":"Q-GRO-06-010","mockSet":2},{"unit":"GRO-06","type":"not","difficulty":2,"stem":"Which statement about the MPN method is NOT correct?","options":["It uses replicate tubes at several dilutions","Signs of growth (turbidity, gas) mark positive tubes","It gives an exact count of cells","The result is read from a statistical table"],"answer":2,"explanation":"MPN là **ước lượng thống kê** (số có khả năng nhất), không phải đếm chính xác.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["MPN"],"trap":null,"pool":"mock","source":"","id":"Q-GRO-06-011","mockSet":3},{"unit":"GRO-07","type":"calc","difficulty":2,"stem":"A culture shows 25% transmittance. What is its OD? (log 25 = 1.40)","options":["1.40","0.60","0.25","2.60"],"answer":1,"explanation":"OD = 2 − log(%T) = 2 − 1,40 = **0,60**.","distractorNotes":["Quên lấy 2 trừ.","","Nhầm %T với OD.","Cộng thay vì trừ."],"vocab":["optical density"],"trap":"OD = log(%T)","pool":"learn","source":"","steps":["OD = 2 − log %T","= 2 − 1,40 = 0,60"],"id":"Q-GRO-07-001"},{"unit":"GRO-07","type":"recall","difficulty":1,"stem":"According to the lecture, a culture should be diluted before measurement when OD600 is greater than about:","options":["0.1","0.7","2.0","5.0"],"answer":1,"explanation":"Slide 30: **cần pha loãng khi OD₆₀₀ > 0,7**.","distractorNotes":["Quá thấp.","","Quá cao.","Quá cao."],"vocab":["optical density"],"trap":null,"pool":"learn","source":"6.The Growth of Bacterial Cultures.pptx slide 30","id":"Q-GRO-07-002"},{"unit":"GRO-07","type":"calc","difficulty":2,"stem":"An E. coli culture has OD600 = 0.35. Using OD600 = 1 ≈ 8 × 10⁸ cells/mL, estimate the cell density.","options":["2.8 × 10⁸ cells/mL","8 × 10⁸ cells/mL","3.5 × 10⁷ cells/mL","2.3 × 10⁹ cells/mL"],"answer":0,"explanation":"Tỉ lệ tuyến tính: 0,35 × 8 × 10⁸ = **2,8 × 10⁸ tế bào/mL**.","distractorNotes":["","Đó là OD = 1.","Sai.","Chia thay vì nhân."],"vocab":["optical density"],"trap":null,"pool":"learn","source":"","steps":["C = OD × 8 × 10⁸","= 0,35 × 8 × 10⁸ = 2,8 × 10⁸"],"id":"Q-GRO-07-003"},{"unit":"GRO-07","type":"concept","difficulty":2,"stem":"Why does the same OD600 = 1 correspond to about 8 × 10⁸ E. coli/mL but only about 3 × 10⁷ S. cerevisiae/mL?","options":["Yeast cells are larger, so fewer cells scatter the same amount of light","Yeasts are transparent","E. coli absorbs no light","OD measures only live cells"],"answer":0,"explanation":"Tế bào nấm men **lớn hơn nhiều** → mỗi tế bào tán xạ nhiều ánh sáng hơn → cùng OD thì ít tế bào hơn.","distractorNotes":["","Sai.","Sai.","OD không phân biệt sống/chết."],"vocab":["optical density"],"trap":"Same OD means same cell number for yeast and E. coli","pool":"learn","source":"","id":"Q-GRO-07-004"},{"unit":"GRO-07","type":"not","difficulty":2,"stem":"Which is NOT a limitation of turbidity measurement?","options":["It does not distinguish live from dead cells","It needs fairly dense cultures","It is slow, requiring 24–48 h incubation","It is unsuitable for filamentous molds"],"answer":2,"explanation":"OD rất **nhanh** (vài giây). Chờ 24–48 h là nhược điểm của **plate count**.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["turbidity"],"trap":"OD distinguishes live and dead cells","pool":"learn","source":"","id":"Q-GRO-07-005"},{"unit":"GRO-07","type":"recall","difficulty":1,"stem":"In the dry weight method, cells are dried until:","options":["they turn black","they reach a constant mass","exactly 1 hour","they form spores"],"answer":1,"explanation":"Slide 31: sấy đến khi tế bào **chỉ mất nước và đạt khối lượng không đổi**.","distractorNotes":["Sai.","","Không cố định thời gian.","Sai."],"vocab":["dry weight"],"trap":null,"pool":"learn","source":"6.The Growth of Bacterial Cultures.pptx slide 31","id":"Q-GRO-07-006"},{"unit":"GRO-07","type":"concept","difficulty":2,"stem":"When constructing a batch growth curve, until when should samples be taken?","options":["Only for the first hour","Until the amount of biomass decreases with culture time","Until the medium is sterile","Only once at the end"],"answer":1,"explanation":"Slide 33: lấy mẫu định kỳ **cho đến khi sinh khối giảm** → thấy đủ 4 pha.","distractorNotes":["Không đủ.","","Sai.","Không đủ."],"vocab":["growth curve"],"trap":null,"pool":"learn","source":"6.The Growth of Bacterial Cultures.pptx slide 33","id":"Q-GRO-07-007"},{"unit":"GRO-07","type":"calc","difficulty":2,"stem":"What is the OD of a sample with 1% transmittance?","options":["0","1","2","0.01"],"answer":2,"explanation":"OD = 2 − log 1 = 2 − 0 = **2**.","distractorNotes":["%T = 100.","%T = 10.","","Sai."],"vocab":["optical density"],"trap":null,"pool":"mock","source":"","steps":["log 1 = 0","OD = 2 − 0 = 2"],"id":"Q-GRO-07-008","mockSet":3},{"unit":"GRO-07","type":"application","difficulty":2,"stem":"A researcher must follow bacterial growth every 30 e":"not","difficulty":2,"stem":"According to the comparison table, which feature is NOT typical of protozoa?","options":["Chemoheterotrophic nutrition","Unicellular organization","Photosynthetic pigments","Motility; some form cysts"],"answer":2,"explanation":"Slide 102: **sắc tố** là đặc điểm của **tảo**. Protozoa: hóa dị dưỡng, đơn bào, di động, một số tạo nang.","distractorNotes":["Đúng với protozoa.","Đúng.","","Đúng."],"vocab":["protozoa"],"trap":"Protozoa are photoautotrophs","pool":"learn","source":"9-10.Protists.pptx slide 102","id":"Q-PRO-01-003"},{"unit":"PRO-01","type":"concept","difficulty":2,"stem":"How do protozoa differ from fungi in obtaining nutrients, according to the lecture table?","options":["Protozoa photosynthesize","Protozoa may absorb nutrients or ingest food through a mouth-like structure, while fungi only absorb","Fungi ingest food through a mouth","There is no difference"],"answer":1,"explanation":"Slide 102: protozoa **hấp thụ hoặc tiêu hóa qua miệng tế bào**; nấm **chỉ hấp thụ**.","distractorNotes":["Sai.","","Ngược.","Có khác."],"vocab":["protozoa"],"trap":null,"pool":"learn","source":"","id":"Q-PRO-01-004"},{"unit":"PRO-01","type":"concept","difficulty":2,"stem":"In a protist life cycle diagram, which event changes a diploid (2n) nucleus into haploid (n) nuclei?","options":["Fertilization","Mitosis","Meiosis","Binary fission"],"answer":2,"explanation":"**Giảm phân (meiosis)**: 2n → n. Thụ tinh: n + n → 2n; nguyên phân giữ nguyên mức bội.","distractorNotes":["Tăng lên 2n.","Giữ nguyên.","","Giữ nguyên."],"vocab":["meiosis"],"trap":null,"pool":"learn","source":"","id":"Q-PRO-01-005"},{"unit":"PRO-01","type":"recall","difficulty":1,"stem":"According to the lecture table, which group is multicellular in all members except yeasts?","options":["Algae","Protozoa","Fungi","Bacteria"],"answer":2,"explanation":"Slide 102: **Fungi – đa bào, trừ nấm men**. Algae: một số; protozoa: không.","distractorNotes":["Chỉ một số.","Không đa bào.","","Không ids_Prions.pptx slide 32","id":"Q-VIR-03-008"},{"unit":"VIR-03","type":"concept","difficulty":2,"stem":"Which HIV enzyme converts the viral RNA genome into DNA?","options":["Integrase","Protease","Reverse transcriptase","RNA polymerase II"],"answer":2,"explanation":"**Reverse transcriptase** (phiên mã ngược) RNA → DNA; integrase chèn DNA vào NST chủ; protease cắt protein.","distractorNotes":["Tích hợp.","Cắt protein.","","Enzyme chủ tạo mRNA."],"vocab":["reverse transcriptase","HIV"],"trap":null,"pool":"learn","source":"","id":"Q-VIR-03-009"},{"unit":"VIR-03","type":"application","difficulty":3,"stem":"A lysogenic E. coli culture is exposed to UV light. Soon after, many cells lyse and release phages. What happened?","options":["UV killed the phages","UV induced the prophage to excise and enter the lytic cycle","The cells formed endospores","UV converted lambda into a virulent T4 phage"],"answer":1,"explanation":"Tổn thương DNA do UV **cảm ứng (induction)** prophage → cắt ra → chu trình tan.","distractorNotes":["Ngược.","","E. coli không tạo nội bào tử.","Sai."],"vocab":["prophage","induction"],"trap":null,"pool":"learn","source":"","id":"Q-VIR-03-010"},{"unit":"VIR-03","type":"calc","difficulty":2,"stem":"0.1 mL of a 10^-6 dilution of a phage lysate produces 150 plaques on a bacterial lawn. What is the phage titer?","options":["1.5 × 10^7 PFU/mL","1.5 × 10^8 PFU/mL","1.5 × 10^9 PFU/mL","1.5 × 10^10 PFU/mL"],"answer":2,"explanation":"PFU/mL = 150 / (0,1 × 10⁻⁶) = **1,5 × 10⁹**.","distractorNotes":["Quên chia 0,1 và sai mũ.","Quên chia cho 0,1 mL.","","Sai mũ."],"vocab":["plaque"],"trap":null,"pool":"learn","source":"","id":"Q-VIR-03-011"},{"unit":"VIR-03","type":"concept","difficulty":2,"stem":"How do T-even phages deliver their DNA into bacteria?","options":["By endocytosis","By membrane fusion","By using their elaborate tail apparatus to puncture the bacterial cell wall","By conjugation pili"],"answer":2,"explanation":"Slide 21: phage T-chẵn dùng **bộ máy đuôi** ch Q-IDT-01-010"},{"unit":"IDT-01","type":"calc","difficulty":2,"stem":"In a 15-test kit, tests are grouped in threes with weights 4, 2, 1. In one group the first and third tests are positive and the second is negative. What digit is recorded for that group?","options":["3","5","6","7"],"answer":1,"explanation":"Cộng trọng số dương: 4 + 1 = **5**.","distractorNotes":["2 + 1.","","4 + 2.","Cả ba dương."],"vocab":["API code"],"trap":null,"pool":"learn","source":"","id":"Q-IDT-01-011"},{"unit":"IDT-01","type":"recall","difficulty":1,"stem":"Which cell-wall component is used as a chemotaxonomic marker to distinguish actinomycete genera?","options":["Lipid A","Isomers of diaminopimelic acid (LL-DAP vs meso-DAP)","Chitin","Ergosterol"],"answer":1,"explanation":"Slide 13–15: **LL-DAP** và **meso-DAP** (cùng glycine, arabinose, galactose...).","distractorNotes":["Gram âm LPS.","","Nấm.","Nấm."],"vocab":["diaminopimelic acid","chemotaxonomy"],"trap":null,"pool":"learn","source":"12.Identification of Microorganisms.pptx slides 13–15","id":"Q-IDT-01-012"},{"unit":"IDT-01","type":"recall","difficulty":1,"stem":"Which genera ferment lactose to produce acid and gas, according to the lecture?","options":["Salmonella and Shigella","Escherichia, Enterobacter and Citrobacter","Bacillus and Clostridium","Pseudomonas and Vibrio"],"answer":1,"explanation":"Slide 11.","distractorNotes":["Không lên men lactose.","","Không thuộc slide.","Không thuộc slide."],"vocab":["lactose fermentation"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-01-013","mockSet":2},{"unit":"IDT-01","type":"recall","difficulty":1,"stem":"Volume 2 (2005) of the current Bergey's Manual covers:","options":["Firmicutes","Proteobacteria","Actinobacteria","Spirochaetes"],"answer":1,"explanation":"Slide 7: Vol 2 – **Proteobacteria** (2A, 2B Gammaproteobacteria, 2C).","distractorNotes":["Vol 3.","","Vol 5.","Vol 4."],"vocab":["Proteobacteria"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-01-014","mockSet":3},{"unit":"IDT-01","type":"not","difficulty":2,"stem":"Which is NOT listed in the lecture as a colony morphology feature used for identification?","options":["Colony shape","Mycelium color","Ability to diffuse color into the medium","16S rRNA gene length"],"answer":3,"explanation":"Slide 13: hình dạng khuẩn lạc, màu hệ sợi, tạo bào tử, màu bào tử, khuếch tán sắc tố.","distractorNotes":["Có.","Có.","Có.",""],"vocab":[],"trap":null,"pool":"mock","source":"","id":"Q-IDT-01-015","mockSet":3},{"unit":"IDT-01","type":"application","difficulty":2,"stem":"IMViC results + + − − (indole +, MR +, VP −, citrate −) for a lactose-fermenting enteric rod best fit:","options":["Enterobacter aerogenes","Escherichia coli","Salmonella","Shigella"],"answer":1,"explanation":"*E. coli*: **+ + − −**; *Enterobacter aerogenes*: − − + +.","distractorNotes":["Ngược.","","Không lên men lactose.","Không lên men lactose."],"vocab":["IMViC"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-01-016","mockSet":1},{"unit":"IDT-01","type":"calc","difficulty":2,"stem":"Weights are 4-2-1 per group of three. A group with all three tests negative is recorded as:","options":["0","1","4","7"],"answer":0,"explanation":"Không có phản ứng dương → **0**.","distractorNotes":["","Chỉ test 3 dương.","Chỉ test 1 dương.","Cả ba dương."],"vocab":["API code"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-01-017","mockSet":1},{"unit":"IDT-02","type":"recall","difficulty":1,"stem":"Which marker is most commonly used for identifying fungi?","options":["16S rDNA","ITS (internal transcribed spacer)","rpoB","23S rDNA"],"answer":1,"explanation":"**ITS** là mã vạch chuẩn cho nấm; 16S, 23S, rpoB cho vi khuẩn.","distractorNotes":["Vi khuẩn.","","Vi khuẩn.","Vi khuẩn."],"vocab":["ITS"],"trap":"ITS is the main bacterial marker","pool":"learn","source":"12.Identification of Microorganisms.pptx slide 17","id":"Q-IDT-02-001"},{"unit":"IDT-02","type":"recall","difficulty":1,"stem":"18S rDNA is used mainly to identify:","options":["bacteria","eukaryotes (e.g., fungi, protists)","viruses","archaea only"],"answer":1,"explanation":"**18S** = tiểu đơn vị nhỏ ribosome **nhân thực**; 16S cho prokaryote.","distractorNotes":["16S.","","Virus không có ribosome.","16S."],"vocab":["18S rDNA"],"trap":null,"pool":"learn","source":"","id":"Q-IDT-02-002"},{"unit":"IDT-02","type":"recall","difficulty":1,"stem":"Put the molecular identification steps in the correct order:","options":["BLAST → PCR → sequencing → primer design","Primer design & PCR → sequencing → database search (BLAST) → phylogenetic tree","Phylogenetic tree → PCR → BLAST","Sequencing → primer design → PCR → tree"],"answer":1,"explanation":"Slide 17: chọn gene → **primer & PCR → giải trình tự → BLAST → cây phát sinh**.","distractorNotes":["Sai thứ tự.","","Sai.","Sai."],"vocab":["PCR","BLAST"],"trap":null,"pool":"learn","source":"12.Identification of Microorganisms.pptx slide 17","id":"Q-IDT-02-003"},{"unit":"IDT-02","type":"concept","difficulty":2,"stem":"Why is 16S rDNA a good marker for bacterial identification?","options":["It is absent in most bacteria","It contains conserved regions for universal primers and variable regions that distinguish taxa","It codes for toxins","It changes every generation"],"answer":1,"explanation":"Có **vùng bảo tồn** (mồi chung, căn chỉnh) và **vùng biến đổi** (phân biệt).","distractorNotes":["Mọi vi khuẩn đều có.","","Sai.","Tiến hóa chậm."],"vocab":["16S rDNA"],"trap":null,"pool":"learn","source":"","id":"Q-IDT-02-004"},{"unit":"IDT-02","type":"calc","difficulty":2,"stem":"A BLAST alignment has 396 identical positions over an alignment length of 400 nt, and the query is 471 nt long (the alignment covers 400 nt of it). What are the percent identity and query cover?","options":["99% identity; 84.9% query cover","84.9% identity; 99% query cover","100% identity; 100% query cover","99% identity; 100% query cover"],"answer":0,"explanation":"Identity = 396/400 = **99%**; query cover = 400/471 = **84,9%**. Hai cột có mẫu số k
