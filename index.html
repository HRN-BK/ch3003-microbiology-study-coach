<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gram+ Vi Sinh</title>
<meta name="description" content="Huấn luyện viên ôn thi cuối kì CH3003 Vi sinh vật học">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F4F4F8; --surface:#FFFFFF; --sunk:#EAEAF2; --line:#D9D9E6;
  --ink:#1B1C2A; --ink2:#55576B; --ink3:#8A8CA0;
  --hema:#3A3F94; --hema-soft:#E3E4F5; --eosin:#C8406F; --eosin-soft:#F8E1EA;
  --good:#1F7A4D; --good-soft:#DDF1E6; --bad:#B3261E; --bad-soft:#F9E0DE; --warn:#9A6400; --warn-soft:#F7ECD6;
  --cb:#3A3F94; --gn:#C8406F;
  --display:"Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12131C; --surface:#1B1C28; --sunk:#242534; --line:#34364A;
    --ink:#E8E8F2; --ink2:#AEB0C4; --ink3:#7E8097;
    --hema:#9CA2F2; --hema-soft:#2A2D55; --eosin:#F08BAE; --eosin-soft:#4A2334;
    --good:#6FD39F; --good-soft:#1C3A2B; --bad:#F2918A; --bad-soft:#452320; --warn:#E8B75C; --warn-soft:#3D2F14;
    --cb:#9CA2F2; --gn:#F08BAE;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12131C; --surface:#1B1C28; --sunk:#242534; --line:#34364A;
  --ink:#E8E8F2; --ink2:#AEB0C4; --ink3:#7E8097;
  --hema:#9CA2F2; --hema-soft:#2A2D55; --eosin:#F08BAE; --eosin-soft:#4A2334;
  --good:#6FD39F; --good-soft:#1C3A2B; --bad:#F2918A; --bad-soft:#452320; --warn:#E8B75C; --warn-soft:#3D2F14;
  --cb:#9CA2F2; --gn:#F08BAE;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.term:focus-visible{outline:2px solid var(--hema);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:12px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--eosin) 0 38%,var(--hema) 40% 100%);display:inline-block}
.top .sp{flex:1}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px}
.progress{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.progress>b{display:block;height:100%;background:linear-gradient(90deg,var(--hema),var(--eosin));width:0;transition:width .3s}

/* home */
.hero{padding-block:24px 8px;display:grid;gap:18px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .n{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--hema);font-variant-numeric:tabular-nums}
.count .t{font-size:17px;color:var(--ink2)}
.go{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border:0;border-radius:20px;padding:22px 24px;background:var(--hema);color:#fff;text-align:left;box-shadow:0 10px 30px -12px color-mix(in srgb,var(--hema) 70%,transparent)}
:root[data-theme="dark"] .go{color:#12131C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{color:#12131C}}
.go .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.go .sub{font-size:14px;opacity:.85;margin-top:4px}
.go .arrow{font-size:30px;font-weight:700}
.go:hover{filter:brightness(1.06)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:2px 7px;margin-top:3px;font-family:var(--mono)}
.tag.cb{background:var(--hema-soft);color:var(--cb)}
.tag.gn{background:var(--eosin-soft);color:var(--gn)}
.tag.x{background:var(--sunk);color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;text-align:left}
.stat .v{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--hema);font-weight:600;padding:8px 0;min-height:44px}
.second{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--hema);background:transparent;color:var(--hema);font-weight:600}

/* session */
.sesshead{display:grid;gap:8px;padding-block:4px 14px}
.sesshead .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunk);color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:grid;gap:16px}
.card h2{font-size:24px}
.hook{background:linear-gradient(160deg,var(--eosin-soft),var(--hema-soft));border:0}
.hook .q{font-size:18px;line-height:1.6}
.stem{font-size:17px;line-height:1.6;white-space:pre-wrap}
.stem pre,.pre{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:4px 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);line-height:1.45}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--hema)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--hema);background:var(--hema-soft)}
.guess{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);min-height:44px}
.guess input{width:20px;height:20px}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--good)} .fb.no .h{color:var(--bad)}
.note{font-size:14px;background:var(--warn-soft);border-radius:10px;padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;min-height:32px}
details summary{cursor:pointer;font-weight:600;min-height:32px}
ol.steps{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;border-radius:12px;padding:0 20px;border:0;background:var(--hema);color:var(--surface);font-weight:600}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad)}
.btn.good{background:var(--good)}
.btn.wide{flex:1}
.gloss{font-size:14px;color:var(--ink2);border-left:3px solid var(--eosin);padding-left:10px}
.term{border-bottom:1.5px dotted var(--hema);cursor:help}
.tip{position:fixed;z-index:30;max-width:min(340px,calc(100vw - 32px));background:var(--ink);color:var(--ground);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);display:grid;gap:6px}
.tip b{font-size:15px}
.tip .vi{color:var(--eosin-soft)}
.tip button{justify-self:start;border:1px solid color-mix(in srgb,var(--ground) 40%,transparent);background:transparent;color:var(--ground);border-radius:8px;padding:4px 10px;font-size:13px;min-height:32px}
.flip{min-height:190px;display:grid;place-items:center;text-align:center;font-size:20px;border-radius:16px;border:1.5px dashed var(--line);padding:20px;background:var(--surface);width:100%}
.flip .back{font-size:16px;line-height:1.55;text-align:left}
.vlist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.vlist li{border-bottom:1px solid var(--line);padding-bottom:10px}
.vlist .en{font-weight:700}
.vlist .vi{color:var(--gn);font-weight:600}
.we-step{border-left:3px solid var(--line);padding-left:12px;display:grid;gap:8px}
.we-step.done{border-color:var(--good)}
.we-step.now{border-color:var(--hema)}
.numin{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font:inherit;width:160px}
/* mock */
.mockbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.grid40{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid40 button{min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12px;padding:0}
.grid40 .a{background:var(--hema-soft);border-color:var(--hema)}
.grid40 .f{box-shadow:inset 0 -3px 0 var(--warn)}
.grid40 .cur{outline:2px solid var(--ink)}
.grid40 .r{background:var(--good-soft);border-color:var(--good)}
.grid40 .w{background:var(--bad-soft);border-color:var(--bad)}
.score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .t b{display:block;height:100%}
/* progress page */
.heat{display:grid;gap:14px}
.fam{display:grid;gap:6px}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);font-family:var(--mono);font-size:10px;display:grid;place-items:center;color:var(--ink2);background:var(--surface)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto;display:grid;gap:14px}
.field{display:grid;gap:6px}
.field input,.field select,textarea{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--ground);color:var(--ink);padding:8px 12px;font:inherit}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}
.sheetf{display:grid;gap:8px;font-size:15px}
.sheetf h3{font-size:17px;margin-top:6px}
.sheetf ul{margin:0;padding-left:20px}
.sync{font-size:12px;color:var(--ink3)}
/* lessons */
.lesson{display:grid;gap:12px;font-size:16px;line-height:1.65}
.lesson h3{font-size:19px;margin-top:4px}
.lesson p{margin:0}
.lesson ul,.lesson ol{margin:0;padding-left:22px;display:grid;gap:4px}
.lesson ul ul,.lesson ol ul{margin-top:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
.tbl table{border-collapse:collapse;font-size:14px;line-height:1.45;width:max-content;min-width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th,.tbl td{max-width:280px}
.tbl td{min-width:72px}
.tbl th{background:var(--sunk);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.callout{background:var(--hema-soft);border-left:4px solid var(--hema);border-radius:10px;padding:10px 14px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 6px;vertical-align:1px;background:var(--sunk);color:var(--ink2)}
.badge.ext{background:var(--warn-soft);color:var(--warn)}
.badge.fix{background:var(--bad-soft);color:var(--bad)}
.extbox{background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.extbox>summary{color:var(--warn)}
.libunit{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:48px}
.libunit .st{margin-left:auto;flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--ink2)}
.libunit .st.weak,.libunit .st.critical{background:var(--bad-soft);color:var(--bad)}
.libunit .st.ok{background:var(--warn-soft);color:var(--warn)}
.libunit .st.mastered{background:var(--good-soft);color:var(--good)}
.trapl{margin:0;padding-left:20px;display:grid;gap:4px}
@media (max-width:480px){
  .sync{display:none}
  .iconbtn{padding:0 10px}
  .count .n{font-size:52px}
  .go .big{font-size:24px}
  .card{padding:18px 16px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:22px}
  .bar{grid-template-columns:88px 1fr 42px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" aria-label="Về trang chính"><i></i>Gram+</button>
    <span class="sp"></span>
    <span class="sync" id="sync"></span>
    <button class="iconbtn" id="btnLib" aria-label="Thư viện bài học">Bài học</button>
    <button class="iconbtn" id="btnProgress" aria-label="Tiến độ">Tiến độ</button>
    <button class="iconbtn" id="btnSettings" aria-label="Cài đặt">⚙</button>
  </header>
  <main id="app"></main>
</div>
<div class="tip" id="tip" hidden></div>

<script type="application/json" id="db">{"meta":{"version":1,"course":"CH3003 Microbiology","defaultExamDate":"2026-10-23","startDate":"2026-09-25","dailyMinutes":150,"mockMinutes":70,"order":["HIS-01","HIS-02","HIS-03","HIS-04","BAC-01","BAC-02","BAC-03","BAC-04","BAC-05","BAC-06","BAC-07","BAC-08","FUN-01","FUN-02","FUN-03","FUN-04","FUN-05","FUN-06","CTL-01","CTL-02","CTL-03","CTL-04","CTL-05","GRO-01","GRO-02","GRO-03","GRO-04","GRO-05","GRO-06","GRO-07","PRO-01","PRO-02","PRO-03","PRO-04","PRO-05","VIR-01","VIR-02","VIR-03","VIR-04","IDT-01","IDT-02","APP-01","APP-02","APP-03","APP-04"],"families":[{"id":"HIS","name":"Lịch sử vi sinh","short":"Lịch sử"},{"id":"BAC","name":"Vi khuẩn & Archaea","short":"Vi khuẩn"},{"id":"FUN","name":"Nấm men & nấm mốc","short":"Nấm"},{"id":"CTL","name":"Kiểm soát vi sinh vật","short":"Kiểm soát"},{"id":"GRO","name":"Sinh trưởng & nuôi cấy","short":"Sinh trưởng"},{"id":"PRO","name":"Nguyên sinh vật","short":"Nguyên sinh"},{"id":"VIR","name":"Virus, viroid, prion","short":"Virus"},{"id":"IDT","name":"Định danh","short":"Định danh"},{"id":"APP","name":"Ứng dụng: SCP, ethanol, penicillin","short":"Ứng dụng"}],"blueprint":{"HIS":4,"BAC":8,"FUN":7,"CTL":6,"GRO":8,"PRO":5,"VIR":5,"IDT":3,"APP":4},"sheetHtml":"<h3>Sinh trưởng (GRO)<\/h3><ul>\n<li>N<sub>t<\/sub> = N<sub>0<\/sub>·2<sup>n<\/sup> · <b>n = (log N<sub>t<\/sub> − log N<sub>0<\/sub>) / 0,301<\/b> · <b>g = (t − t<sub>0<\/sub>) / n<\/b><\/li>\n<li>Pha: tiềm phát (lag) → log → cân bằng → suy vong; thế hệ E. coli ~20 phút<\/li>\n<li>CFU/mL = số khuẩn lạc / (thể tích cấy mL × độ pha loãng) · đếm đĩa 30–300 khuẩn lạc<\/li>\n<li>Hemocytometer: 1 mm² × 0,1 mm = 10<sup>−4<\/sup> mL · Petroff-Hausser: 1 mm² × 0,02 mm = 2×10<sup>−5<\/sup> mL<\/li>\n<li>OD = 2 − log %T · OD &gt; 0,7 → pha loãng lại · MPN: 3 hoặc 5 ống lặp → tra bảng<\/li>\n<li>Nhiệt: ưa lạnh &lt;15 °C · ưa ấm 25–40 °C · ưa nhiệt 50–60 °C · cực ưa nhiệt &gt;80 °C · halophile cực đoan 15–30% NaCl<\/li>\n<li>Oxy: hiếu khí bắt buộc (SOD + catalase) · tùy nghi (SOD + catalase) · chịu oxy (SOD) · kỵ khí bắt buộc (không có)<\/li>\n<\/ul>\n<h3>Kiểm soát (CTL)<\/h3><ul>\n<li>D-value = thời gian giảm 90% (1 log) · <b>t = D × (log N<sub>0<\/sub> − log N)<\/b> · 12D đồ hộp (C. botulinum)<\/li>\n<li>Autoclave 121 °C · ~15 psi · 15 phút · Tủ sấy 170 °C · 2 h · UV ~260 nm (dimer thymine)<\/li>\n<li>Thanh trùng sữa: 63 °C/30 phút · HTST 72 °C/15 s · UHT 140 °C/&lt;1 s<\/li>\n<li>Lọc 0,22–0,45 μm · HEPA 0,3 μm · Glycerol 10–30% ở −70 đến −95 °C · đông khô ≥10 năm<\/li>\n<\/ul>\n<h3>Vi khuẩn & nấm (BAC, FUN)<\/h3><ul>\n<li>Gram+: peptidoglycan dày, teichoic acid · Gram−: mỏng, màng ngoài LPS (lipid A = nội độc tố), porin, chu chất<\/li>\n<li>Peptidoglycan: NAG–NAM β-1,4 (lysozyme cắt) · tetrapeptide L-Ala, D-Glu, DAP/L-Lys, D-Ala · penicillin chặn transpeptidase<\/li>\n<li>Archaea: pseudomurein (NAT, β-1,3) · lipid liên kết ether · Nội bào tử: dipicolinic acid + Ca²⁺<\/li>\n<li>Nấm men: thành glucan + mannan (+ chitin ở vết chồi) · S. cerevisiae 16 NST · chu trình Krebs/acetyl-CoA: 2 CO₂, 3 NADH, 1 FADH₂, 1 ATP<\/li>\n<\/ul>\n<h3>Virus & định danh (VIR, IDT)<\/h3><ul>\n<li>Chi -virus · họ -viridae · bộ -virales · HHV-1/2 mụn rộp, 3 thủy đậu, 4 mono, 5 CMV, 6/7 roseola, 8 Kaposi<\/li>\n<li>Tan: phage độc (T4) · Tiềm tan: phage ôn hòa (λ) → prophage · viroid RNA trần 300–400 nt · prion = protein<\/li>\n<li>PFU/mL = số plaque / (thể tích × độ pha loãng)<\/li>\n<li>Bergey cũ (1980–84): 4 tập (Gram−, Gram+, còn lại + archaea, actinomycetes) · mới: 5 tập theo 16S<\/li>\n<li>Enterobacteriaceae oxidase âm · Escherichia/Enterobacter/Citrobacter lên men lactose; Salmonella/Shigella không<\/li>\n<li>Marker: 16S (vi khuẩn), 18S (nhân thực), ITS (nấm), rpoB · Identity = giống/độ dài căn chỉnh · Query cover = phủ/độ dài query<\/li>\n<\/ul>\n<h3>Ứng dụng (APP)<\/h3><ul>\n<li>SCP: protein 60–82% · nucleic acid tảo 3–8%, nấm 7–10% · C:N = 10:1 · cơ chất 45–75% chi phí · Pekilo = Paecilomyces variotii<\/li>\n<li>Y<sub>X/S<\/sub> = ΔX / ΔS · Ethanol: C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂ · lý thuyết 0,511 g/g · % lý thuyết = Y/0,511<\/li>\n<li>Azolla: K. marxianus 26,8 g/L (Y 0,43), dùng cả glucose + xylose · S. cerevisiae chỉ glucose<\/li>\n<li>Penicillin: 6-APA = thiazolidine + β-lactam · phenylacetic acid → penicillin G · fed-batch hiếu khí 25–27 °C · chiết pH 2–2,5 → dung môi → pH 7–7,5<\/li>\n<li>Thu hồi chung = tích hệ số từng bước · khối lượng = nồng độ × thể tích<\/li>\n<\/ul>"},"units":[{"id":"HIS-01","title":"The microbial world; Hooke and Leeuwenhoek","priority":"M","difficulty":1,"minutes":15,"source":"1.History of Microbiology.pptx: slides 2–7, 23–27","prereq":[],"hookVi":"Bạn cầm một giọt nước ao dưới kính hiển vi trường học và thấy hàng trăm \"con vật\" li ti bơi lội. Năm 1673, một người bán vải ở Hà Lan — **Anton van Leeuwenhoek** — cũng thấy đúng cảnh đó bằng một chiếc kính tự mài chỉ có **một thấu kính**. Ông gọi chúng là **animalcules**. Vậy ai là người đầu tiên *đặt tên* cho \"tế bào\", và ai là người đầu tiên *thấy vi sinh vật sống*?","predictQuestion":{"stem":"Who was the first to observe and describe LIVING microorganisms (\"animalcules\")?","options":["Robert Hooke","Anton van Leeuwenhoek","Louis Pasteur","Robert Koch"],"answer":1,"explanation":"Leeuwenhoek (1673) là người đầu tiên quan sát vi sinh vật **sống**. Hooke (1665) quan sát lát **bần (cork)** – chỉ là thành tế bào chết – và đặt ra từ **cell**."},"lesson":[{"h":"1. Vi sinh vật học nghiên cứu gì?","body":"**Microbiology** (vi sinh vật học) nghiên cứu các sinh vật quá nhỏ để nhìn rõ bằng mắt thường – **microorganisms / microbes** – cùng hoạt động của chúng. Đây là một *phạm vi nghiên cứu*, không phải một nhánh phân loại duy nhất.\n\nSlide 24 chia thế giới vi sinh vật của môn học thành các nhóm:\n\n| Nhóm | Gồm | Kiểu tế bào |\n|---|---|---|\n| **Bacteria** (vi khuẩn) | vi khuẩn \"thật\" | nhân sơ (prokaryote) |\n| **Archaea** (vi khuẩn cổ) | nhiều loài sống môi trường khắc nghiệt | nhân sơ |\n| **Fungi** (nấm) | **yeasts** (nấm men), **molds** (nấm mốc), macroscopic fungi (nấm lớn) | nhân thực (eukaryote) |\n| **Protists** (nguyên sinh vật) | **protozoa**, **algae** (tảo), **oomycetes**, **slime molds** (nấm nhầy) | nhân thực |\n| **Viruses** | virus, viroid, prion | **không có cấu tạo tế bào** |\n\n- Vi sinh vật **không chỉ gây bệnh**: phần lớn có lợi – phân giải chất hữu cơ, quay vòng N/C, làm bánh mì, bia, sữa chua, kháng sinh, enzyme…\n- Nhỏ ≠ nhân sơ: nấm men nhỏ nhưng là **nhân thực**.\n- Virus không phải \"vi khuẩn rất nhỏ\"; nó không có ribosome, không tự trao đổi chất."},{"h":"2. Robert Hooke (1665) – từ \"cell\" ra đời","body":"- Năm **1665**, **Robert Hooke** (Anh) dùng kính hiển vi phức (compound microscope) thô sơ quan sát **lát bần (cork)** và thấy những ô nhỏ, ông gọi là **\"cells\"**.\n- Slide ghi: Hooke phát hiện \"đơn vị nhỏ nhất của sự sống\" → **mở đường cho học thuyết tế bào (Cell Theory)**.\n- Thực ra Hooke chỉ thấy **thành tế bào chết** của mô bần, chưa thấy tế bào sống hay vi sinh vật. Học thuyết tế bào (mọi sinh vật cấu tạo từ tế bào) được hoàn thiện sau này bởi Schleiden, Schwann (1838–1839) và Virchow (1858)."},{"h":"3. Anton van Leeuwenhoek (1673–1723) – người đầu tiên thấy vi sinh vật sống","body":"- **1673**: Leeuwenhoek (Hà Lan) tự chế khoảng **400 kính hiển vi đơn thấu kính** (phóng đại tới ~300 lần) và quan sát **tế bào sống**.\n- Ông mô tả **\"animalcules\"** (động vật nhỏ li ti) trong nước mưa, phân, cặn răng… và gửi hàng loạt thư cho **Hội Hoàng gia Anh (Royal Society)** trong giai đoạn **1673–1723**.\n- Hình vẽ của ông [fig] cho thấy các dạng cầu, que, xoắn – chính là vi khuẩn.\n\n| | Hooke | Leeuwenhoek |\n|---|---|---|\n| Năm | 1665 | 1673 |\n| Nước | Anh | Hà Lan |\n| Kính | kính phức thô sơ | kính **một thấu kính** tự mài |\n| Thấy gì | ô bần (thành tế bào chết) | **vi sinh vật sống** (\"animalcules\") |\n| Ý nghĩa | đặt tên \"cell\", mở đầu học thuyết tế bào | khai sinh việc quan sát vi sinh vật |"},{"h":"4. Dòng thời gian nhanh (slide 4–7) [fig]","body":"Các slide 4–7 là hình dòng thời gian trong giáo trình Tortora. Những mốc hay được hỏi:\n\n| Năm | Sự kiện |\n|---|---|\n| 1665 | Hooke – \"cells\" |\n| 1673 | Leeuwenhoek – vi sinh vật sống |\n| 1668 | Redi – thí nghiệm dòi (chống tự sinh ở sinh vật lớn) |\n| 1796 | Jenner – vaccine đầu tiên (đậu mùa) |\n| 1835 | Bassi – nấm gây bệnh tằm |\n| 1857–1864 | Pasteur – lên men, bác bỏ tự sinh (1861), thanh trùng |\n| 1867 | Lister – phẫu thuật vô khuẩn (phenol) |\n| 1876 | Koch – *Bacillus anthracis* gây bệnh than → định đề Koch |\n| 1880 | Pasteur – vaccine giảm độc lực (tả gà) |\n| 1910 | Ehrlich – salvarsan chữa giang mai |\n| 1928 | Fleming – penicillin |\n\nMẹo: **H**ooke → **L**eeuwenhoek → **R**edi → **J**enner → **P**asteur → **K**och → **E**hrlich → **F**leming theo thứ tự thời gian (trừ Redi 1668 chen giữa Hooke và Leeuwenhoek về *ý tưởng*)."},{"h":"5. Độ phóng đại và độ phân giải","body":"- **Magnification** (độ phóng đại): ảnh to lên bao nhiêu lần.\n- **Resolution** (độ phân giải): khả năng phân biệt **hai điểm gần nhau** thành hai điểm riêng. Kính quang học giới hạn ≈ **0,2 μm**.\n- Vi khuẩn điển hình dài 1–5 μm → thấy được bằng kính quang học; virus (20–300 nm) cần **kính hiển vi điện tử**.\n- Phóng đại mà không tăng độ phân giải thì chỉ được một ảnh \"to mà mờ\" (empty magnification). [mở rộng]"}],"extension":[{"h":"Thực tế: kính hiển vi trong phòng thí nghiệm của bạn","body":"Kính hiển vi quang học trong phòng lab CH3004 dùng vật kính dầu **100×** × thị kính **10×** = **1000×** để xem vi khuẩn nhuộm Gram. Dầu soi (immersion oil) giúp tăng độ phân giải vì giảm tán xạ ánh sáng. Đây là hậu duệ trực tiếp của kính Hooke, còn kính một thấu kính của Leeuwenhoek là \"tổ tiên\" của kính lúp."},{"h":"Mở rộng: vi sinh vật quanh ta","body":"- Cơ thể người mang số tế bào vi khuẩn **tương đương** số tế bào người (≈ 3,8 × 10¹³) – **microbiome**.\n- Khoảng 50 % O₂ trên Trái Đất đến từ vi sinh vật quang hợp ở biển (vi khuẩn lam, tảo silic).\n- Ngành công nghệ sinh học (chuyên ngành của bạn) dựa trên vi sinh vật: enzyme, kháng sinh, ethanol, protein đơn bào (SCP) – sẽ học ở tuần 13–15."}],"keyCards":[{"title":"Hooke, 1665","bodyEn":"Robert Hooke observed thin slices of **cork** with a crude compound microscope and named the little boxes **\"cells\"**. He saw dead cell walls, not living microbes. His work opened the way to the **cell theory**.","glossVi":"Hooke đặt tên cell, nhưng chỉ thấy thành tế bào chết."},{"title":"Leeuwenhoek, 1673","bodyEn":"Anton van **Leeuwenhoek** built about **400 single-lens microscopes** and was the **first to observe living microorganisms**, which he called **\"animalcules\"**. He reported them in letters to the Royal Society (1673–1723).","glossVi":"Leeuwenhoek: người đầu tiên thấy vi sinh vật sống."},{"title":"Groups of microbes","bodyEn":"Microbiology covers **bacteria** and **archaea** (prokaryotes), **fungi** (yeasts, molds), **protists** (protozoa, algae, oomycetes, slime molds) and **viruses** (acellular). Most microbes are harmless or beneficial.","glossVi":"Virus không có cấu tạo tế bào; nấm và nguyên sinh vật là nhân thực."}],"traps":["Hooke saw living microbes","Viruses are tiny bacteria","Microbes are mostly pathogens","Magnification equals resolution"]},{"id":"HIS-02","title":"Spontaneous generation versus biogenesis","priority":"H","difficulty":2,"minutes":20,"source":"1.History of Microbiology.pptx: slides 8–11","prereq":[],"hookVi":"Bạn nấu nồi canh, để quên ngoài bếp 2 ngày thì canh đục và bốc mùi. Người thế kỷ 18 giải thích: vi sinh vật **tự sinh ra từ nước canh**. Người khác cãi: chúng **bay từ không khí vào**. Làm sao thiết kế một thí nghiệm mà **vẫn cho không khí vào** nhưng **không cho vi sinh vật vào**?","predictQuestion":{"stem":"Pasteur's swan-neck (S-neck) flask stayed clear for a long time even though it was open to the air. Why?","options":["The broth was sealed so no air entered","Dust and microbes were trapped in the curved neck","Boiling destroyed the \"vital force\" in air","The broth contained an antibiotic"],"answer":1,"explanation":"Cổ cong cho **không khí đi qua** nhưng **giữ bụi mang vi sinh vật** ở chỗ uốn. Không khí vẫn vào mà dịch không đục → không khí không tự sinh ra vi sinh vật."},"lesson":[{"h":"1. Hai thuyết đối lập","body":"- **Spontaneous generation** (thuyết tự sinh / abiogenesis): sự sống có thể phát sinh từ vật không sống. Ví dụ slide 8: cóc, rắn, chuột sinh ra từ đất ẩm; ruồi từ phân; **dòi từ xác thối**.\n- **Biogenesis** (thuyết sinh học / \"sinh từ sinh\"): tế bào sống chỉ sinh ra từ **tế bào sống có trước**. Khái niệm do **Rudolf Virchow (1858, Đức)** đưa ra (slide 10)."},{"h":"2. Redi (1668) – thí nghiệm dòi","body":"**Francesco Redi** (Ý) đặt thịt vào:\n| Bình | Kết quả |\n|---|---|\n| Mở | ruồi đậu, **có dòi** |\n| Đậy kín | **không dòi** |\n| Đậy **gạc** (không khí qua được, ruồi không vào) | **không dòi** trên thịt (trứng ruồi đẻ trên gạc) |\n\n→ Dòi đến từ **trứng ruồi**, không tự sinh. **Nhưng** nhiều nhà khoa học vẫn tin **vi sinh vật** đủ đơn giản để tự sinh từ vật không sống (slide 8)."},{"h":"3. Needham (1745) và Spallanzani (1765)","body":"- **John Needham** (Anh, 1745): đun nóng **nước dùng gà và ngô**, rót vào bình **đậy nắp**. Nguội một thời gian → dịch **đục** (vi sinh vật mọc). Needham kết luận: vi sinh vật **tự sinh từ nước dùng**.\n- **Lazzaro Spallanzani** (Ý, 1765): cho rằng vi sinh vật từ **không khí** đã lọt vào sau khi đun. Ông đun dịch **sau khi hàn kín** bình → **không mọc**.\n- Needham phản bác: nhiệt đã **phá hủy \"sinh lực\" (vital force)** cần cho tự sinh, và việc hàn kín **ngăn không khí** mang sinh lực vào.\n\n→ Tranh cãi chưa kết thúc vì thí nghiệm của Spallanzani **loại cả không khí**."},{"h":"4. Virchow (1858) và Pasteur (1861) – kết thúc tranh luận","body":"- **Virchow (1858)**: đề xuất **biogenesis** – tế bào chỉ sinh ra từ tế bào. Tranh luận kéo dài tới 1861.\n- **Louis Pasteur (Pháp, 1861)** chứng minh: vi sinh vật **có trong không khí** có thể làm nhiễm dịch đã tiệt trùng; **bản thân không khí không tạo ra vi sinh vật**.\n  - Thí nghiệm bình **cổ ngắn** chứa dịch chiết thịt bò: đun sôi → để hở → **nhiễm**.\n  - Thí nghiệm bình **cổ dài uốn cong (S-shaped / swan-neck flask)** (Hình 1.3): đun sôi dịch trong bình rồi uốn cổ → không khí vào tự do nhưng **bụi và vi sinh vật bị giữ ở chỗ cong** → dịch **trong suốt nhiều năm**. Nếu **nghiêng bình** cho dịch chạm chỗ cong (hoặc bẻ cổ) → dịch **đục** trong vài ngày.\n\n**Sức mạnh của thiết kế**: bác bỏ luận điểm \"thiếu không khí\" của Needham, vì không khí vẫn vào."},{"h":"5. Ý nghĩa","body":"- Là nền tảng của **kỹ thuật vô trùng (aseptic technique)**: dụng cụ, môi trường phải tiệt trùng và ngăn nhiễm từ không khí, tay, bụi.\n- Mở ra **thời kỳ vàng** của vi sinh vật học (1857–1914).\n- Giới hạn: Pasteur bác bỏ tự sinh **trong điều kiện ngày nay**; không nói gì về nguồn gốc sự sống đầu tiên trên Trái Đất hàng tỉ năm trước."}],"extension":[{"h":"Thực tế phòng lab: vì sao bạn phải hơ miệng ống nghiệm?","body":"Khi cấy vi sinh, bạn hơ miệng ống qua đèn cồn, mở nắp nghiêng, thao tác gần ngọn lửa – tất cả nhằm **ngăn vi sinh vật trong không khí/bụi rơi vào**, đúng bài học của Pasteur. Nút bông trên bình tam giác cũng hoạt động như \"cổ cong\": cho khí trao đổi, giữ bụi."},{"h":"Thực tế công nghiệp","body":"Nồi lên men công nghiệp dùng **bộ lọc khí vô trùng (0,2 μm)** cho khí sục vào: không khí vào được, vi sinh vật bị giữ lại – \"bình cổ cong\" hiện đại. Đồ hộp bị phồng là do vi sinh vật **còn sống sót hoặc lọt vào sau** xử lý nhiệt, chứ không phải tự sinh."}],"keyCards":[{"title":"Spontaneous generation vs biogenesis","bodyEn":"**Spontaneous generation**: life arises from nonliving matter. **Biogenesis** (Virchow, 1858): living cells arise only from preexisting living cells.","glossVi":"Tự sinh vs sinh từ sinh."},{"title":"Redi, Needham, Spallanzani","bodyEn":"**Redi (1668)**: gauze-covered meat had no maggots → maggots come from fly eggs. **Needham (1745)**: heated broth in covered flasks became turbid → claimed spontaneous generation. **Spallanzani (1765)**: broth heated after sealing stayed clear; Needham replied that heat destroyed the \"vital force\".","glossVi":"Needham ủng hộ tự sinh; Spallanzani phản bác."},{"title":"Pasteur, 1861","bodyEn":"**Pasteur** boiled beef broth in **S-shaped (swan-neck) flasks**. Air entered freely but microbes were trapped in the neck, so the broth stayed sterile. Tilting the flask contaminated it. Conclusion: microbes come from the air, **air itself does not generate them**.","glossVi":"Cổ cong giữ bụi, không khí vẫn vào."}],"traps":["Pasteur sealed the flask","Needham supported biogenesis","Redi settled the question for microbes","Virchow did the swan-neck experiment"]},{"id":"HIS-03","title":"The Golden Age: fermentation, pasteurization, germ theory and Koch's postulates","priority":"H","difficulty":2,"minutes":25,"source":"1.History of Microbiology.pptx: slides 12–20","prereq":[],"hookVi":"Thế kỷ 19, rượu vang và bia Pháp thường bị **chua** khi vận chuyển xa, gây thiệt hại lớn. Người ta mời **Pasteur** giải quyết. Ông phát hiện: nấm men làm ra rượu, còn **vi khuẩn** làm rượu chua. Giải pháp đơn giản đến bất ngờ: **đun nóng nhẹ** – ngày nay gọi là **pasteurization** (thanh trùng) và vẫn dùng cho sữa bạn uống mỗi sáng.","predictQuestion":{"stem":"Pasteurization of beer and wine was designed to:","options":["make the drink completely sterile","kill the microbes that cause spoilage without ruining the taste","add yeast to speed up fermentation","remove alcohol from the drink"],"answer":1,"explanation":"Thanh trùng là **đun nóng nhẹ**, đủ diệt vi sinh vật gây hỏng mà không làm hỏng hương vị. Nó **không** làm sản phẩm vô trùng hoàn toàn."},"lesson":[{"h":"1. Thời kỳ vàng (1857–1914)","body":"Sau thí nghiệm của Pasteur, vi sinh vật học **bùng nổ**. Giai đoạn **1857–1914** được gọi là **Golden Age of Microbiology**. Pasteur và **Robert Koch** được xem là người đặt nền móng. Trong giai đoạn này:\n- phát hiện **tác nhân gây bệnh (pathogens)** của nhiều bệnh;\n- phát hiện vai trò của **miễn dịch** trong phòng và kiểm soát bệnh;\n- nghiên cứu **hoạt động hóa học** của vi sinh vật, cải tiến **kính hiển vi** và **kỹ thuật nuôi cấy**, phát triển **vaccine** và **kỹ thuật phẫu thuật**."},{"h":"2. Lên men và thanh trùng (slide 16)","body":"- Câu hỏi thực tế: **vì sao rượu vang và bia bị chua?** → cần cách bảo quản đồ uống lên men để vận chuyển xa.\n- Trước đó, nhiều nhà khoa học cho rằng không khí biến đường thành rượu (quá trình hóa học thuần túy). Pasteur chứng minh:\n  - **Nấm men (yeasts)** biến đường thành **rượu** khi **không có không khí** → **fermentation** (lên men) là quá trình **sinh học**.\n  - Bia/rượu **chua và hỏng** là do **các vi khuẩn khác** (ví dụ vi khuẩn tạo **acid acetic** – giấm).\n- **Pasteurization**: **đun nóng** đồ uống tới nhiệt độ **đủ diệt vi sinh vật gây hỏng**, nhưng không quá cao để giữ hương vị.\n- Ngày nay dùng cho sữa: truyền thống **63 °C/30 phút**, **HTST 72 °C/15 giây**, **UHT 140 °C/<1 giây** (chi tiết ở bài CTL-02)."},{"h":"3. Thuyết mầm bệnh (Germ Theory of Disease) – slide 17–18","body":"- Trước Pasteur: **không biết tác nhân gây bệnh**, chữa bệnh bằng **thử và sai (trial and error)**.\n- Ý tưởng then chốt: nếu **nấm men ↔ lên men**, thì có thể **vi sinh vật ↔ bệnh**.\n- Khó được chấp nhận vì người ta tin bệnh do \"khí độc\" (**miasma**) từ cống rãnh, đầm lầy; khó tin vi sinh vật di chuyển từ nơi khác vào cây/động vật để gây bệnh.\n- **1835 – Agostino Bassi**: chứng minh **một loại nấm** gây bệnh trên **tằm (silkworm)**.\n- **1865 – Pasteur** được mời chống **bệnh tằm**: ông tìm thấy một tác nhân khác là **động vật nguyên sinh (protozoan)** → xây dựng phương pháp phát hiện tằm bệnh."},{"h":"4. Lister và Koch (slide 19)","body":"- **Joseph Lister (Anh, 1860s)**: áp dụng thuyết mầm bệnh vào y khoa – xử lý vết mổ bằng **dung dịch phenol (carbolic acid)** → giảm nhiễm trùng vết mổ; khai sinh **phẫu thuật sát khuẩn (antiseptic surgery)**.\n- **Robert Koch (Đức, 1876)**: bằng chứng **đầu tiên** rằng **vi khuẩn gây bệnh**: ***Bacillus anthracis*** gây **bệnh than (anthrax)** giết gia súc ở châu Âu.\n  - Koch lấy máu con bệnh, **nuôi** vi khuẩn, **tiêm** vào con khỏe → con khỏe bị bệnh → **phân lập lại** vi khuẩn và **so sánh** với vi khuẩn ban đầu → giống nhau.\n  - Từ đó hình thành **Koch's postulates** – chuỗi bước thực nghiệm để liên hệ **một vi sinh vật cụ thể** với **một bệnh cụ thể**."},{"h":"5. Bốn định đề Koch (slide 20, Hình 14.3)","body":"1. **Cùng một tác nhân** phải có mặt ở **mọi trường hợp bệnh**.\n2. Tác nhân phải được **phân lập** từ vật chủ bệnh và nuôi thành **nuôi cấy thuần (pure culture)**.\n3. Tác nhân từ nuôi cấy thuần phải **gây ra cùng bệnh** khi tiêm vào **vật chủ khỏe, cảm thụ**.\n4. Tác nhân phải được **phân lập lại** từ vật chủ bị gây bệnh thực nghiệm và **giống** tác nhân ban đầu.\n\nMẹo nhớ: **Thấy – Tách – Tái hiện – Tìm lại**.\n\n**Ngoại lệ** (hay hỏi): virus, *Treponema pallidum* (giang mai), *Mycobacterium leprae* (phong) **không nuôi cấy được trên môi trường nhân tạo**; một bệnh có thể do nhiều tác nhân (viêm phổi); một tác nhân gây nhiều bệnh (*Streptococcus pyogenes*); người mang mầm bệnh không triệu chứng. [mở rộng]"}],"extension":[{"h":"Thực tế: sữa tươi thanh trùng vs tiệt trùng","body":"Hộp sữa **\"thanh trùng\"** (pasteurized) phải bảo quản lạnh 4 °C và dùng trong ~7–10 ngày; hộp **\"tiệt trùng UHT\"** để nhiệt độ phòng hàng tháng. Lý do: thanh trùng chỉ diệt tác nhân gây bệnh và phần lớn vi sinh vật gây hỏng, **không diệt nội bào tử**; UHT + đóng gói vô trùng gần như vô trùng thương mại."},{"h":"Mở rộng: định đề Koch phân tử","body":"Ngày nay, người ta dùng **định đề Koch phân tử** (Falkow, 1988): gen độc lực phải có ở chủng gây bệnh, bất hoạt gen → mất độc lực, phục hồi gen → phục hồi độc lực. Nhờ đó xác định được tác nhân chưa nuôi cấy được, ví dụ *Helicobacter pylori* gây loét dạ dày (Marshall tự uống vi khuẩn năm 1984 – Nobel 2005)."},{"h":"Liên hệ ngành: lên men là nền tảng công nghệ sinh học","body":"Phát hiện \"nấm men làm ra rượu\" của Pasteur là khởi đầu của **công nghiệp lên men**: bia, rượu, bánh mì, và sau này là ethanol nhiên liệu (bài APP-03). Chữ \"fermentation\" trong công nghiệp được dùng rộng cho mọi quá trình nuôi vi sinh vật quy mô lớn."}],"keyCards":[{"title":"Golden Age 1857–1914","bodyEn":"Pasteur and **Robert Koch** founded microbiology. Achievements: discovery of **pathogens**, the role of **immunity**, study of microbial chemistry, better microscopy and **culture techniques**, **vaccines** and surgical techniques.","glossVi":"Thời kỳ vàng 1857–1914."},{"title":"Fermentation and pasteurization","bodyEn":"Pasteur showed that **yeasts** convert sugar to alcohol without air (**fermentation**) and that **bacteria** cause wine and beer to sour. **Pasteurization** = mild heating that kills spoilage microbes without damaging taste.","glossVi":"Nấm men → rượu; vi khuẩn → chua; thanh trùng = đun nhẹ."},{"title":"Germ theory milestones","bodyEn":"**Bassi (1835)**: a fungus causes silkworm disease. **Pasteur (1865)**: a protozoan also causes silkworm disease. **Lister (1860s)**: phenol on surgical wounds. **Koch (1876)**: *Bacillus anthracis* causes **anthrax**.","glossVi":"Bassi nấm; Pasteur protozoa; Lister phenol; Koch bệnh than."},{"title":"Koch's postulates","bodyEn":"1) same pathogen in every case; 2) isolated in **pure culture**; 3) the culture causes the same disease in a healthy susceptible host; 4) the pathogen is **re-isolated** and matches the original.","glossVi":"Thấy – Tách – Tái hiện – Tìm lại."}],"traps":["Pasteurization sterilizes","Koch's postulates apply to every disease","Lister used alcohol","Bassi found a protozoan in silkworms"]},{"id":"HIS-04","title":"Vaccines and chemotherapy: Jenner, Pasteur, Ehrlich, Fleming","priority":"M","difficulty":1,"minutes":15,"source":"1.History of Microbiology.pptx: slides 21–22","prereq":[],"hookVi":"Năm 1928, **Alexander Fleming** đi nghỉ về và thấy một đĩa nuôi *Staphylococcus* bị **nhiễm mốc xanh**. Xung quanh khuẩn lạc mốc là một **vòng trong** – vi khuẩn không mọc được. Thay vì vứt đi, ông tự hỏi: *mốc này tiết ra chất gì?* Chất đó là **penicillin** – mở ra kỷ nguyên kháng sinh cứu hàng trăm triệu người.","predictQuestion":{"stem":"What did Fleming's contaminated plate show?","options":["The mold killed the bacteria by eating them","A substance diffusing from the Penicillium mold inhibited bacterial growth","The bacteria killed the mold","Heat from the incubator killed the bacteria"],"answer":1,"explanation":"Mốc ***Penicillium*** tiết **penicillin** khuếch tán vào thạch, **ức chế vi khuẩn** tạo vùng trong quanh khuẩn lạc mốc."},"lesson":[{"h":"1. Jenner và vaccine (1796)","body":"- **Edward Jenner (Anh, 1796)** nhận thấy người vắt sữa bò từng mắc **đậu bò (cowpox)** không mắc **đậu mùa (smallpox)**. Ông lấy dịch từ mụn **đậu bò** cấy cho một cậu bé; sau đó cậu bé **không mắc đậu mùa**.\n- Quá trình này gọi là **vaccination** (từ *vacca* = bò). Khả năng cơ thể được bảo vệ khỏi bệnh gọi là **immunity** (miễn dịch).\n\n> ⚠ Slide 21 ghi \"dịch từ mụn **đậu mùa**\". Theo lịch sử chuẩn, Jenner dùng **đậu bò**; dùng dịch đậu mùa là **variolation** – một thực hành cũ, nguy hiểm hơn. Khi thi, câu hỏi thường hỏi *Jenner → vaccination → immunity*; hãy nhớ bản chất đó."},{"h":"2. Pasteur và cơ chế vaccine (1880)","body":"- **Pasteur (1880)** phát hiện: vi khuẩn **tả gà (chicken cholera)** nuôi **lâu ngày trong phòng thí nghiệm** mất khả năng gây bệnh (**giảm độc lực – attenuation**) nhưng **vẫn tạo được miễn dịch**.\n- Pasteur gọi các chế phẩm này là **vaccines** để vinh danh Jenner.\n- Về sau: vaccine bệnh than (1881), dại (1885)."},{"h":"3. Hóa trị liệu – Ehrlich và \"viên đạn thần kỳ\"","body":"- **Chemotherapy**: điều trị bệnh bằng hóa chất.\n- **Paul Ehrlich (Đức, 1910)**: tìm ra **salvarsan** – một dẫn xuất **arsenic** có tác dụng chống ***Treponema pallidum***, vi khuẩn gây **giang mai (syphilis)**. Ý tưởng **\"magic bullet\"**: chất diệt mầm bệnh mà không hại vật chủ → **độc tính chọn lọc (selective toxicity)**.\n- **Sau 1930**: nhiều hợp chất ức chế vi sinh vật gây bệnh được tìm thấy, **phần lớn là dẫn xuất của thuốc nhuộm**; **sulfonamides** (sulfa drugs) được tổng hợp trong giai đoạn này.\n\nPhân biệt: **synthetic drugs** (tổng hợp hóa học: salvarsan, sulfonamide) vs **antibiotics** (chất do vi sinh vật tạo ra: penicillin)."},{"h":"4. Fleming và penicillin (1928)","body":"- **Alexander Fleming (Scotland, 1928)** phát hiện nấm ***Penicillium notatum*** (nay gọi ***P. chrysogenum***) **ức chế sự phát triển của vi khuẩn**. Hợp chất được gọi là **penicillin**.\n- Penicillin được **sản xuất công nghiệp sau 1940** (Florey và Chain tinh chế; sản xuất bằng lên men chìm – bài APP-04).\n- Nhờ phát hiện này, **hàng nghìn kháng sinh khác** được tìm thấy.\n- **Mặt trái**: nhiều kháng sinh **độc với người và động vật**; xuất hiện **vi sinh vật kháng kháng sinh (antibiotic-resistant microorganisms)**."},{"h":"5. Bảng tổng hợp slide 21–22","body":"| Người | Năm | Đóng góp | Từ khóa |\n|---|---|---|---|\n| Jenner | 1796 | vaccine đậu mùa | vaccination, immunity |\n| Pasteur | 1880 | vi khuẩn tả gà giảm độc lực vẫn tạo miễn dịch | attenuated vaccine |\n| Ehrlich | 1910 | salvarsan (arsenic) chữa giang mai | chemotherapy, magic bullet |\n| (sau 1930) | 1930s | dẫn xuất thuốc nhuộm, sulfonamides | synthetic drugs |\n| Fleming | 1928 | penicillin từ *Penicillium notatum/chrysogenum* | antibiotic |"}],"extension":[{"h":"Thực tế: kháng kháng sinh (AMR)","body":"WHO xếp **kháng kháng sinh** là một trong 10 mối đe dọa sức khỏe toàn cầu. Dùng kháng sinh khi bị cảm cúm (do virus) không có tác dụng mà còn **chọn lọc** vi khuẩn kháng thuốc. Vi khuẩn kháng penicillin thường tiết **β-lactamase** cắt vòng β-lactam – liên hệ bài BAC-03 (penicillin ức chế transpeptidase)."},{"h":"Liên hệ bài học sau","body":"- Penicillin tác động vào **peptidoglycan** → vì sao Gram dương nhạy hơn Gram âm (BAC-03, BAC-04).\n- Sản xuất penicillin công nghiệp là **chất chuyển hóa bậc 2** bằng lên men fed-batch (APP-04).\n- Vaccine hiện đại: bất hoạt, giảm độc lực, tiểu đơn vị, mRNA (vaccine COVID-19) – cùng nguyên lý **tạo trí nhớ miễn dịch** mà Jenner khởi đầu."}],"keyCards":[{"title":"Jenner 1796","bodyEn":"Edward **Jenner** protected people against **smallpox** with material from cowpox lesions. The process is **vaccination**; the protection is **immunity**. (The slide says smallpox blisters; historically it was cowpox.)","glossVi":"Jenner → vaccination → immunity."},{"title":"Pasteur 1880","bodyEn":"Chicken cholera bacteria kept in the lab for a long time lost their ability to cause disease (**attenuated**) but still induced immunity. Pasteur called them **vaccines**.","glossVi":"Vi khuẩn giảm độc lực vẫn tạo miễn dịch."},{"title":"Ehrlich and Fleming","bodyEn":"**Ehrlich (1910)**: **salvarsan**, an arsenic derivative active against the syphilis bacterium. After 1930: dye derivatives and **sulfonamides**. **Fleming (1928)**: *Penicillium notatum (chrysogenum)* inhibits bacteria → **penicillin**, industrial after 1940. Problems: toxicity and **antibiotic resistance**.","glossVi":"Salvarsan – giang mai; penicillin – Fleming 1928."}],"traps":["Vaccines are antibiotics","Salvarsan is an antibiotic from a mold","Antibiotics treat viral infections","Fleming industrialized penicillin in 1928"]},{"id":"BAC-01","title":"Size, shape and arrangement of bacteria","priority":"H","difficulty":1,"minutes":20,"source":"2-3.Bacteria.pptx: slides 1–11","prereq":[],"hookVi":"Nhìn tiêu bản nhuộm Gram mủ viêm họng, bác sĩ thấy **cầu khuẩn xếp thành chuỗi** như chuỗi hạt; tiêu bản mụn nhọt lại thấy **cầu khuẩn xếp thành chùm** như chùm nho. Chỉ từ **cách sắp xếp** đã gợi ý hai chi khác nhau: *Streptococcus* và *Staphylococcus*. Cách sắp xếp đến từ đâu?","predictQuestion":{"stem":"Why do streptococci form chains while staphylococci form grape-like clusters?","options":["They have different cell wall colors","Cells divide in one plane and stay attached (chains) versus divide in multiple random planes (clusters)","Streptococci are rods","Staphylococci have flagella"],"answer":1,"explanation":"Cách sắp xếp phụ thuộc **mặt phẳng phân chia** và việc tế bào con **còn dính nhau**: một mặt phẳng → chuỗi (strepto-); nhiều mặt phẳng ngẫu nhiên → chùm (staphylo-)."},"lesson":[{"h":"1. Kích thước","body":"- Phần lớn vi khuẩn: đường kính **0,2–2,0 μm**, dài **2–8 μm** [fig]. Nhỏ hơn nhiều so với tế bào nhân thực (10–100 μm).\n- Slide 3: thang kích thước từ virus (nm) → vi khuẩn (μm) → tế bào nhân thực.\n- Tỉ lệ **diện tích bề mặt/thể tích** lớn giúp vi khuẩn trao đổi chất nhanh → sinh trưởng nhanh. [mở rộng]"},{"h":"2. Ba hình dạng cơ bản","body":"| Hình dạng | Tên | Ví dụ |\n|---|---|---|\n| Hình cầu | **coccus** (số nhiều cocci) – cầu khuẩn | *Staphylococcus, Streptococcus* |\n| Hình que | **bacillus** (bacilli) – trực khuẩn | *E. coli, Bacillus* |\n| Xoắn | **spiral** – xoắn khuẩn | *Vibrio, Spirillum, Treponema* |\n\nBa dạng xoắn (slide 1 ghi chú \"Spirillum & spirochete: xoắn khuẩn\"):\n- **Vibrio**: que **cong** như dấu phẩy (*Vibrio cholerae*).\n- **Spirillum**: xoắn **cứng**, di chuyển bằng **roi ngoài** giống cánh quạt.\n- **Spirochete**: xoắn **mềm dẻo**, di chuyển bằng **sợi trục (axial filament)** nằm dưới vỏ ngoài (*Treponema pallidum, Borrelia*).\n\nHình dạng khác: **hình sao** (*Stella*), **hình vuông/phẳng** (*Haloarcula* – một archaea). Phần lớn vi khuẩn **đơn hình (monomorphic)**; một số **đa hình (pleomorphic)** như *Rhizobium, Corynebacterium*.\n\n> Chú ý chính tả: **bacillus** (viết thường) = hình que; ***Bacillus*** (viết hoa, in nghiêng) = **tên một chi**."},{"h":"3. Cách sắp xếp của cầu khuẩn","body":"| Kiểu | Cách phân chia | Hình ảnh |\n|---|---|---|\n| **Diplococci** | 1 mặt phẳng, dính 2 tế bào | đôi (*Neisseria*) |\n| **Streptococci** | 1 mặt phẳng, dính thành chuỗi | chuỗi hạt |\n| **Tetrad** | 2 mặt phẳng vuông góc | nhóm 4 |\n| **Sarcinae** | 3 mặt phẳng vuông góc | khối lập phương 8 tế bào |\n| **Staphylococci** | nhiều mặt phẳng ngẫu nhiên | chùm nho |"},{"h":"4. Cách sắp xếp của trực khuẩn","body":"- Trực khuẩn chỉ phân chia theo **mặt phẳng ngang** (vuông góc trục dài) → ít kiểu sắp xếp hơn.\n- **Single bacillus** (đơn), **diplobacilli** (đôi), **streptobacilli** (chuỗi), **coccobacillus** (que rất ngắn, gần giống cầu).\n- Hình dạng + sắp xếp là **đặc điểm kiểu hình**, dùng hỗ trợ định danh (bài IDT-01), nhưng **không đủ** để xác định loài."}],"extension":[{"h":"Thực tế lâm sàng","body":"- Nhuộm Gram mủ thấy **Gram dương, cầu khuẩn chùm** → nghĩ tới *Staphylococcus aureus*; **song cầu Gram âm hình hạt cà phê** trong tế bào bạch cầu → nghĩ tới *Neisseria gonorrhoeae*.\n- Đây là bước định danh sơ bộ nhanh nhất (vài phút), trước khi có kết quả nuôi cấy (1–2 ngày)."},{"h":"Công nghệ thực phẩm","body":"*Streptococcus thermophilus* (cầu khuẩn chuỗi) và *Lactobacillus bulgaricus* (trực khuẩn) cùng lên men sữa chua. Nhìn tiêu bản sữa chua dưới kính, bạn thấy **cả chuỗi cầu và que** – kiểm tra tỷ lệ hai loài là một chỉ tiêu chất lượng."}],"keyCards":[{"title":"Basic shapes","bodyEn":"**Coccus** (spherical), **bacillus** (rod), **spiral**. Spirals: **vibrio** (curved rod), **spirillum** (rigid helix, external flagella), **spirochete** (flexible helix, **axial filaments**). Most bacteria are **monomorphic**; some are **pleomorphic**.","glossVi":"Cầu, que, xoắn; xoắn khuẩn có vibrio, spirillum, spirochete."},{"title":"Arrangements of cocci","bodyEn":"Division in one plane → **diplococci** or **streptococci** (chains). Two planes → **tetrads**. Three planes → **sarcinae** (cubes of 8). Random planes → **staphylococci** (clusters).","glossVi":"Mặt phẳng phân chia quyết định cách sắp xếp."},{"title":"Arrangements of bacilli","bodyEn":"Bacilli divide only across the short axis: single, **diplobacilli**, **streptobacilli**, **coccobacilli**. Note: *Bacillus* (genus) ≠ bacillus (shape).","glossVi":"Trực khuẩn: đơn, đôi, chuỗi, cầu trực."}],"traps":["bacillus shape = Bacillus genus","Spirilla move with axial filaments","Arrangement identifies species"]},{"id":"BAC-02","title":"Glycocalyx, flagella and archaella, axial filaments, fimbriae and pili","priority":"H","difficulty":2,"minutes":25,"source":"2-3.Bacteria.pptx: slides 13–22","prereq":[],"hookVi":"Mảng bám trên răng (**dental plaque**) thật ra là một **biofilm**: hàng tỉ vi khuẩn *Streptococcus mutans* dính vào men răng nhờ một lớp **đường nhầy** do chính chúng tiết ra. Súc miệng thôi không đủ, phải **chải** (tác động cơ học). Lớp nhầy đó là gì và vì sao nó giúp vi khuẩn gây bệnh?","predictQuestion":{"stem":"Encapsulated Streptococcus pneumoniae causes pneumonia, while mutant strains without capsules are easily destroyed. What does the capsule mainly do?","options":["Makes the cell move faster","Protects the bacterium from phagocytosis by host cells","Carries out photosynthesis","Transfers DNA to other cells"],"answer":1,"explanation":"Vỏ nhầy (**capsule**) giúp vi khuẩn **tránh bị thực bào** → tăng **độc lực (virulence)**. Chủng mất capsule bị bạch cầu tiêu diệt dễ dàng."},"lesson":[{"h":"1. Glycocalyx: capsule và slime layer (slide 15)","body":"**Glycocalyx** là lớp polymer **nhớt, dạng gel** nằm **bên ngoài thành tế bào**, gồm **polysaccharide, polypeptide hoặc cả hai**.\n- **Capsule** (vỏ nhầy): tổ chức chặt, bám chắc vào thành.\n- **Slime layer** (lớp nhầy): lỏng lẻo, không tổ chức.\n\n**Vai trò:**\n- **Độc lực (virulence)** – mức độ gây bệnh: capsule giúp tránh **thực bào (phagocytosis)**. Ví dụ slide: ***Streptococcus pneumoniae, Bacillus anthracis, Streptococcus mutans, Klebsiella pneumoniae***.\n- Thành phần quan trọng của **biofilm**. Glycocalyx giúp tế bào bám vào bề mặt và vào nhau gọi là **EPS (extracellular polymeric substance)**. EPS **bảo vệ** tế bào bên trong, **giúp chúng giao tiếp** và **sống sót** nhờ bám vào nhiều bề mặt.\n- Giữ nước, chống khô; dự trữ dinh dưỡng. [fig]"},{"h":"2. Roi (flagella) – cấu tạo và vận động","body":"**Flagella** (số ít flagellum): phần phụ dài, mảnh giúp vi khuẩn **di chuyển**. Ba phần [fig]:\n| Phần | Mô tả |\n|---|---|\n| **Filament** (sợi) | dài nhất, làm từ protein **flagellin** |\n| **Hook** (móc) | nối sợi với thân |\n| **Basal body** (thể gốc) | neo roi vào thành và màng bằng các **vòng (rings)**; là \"động cơ\" quay |\n\n**Kiểu phân bố roi** [fig]:\n- **Monotrichous**: 1 roi ở một cực (polar).\n- **Amphitrichous**: roi ở **hai đầu**.\n- **Lophotrichous**: **chùm** roi ở một đầu.\n- **Peritrichous**: roi **khắp bề mặt** (*E. coli, Salmonella*).\n- **Atrichous**: không roi.\n\n**Cơ chế:** roi **quay** như chân vịt (xoay ngược chiều kim đồng hồ → **run** bơi thẳng; xoay cùng chiều → **tumble** lộn vòng đổi hướng). Di chuyển hướng tới/xa kích thích gọi là **taxis**: **chemotaxis** (hóa chất), **phototaxis** (ánh sáng).\n\nProtein roi là **kháng nguyên H** – dùng phân biệt chủng, ví dụ ***E. coli* O157:H7**. [mở rộng]"},{"h":"3. Archaella (slide 16–18)","body":"**Archaella** (số ít archaellum) là cấu trúc vận động của **Archaea**: cũng quay như roi nhưng **khác cấu trúc và nguồn gốc**:\n| | Flagellum (Bacteria) | Archaellum (Archaea) |\n|---|---|---|\n| Protein | flagellin | archaellin (glycoprotein) |\n| Năng lượng quay | lực proton (proton motive force) | **ATP** |\n| Kênh rỗng giữa sợi | có | **không** |"},{"h":"4. Sợi trục – axial filaments (slide 19)","body":"- Còn gọi **endoflagella**: bó sợi **nằm dưới vỏ ngoài (outer sheath)**, bám ở hai đầu tế bào, quấn quanh tế bào của **xoắn thể (spirochetes)**.\n- Có **cấu trúc giống roi**; sự **quay của sợi** làm vỏ ngoài chuyển động → tế bào di chuyển kiểu **xoắn ốc** (như cái mở nút chai).\n- Ví dụ: ***Treponema pallidum*** – **giang mai (syphilis)**; ***Borrelia burgdorferi*** – **bệnh Lyme**."},{"h":"5. Fimbriae và pili (slide 20–22)","body":"| | **Fimbriae** (tiêm mao / lông bám) | **Pili** (lông giới tính) |\n|---|---|---|\n| Hình dạng | ngắn, thẳng, mảnh hơn roi | thường **dài hơn** fimbriae |\n| Số lượng | nhiều (vài đến vài trăm) | chỉ **1 hoặc 2** mỗi tế bào |\n| Protein | **pilin** | pilin |\n| Chức năng | **bám dính (attachment)** vào bề mặt, tế bào chủ | **nối hai tế bào** chuẩn bị **chuyển DNA** (tiếp hợp – conjugation); còn giúp vận động giật (twitching), trượt (gliding) |\n| Ví dụ | *E. coli*, *Neisseria gonorrhoeae* (lậu) | pilus giới tính F ở *E. coli* |\n\n- Slide 20: nếu **đột biến mất fimbriae**, vi khuẩn **không gây bệnh được** (vì không bám được vào mô chủ) → fimbriae là **yếu tố độc lực**.\n- Fimbriae/pili **không dùng để bơi** như roi."}],"extension":[{"h":"Biofilm trong đời sống","body":"- Biofilm có mặt ở: mảng bám răng, ống thông tiểu, van tim nhân tạo, kính áp tròng, đường ống nước, màng lọc công nghiệp.\n- Vi khuẩn trong biofilm **chịu kháng sinh và chất khử trùng gấp 10–1000 lần** tế bào trôi nổi → khó điều trị nhiễm trùng thiết bị y tế.\n- Trong công nghệ môi trường, biofilm lại **có lợi**: bể lọc sinh học, đĩa quay sinh học xử lý nước thải."},{"h":"Kháng nguyên O và H","body":"Chủng *E. coli* **O157:H7** gây tiêu chảy ra máu: **O157** là kháng nguyên từ chuỗi đường O của LPS (bài BAC-04), **H7** là kháng nguyên roi. Cách gọi tên này dùng trong kiểm nghiệm an toàn thực phẩm."}],"keyCards":[{"title":"Glycocalyx","bodyEn":"A viscous, gelatinous polymer **outside the cell wall**, made of polysaccharide, polypeptide or both. **Capsule** = organized and firmly attached; **slime layer** = loose. Capsules protect pathogens from **phagocytosis** (virulence): *S. pneumoniae, B. anthracis, S. mutans, K. pneumoniae*. In biofilms it is called **EPS**.","glossVi":"Capsule → tránh thực bào; EPS → biofilm."},{"title":"Flagella","bodyEn":"Filament (**flagellin**) + hook + basal body. Arrangements: **monotrichous, amphitrichous, lophotrichous, peritrichous**. Flagella rotate (run and tumble) and allow **taxis**. Archaea have **archaella** (ATP-driven, different structure).","glossVi":"Roi quay; 4 kiểu phân bố."},{"title":"Axial filaments","bodyEn":"Bundles of **endoflagella** under an outer sheath of **spirochetes** (*Treponema pallidum*: syphilis; *Borrelia burgdorferi*: Lyme disease). Rotation moves the sheath and produces a corkscrew motion.","glossVi":"Sợi trục của xoắn thể."},{"title":"Fimbriae vs pili","bodyEn":"**Fimbriae**: many, short, thin, made of **pilin**, used for **attachment**; mutants without fimbriae cannot cause disease. **Pili**: longer, only **1–2 per cell**, join two cells for **DNA transfer** (conjugation).","glossVi":"Fimbriae bám; pili chuyển DNA."}],"traps":["Fimbriae are for swimming","Pili are numerous","Capsule is inside the cell wall","Archaella are bacterial flagella"]},{"id":"BAC-03","title":"Peptidoglycan and the Gram-positive cell wall","priority":"H","difficulty":2,"minutes":25,"source":"2-3.Bacteria.pptx: slides 23–37","prereq":[],"hookVi":"Nước mắt của bạn chứa **lysozyme**, còn thuốc **penicillin** thì do nấm tạo ra. Cả hai đều giết vi khuẩn nhưng **không làm hại tế bào người**. Bí mật: cả hai tấn công cùng một mục tiêu mà tế bào người **không có** – mạng lưới **peptidoglycan** của thành tế bào vi khuẩn.","predictQuestion":{"stem":"Why does penicillin harm bacteria but not human cells?","options":["Human cells have thicker cell walls","It targets peptidoglycan synthesis, and human cells have no peptidoglycan","It targets 80S ribosomes","It dissolves all lipid membranes"],"answer":1,"explanation":"Penicillin ức chế enzyme tạo liên kết chéo **peptidoglycan**; tế bào người **không có thành peptidoglycan** → **độc tính chọn lọc**."},"lesson":[{"h":"1. Chức năng của thành tế bào","body":"- Giữ **hình dạng** tế bào.\n- Chống **vỡ do áp suất thẩm thấu**: nồng độ chất tan trong tế bào cao hơn môi trường → nước đi vào → thành chống lại áp lực.\n- Điểm neo cho roi.\n- Là **đích tác động** của kháng sinh (penicillin) và lysozyme; thành phần thành giúp phân biệt **Gram dương / Gram âm**."},{"h":"2. Cấu trúc peptidoglycan (murein) – slide 28","body":"**Peptidoglycan** là mạng lưới gồm:\n- **Khung đường (glycan backbone)**: xen kẽ **NAG** (N-acetylglucosamine) và **NAM** (N-acetylmuramic acid), nối bằng liên kết **β-1,4**. Mỗi chuỗi dài **10–65 đơn vị** (slide ghi \"10–65 monomers\"), các chuỗi xếp **song song**.\n- **Chuỗi bên tetrapeptide (side chain)**: 4 amino acid gắn vào **NAM**. Ghi chú slide 3: gồm **L-alanine, D-glutamate, diaminopimelic acid (DAP), D-alanine** – có **D-amino acid** (hiếm gặp ở protein thường).\n- **Cầu nối chéo peptide (cross-bridge)**: chuỗi amino acid ngắn nối các tetrapeptide của hai chuỗi kề nhau (ví dụ cầu pentaglycine ở *Staphylococcus aureus*).\n\nHình dung: khung đường = các sợi dây song song; tetrapeptide + cầu nối = các \"nút buộc\" tạo lưới."},{"h":"3. Penicillin và lysozyme – hai cách phá thành","body":"| | **Penicillin** | **Lysozyme** |\n|---|---|---|\n| Nguồn | nấm *Penicillium* | nước mắt, nước bọt, lòng trắng trứng |\n| Đích | enzyme **transpeptidase** tạo **cầu nối chéo** | **liên kết β-1,4** giữa NAM và NAG |\n| Tác động | ngăn **tổng hợp** thành mới → tế bào **đang sinh trưởng** bị vỡ | **cắt** khung đường của thành có sẵn |\n\n- Slide 28: *penicillin inactivates transpeptidase (responsible for cross-bridge synthesis) → breaks down the peptidoglycan layer.*\n- Mất thành trong môi trường đẳng trương: Gram dương → **protoplast**; Gram âm (còn màng ngoài) → **spheroplast**. Trong môi trường nhược trương, chúng **vỡ (osmotic lysis)**. [fig]"},{"h":"4. Thành tế bào Gram dương (slide 34–37)","body":"- **Nhiều lớp peptidoglycan** → thành **dày và chắc**; **nhạy với penicillin** (peptidoglycan lộ ra ngoài, không có màng ngoài che chắn).\n- Chứa **teichoic acid** (gồm **rượu – glycerol hoặc ribitol – và phosphate**):\n  - **Lipoteichoic acid**: xuyên qua lớp peptidoglycan và **gắn vào màng sinh chất**.\n  - **Wall teichoic acid**: gắn vào **lớp peptidoglycan**.\n- Teichoic acid **tích điện âm** → có thể **liên kết và điều hòa sự di chuyển của cation** (ion dương) ra vào tế bào; cũng là kháng nguyên giúp định danh. [fig]\n- Thành *Streptococcus* chứa **nhiều loại polysaccharide** khác nhau (dùng phân nhóm Lancefield). [mở rộng]"},{"h":"5. Mycobacterium – thành giàu acid mycolic","body":"- Slide 37: thành ***Mycobacterium*** chứa **60 % mycolic acid** (lipid sáp), phần còn lại là peptidoglycan.\n- Lớp sáp khiến thuốc nhuộm Gram khó thấm → dùng **nhuộm kháng acid (acid-fast stain)**: vi khuẩn giữ màu đỏ carbolfuchsin sau khi tẩy bằng cồn-acid.\n- Vi khuẩn lao (*M. tuberculosis*) và phong (*M. leprae*); *Nocardia* cũng kháng acid.\n- Lớp sáp giúp chống khô, chống nhiều chất sát khuẩn và kháng sinh, sinh trưởng rất chậm."}],"extension":[{"h":"Thực tế: vì sao β-lactam là \"con cưng\" của ngành dược","body":"Penicillin, ampicillin, amoxicillin, cephalosporin đều có **vòng β-lactam** và đều ức chế transpeptidase (còn gọi **penicillin-binding proteins – PBP**). Chúng chiếm hơn 60 % lượng kháng sinh dùng trên thế giới vì độc tính chọn lọc cao. Vi khuẩn kháng lại bằng **β-lactamase** (cắt vòng β-lactam) hoặc thay đổi PBP (tụ cầu vàng kháng methicillin **MRSA**)."},{"h":"Công nghệ thực phẩm: lysozyme bảo quản","body":"Lysozyme từ lòng trắng trứng được dùng làm chất bảo quản trong **phô mai** (ngăn *Clostridium tyrobutyricum* gây phồng phô mai) và rượu vang – một ứng dụng trực tiếp của kiến thức cấu trúc peptidoglycan."}],"keyCards":[{"title":"Peptidoglycan structure","bodyEn":"Backbone of alternating **NAG** and **NAM** linked by **β-1,4** bonds (10–65 units per chain, chains in parallel). A **tetrapeptide side chain** (L-Ala, D-Glu, DAP, D-Ala) is attached to NAM; short **peptide cross-bridges** link side chains.","glossVi":"NAG–NAM + tetrapeptide + cầu nối."},{"title":"Penicillin vs lysozyme","bodyEn":"**Penicillin** inactivates **transpeptidase**, the enzyme that makes cross-bridges, so new wall cannot be built. **Lysozyme** hydrolyzes the **β-1,4 bond** between NAM and NAG. Without a wall: protoplast (Gram+) or spheroplast (Gram−); in hypotonic media → lysis.","glossVi":"Penicillin chặn nối chéo; lysozyme cắt khung đường."},{"title":"Gram-positive wall","bodyEn":"**Many layers** of peptidoglycan → thick, strong, **sensitive to penicillin**. **Teichoic acids** (glycerol or ribitol + phosphate): **lipoteichoic acid** spans the wall and links to the plasma membrane; **wall teichoic acid** links to peptidoglycan. Negatively charged → bind and regulate cations.","glossVi":"Gram dương: dày, có teichoic acid."},{"title":"Mycobacterium","bodyEn":"Wall contains about **60 % mycolic acid** (waxy lipid) and the rest peptidoglycan → **acid-fast**, resistant to drying and many chemicals.","glossVi":"60 % acid mycolic → kháng acid."}],"traps":["Lysozyme and penicillin act the same way","Teichoic acid is in Gram-negative walls","Human cells have peptidoglycan"]},{"id":"BAC-04","title":"Gram-negative wall, LPS, the Gram stain and atypical walls","priority":"H","difficulty":2,"minutes":25,"source":"2-3.Bacteria.pptx: slides 26–27, 38–41","prereq":[],"hookVi":"Một bệnh nhân nhiễm trùng máu do *E. coli* được tiêm kháng sinh, vi khuẩn chết hàng loạt – nhưng bệnh nhân lại **sốt cao hơn, tụt huyết áp**. Lý do: khi vi khuẩn **Gram âm** chết và vỡ, chúng giải phóng **lipid A** từ màng ngoài – một **nội độc tố (endotoxin)**. Màng ngoài này còn giải thích vì sao Gram âm **khó trị** hơn.","predictQuestion":{"stem":"Which part of the Gram-negative outer membrane is the endotoxin?","options":["Porin","O polysaccharide","Lipid A","Teichoic acid"],"answer":2,"explanation":"**Lipid A** của LPS là **nội độc tố** → sốt, giãn mạch, sốc, đông máu. Được giải phóng khi vi khuẩn Gram âm chết/vỡ."},"lesson":[{"h":"1. Cấu tạo thành Gram âm (slide 38–39)","body":"Từ trong ra ngoài:\n1. **Màng sinh chất** (plasma membrane).\n2. **Periplasmic space (vùng chu chất)** – khoảng giữa màng sinh chất và màng ngoài; chứa **nồng độ cao enzyme phân giải và protein vận chuyển**.\n3. **Peptidoglycan**: chỉ **một hoặc rất ít lớp**, **mỏng** → dễ tổn thương cơ học; nằm trong vùng chu chất và **liên kết với lipoprotein** (lipid gắn cộng hóa trị với protein) của màng ngoài.\n4. **Outer membrane (màng ngoài)**: lipoprotein, **lipopolysaccharide (LPS)**, phospholipid và **porin**.\n\n- **Không có teichoic acid**."},{"h":"2. Màng ngoài – chức năng (slide 40–41)","body":"- **Điện tích âm mạnh** → giúp **tránh thực bào** và tránh tác động của **bổ thể (complement)** (hệ protein làm tan tế bào và thúc đẩy thực bào).\n- **Hàng rào** ngăn: chất tẩy rửa, **kim loại nặng, muối mật**, một số thuốc nhuộm, **kháng sinh (như penicillin)** và enzyme tiêu hóa như **lysozyme**.\n- **Porin**: protein tạo **kênh** cho các phân tử nhỏ đi qua – nucleotide, disaccharide, peptide, amino acid, vitamin B12, sắt…\n\n> Slide 40 ghi porin còn cho \"virus và hợp chất nguy hiểm\" đi qua. Hiểu đúng: porin cho **các chất tan nhỏ, ưa nước** đi qua (kể cả chất có hại); virus nguyên vẹn thì **quá lớn**, chúng dùng porin như **thụ thể bám** chứ không chui qua."},{"h":"3. LPS – lipopolysaccharide","body":"LPS gồm 3 phần [fig]:\n| Phần | Vai trò |\n|---|---|\n| **Lipid A** | neo LPS vào màng ngoài; là **nội độc tố (endotoxin)** → **sốt, giãn mạch máu, sốc, đông máu** ở vật chủ (slide 41) |\n| **Core polysaccharide** | lõi đường nối lipid A với chuỗi O |\n| **O polysaccharide** | chuỗi đường hướng ra ngoài; là **kháng nguyên O** (ví dụ *E. coli* **O157**) |\n\nNội độc tố được giải phóng khi vi khuẩn **chết và vỡ** → dùng kháng sinh diệt khuẩn ồ ạt có thể làm triệu chứng nặng lên tạm thời."},{"h":"4. Nhuộm Gram – cơ chế (slide 26–27)","body":"| Bước | Hóa chất | Gram dương | Gram âm |\n|---|---|---|---|\n| 1. Nhuộm chính | **Crystal violet** | tím | tím |\n| 2. Cẩn màu | **Iodine** (mordant) → phức CV-I | tím | tím |\n| 3. Tẩy màu | **Alcohol / acetone** | **tím** (giữ màu) | **không màu** |\n| 4. Nhuộm phụ | **Safranin** (counterstain) | tím | **hồng/đỏ** |\n\n**Vì sao?**\n- Gram dương: cồn làm **lớp peptidoglycan dày mất nước, co lại** → phức CV-I **bị giữ lại**.\n- Gram âm: cồn **hòa tan màng ngoài (lipid)**, lớp peptidoglycan **mỏng** không giữ được phức CV-I → phức bị rửa trôi → bắt màu safranin.\n- **Tế bào già** Gram dương có thể bắt màu như Gram âm (thành bị tổn thương) → nên nhuộm vi khuẩn **non (18–24 h)**. [mở rộng]"},{"h":"5. So sánh Gram dương – Gram âm","body":"| Đặc điểm | Gram dương | Gram âm |\n|---|---|---|\n| Peptidoglycan | **dày, nhiều lớp** | **mỏng, 1–vài lớp** |\n| Teichoic acid | **có** | **không** |\n| Màng ngoài | không | **có** (LPS, porin, lipoprotein) |\n| Vùng chu chất | hẹp/không rõ | **có**, nhiều enzyme |\n| Nội độc tố (lipid A) | không | **có** |\n| Nhạy penicillin, lysozyme | **cao** | **thấp** (màng ngoài cản) |\n| Chịu tác động cơ học | tốt | kém |\n| Màu Gram | **tím** | **hồng/đỏ** |"},{"h":"6. Thành tế bào không điển hình","body":"- ***Mycoplasma***: **không có thành tế bào**; màng chứa **sterol** (giúp chống vỡ); rất nhỏ; kháng penicillin tự nhiên.\n- **Kháng acid** (*Mycobacterium, Nocardia*): acid mycolic (BAC-03).\n- **Archaea**: không có peptidoglycan; có **pseudomurein** hoặc lớp S (BAC-08)."}],"extension":[{"h":"Thực tế: nội độc tố trong dược phẩm","body":"Nước tiêm, dịch truyền, vaccine phải kiểm tra **endotoxin** (phép thử **LAL – Limulus Amebocyte Lysate** từ máu cua móng ngựa). Vì lipid A **chịu nhiệt**, hấp tiệt trùng (autoclave) diệt vi khuẩn nhưng **không phá nội độc tố** → phải loại bỏ bằng nhiệt khô 250 °C (depyrogenation) hoặc lọc."},{"h":"Liên hệ: vì sao Gram âm khó trị","body":"Màng ngoài + bơm đẩy thuốc (efflux pump) + β-lactamase trong vùng chu chất làm vi khuẩn Gram âm như *Pseudomonas aeruginosa, Klebsiella, Acinetobacter* đứng đầu danh sách vi khuẩn kháng thuốc ưu tiên của WHO. *P. aeruginosa* còn kháng triclosan (bài CTL-04)."}],"keyCards":[{"title":"Gram-negative wall","bodyEn":"Plasma membrane → **periplasmic space** (degrading enzymes, transport proteins) → **thin peptidoglycan** (one or a few layers, linked to lipoproteins) → **outer membrane** (lipoproteins, **LPS**, phospholipids, **porins**). No teichoic acid.","glossVi":"Gram âm: peptidoglycan mỏng + màng ngoài."},{"title":"Outer membrane functions","bodyEn":"Strong negative charge helps **evade phagocytosis and complement**. Barrier to detergents, heavy metals, bile salts, some dyes, **antibiotics (penicillin)** and **lysozyme**. **Porins** let small molecules pass (nucleotides, disaccharides, peptides, amino acids, vitamin B12, iron).","glossVi":"Màng ngoài: hàng rào + porin."},{"title":"LPS","bodyEn":"**Lipid A** (endotoxin → fever, vasodilation, shock, blood clotting), **core polysaccharide**, **O polysaccharide** (O antigen, e.g., O157).","glossVi":"Lipid A = nội độc tố."},{"title":"Gram stain","bodyEn":"Crystal violet → iodine (mordant) → **alcohol decolorizes** → safranin. Gram+: thick peptidoglycan dehydrates and traps CV-I → **purple**. Gram−: alcohol dissolves the outer membrane; thin wall loses CV-I → **pink/red**.","glossVi":"Tím = Gram dương; hồng = Gram âm."}],"traps":["Gram-negative has thicker peptidoglycan","Porins transport whole viruses","Endotoxin is released from living cells only","Safranin stains only Gram-negatives"]},{"id":"BAC-05","title":"The plasma membrane and transport across it","priority":"H","difficulty":2,"minutes":25,"source":"2-3.Bacteria.pptx: slides 42–50","prereq":[],"hookVi":"Muối dưa, ướp cá, làm mứt đường – ông bà ta đã dùng **áp suất thẩm thấu** để bảo quản thực phẩm hàng nghìn năm. Trong môi trường **ưu trương**, nước bị rút khỏi tế bào vi khuẩn qua **màng sinh chất**, tế bào co lại và ngừng phát triển. Màng sinh chất quyết định chất gì vào, chất gì ra.","predictQuestion":{"stem":"A bacterium is placed in 20% salt solution (hypertonic). What happens?","options":["Water enters and the cell bursts","Water leaves the cell and the cytoplasm shrinks (plasmolysis)","Nothing, because the cell wall blocks water","Salt is actively pumped out and the cell grows faster"],"answer":1,"explanation":"Môi trường **ưu trương** → nước đi **ra** → **co nguyên sinh (plasmolysis)** → ức chế sinh trưởng. Đó là nguyên lý muối, ướp đường."},"lesson":[{"h":"1. Cấu trúc màng sinh chất (slide 42–44)","body":"- **Lớp kép phospholipid (bilayer)**: hai hàng phospholipid song song.\n  - **Đầu phân cực (polar head)**: nhóm phosphate + glycerol → **ưa nước**, hướng ra ngoài.\n  - **Đuôi không phân cực (non-polar tails)**: acid béo → **kỵ nước**, hướng vào trong.\n- Bao bọc **tế bào chất (cytosol)**; gồm **phospholipid và protein**.\n- **Không chứa sterol** như tế bào nhân thực, **ngoại trừ *Mycoplasma***.\n- **Mô hình khảm lỏng (fluid mosaic)**: phospholipid và protein **không đứng yên** mà di chuyển khá tự do trên mặt màng.\n- **Protein màng**:\n  - **Peripheral proteins** (ngoại vi, ở bề mặt): **xúc tác phản ứng**, **nâng đỡ**.\n  - **Integral proteins** (xuyên màng): **kênh vận chuyển**.\n  - Nhiều protein mang đường (glycoprotein) giúp nhận diện, truyền tín hiệu. [fig]"},{"h":"2. Chức năng (slide 45–47)","body":"- **Tính thấm chọn lọc (selective permeability = semipermeability)**: cho một số chất qua, chặn chất khác. Phân tử nhỏ, không phân cực (O₂, CO₂) qua dễ; ion, phân tử lớn cần protein.\n- **Phân giải chất hữu cơ tạo năng lượng**: vi khuẩn **không có ty thể** → chuỗi truyền electron và ATP synthase nằm **trên màng sinh chất**.\n- **Chromatophores**: ở một số vi khuẩn quang hợp, sắc tố và enzyme quang hợp nằm trong các **nếp gấp của màng** lõm vào tế bào chất.\n  - **Vi khuẩn lưu huỳnh màu tía (purple sulfur bacteria)** **không dùng nước** làm chất khử → **không tạo O₂**. Chúng dùng **sulfide (H₂S), thiosulfate** (một số dùng H₂, Fe²⁺, NO₂⁻) làm chất cho electron; S bị oxy hóa thành **hạt lưu huỳnh**, có thể tiếp tục thành **acid sulfuric**.\n- **Bị phá hủy bởi**: chất khử trùng **cồn và hợp chất amoni bậc bốn (quats)**, kháng sinh **polymyxin** (tương tác với phospholipid)."},{"h":"3. Vận chuyển thụ động (slide 48)","body":"Không tốn năng lượng, đi **theo gradient** (cao → thấp):\n- **Simple diffusion (khuếch tán đơn giản)**: chất đi thẳng qua lớp lipid – **O₂, CO₂**.\n- **Facilitated diffusion (khuếch tán được hỗ trợ)**: nhờ **protein màng – permease** (kênh hoặc chất mang) – **glucose, amino acid**…"},{"h":"4. Thẩm thấu (slide 49)","body":"**Osmosis**: sự di chuyển **của nước** qua màng bán thấm, từ nơi **nồng độ chất tan thấp** (nhiều nước) sang nơi **nồng độ chất tan cao**.\n\n| Môi trường | So với trong tế bào | Nước | Kết quả |\n|---|---|---|---|\n| **Isotonic** (đẳng trương) | bằng | cân bằng, không có dòng ròng | bình thường |\n| **Hypotonic** (nhược trương) | thấp hơn (vd nước cất) | **đi vào** | tế bào trương; thành chống vỡ; mất thành → **vỡ (lysis)** |\n| **Hypertonic** (ưu trương) | cao hơn (vd muối, đường đặc) | **đi ra** | **co nguyên sinh (plasmolysis)** |\n\nNước còn đi nhanh qua kênh **aquaporin**. [mở rộng]"},{"h":"5. Vận chuyển chủ động (slide 50)","body":"- **Cần năng lượng** (ATP hoặc gradient ion); đi **ngược gradient** → tích lũy chất trong tế bào.\n- **Phụ thuộc protein mang (carrier) trên màng**.\n- **Group translocation (chuyển vị nhóm)**: **gắn nhóm chức vào chất trong lúc vận chuyển** – ví dụ **glucose được phosphoryl hóa** thành glucose-6-phosphate (hệ phosphotransferase). Glucose-6-P không đi ngược ra được → giữ trong tế bào.\n\n| Cơ chế | Chiều gradient | Protein? | Năng lượng? |\n|---|---|---|---|\n| Khuếch tán đơn giản | thuận | không | không |\n| Khuếch tán hỗ trợ | thuận | **có** (permease) | không |\n| Thẩm thấu (nước) | thuận thế nước | không/aquaporin | không |\n| Vận chuyển chủ động | **ngược** | **có** | **có** |\n| Chuyển vị nhóm | – (chất bị biến đổi) | **có** | **có** (PEP) |"}],"extension":[{"h":"Thực tế: bảo quản bằng muối và đường","body":"- Nồng độ muối 10–15 % (cá khô, mắm), đường 50–65 % (mứt, sữa đặc) tạo môi trường ưu trương. Tuy nhiên **nấm mốc và nấm men chịu áp suất thẩm thấu tốt hơn vi khuẩn** → mứt để lâu vẫn có thể mốc.\n- Vi khuẩn **ưa mặn (halophiles)** như *Staphylococcus aureus* (chịu tới 15 % muối) vẫn có thể phát triển trong thịt muối. (Bài GRO-01.)"},{"h":"Liên hệ: polymyxin và chất khử trùng","body":"Polymyxin B / colistin gắn phospholipid và LPS, phá màng – là kháng sinh \"cứu cánh cuối cùng\" cho Gram âm đa kháng. Cồn 70 % và quats (benzalkonium chloride trong nước rửa tay) cũng đánh vào màng (bài CTL-04, CTL-05)."}],"keyCards":[{"title":"Plasma membrane structure","bodyEn":"A **phospholipid bilayer** (polar phosphate–glycerol heads, nonpolar fatty-acid tails) with **peripheral proteins** (catalysis, support) and **integral proteins** (transport channels). **Fluid mosaic**: molecules move freely. **No sterols**, except in *Mycoplasma*.","glossVi":"Lớp kép phospholipid; không sterol trừ Mycoplasma."},{"title":"Membrane functions","bodyEn":"**Selective permeability**; breakdown of nutrients and **energy (ATP) production**; **chromatophores** (photosynthetic infoldings). Purple sulfur bacteria use H₂S/thiosulfate, not water, so they **do not produce O₂** and deposit sulfur granules. Damaged by **alcohols, quats, polymyxin**.","glossVi":"Màng = nơi tạo năng lượng ở vi khuẩn."},{"title":"Transport","bodyEn":"**Passive**: simple diffusion (O₂, CO₂); facilitated diffusion with **permeases** (glucose, amino acids). **Osmosis**: water moves toward higher solute; isotonic / hypotonic (water in) / hypertonic (water out → **plasmolysis**). **Active transport**: needs energy and carriers; **group translocation** phosphorylates glucose during transport.","glossVi":"Thụ động – thẩm thấu – chủ động – chuyển vị nhóm."}],"traps":["Bacterial membranes contain sterols","Facilitated diffusion needs ATP","Hypotonic makes cells shrink","Purple sulfur bacteria release O2"]},{"id":"BAC-06","title":"Cytoplasm, nucleoid, plasmids, ribosomes, inclusions and endospores","priority":"H","difficulty":2,"minutes":25,"source":"2-3.Bacteria.pptx: slides 13, 51–56","prereq":[],"hookVi":"Đồ hộp tự làm (măng, cá, pate) được đun sôi 100 °C vẫn có thể gây **ngộ độc botulinum** chết người. Thủ phạm *Clostridium botulinum* tạo **nội bào tử (endospore)** – cấu trúc chịu được **nước sôi hàng giờ**. Muốn diệt nó, nhà máy đồ hộp phải dùng **121 °C dưới áp suất**. Nội bào tử khác gì một tế bào thường?","predictQuestion":{"stem":"Which statement about bacterial endospores is correct?","options":["One vegetative cell forms many endospores to reproduce","One cell forms one endospore, which is a resistant resting structure, not a means of reproduction","Endospores are found in all bacteria","Endospores are killed by boiling for 1 minute"],"answer":1,"explanation":"**1 tế bào → 1 nội bào tử → (nảy mầm) → 1 tế bào**. Nội bào tử để **sống sót**, không để sinh sản."},"lesson":[{"h":"1. Tế bào chất và vùng nhân","body":"- **Cytoplasm**: khoảng **80 % là nước**, chứa protein (enzyme), carbohydrate, lipid, ion vô cơ; đặc, bán lỏng. [fig]\n- Vi khuẩn **không có** bộ khung tế bào dạng vi ống điển hình, **không có bào quan có màng**, không có dòng chảy tế bào chất. (Thực ra có protein khung tương đồng như MreB, FtsZ.) [mở rộng]\n- **Nucleoid (vùng nhân)**: chứa **nhiễm sắc thể vi khuẩn** – thường là **một phân tử DNA mạch kép, dạng vòng**, **không có màng nhân**, không có histone điển hình."},{"h":"2. Plasmid (slide 13: \"plasmid?\")","body":"- **Plasmid**: phân tử **DNA mạch kép, vòng, nhỏ**, **nằm ngoài nhiễm sắc thể**, **tự sao chép độc lập**.\n- **Không cần thiết** cho sự sống trong điều kiện bình thường, nhưng mang gene **có lợi trong điều kiện đặc biệt**:\n  - gene **kháng kháng sinh** (R plasmid) và kháng kim loại nặng;\n  - gene **độc tố**, enzyme phân giải chất lạ;\n  - gene **tiếp hợp** (F factor) – chuyển sang tế bào khác qua **pili**.\n- Có thể mất đi hoặc được truyền giữa tế bào → nền tảng của **công nghệ DNA tái tổ hợp** (vector nhân dòng)."},{"h":"3. Ribosome 70S","body":"- Nơi **tổng hợp protein**. Vi khuẩn có ribosome **70S**, gồm **tiểu đơn vị nhỏ 30S** và **lớn 50S**.\n- **S (Svedberg)** là **hệ số lắng** khi siêu ly tâm → **không cộng số học** (30 + 50 ≠ 70).\n- Tế bào nhân thực có ribosome **80S** (40S + 60S) trong tế bào chất (ty thể/lục lạp có 70S).\n- Khác biệt này là cơ sở của **độc tính chọn lọc**: **streptomycin, gentamicin** gắn **30S**; **erythromycin, chloramphenicol** gắn **50S**. [fig]"},{"h":"4. Thể vùi – inclusions (slide 54)","body":"Các hạt dự trữ/chức năng trong tế bào chất:\n| Thể vùi | Chứa | Nhận biết / ý nghĩa |\n|---|---|---|\n| **Volutin** (**metachromatic granules**) | **phosphate vô cơ** (polyphosphate) | bắt màu **đỏ** với **methylene blue** (biến sắc) – đặc trưng *Corynebacterium diphtheriae* |\n| **Polysaccharide granules** | **glycogen, tinh bột** | nhuộm **iodine** (glycogen nâu đỏ, tinh bột xanh) |\n| **Lipid inclusions** | lipid (vd poly-β-hydroxybutyrate) | nhuộm **Sudan** (thuốc nhuộm tan trong mỡ) |\n| **Sulfur granules** | **lưu huỳnh** | dự trữ năng lượng ở vi khuẩn oxy hóa lưu huỳnh |\n| **Carboxysomes** | enzyme **ribulose 1,5-diphosphate carboxylase (RuBisCO)** | **cố định CO₂** |\n| **Gas vacuoles** | các **túi khí** | giúp vi khuẩn thủy sinh **nổi** |\n| **Magnetosomes** | **Fe₃O₄ (magnetite)** | định hướng theo **từ trường** |"},{"h":"5. Nội bào tử – endospore (slide 13, 55–56)","body":"**Endospore**: cấu trúc **ngủ, cực kỳ bền** hình thành **bên trong** tế bào của một số vi khuẩn **Gram dương**, chủ yếu ***Bacillus*** và ***Clostridium***, khi **thiếu chất dinh dưỡng**.\n\n**Sporulation (tạo bào tử)** [fig]:\n1. DNA sao chép; một **vách ngăn bào tử (spore septum)** tách một phần DNA + tế bào chất.\n2. Màng tế bào mẹ bao quanh tạo **forespore** (tiền bào tử) với hai lớp màng.\n3. Lớp **cortex** (peptidoglycan) hình thành giữa hai màng; ngoài cùng là **spore coat** (protein) dày.\n4. Tế bào mẹ tự phân hủy → **giải phóng nội bào tử**.\n\n**Vì sao bền?** Lõi **rất ít nước**, chứa **acid dipicolinic + Ca²⁺** bảo vệ DNA, protein SASP gắn DNA, các lớp vỏ dày. Chịu được **nhiệt, khô, bức xạ, hóa chất, acid**; sống sót hàng trăm–nghìn năm.\n\n**Germination (nảy mầm)**: khi điều kiện thuận lợi (nhi
