ệt, chất dinh dưỡng) → nội bào tử trở lại **tế bào sinh dưỡng (vegetative cell)**.\n\n> **Không phải sinh sản**: 1 tế bào → 1 nội bào tử → 1 tế bào. Số lượng không tăng. (Khác **bào tử nấm** là cơ quan sinh sản – bài FUN.)\n\nÝ nghĩa thực tế: phải dùng **autoclave 121 °C** mới diệt được; bệnh do vi khuẩn tạo bào tử: uốn ván (*C. tetani*), ngộ độc thịt (*C. botulinum*), bệnh than (*B. anthracis*), viêm ruột (*C. difficile*)."}],"extension":[{"h":"Công nghệ đồ hộp: quy tắc 12D","body":"Nhà máy đồ hộp thực phẩm ít acid (pH > 4,6) phải xử lý nhiệt đủ để giảm **10¹² lần** bào tử *C. botulinum* (**12D**) – thường ~121 °C trong vài phút tại tâm hộp. Bạn sẽ tính D-value ở bài CTL-01."},{"h":"Plasmid trong công nghệ sinh học","body":"Plasmid là \"xe chở gene\": gắn gene insulin người vào plasmid, đưa vào *E. coli* → vi khuẩn tổng hợp insulin. Gene kháng ampicillin trên plasmid dùng để **chọn lọc** tế bào mang plasmid trên môi trường có kháng sinh."},{"h":"Magnetosome & carboxysome","body":"Vi khuẩn hướng từ (*Magnetospirillum*) được nghiên cứu làm hạt nano từ tính cho y sinh. Carboxysome đang được \"cấy\" vào cây trồng để tăng hiệu suất quang hợp."}],"keyCards":[{"title":"Nucleoid and plasmids","bodyEn":"The **nucleoid** holds the bacterial chromosome: usually one **circular, double-stranded DNA**, no nuclear membrane. **Plasmids** are small circular DNA molecules that **replicate independently**, are not essential, and may carry genes for **antibiotic resistance**, toxins or conjugation.","glossVi":"Plasmid: DNA vòng nhỏ, tự sao chép, không thiết yếu."},{"title":"70S ribosomes","bodyEn":"Bacterial ribosomes are **70S** (30S + 50S subunits); eukaryotic cytoplasmic ribosomes are **80S**. S = sedimentation coefficient, not additive. Streptomycin targets 30S; erythromycin targets 50S.","glossVi":"70S = 30S + 50S; khác 80S nhân thực."},{"title":"Inclusions","bodyEn":"**Volutin/metachromatic granules** (phosphate, red with methylene blue); **polysaccharide granules** (glycogen, starch; iodine); **lipid inclusions** (Sudan dye); **sulfur granules**; **carboxysomes** (ribulose 1,5-diphosphate carboxylase, CO₂ fixation); **gas vacuoles**; **magnetosomes** (Fe₃O₄).","glossVi":"7 loại thể vùi."},{"title":"Endospores","bodyEn":"Formed inside some Gram-positive rods (*Bacillus, Clostridium*) when nutrients run out. Very little water, **dipicolinic acid + Ca²⁺**, thick cortex and coat → resistant to heat, drying, radiation and chemicals. **One cell → one spore**: not reproduction. Germination returns a vegetative cell.","glossVi":"Nội bào tử: sống sót, không sinh sản."}],"traps":["Endospores are for reproduction","70S = 30S + 50S arithmetic","Plasmids are essential","Volutin stains with iodine"]},{"id":"BAC-07","title":"Reproduction and classification of bacteria","priority":"M","difficulty":2,"minutes":20,"source":"2-3.Bacteria.pptx: slides 57–73","prereq":[],"hookVi":"Trong 20 phút, một tế bào *E. coli* chia đôi. Sau 7 giờ (21 thế hệ), một tế bào thành **2²¹ ≈ 2 triệu** tế bào – nhưng làm sao phân loại hàng triệu loài vi khuẩn **nhìn giống nhau dưới kính**? Nhà khoa học chuyển từ **hình dạng** sang **trình tự rRNA** để vẽ cây tiến hóa.","predictQuestion":{"stem":"Why did bacterial classification move from phenotypic features (Gram stain, shape) to rRNA sequences?","options":["Phenotypic features are too expensive to measure","Phenotypic groupings do not provide a clear evolutionary history","rRNA is found only in pathogens","Gram stain no longer works"],"answer":1,"explanation":"Slide 61–62: phân loại theo đặc điểm tế bào **không phản ánh rõ lịch sử tiến hóa**. So sánh trình tự **rRNA (16S)** cho biết quan hệ họ hàng."},"lesson":[{"h":"1. Các kiểu sinh sản (slide 70–73)","body":"- **Binary fission (phân đôi)** – phổ biến nhất [fig]:\n  1. Tế bào dài ra, **DNA nhân đôi**.\n  2. Màng và thành **lõm vào** giữa tế bào, hai bản DNA tách ra hai đầu.\n  3. **Vách ngăn (septum)** hình thành.\n  4. Tách thành **hai tế bào con giống hệt** nhau.\n- **Budding (nảy chồi)**: một chồi nhỏ mọc ra, lớn lên rồi tách – ví dụ ***Hyphomicrobium*** (slide 73).\n- **Fragmentation (đứt đoạn)** sợi: vi khuẩn dạng sợi như xạ khuẩn đứt thành đoạn, mỗi đoạn thành tế bào mới. [fig]\n- **Conidiospores** ở đầu sợi của **xạ khuẩn (actinomycetes, *Streptomyces*)**. [fig]\n\nSố tế bào sau n thế hệ phân đôi: **N = N₀ × 2ⁿ** (chi tiết tính toán ở bài GRO-05)."},{"h":"2. Chuyển gene ngang (liên hệ slide 21–22)","body":"Không phải sinh sản nhưng làm thay đổi kiểu gene:\n| Cơ chế | DNA đi bằng đường nào |\n|---|---|\n| **Transformation** (biến nạp) | tế bào nhận **DNA tự do** từ môi trường |\n| **Conjugation** (tiếp hợp) | qua **pilus**, tiếp xúc tế bào (F⁺ → F⁻, Hfr) |\n| **Transduction** (tải nạp) | **phage** mang DNA vi khuẩn |\n\nMẹo: **Tự do – Tiếp xúc – Phage**. [mở rộng: slide chỉ nêu pili chuẩn bị chuyển DNA]"},{"h":"3. Tên khoa học","body":"- **Danh pháp hai phần** (binomial): ***Genus species***, chi viết hoa, loài viết thường, in nghiêng: *Escherichia coli* → *E. coli*.\n- Các bậc: Domain → Phylum → Class → Order → Family → Genus → Species; dưới loài có **strain** (chủng)."},{"h":"4. Phân loại dựa trên đặc điểm tế bào – Bergey's Manual (slide 60–62)","body":"***Bergey's Manual of Systematic Bacteriology***: vi khuẩn chia **4 divisions/phyla**. Mỗi ngành chia nhóm theo:\n- **phản ứng nhuộm Gram**;\n- **hình dạng** tế bào;\n- **cách sắp xếp**;\n- **nhu cầu oxy**;\n- **khả năng di động**;\n- **đặc điểm dinh dưỡng và trao đổi chất**.\n\nBốn ngành lịch sử [fig]: *Gracilicutes* (Gram âm, thành mỏng), *Firmicutes* (Gram dương, thành dày), *Tenericutes* (không thành – *Mycoplasma*), *Mendosicutes* (thành bất thường – archaea).\n\n→ Nhược điểm (slide 61–62): **không cho thấy rõ lịch sử tiến hóa** của vi khuẩn."},{"h":"5. Phân loại dựa trên trình tự rRNA (slide 65–69)","body":"- **Carl Woese (1977)** so sánh trình tự **16S rRNA** → đề xuất **3 miền (domains)**: **Bacteria, Archaea, Eukarya**. [fig]\n- 16S rRNA thích hợp vì: có ở **mọi** tế bào nhân sơ, chức năng **bảo tồn**, có vùng biến đổi chậm và vùng thay đổi → dùng như \"đồng hồ phân tử\".\n- Slide 69 – các ngành chính (hệ Bergey mới):\n| Ngành | Gram | Ví dụ |\n|---|---|---|\n| **Proteobacteria** | phần lớn Gram âm | *E. coli, Salmonella, Pseudomonas, Vibrio* |\n| **Firmicutes** | Gram dương (G+C thấp) | *Bacillus, Clostridium, Staphylococcus, Lactobacillus* |\n| **Actinobacteria** | Gram dương (G+C cao) | *Streptomyces, Mycobacterium, Corynebacterium* |\n| **Cyanobacteria** | Gram âm, quang hợp tạo O₂ | *Anabaena, Spirulina* |\n| **Spirochaetes** | xoắn thể | *Treponema, Borrelia* |\n| **Chlamydiae/Verrucomicrobia** | ký sinh nội bào | *Chlamydia* |\n| **Deinococcus-Thermus** | Gram dương, chịu bức xạ/nhiệt | *Deinococcus radiodurans* |\n| **Bacteroidetes/Chlorobi, Chloroflexi, Fusobacteria, Thermotogae** | Gram âm | |\n| **Acidobacteria** | ngành mới, đa dạng, **ưa acid** | |\n| **Aquificae** | sống môi trường **khắc nghiệt** | |\n| **Planctomycetes** | | |"}],"extension":[{"h":"Thực tế: định danh bằng 16S rRNA","body":"Phòng thí nghiệm hiện đại khuếch đại gene **16S rDNA** bằng PCR, giải trình tự rồi **BLAST** với ngân hàng gene – nhận diện vi khuẩn trong 1–2 ngày, kể cả loài không nuôi cấy được. Bạn sẽ học chi tiết ở IDT-02."},{"h":"Mở rộng: vi khuẩn chịu bức xạ","body":"*Deinococcus radiodurans* chịu được liều bức xạ gấp ~1000 lần liều gây chết người nhờ nhiều bản sao genome và hệ sửa chữa DNA mạnh – ứng viên xử lý chất thải phóng xạ."}],"keyCards":[{"title":"Reproduction","bodyEn":"Most bacteria reproduce by **binary fission** (DNA replicates, cell elongates, septum forms, two identical cells). Others: **budding** (*Hyphomicrobium*), **fragmentation** of filaments, **conidiospores** (actinomycetes). N = N₀ × 2ⁿ.","glossVi":"Phân đôi, nảy chồi, đứt đoạn, bào tử đính."},{"title":"Phenotypic classification","bodyEn":"*Bergey's Manual of Systematic Bacteriology*: **4 divisions/phyla**, grouped by **Gram reaction, cell shape, arrangement, oxygen requirement, motility, nutrition/metabolism**. Weakness: **no clear evolutionary history**.","glossVi":"Phân loại theo đặc điểm: không rõ tiến hóa."},{"title":"rRNA-based classification","bodyEn":"Comparing **16S rRNA** sequences (Woese) gives **3 domains** (Bacteria, Archaea, Eukarya) and phyla such as **Proteobacteria** (mostly Gram−), **Firmicutes** and **Actinobacteria** (Gram+), **Cyanobacteria**, **Spirochaetes**, **Deinococcus-Thermus** (Gram+).","glossVi":"16S rRNA → cây tiến hóa, 3 miền."}],"traps":["Conjugation is reproduction","Bergey's phenotypic groups show evolution","Proteobacteria are Gram-positive"]},{"id":"BAC-08","title":"Archaea","priority":"M","difficulty":2,"minutes":15,"source":"2-3.Bacteria.pptx: slides 74–77","prereq":[],"hookVi":"Suối nước nóng Yellowstone ở 90 °C, hồ muối Chết mặn gấp 10 lần nước biển, dạ cỏ bò không có oxy – những nơi tưởng như không sinh vật nào sống nổi lại đầy **vi khuẩn cổ (Archaea)**. Enzyme **Taq polymerase** trong máy PCR của bạn cũng có \"họ hàng\" chịu nhiệt tương tự từ archaea (*Pfu* polymerase). Archaea nhìn giống vi khuẩn – vậy khác ở đâu?","predictQuestion":{"stem":"Which feature distinguishes archaea from bacteria?","options":["Archaea have a nucleus","Archaea lack peptidoglycan and have ether-linked membrane lipids","Archaea have 80S ribosomes and mitochondria","Archaea are all pathogens"],"answer":1,"explanation":"Archaea **không có peptidoglycan** (có pseudomurein hoặc lớp S) và lipid màng nối **ether** với chuỗi isoprenoid phân nhánh."},"lesson":[{"h":"1. Archaea là gì?","body":"- Một trong **ba miền** sự sống (Woese). **Nhân sơ** (không nhân), nhưng về mặt phân tử nhiều điểm **gần Eukarya** hơn Bacteria (RNA polymerase, histone-like protein…). [mở rộng]\n- Hình dạng đa dạng: cầu, que, xoắn, dạng **vuông/phẳng** (*Haloarcula*), không đều.\n- **Chưa phát hiện archaea gây bệnh** cho người."},{"h":"2. Thành tế bào (slide 76)","body":"- **Không có peptidoglycan** điển hình → **kháng lysozyme và penicillin** tự nhiên.\n- Một số có **pseudomurein** (pseudopeptidoglycan):\n  - chứa **N-acetyl talosaminuronic acid (NAT)** **thay cho NAM**;\n  - **không chứa D-amino acid**;\n  - liên kết **β-1,3** thay vì β-1,4 (vì vậy lysozyme không cắt được).\n- Nhiều archaea có **lớp S (S-layer)** bằng protein/glycoprotein; một số không có thành.\n- Nhuộm Gram cho kết quả dương hoặc âm tùy loài nhưng không phản ánh cấu trúc như vi khuẩn."},{"h":"3. Màng sinh chất (slide 77)","body":"| | Bacteria / Eukarya | Archaea |\n|---|---|---|\n| Liên kết glycerol – chuỗi kỵ nước | **ester** | **ether** (bền hơn với nhiệt, acid) |\n| Chuỗi kỵ nước | acid béo thẳng | **isoprenoid phân nhánh** (phytanyl) |\n| Cấu trúc | lớp kép | lớp kép **hoặc lớp đơn** (tetraether nối xuyên màng – ở loài ưa nhiệt) |\n| Glycerol | D-glycerol | L-glycerol [mở rộng] |\n\nLớp đơn tetraether không tách đôi được khi nóng → giúp archaea ưa nhiệt giữ màng ổn định ở > 80 °C."},{"h":"4. Các nhóm sinh lý chính","body":"| Nhóm | Môi trường | Ví dụ |\n|---|---|---|\n| **Methanogens** (sinh methane) | kỵ khí nghiêm ngặt: bùn, dạ cỏ, ruột, bể biogas; biến CO₂ + H₂ → **CH₄** | *Methanobacterium* |\n| **Extreme halophiles** (cực ưa mặn) | muối **15–30 %**: hồ muối, ruộng muối | *Halobacterium* (sắc tố bacteriorhodopsin) |\n| **Extreme thermophiles / hyperthermophiles** | **> 80 °C**, suối nóng, miệng phun thủy nhiệt | *Pyrodictium, Sulfolobus* |\n\n> *Halobacterium* là **archaea** dù tên có chữ \"bacterium\" – đừng đoán miền theo tên."},{"h":"5. So sánh ba miền","body":"| Đặc điểm | Bacteria | Archaea | Eukarya |\n|---|---|---|---|\n| Nhân có màng | không | không | **có** |\n| Bào quan có màng | không | không | có |\n| Thành | **peptidoglycan** | **pseudomurein / lớp S**, không peptidoglycan | cellulose, chitin hoặc không |\n| Lipid màng | ester, acid béo | **ether, isoprenoid** | ester, acid béo |\n| Ribosome | 70S | 70S | 80S |\n| Nhạy kháng sinh (streptomycin, chloramphenicol) | có | **không** | không |"}],"extension":[{"h":"Ứng dụng công nghiệp","body":"- **Biogas**: methanogens trong bể ủ kỵ khí chuyển chất thải chăn nuôi thành CH₄ – năng lượng sạch cho nông hộ.\n- **Enzyme chịu nhiệt**: DNA polymerase *Pfu* (*Pyrococcus furiosus*) dùng trong PCR độ chính xác cao.\n- Methanogens trong dạ cỏ bò thải CH₄ – khí nhà kính mạnh gấp ~28 lần CO₂; nhiều nghiên cứu phụ gia thức ăn nhằm ức chế chúng."}],"keyCards":[{"title":"Archaea basics","bodyEn":"Prokaryotes forming a separate **domain**. No peptidoglycan; some have **pseudomurein** (NAT instead of NAM, **no D-amino acids**, β-1,3 links) or an S-layer. Not known to cause human disease.","glossVi":"Không peptidoglycan; pseudomurein có NAT."},{"title":"Archaeal membranes","bodyEn":"Lipids are **ether-linked** to glycerol and made of **branched isoprenoid** chains; some form **monolayers** (tetraethers) that are stable at high temperature. Bacterial lipids are ester-linked fatty acids.","glossVi":"Liên kết ether, chuỗi isoprenoid."},{"title":"Groups","bodyEn":"**Methanogens** (anaerobic, make CH₄), **extreme halophiles** (15–30 % salt, *Halobacterium*), **extreme thermophiles** (> 80 °C).","glossVi":"Sinh methane, ưa mặn, ưa nhiệt."}],"traps":["Archaea have peptidoglycan","Halobacterium is a bacterium","Pseudomurein contains NAM"]},{"id":"FUN-01","title":"Yeast cell structure (Saccharomyces cerevisiae)","priority":"H","difficulty":2,"minutes":25,"source":"7. Yeasts.pptx: slides 1–22","prereq":[],"hookVi":"Men bánh mì, men bia, men rượu vang – tất cả là **cùng một loài**: *Saccharomyces cerevisiae*. Dưới kính hiển vi nó chỉ to hơn vi khuẩn khoảng 5–10 lần, nhưng bên trong là cả một \"thành phố\" với **nhân, ty thể, không bào, lưới nội chất** – nó là **tế bào nhân thực** giống tế bào của bạn hơn là giống vi khuẩn.","predictQuestion":{"stem":"Which structure is found in a yeast cell but NOT in a bacterial cell?","options":["Ribosomes","Plasma membrane","A membrane-bound nucleus with 16 chromosomes","Cell wall"],"answer":2,"explanation":"Nấm men là **nhân thực**: có **nhân có màng** (S. cerevisiae đơn bội có **16 nhiễm sắc thể thẳng**), ty thể, ER, Golgi… Vi khuẩn cũng có ribosome, màng và thành."},"lesson":[{"h":"1. Hình thái (slide 3–6)","body":"- **Yeasts** (nấm men): nấm **đơn bào**, hình **cầu, bầu dục hoặc elip**, kích thước ~**3–10 μm** (to hơn vi khuẩn nhiều lần). [fig]\n- Hai kiểu tiêu biểu:\n  - ***Saccharomyces cerevisiae*** – sinh sản **nảy chồi (budding)**.\n  - ***Schizosaccharomyces pombe*** – sinh sản **phân đôi (fission)**.\n- Là **nhân thực** với đầy đủ bào quan (slide 6: sơ đồ cấu trúc tế bào *S. cerevisiae*)."},{"h":"2. Thành tế bào (slide 8)","body":"Chủ yếu là **polysaccharide**:\n| Thành phần | Cấu tạo | Vai trò/vị trí |\n|---|---|---|\n| **Glucan** | D-glucose; mạch chính **β-1,3**, nhánh **β-1,6** | khung chịu lực chính (lớp trong) |\n| **Mannan** | D-**mannose** (slide ghi nhầm D-glucose); mạch chính **α-1,6**, nhánh **α-1,2 và α-1,3** | lớp ngoài, gắn với protein → **mannoprotein** |\n| **Chitin** | **N-acetylglucosamine**, liên kết **β-1,4** | tập trung chủ yếu ở **sẹo chồi (bud scars)** |\n\nThành phần khác: **mannoproteins, lipids, phosphate vô cơ**.\n\n> So sánh: thành vi khuẩn là **peptidoglycan**; thành nấm là **glucan – mannan – chitin** → penicillin không tác dụng lên nấm."},{"h":"3. Khoang chu chất và màng sinh chất (slide 9–10)","body":"**Periplasmic space** (giữa thành và màng) chứa **mannoprotein** và enzyme:\n- **Invertase**: sucrose → **glucose + fructose** (nhờ đó men dùng được đường mía, rỉ đường).\n- **Phosphatase**: thủy phân hợp chất chứa phosphate → giải phóng **phosphate vô cơ** để hấp thu.\n\n**Plasma membrane**: lớp kép phospholipid + protein → **bán thấm (chọn lọc)**. Màng nấm chứa **sterol – ergosterol** (vi khuẩn thường không có sterol). Ergosterol là đích của thuốc kháng nấm (amphotericin B, azole). [mở rộng]"},{"h":"4. Tế bào chất, bộ khung và nhân (slide 11–15)","body":"- **Cytosol**: ion, chất hữu cơ phân tử nhỏ và trung bình, và phân tử lớn tan như **enzyme, glycogen**; chứa **ribosome 80S**, hạt lipid, phức hợp protein.\n- **Cytoskeleton**: **vi ống (microtubules)** và **vi sợi (microfilaments)** → giữ **hình dạng**, ổn định cấu trúc bên trong, **di chuyển bào quan**, tham gia **phân chia tế bào**.\n- **Nucleus**: màng nhân có **lỗ nhân (nuclear pores)**. Bộ gene gồm **16 nhiễm sắc thể thẳng** (DNA + protein) ở tế bào đơn bội (lưỡng bội 2n = 32).\n- **DNA ngoài nhiễm sắc thể**: **DNA ty thể** và **plasmid** (plasmid 2-μm)."},{"h":"5. Các bào quan (slide 16–22)","body":"| Bào quan | Chức năng |\n|---|---|\n| **Endoplasmic reticulum (ER)** | tổng hợp protein tiết và lipid |\n| **Golgi** | sửa đổi, đóng gói, phân phối protein |\n| **Vacuole** (không bào) | chứa **enzyme thủy phân protein**; chứa **amino acid, polyphosphate, ion kim loại** → **điều hòa áp suất thẩm thấu** |\n| **Peroxisome** | chứa **enzyme oxy hóa** (vd catalase phân hủy H₂O₂) |\n| **Mitochondrion** (ty thể) | hô hấp tạo ATP (xem dưới) |\n\n**Ty thể (slide 20–22)**:\n- **Màng ngoài**: enzyme **chuyển hóa lipid**.\n- **Khoang gian màng**.\n- **Màng trong**: **NADH dehydrogenase, succinate dehydrogenase, ATP synthase**, protein vận chuyển.\n- **Chất nền (matrix)**: enzyme **oxy hóa acid béo**, **chu trình acid citric (TCA)**; chứa **DNA ty thể** và bộ máy sao chép/phiên mã.\n- **Hình dạng, kích thước, số lượng** thay đổi theo **loài, giai đoạn sinh trưởng và điều kiện dinh dưỡng**."}],"extension":[{"h":"Men trong đời sống Việt Nam","body":"- **Bánh mì**: CO₂ do nấm men tạo làm bột nở; ethanol bay hơi khi nướng.\n- **Bia, rượu vang, rượu gạo**: bánh men rượu truyền thống chứa **nấm mốc** (*Rhizopus, Mucor, Amylomyces* – đường hóa tinh bột) **và nấm men** (*Saccharomyces* – lên men rượu).\n- **Men dinh dưỡng / chiết xuất nấm men**: giàu protein, vitamin nhóm B – liên hệ SCP (APP-02)."},{"h":"Nấm men – \"tế bào mẫu\" của sinh học","body":"*S. cerevisiae* là sinh vật nhân thực **đầu tiên được giải trình tự toàn bộ genome (1996)**, ~6.000 gene, ~12 Mb. Rất nhiều gene người có gene tương đồng ở nấm men → dùng nghiên cứu ung thư, lão hóa. Nấm men tái tổ hợp sản xuất **vaccine viêm gan B, insulin**."}],"keyCards":[{"title":"Yeast morphology","bodyEn":"Yeasts are **unicellular fungi**, oval to spherical, larger than bacteria. *Saccharomyces cerevisiae* reproduces by **budding**; *Schizosaccharomyces pombe* by **fission**. Yeasts are **eukaryotes** with 80S ribosomes and membrane-bound organelles.","glossVi":"Nấm men: nấm đơn bào, nhân thực."},{"title":"Yeast cell wall","bodyEn":"Mainly polysaccharides: **glucan** (β-1,3 backbone, β-1,6 branches), **mannan** (mannose; α-1,6 backbone, α-1,2/α-1,3 branches; forms mannoproteins), **chitin** (N-acetylglucosamine, β-1,4) mainly in **bud scars**. Also lipids and inorganic phosphate.","glossVi":"Glucan – mannan – chitin, không peptidoglycan."},{"title":"Periplasm and membrane","bodyEn":"The periplasmic space holds **invertase** (sucrose → glucose + fructose) and **phosphatase**. The plasma membrane is a semipermeable phospholipid bilayer with proteins and **ergosterol**.","glossVi":"Invertase phân giải sucrose."},{"title":"Nucleus and organelles","bodyEn":"Nucleus with nuclear pores; **16 linear chromosomes** (haploid). Extrachromosomal DNA: **mitochondrial DNA and plasmids**. ER, Golgi, **vacuole** (proteases, amino acids, polyphosphate, metal ions → osmotic regulation), **peroxisome** (oxidizing enzymes), **mitochondria** (TCA cycle, ATP synthase).","glossVi":"16 NST; không bào điều hòa thẩm thấu."}],"traps":["Yeast walls contain peptidoglycan","Chitin is spread evenly in the wall","Yeast ribosomes are 70S","Mannan is a glucose polymer"]},{"id":"FUN-02","title":"Yeast metabolism and reproduction","priority":"H","difficulty":2,"minutes":25,"source":"7. Yeasts.pptx: slides 23–36","prereq":[],"hookVi":"Nhà máy bia sục khí cho nấm men lúc đầu để chúng **sinh sôi**, rồi **đậy kín** để chúng **tạo cồn**. Cùng một tế bào, hai \"chế độ\" khác nhau: có oxy thì **hô hấp** (nhiều ATP, nhiều tế bào), thiếu oxy thì **lên men** (ít ATP, nhiều ethanol). Đó là vì *S. cerevisiae* là sinh vật **kỵ khí tùy nghi**.","predictQuestion":{"stem":"Why do brewers first aerate the wort and then keep the fermenter closed?","options":["Oxygen kills contaminating bacteria","With oxygen yeast respires and multiplies; without oxygen it ferments sugar to ethanol","Oxygen is needed to produce ethanol","Closing the tank raises the temperature"],"answer":1,"explanation":"*S. cerevisiae* là **facultative anaerobe**: có O₂ → hô hấp, sinh khối tăng; thiếu O₂ → lên men tạo **ethanol + CO₂**."},"lesson":[{"h":"1. Kiểu trao đổi chất","body":"- *S. cerevisiae* là **dị dưỡng hóa năng (chemoheterotroph)** và **kỵ khí tùy nghi (facultative anaerobe)** (slide 23).\n- **Hô hấp hiếu khí**: glucose → pyruvate (đường phân) → acetyl-CoA → **chu trình acid citric** trong ty thể → chuỗi truyền electron → nhiều ATP.\n- **Lên men ethanol** (khi thiếu O₂ hoặc thừa đường): glucose → 2 pyruvate → 2 acetaldehyde + 2 CO₂ → **2 ethanol**; tái tạo NAD⁺, chỉ **2 ATP/glucose** từ đường phân.\n  - Phương trình: **C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂**.\n- Ở nồng độ glucose cao, *S. cerevisiae* vẫn lên men ngay cả khi có O₂ (**hiệu ứng Crabtree**). [mở rộng]"},{"h":"2. Chu trình acid citric – con số cần nhớ (slide 23)","body":"Slide: **mỗi 2 phân tử acetyl-CoA (CH₃-CO-CoA)** đi vào chu trình tạo:\n| Sản phẩm | Số lượng |\n|---|---|\n| CO₂ | **4** |\n| NADH | **6** |\n| FADH₂ | **2** |\n| ATP (GTP) | **2** |\n\n→ Mỗi acetyl-CoA: 2 CO₂, 3 NADH, 1 FADH₂, 1 ATP. (Một glucose tạo 2 acetyl-CoA.)\n- Oxy hóa pyruvate → acetyl-CoA là bước **riêng**, tạo thêm 1 NADH + 1 CO₂ mỗi pyruvate – đừng cộng lẫn."},{"h":"3. Sinh sản vô tính – nảy chồi và phân đôi (slide 29–31)","body":"- **Nảy chồi (budding)** ở *S. cerevisiae*: một chồi nhỏ nhú ra trên tế bào mẹ → nhân **nguyên phân (mitosis)** → một nhân đi vào chồi → chồi lớn lên → vách ngăn (chitin) tách chồi → để lại **sẹo chồi** trên tế bào mẹ.\n- **Cả tế bào đơn bội (n) và lưỡng bội (2n)** đều nảy chồi được (slide 29: *haploid and diploid cells: mitosis (budding)*).\n- **Phân đôi (fission)** ở *Schizosaccharomyces pombe*: tế bào dài ra rồi chia đôi bằng vách ngăn, giống vi khuẩn.\n- Chồi không tách hẳn, xếp thành chuỗi → **giả sợi (pseudohyphae)** – ví dụ *Candida albicans*. [fig]"},{"h":"4. Sinh sản hữu tính – giao phối và bào tử túi (slide 31–36)","body":"**Chu trình sống của *S. cerevisiae*** [fig]:\n1. Hai tế bào đơn bội khác **kiểu giao phối (mating type)** – **α** và **a** – kết hợp → **hợp tử (zygote) lưỡng bội 2n**.\n2. Tế bào lưỡng bội có thể **nảy chồi** nhiều thế hệ (pha lưỡng bội).\n3. Khi **thiếu dinh dưỡng** (đói nitơ), tế bào 2n **giảm phân (meiosis)** → **4 bào tử đơn bội (ascospores)** nằm trong **túi (ascus)**.\n4. Bào tử nảy mầm → tế bào đơn bội α hoặc a → nảy chồi (pha đơn bội) → lại giao phối.\n\nCông thức rút gọn (slide): **Haploid α + haploid a → zygote → meiosis → haploid spores**.\n\n> Nhớ: **n = 16** (đơn bội) → **2n = 32** (lưỡng bội). Sau giảm phân I nhân đã là **n** (nhiễm sắc thể còn kép) – slide 32 ghi \"2n\" là nhầm."},{"h":"5. So sánh hai kiểu sinh sản","body":"| | Vô tính | Hữu tính |\n|---|---|---|\n| Cơ chế | **nguyên phân** | **hợp giao + giảm phân** |\n| Hình thức | nảy chồi / phân đôi | giao phối α × a → ascus 4 bào tử |\n| Bội thể con | giống mẹ (n → n; 2n → 2n) | bào tử **n** |\n| Biến dị di truyền | thấp | **cao** (tái tổ hợp) |\n| Điều kiện | đủ dinh dưỡng | thường khi **đói** |"}],"extension":[{"h":"Công nghiệp: điều khiển \"chế độ\" nấm men","body":"- **Sản xuất men bánh mì (sinh khối)**: nuôi **fed-batch**, cấp đường từ từ và **sục khí mạnh** → tránh hiệu ứng Crabtree, tối đa sinh khối.\n- **Sản xuất ethanol/bia**: yếm khí, đường cao → tối đa ethanol (APP-03).\n- Nồng độ ethanol thường ức chế nấm men ở ~13–15 % (slide 28 nêu 13 %), chủng chịu cồn tốt có thể cao hơn."},{"h":"Di truyền học nấm men","body":"Vì có pha đơn bội ổn định, đột biến lặn ở nấm men **biểu hiện ngay** – tiện cho nghiên cứu gene. Phân tích 4 bào tử trong một túi (**tetrad analysis**) cho phép lập bản đồ gene trực tiếp."}],"keyCards":[{"title":"Yeast metabolism","bodyEn":"*S. cerevisiae* is a **facultative anaerobe**. With O₂ it respires (glycolysis → acetyl-CoA → **citric acid cycle** → electron transport). Without O₂ (or with excess sugar) it **ferments**: C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂, net 2 ATP.","glossVi":"Kỵ khí tùy nghi: hô hấp hoặc lên men."},{"title":"Citric acid cycle numbers","bodyEn":"Every **two acetyl-CoA** entering the cycle produce **4 CO₂, 6 NADH, 2 FADH₂ and 2 ATP**.","glossVi":"2 acetyl-CoA → 4 CO₂, 6 NADH, 2 FADH₂, 2 ATP."},{"title":"Asexual reproduction","bodyEn":"**Budding** (*S. cerevisiae*): mitosis, bud grows and separates, leaving a **bud scar**; both haploid and diploid cells bud. **Fission** (*S. pombe*). Buds that stay attached form **pseudohyphae**.","glossVi":"Nảy chồi – nguyên phân."},{"title":"Sexual reproduction","bodyEn":"Haploid **α** + haploid **a** → diploid **zygote**; diploid cells can bud; under starvation they undergo **meiosis** → **4 haploid ascospores** in an **ascus**.","glossVi":"α + a → 2n → giảm phân → 4 bào tử túi."}],"traps":["Only haploid cells can bud","Budding uses meiosis","Fermentation gives more ATP than respiration","Ascus contains 8 spores in S. cerevisiae"]},{"id":"FUN-03","title":"Yeast vs bacteria; yeast classification and counting","priority":"H","difficulty":2,"minutes":20,"source":"7. Yeasts.pptx: slides 37–48","prereq":[],"hookVi":"Phòng QC nhà máy bia cần biết **mật độ nấm men sống** trước khi cấy vào thùng lên men. Cách nhanh: đếm trên **buồng đếm hồng cầu** trong 10 phút. Cách chắc: **cấy đĩa đếm khuẩn lạc** nhưng chờ 2–3 ngày. Mỗi cách trả lời một câu hỏi khác nhau – và cách thứ nhất có thể **đếm nhầm cả tế bào chết**.","predictQuestion":{"stem":"A direct count with a counting chamber gives a higher number than a plate count of the same yeast suspension. The most likely reason is:","options":["The plate count includes dead cells","The chamber counts both live and dead cells, while only viable cells form colonies","Yeasts cannot grow on agar","The chamber has a smaller volume"],"answer":1,"explanation":"Buồng đếm đếm **mọi tế bào nhìn thấy** (sống + chết); đếm đĩa chỉ đếm tế bào **có khả năng tạo khuẩn lạc** (CFU)."},"lesson":[{"h":"1. Nấm men vs vi khuẩn (slide 37)","body":"| Đặc điểm | **Nấm men** | **Vi khuẩn (Eubacteria)** |\n|---|---|---|\n| Kiểu tế bào | **nhân thực**: có nhân, bào quan có màng, bộ khung tế bào; ribosome **80S** | **nhân sơ**: không nhân, không bào quan có màng và bộ khung (theo slide); ribosome **70S** |\n| Màng sinh chất | có **sterol** (ergosterol) | **không sterol**, trừ *Mycoplasma* |\n| Thành tế bào | **glucan, mannan, chitin** | **peptidoglycan** |\n| Bào tử | cấu trúc **sinh sản** vô tính và hữu tính | **nội bào tử** (không để sinh sản) nhưng có thể thành tế bào sinh dưỡng |\n| Trao đổi chất | **dị dưỡng**; **kỵ khí tùy nghi** | dị dưỡng **hoặc tự dưỡng**; **hiếu khí, kỵ khí tùy nghi, kỵ khí** |\n| Kích thước | ~3–10 μm | ~0,5–5 μm |\n| Kháng sinh nhạy | kháng penicillin; nhạy thuốc kháng nấm | nhạy penicillin, streptomycin… |\n\n> Slide nói vi khuẩn \"không có cytoskeleton\" – đây là khái quát cũ; vi khuẩn có protein tương đồng (FtsZ, MreB) nhưng không có vi ống/vi sợi điển hình."},{"h":"2. Phân loại nấm men (slide 38–40)","body":"\"Nấm men\" là **dạng sinh trưởng đơn bào**, không phải một ngành. Nấm men thuộc nhiều nhóm:\n| Nhóm | Bào tử hữu tính | Ví dụ |\n|---|---|---|\n| **Ascomycetes** (nấm túi) | **ascospore** trong ascus | *Saccharomyces, Schizosaccharomyces, Pichia, Kluyveromyces* |\n| **Basidiomycetes** (nấm đảm) | **basidiospore** | *Cryptococcus, Rhodotorula* |\n| **Deuteromycetes** (nấm bất toàn – chưa thấy giai đoạn hữu tính) | không biết | *Candida* (nay xếp vào Ascomycota) |\n\nCác tiêu chí phân loại truyền thống: hình thái tế bào, kiểu sinh sản (chồi, phân đôi), bào tử hữu tính, khả năng lên men/đồng hóa các loại đường, sử dụng nitrate…; hiện nay dùng trình tự **ITS, 26S/18S rDNA** (IDT-02)."},{"h":"3. Định lượng nấm men – buồng đếm (slide 41–43)","body":"**Buồng đếm hồng cầu (hemocytometer / Thoma / Neubauer)**:\n- Buồng có lưới ô với **diện tích và chiều sâu biết trước** → biết **thể tích** mẫu trong ô.\n- Ví dụ buồng Neubauer: ô lớn trung tâm 1 mm × 1 mm, sâu **0,1 mm** → V = 0,1 mm³ = **10⁻⁴ mL** (chia 25 ô trung bình × 16 ô nhỏ = 400 ô nhỏ).\n- **Mật độ (tế bào/mL) = (số tế bào đếm được / thể tích đã đếm, mL) × hệ số pha loãng**.\n- Ví dụ: đếm 120 tế bào trong 1 mm² (10⁻⁴ mL), mẫu pha loãng 10 lần → 120 × 10 / 10⁻⁴ = **1,2 × 10⁷ tế bào/mL**.\n- Nhuộm **xanh methylene (methylene blue)**: tế bào **chết bắt màu xanh**, tế bào sống khử màu → **không màu** → đếm được tỉ lệ sống.\n- Quy tắc: chồi lớn hơn ½ tế bào mẹ đếm là 1 tế bào riêng; đếm tế bào chạm cạnh trên và trái, bỏ cạnh dưới và phải. [mở rộng]"},{"h":"4. Định lượng – đếm khuẩn lạc trên đĩa","body":"- Pha loãng liên tiếp → cấy trải (spread) hoặc đổ đĩa (pour) → ủ 2–3 ngày (nấm men 28–30 °C) → đếm khuẩn lạc (30–300).\n- **CFU/mL = số khuẩn lạc / (thể tích cấy × độ pha loãng)**.\n- Chỉ **tế bào sống có khả năng phân chia** mới tạo khuẩn lạc."},{"h":"5. So sánh hai phương pháp (slide 44–48: \"Time & materials\", \"Dead cells\")","body":"| Tiêu chí | **Buồng đếm** | **Đếm khuẩn lạc trên đĩa** |\n|---|---|---|\n| **Thời gian** | **nhanh** (vài phút) | **chậm** (2–3 ngày ủ) |\n| **Vật tư** | ít: buồng đếm, kính hiển vi | nhiều: môi trường, đĩa, ống pha loãng, tủ ấm |\n| **Tế bào chết** | **đếm cả tế bào chết** (trừ khi nhuộm methylene blue) | **chỉ đếm tế bào sống** |\n| Mật độ tối thiểu | cần mẫu đặc (≥ ~10⁶ tế bào/mL) | phát hiện được mật độ thấp |\n| Cụm tế bào | đếm được từng tế bào | 1 cụm = 1 CFU → có thể thấp hơn thực tế |\n| Nhiễm tạp | khó phân biệt | quan sát được khuẩn lạc lạ |\n\n→ Buồng đếm: **nhanh, rẻ**, nhưng **không phân biệt sống/chết**. Đếm đĩa: **chính xác số tế bào sống**, nhưng **tốn thời gian, vật tư**."}],"extension":[{"h":"Thực tế: kiểm soát men giống trong nhà máy bia","body":"Nhà máy bia thường cấy khoảng **10–20 × 10⁶ tế bào/mL** dịch đường và yêu cầu tỉ lệ sống **> 90 %** (nhuộm methylene blue). Tỉ lệ sống thấp → lên men chậm, bia có mùi lạ. Máy đếm tế bào tự động hiện đại dùng nguyên lý nhuộm huỳnh quang + phân tích ảnh – vẫn là \"buồng đếm\" nâng cấp."},{"h":"Candida – nấm men gây bệnh","body":"*Candida albicans* (thường trú ở miệng, ruột, âm đạo) có thể gây **nấm miệng, nấm âm đạo**, nhiễm trùng máu ở người suy giảm miễn dịch; chuyển từ dạng men sang **giả sợi/sợi** khi xâm lấn mô. *Cryptococcus neoformans* (có vỏ nhầy) gây viêm màng não."}],"keyCards":[{"title":"Yeast vs bacteria","bodyEn":"Yeast: eukaryotic, nucleus, organelles, 80S ribosomes; **sterol** in membrane; wall of **glucan, mannan, chitin**; spores are **reproductive**; heterotroph, facultative anaerobe. Bacteria: prokaryotic, 70S; no sterol (except *Mycoplasma*); **peptidoglycan**; **endospores** are not for reproduction; heterotroph or autotroph; aerobic/facultative/anaerobic.","glossVi":"Bảng so sánh nấm men – vi khuẩn."},{"title":"Counting chamber","bodyEn":"Cells counted in a grid of known area and depth (e.g., 1 mm² × 0.1 mm = 10⁻⁴ mL). Cells/mL = count ÷ volume (mL) × dilution factor. **Methylene blue** stains dead cells blue; live cells stay colorless.","glossVi":"Buồng đếm: nhanh, đếm cả tế bào chết."},{"title":"Chamber vs plate count","bodyEn":"Chamber: fast, few materials, but counts **dead cells** too and needs dense samples. Plate count: counts only **viable** cells (CFU) and detects low numbers, but needs **2–3 days** and more materials.","glossVi":"So sánh thời gian, vật tư, tế bào chết."}],"traps":["Chamber counts only live cells","Yeast is a phylum","Endospores reproduce bacteria"]},{"id":"FUN-04","title":"Mold structure: hyphae, septa and mycelium","priority":"H","difficulty":1,"minutes":20,"source":"8. Molds.pptx: slides 1–14","prereq":[],"hookVi":"Ổ bánh mì để lâu nổi một lớp **bông trắng**, vài ngày sau chuyển **đen**. Lớp bông đó là **hệ sợi nấm (mycelium)** – hàng triệu **sợi nấm (hyphae)** đan xen, bò khắp ổ bánh và tiết enzyme tiêu hóa nó từ bên ngoài. Chấm đen là hàng nghìn **túi bào tử** sẵn sàng bay đi. Vì sao cắt bỏ phần mốc chưa chắc đã an toàn?","predictQuestion":{"stem":"A piece of bread shows a small moldy spot. Why is cutting it off not always enough?","options":["Molds are bacteria","Hyphae grow through the bread beyond the visible colony, and fragments can regrow","Mold spores cannot survive","Bread contains antibiotics"],"answer":1,"explanation":"Sợi nấm **lan sâu** vào bánh ngoài phần nhìn thấy; **mỗi đoạn sợi** có thể mọc thành hệ sợi mới."},"lesson":[{"h":"1. Nấm mốc là gì?","body":"- **Molds** (nấm mốc / nấm sợi): nấm **đa bào**, phát triển thành các **sợi dài (hyphae)**. Là **nhân thực**, dị dưỡng **hấp thụ** (tiết enzyme ra ngoài, hấp thụ chất tan).\n- Khuẩn lạc nấm mốc: **xốp, bông, dạng bột**, có màu (xanh, đen, vàng…) do bào tử – khác khuẩn lạc vi khuẩn/nấm men (nhẵn, ướt). Slide 7: khuẩn lạc *Penicillium* nhìn đại thể.\n- Slide 3 đặt câu hỏi so sánh nấm mốc – nấm men (hình thái, thành, bào tử, sinh sản, trao đổi chất) – xem bài FUN-06."},{"h":"2. Sợi nấm (hyphae) và vách ngăn (septa)","body":"- **Hypha** (số nhiều **hyphae**): **ống tế bào** có **thành chitin** bao quanh màng sinh chất và tế bào chất (slide 10).\n- **Septate hyphae** (sợi có vách ngăn): có **septa** (số ít septum) – vách ngang chia sợi thành các **đơn vị giống tế bào**, slide ghi mỗi đơn vị **một nhân (uninucleate)**. Vách có **lỗ** cho tế bào chất và nhân di chuyển. Ví dụ: *Penicillium, Aspergillus*.\n- **Coenocytic hyphae** (sợi cộng bào / không vách): **không có vách ngăn**, là một khối tế bào chất **dài liên tục chứa nhiều nhân**. Ví dụ: *Rhizopus, Mucor* (nhóm Zygomycetes).\n\n| | Có vách ngăn (septate) | Cộng bào (coenocytic) |\n|---|---|---|\n| Vách ngang | có (septa có lỗ) | không |\n| Nhân | 1 (hoặc vài) mỗi khoang | nhiều nhân trong ống liên tục |\n| Ví dụ | *Aspergillus, Penicillium* | *Rhizopus, Mucor* |"},{"h":"3. Hệ sợi (mycelium)","body":"- **Mycelium** (số nhiều mycelia): **khối sợi nấm đan xen** nhìn thấy được bằng mắt thường – được tạo thành **từ các hyphae**.\n- Slide 10 ghi \"Mycelia: formed from the mycelium\" – hiểu đúng: hệ sợi (mycelium) **được tạo từ nhiều sợi nấm (hyphae)**."},{"h":"4. Sinh trưởng ở đỉnh và phân mảnh (slide 12–13)","body":"- Sợi nấm **dài ra ở đỉnh (tip growth)** và phân nhánh.\n- **Mỗi phần của sợi đều có khả năng sinh trưởng**; khi một **đoạn sợi bị đứt ra**, nó có thể **kéo dài thành sợi mới** → sinh sản bằng **phân mảnh (fragmentation)**.\n- **Bào tử (spores)** là **cơ quan sinh sản** của nấm sợi (bài FUN-05)."},{"h":"5. Sợi dinh dưỡng và sợi khí sinh (slide 14)","body":"| | **Vegetative hypha** (sợi dinh dưỡng / sợi cơ chất) | **Aerial hypha** (sợi khí sinh / sợi sinh sản) |\n|---|---|---|\n| Vị trí | trong/trên bề mặt cơ chất | **vươn lên trên** bề mặt môi trường |\n| Chức năng | **hấp thụ chất dinh dưỡng** | thường **mang bào tử sinh sản** |"}],"extension":[{"h":"Nấm mốc có lợi trong thực phẩm Việt Nam","body":"- ***Aspergillus oryzae*** (mốc tương, koji): làm **tương, nước tương, miso**, rượu sake – tiết amylase, protease mạnh.\n- ***Rhizopus, Mucor*** trong **bánh men rượu**, **tempeh** (Indonesia).\n- ***Penicillium roqueforti / camemberti***: phô mai xanh, phô mai trắng.\n- ***Monascus purpureus***: gạo men đỏ (tạo màu tự nhiên, giảm cholesterol)."},{"h":"Nấm mốc có hại: độc tố nấm (mycotoxin)","body":"***Aspergillus flavus*** trên lạc, ngô mốc sinh **aflatoxin B1** – một trong những chất **gây ung thư gan mạnh nhất**, **chịu nhiệt**, không bị phá khi nấu. Vì vậy thực phẩm mốc nên **bỏ cả phần** chứ không chỉ cắt chỗ mốc, đặc biệt với thực phẩm mềm, nhiều nước."}],"keyCards":[{"title":"Hyphae","bodyEn":"Molds grow as **hyphae**: tubes with a **chitin** wall around the plasma membrane and cytoplasm. **Septate** hyphae have cross-walls (**septa**) dividing them into cell-like units (uninucleate); **coenocytic** hyphae have no septa and many nuclei in one continuous cytoplasm.","glossVi":"Sợi có vách vs cộng bào."},{"title":"Mycelium and growth","bodyEn":"A **mycelium** is the visible mass of intertwined hyphae. Hyphae grow by **elongating at the tips**; any fragment can grow into a new hypha (**fragmentation**). **Spores** are the reproductive structures.","glossVi":"Mọc ở đỉnh; đoạn sợi mọc thành sợi mới."},{"title":"Vegetative vs aerial hyphae","bodyEn":"**Vegetative hyphae** obtain nutrients from the substrate. **Aerial (reproductive) hyphae** project above the medium and often bear reproductive spores.","glossVi":"Sợi dinh dưỡng hấp thụ; sợi khí sinh mang bào tử."}],"traps":["Coenocytic hyphae have septa","Mold walls are peptidoglycan","Only spores can start a new colony"]},{"id":"FUN-05","title":"Mold spores, the sexual cycle and fungal phyla","priority":"H","difficulty":2,"minutes":25,"source":"8. Molds.pptx: slides 15–43","prereq":[],"hookVi":"Mốc đen trên bánh mì (*Rhizopus*) mang bào tử trong **túi**; mốc xanh trên cam (*Penicillium*) xếp bào tử thành **chuỗi hở** như chổi quét; còn cây nấm rơm bạn ăn là **quả thể** của một nấm đảm. Chỉ cần nhìn **bào tử nằm ở đâu và sinh ra thế nào**, nhà nấm học xếp được nấm vào đúng ngành.","predictQuestion":{"stem":"Molds are classified into phyla mainly according to:","options":["the color of their colonies","their type of sexual spores (sexual reproduction)","their cell wall thickness","whether they cause disease"],"answer":1,"explanation":"Slide 15: nấm mốc được phân loại theo **cách sinh sản hữu tính** – loại **bào tử hữu tính** đặc trưng cho từng ngành."},"lesson":[{"h":"1. Phân loại nấm mốc (slide 15–19)","body":"Nấm mốc được xếp vào các **ngành** theo **kiểu sinh sản hữu tính**:\n| Ngành | Bào tử hữu tính | Sợi | Ví dụ trong bài |\n|---|---|---|---|\n| **Zygomycota** (Zygomycetes; nay là Mucoromycota) | **zygospore** | cộng bào | ***Rhizopus stolonifer*** (mốc bánh mì đen), *Mucor indicus*, *Absidia* |\n| **Ascomycota** (nấm túi) | **ascospore** trong **ascus** | có vách | ***Neurospora crassa***, *Penicillium, Aspergillus* |\n| **Basidiomycota** (nấm đảm) | **basidiospore** trên **basidium** | có vách | ***Itajahya*** (nấm lõ chó), nấm mũ |\n\nNgoài ra *Allomyces* (Blastocladiomycota) có **bào tử động (zoospore)**. Phân loại hiện đại dựa thêm vào trình tự DNA (cây phân loại 2018 trên slide)."},{"h":"2. Bào tử vô tính (slide 20–31)","body":"Nấm mốc có thể sinh sản **vô tính, hữu tính hoặc cả hai**. **Bào tử vô tính** do một cá thể tạo ra qua **nguyên phân** và phân chia tế bào:\n\n**a) Sporangiospores (bào tử túi / bào tử kín)**: hình thành **bên trong túi – sporangium**, ở đầu một sợi khí sinh gọi là **sporangiophore** (cuống túi). Ví dụ: *Rhizopus, Mucor, Absidia*.\n\n**b) Conidiospores (conidia – bào tử đính / bào tử trần)**: bào tử đơn bào hoặc đa bào **không nằm trong túi**, sinh ra ở đầu **conidiophore**. Ví dụ: *Penicillium* (chổi), *Aspergillus* (bông hoa cúc). Các kiểu conidia [fig]:\n- **Arthroconidia**: sợi đứt thành đoạn (*Coccidioides*).\n- **Blastoconidia**: nảy chồi từ tế bào mẹ (*Candida*).\n- **Chlamydoconidia**: bào tử **vách dày** hình thành trong đoạn sợi (*Candida albicans*).\n\n**c) Zoospores (bào tử động)**: bào tử **di động bằng roi (flagella)**, bơi trong nước (*Allomyces*, nấm chytrid)."},{"h":"3. Sinh sản hữu tính – 3 giai đoạn (slide 32–34)","body":"Bào tử hữu tính **đặc trưng cho từng ngành**. Sinh sản hữu tính gồm:\n1. **Plasmogamy (chất giao)**: nhân **đơn bội** của tế bào cho (+) **xâm nhập tế bào chất** của tế bào nhận (−).\n2. **Karyogamy (nhân giao)**: nhân (+) và (−) **hợp nhất** thành **nhân hợp tử lưỡng bội**.\n3. **Meiosis (giảm phân)**: nhân lưỡng bội tạo các **nhân đơn bội** (bào tử hữu tính), một số là **tái tổ hợp di truyền**.\n\nMẹo: **Chất → Nhân → Giảm** (P-K-M). Giữa plasmogamy và karyogamy có thể là pha **song nhân (n + n, dikaryotic)** kéo dài, đặc biệt ở nấm đảm."},{"h":"4. Ba loại bào tử hữu tính (slide 35–43)","body":"**Zygospore (bào tử tiếp hợp)** – Zygomycota:\n- Hai sợi của hai kiểu giao phối (+/−) mọc lại gần nhau, đầu sợi phình (gametangia) và **hợp nhất** → **zygospore vách dày, sần** chịu điều kiện bất lợi → nảy mầm, giảm phân, tạo sporangium. Ví dụ *Rhizopus stolonifer, Mucor indicus*.\n\n**Ascospore (bào tử túi)** – Ascomycota:\n- Hình thành **bên trong túi – ascus**; thường **8 ascospores** mỗi ascus (4 nhân sau giảm phân + 1 lần nguyên phân). Túi thường nằm trong **quả thể (ascocarp)**. Ví dụ *Neurospora crassa*, *Penicillium*, *Aspergillus*, nấm men *Saccharomyces* (4 bào tử).\n\n**Basidiospore (bào tử đảm)** – Basidiomycota:\n- Hình thành **bên ngoài** một cấu trúc hình chùy gọi là **đảm – basidium**, thường **4 bào tử**/đảm.\n- Slide 40–41: **quả thể (basidiocarp)** → **phiến nấm (gill)** → **đảm (basidia)** → **bào tử đảm (basidiospore)**.\n\n| | Zygospore | Ascospore | Basidiospore |\n|---|---|---|---|\n| Vị trí | bào tử vách dày tự do | **trong** ascus | **ngoài** basidium |\n| Số lượng | 1 | thường **8**/túi | thường **4**/đảm |\n| Ngành | Zygomycota | Ascomycota | Basidiomycota |"},{"h":"5. Tổng hợp: nhận diện nhanh","body":"- Có **túi chứa bào tử vô tính** + sợi không vách → nghĩ tới **Zygomycota** (*Rhizopus*).\n- Bào tử **trần xếp chuỗi** trên cuống + sợi có vách → **Ascomycota** dạng vô tính (*Penicillium, Aspergillus*).\n- Có **quả thể dạng nấm mũ, phiến** → **Basidiomycota**.\n- **Bào tử có roi** → zoospore (*Allomyces*, chytrid; lưu ý oomycetes cũng có zoospore nhưng là **nguyên sinh vật** – bài PRO-03)."}],"extension":[{"h":"Công nghiệp: bào tử nấm là \"giống\" sản xuất","body":"- Sản xuất **acid citric** bằng *Aspergillus niger* và **penicillin** bằng *Penicillium chrysogenum* đều bắt đầu từ **huyền phù bào tử (conidia)** được đếm bằng buồng đếm (~10⁶–10⁷ bào tử/mL) rồi cấy vào nồi lên men (APP-04).\n- **Nấm ăn** (nấm rơm *Volvariella*, nấm bào ngư *Pleurotus*, nấm hương *Lentinula*) là **quả thể của nấm đảm** – ngành trồng nấm là nông nghiệp vi sinh lớn ở Việt Nam."},{"h":"Y tế: bào tử và dị ứng","body":"Bào tử *Aspergillus* trong không khí có thể gây **bệnh aspergillosis** ở phổi người suy giảm miễn dịch; bào tử mốc trong nhà ẩm là tác nhân dị ứng, hen suyễn phổ biến."}],"keyCards":[{"title":"Classification of molds","bodyEn":"Molds are classified into phyla by their **sexual reproduction**: **Zygomycota** (zygospores; *Rhizopus stolonifer*), **Ascomycota** (ascospores in asci; *Neurospora crassa*), **Basidiomycota** (basidiospores on basidia; *Itajahya*, mushrooms).","glossVi":"Phân ngành theo bào tử hữu tính."},{"title":"Asexual spores","bodyEn":"Formed by mitosis. **Sporangiospores**: inside a **sporangium** at the tip of a **sporangiophore** (*Rhizopus, Absidia*). **Conidiospores (conidia)**: not enclosed in a sac (*Penicillium, Aspergillus*; arthro-, blasto-, chlamydoconidia). **Zoospores**: motile with **flagella**.","glossVi":"Bào tử kín, bào tử trần, bào tử động."},{"title":"Sexual cycle","bodyEn":"1) **Plasmogamy**: a haploid (+) nucleus enters the cytoplasm of a (−) cell. 2) **Karyogamy**: nuclei fuse → diploid zygote nucleus. 3) **Meiosis**: haploid nuclei, some recombinant.","glossVi":"Chất giao → nhân giao → giảm phân."},{"title":"Sexual spores","bodyEn":"**Zygospore**: thick-walled spore from fusion of two hyphal tips (Zygomycota). **Ascospore**: inside an **ascus** (often 8). **Basidiospore**: outside a **basidium** (often 4); basidiocarp → gills → basidia → basidiospores.","glossVi":"Zygo – trong túi – ngoài đảm."}],"traps":["Conidia are formed in a sporangium","Basidiospores form inside the basidium","Karyogamy comes before plasmogamy","Asexual spores are formed by meiosis"]},{"id":"FUN-06","title":"Lichens; comparing molds, yeasts and bacteria; mold biomass","priority":"M","difficulty":2,"minutes":15,"source":"8. Molds.pptx: slides 3, 44–48","prereq":[],"hookVi":"Trên thân cây cổ thụ và đá núi có những mảng xanh xám, vàng cam như vảy – đó là **địa y (lichen)**: một \"liên minh\" giữa **nấm** và **tảo** (hoặc vi khuẩn lam). Địa y chỉ mọc nơi không khí sạch, nên được dùng làm **chỉ thị ô nhiễm không khí**. Còn khi muốn biết một nồi nấm mốc đã mọc bao nhiêu, ta **không đếm tế bào** như nấm men được – vì sao?","predictQuestion":{"stem":"Why is counting individual cells not a good way to measure the growth of a mold in liquid culture?","options":["Molds do not contain cells","Molds form a continuous branching network of hyphae with no clear individual cells, so biomass (dry weight) is measured instead","Molds are too small to see","Mold cells are always dead"],"answer":1,"explanation":"Nấm mốc tạo **mạng sợi liên tục**, không có ranh giới tế bào rõ → đo **sinh khối (khối lượng khô)** hoặc **đếm bào tử**."},"lesson":[{"h":"1. Địa y (lichens) – slide 44–46","body":"- **Lichen** = sự kết hợp **cộng sinh** giữa **một nấm** (thường là nấm túi) và **một đối tác quang hợp** (**tảo lục** hoặc **vi khuẩn lam**).\n  - **Nấm**: tạo cấu trúc, bám giá thể, giữ nước, hấp thụ khoáng.\n  - **Tảo/vi khuẩn lam**: **quang hợp**, cung cấp **chất hữu cơ** cho nấm.\n- Ba dạng tản (thallus) [fig]:\n| Dạng | Mô tả |\n|---|---|\n| **Crustose** (dạng vỏ) | bám chặt, phẳng như lớp vỏ trên đá/cây |\n| **Foliose** (dạng lá) | giống lá, mép nhấc lên |\n| **Fruticose** (dạng bụi/cành) | dạng sợi, cành nhánh, treo hoặc đứng |\n- Sinh sản sinh dưỡng bằng **soredia** (cụm sợi nấm + tế bào tảo) hoặc phân mảnh.\n- Vai trò: **sinh vật tiên phong** phân hủy đá tạo đất; **chỉ thị ô nhiễm SO₂**; thức ăn tuần lộc; thuốc nhuộm (quỳ tím – litmus – chiết từ địa y)."},{"h":"2. So sánh nấm mốc – nấm men – vi khuẩn (slide 3)","body":"| Đặc điểm | **Nấm mốc** | **Nấm men** | **Vi khuẩn** |\n|---|---|---|---|\n| Hình thái | **đa bào, dạng sợi** (hyphae, mycelium) | **đơn bào**, cầu/bầu dục | đơn bào nhân sơ |\n| Thành tế bào | chủ yếu **chitin** (+ glucan) | glucan, mannan, chitin (sẹo chồi) | peptidoglycan |\n| Bào tử | bào tử **vô tính** (sporangio-, conidio-, zoospore) và **hữu tính** (zygo-, asco-, basidiospore) | ascospore/basidiospore; bào tử vô tính ít | nội bào tử (sống sót) |\n| Sinh sản | **bào tử**, **phân mảnh sợi** | **nảy chồi**, phân đôi; hữu tính | phân đôi |\n| Trao đổi chất | dị dưỡng, phần lớn **hiếu khí** | dị dưỡng, **kỵ khí tùy nghi** | rất đa dạng |\n| pH tối ưu | ~5–6 (chịu acid) | ~5–6 | ~6,5–7,5 |\n| Khuẩn lạc | xốp, bông, có màu bào tử | nhẵn, ướt, trắng kem | nhẵn/nhầy |"},{"h":"3. Định lượng sinh khối nấm mốc (slide 48)","body":"**a) Định lượng bào tử (spore quantification)**:\n- Rửa bào tử khỏi bề mặt khuẩn lạc bằng nước có chất hoạt động bề mặt (Tween 80) → lọc bỏ sợi → **đếm bào tử bằng buồng đếm** (bào tử/mL) hoặc **cấy đĩa đếm CFU**.\n\n**b) Định lượng sinh khối (biomass quantification)**:\n- **Khối lượng khô (dry weight)**: lọc/ly tâm thu sinh khối → rửa → **sấy đến khối lượng không đổi** → cân (g/L).\n- Có thể đo **đường kính khuẩn lạc** trên thạch theo thời gian (tốc độ lan).\n\n**So sánh cách định lượng** giữa ba nhóm:\n| | Vi khuẩn | Nấm men | Nấm mốc |\n|---|---|---|---|\n| Đếm trực tiếp | buồng đếm Petroff-Hausser | buồng đếm hồng cầu | chỉ **đếm bào tử** |\n| Đếm khuẩn lạc (CFU) | có | có | bào tử/mảnh sợi (CFU **không** tỉ lệ sinh khối) |\n| Độ đục (OD) | có | có | **không phù hợp** (sợi kết viên, không đồng nhất) |\n| Khối lượng khô | có | có | **phương pháp chính** |"}],"extension":[{"h":"Công nghệ: đo sinh khối trong nồi lên men nấm","body":"Trong sản xuất penicillin hay acid citric, sợi nấm có thể mọc dạng **viên (pellet)** hoặc **sợi phân tán** làm dịch rất nhớt. Kỹ sư theo dõi **khối lượng khô tế bào (DCW, g/L)** và **thể tích sinh khối lắng (packed mycelial volume)** thay cho OD. Hình thái viên/sợi ảnh hưởng mạnh đến truyền oxy và năng suất."}],"keyCards":[{"title":"Lichens","bodyEn":"A **symbiosis** of a **fungus** and a photosynthetic partner (**green alga** or **cyanobacterium**). Forms: **crustose** (crust), **foliose** (leaflike), **fruticose** (shrubby). The alga makes organic food; the fungus provides structure and water.","glossVi":"Địa y = nấm + tảo/vi khuẩn lam."},{"title":"Mold vs yeast","bodyEn":"Molds: multicellular **hyphae**, chitin walls, many asexual and sexual spores, reproduce by spores and fragmentation, mostly aerobic. Yeasts: unicellular, glucan–mannan–chitin walls, **budding**/fission, facultative anaerobes.","glossVi":"Nấm mốc sợi – nấm men đơn bào."},{"title":"Mold quantification","bodyEn":"Molds are measured by **spore quantification** (counting chamber or CFU of spores) and **biomass quantification** (**dry weight** to constant mass). Direct cell counts and turbidity are unsuitable for hyphal networks.","glossVi":"Nấm mốc: đếm bào tử + khối lượng khô."}],"traps":["Lichens are a single organism","Molds are measured by turbidity","Molds are unicellular"]},{"id":"CTL-01","title":"Sterilization vs disinfection; microbial death rate; D-value; efficacy factors","priority":"H","difficulty":3,"minutes":25,"source":"4.The Control of Microbial Growth.pptx: slides 1–8","prereq":[],"hookVi":"Một nhà máy đồ hộp phải đảm bảo xác suất còn sót một bào tử *Clostridium botulinum* trong hộp **nhỏ hơn 1 phần tỉ tỉ**. Họ không \"diệt sạch\" theo cảm tính mà **tính toán**: vi khuẩn chết theo **tỉ lệ cố định** mỗi phút – cứ mỗi **D phút** số sống giảm **10 lần**. Biết D, bạn tính được phải đun bao lâu.","predictQuestion":{"stem":"A population of 10^6 bacteria is heated; 90% die every minute. How many survivors remain after 3 minutes?","options":["0","10^3","10^5","7 × 10^5"],"answer":1,"explanation":"Mỗi phút giảm **1 log** (còn 10 %): 10⁶ → 10⁵ → 10⁴ → **10³**. Vi khuẩn chết theo **tỉ lệ**, không theo số lượng cố định."},"lesson":[{"h":"1. Các thuật ngữ (slide 3–4)","body":"| Thuật ngữ | Định nghĩa | Ghi chú |\n|---|---|---|\n| **Sterilization** (tiệt trùng) | **tiêu diệt tất cả** vi sinh vật: **tế bào sinh dưỡng + bào tử** | thường dùng **nhiệt độ cao** (autoclave) |\n| **Disinfection** (khử trùng) | **tiêu diệt vi khuẩn gây bệnh** (tế bào sinh dưỡng không tạo bào tử) trên **vật vô tri** | dùng **hóa chất, UV, nước sôi, hơi nước…** |\n| **Antisepsis** (sát khuẩn) | khử trùng khi áp dụng **trực tiếp lên mô sống**; hóa chất là **antiseptic** | cồn, iodine lên da |\n| Commercial sterilization | xử lý nhiệt đủ diệt bào tử *C. botulinum* trong đồ hộp | [mở rộng] |\n| Sanitization | giảm vi sinh vật trên dụng cụ ăn uống tới mức an toàn | [mở rộng] |\n| Degerming | loại vi sinh vật cơ học (rửa tay, lau cồn) | [mở rộng] |\n\nHậu tố: **-cide** = giết (**bactericide, fungicide, virucide, germicide**); **-stasis/-static** = **ức chế** sinh trưởng (bacteriostatic) – bỏ tác nhân thì vi sinh vật mọc lại."},{"h":"2. Tốc độ chết của vi sinh vật (slide 5)","body":"- Khi xử lý nhiệt, vi khuẩn thường **chết với tốc độ không đổi (constant rate)** – tức **tỉ lệ chết cố định** mỗi đơn vị thời gian.\n- Ví dụ bảng slide (chết 90 %/phút):\n| Thời gian (phút) | Số tế bào sống | Số chết trong phút đó | log₁₀ sống |\n|---|---|---|---|\n| 0 | 1 000 000 | – | 6 |\n| 1 | 100 000 | 900 000 | 5 |\n| 2 | 10 000 | 90 000 | 4 |\n| 3 | 1 000 | 9 000 | 3 |\n| 4 | 100 | 900 | 2 |\n| 5 | 10 | 90 | 1 |\n| 6 | 1 | 9 | 0 |\n- Vẽ **log(số sống)** theo thời gian → **đường thẳng** (logarithmic death curve)."},{"h":"3. D-value – thời gian giảm thập phân","body":"- **D-value (decimal reduction time, DRT)**: **thời gian (phút) ở một nhiệt độ xác định** để **giết 90 %** quần thể (giảm **1 log**).\n- Công thức: **t = D × (log N₀ − log N)** hay **log N = log N₀ − t/D**.\n- Ví dụ: D₁₂₁ của bào tử *C. botulinum* ≈ **0,2 phút**. Quy tắc **12D** trong đồ hộp: t = 12 × 0,2 = **2,4 phút** ở 121 °C → giảm 10¹² lần.\n- Thuật ngữ khác [mở rộng]: **thermal death point (TDP)** – nhiệt độ thấp nhất giết hết trong 10 phút; **thermal death time (TDT)** – thời gian ngắn nhất để giết hết ở một nhiệt độ.\n- Mô hình log **không bao giờ đạt đúng 0** → tiệt trùng được định nghĩa bằng **xác suất sống sót** rất nhỏ (ví dụ < 10⁻⁶)."},{"h":"4. Các yếu tố ảnh hưởng hiệu quả diệt khuẩn (slide 6–7)","body":"1. **Số lượng vi sinh vật**: **càng nhiều** vi sinh vật ban đầu → **càng lâu** mới loại bỏ hết.\n2. **Đặc điểm vi sinh vật**:\n   - **Bào tử khó diệt hơn** tế bào sinh dưỡng;\n   - các tế bào sinh dưỡng khác nhau có **độ nhạy khác nhau** với cùng tác nhân (vd vi khuẩn lao, *Pseudomonas* bền hơn).\n3. **Ảnh hưởng của môi trường**:\n   - **Chất béo và protein** trong dung dịch có xu hướng **bảo vệ** vi khuẩn (máu, mủ, sữa làm giảm hiệu quả);\n   - **pH càng thấp → càng dễ diệt** vi khuẩn (acid tăng hiệu quả nhiệt – thực phẩm chua cần xử lý nhiệt nhẹ hơn).\n4. **Thời gian tiếp xúc (time of exposure)**:\n   - **Nhiệt độ càng thấp → thời gian tiếp xúc càng dài**;\n   - **diệt bào tử cần lâu hơn** tế bào sinh dưỡng."},{"h":"5. Cơ chế tác động của tác nhân (slide 8)","body":"| Đích | Cơ chế | Ví dụ tác nhân |\n|---|---|---|\n| **Màng tế bào** | thay đổi **tính thấm** – phá cấu trúc lipid, protein của màng → rò rỉ chất trong tế bào | cồn, phenol, quats, chlorhexidine |\n| **Protein và acid nucleic** | **phá liên kết hóa học** (liên kết H, cộng hóa trị) → biến tính protein, hỏng DNA/RNA | nhiệt, bức xạ, aldehyde, kim loại nặng |"}],"extension":[{"h":"Thực tế: vì sao bệnh viện dặn \"rửa sạch trước khi khử trùng\"","body":"Máu, mủ, dịch tiết (**protein, lipid**) **bảo vệ** vi khuẩn và **tiêu hao** hóa chất (chlorine, iodine phản ứng với chất hữu cơ). Rửa sạch trước giúp giảm **tải lượng ban đầu (N₀)** và loại chất bảo vệ → cùng thời gian xử lý đạt nhiều log hơn."},{"h":"Thực phẩm chua cần ít nhiệt hơn","body":"Đồ hộp **pH < 4,6** (dưa chua, nước ép cà chua, trái cây) chỉ cần xử lý ~100 °C, vì bào tử *C. botulinum* **không nảy mầm** và vi khuẩn **dễ chết hơn** ở pH thấp. Đồ hộp ít acid (thịt, cá, rau) bắt buộc **121 °C** với 12D."}],"keyCards":[{"title":"Key terms","bodyEn":"**Sterilization**: kills **all** microbes including **spores** (usually high heat). **Disinfection**: kills pathogenic vegetative cells on objects (chemicals, UV, boiling water, steam). **Antisepsis**: disinfection of **living tissue**; agent = **antiseptic**. -cide kills; -static inhibits.","glossVi":"Tiệt trùng diệt cả bào tử; khử trùng thì không."},{"title":"Microbial death rate","bodyEn":"Heated bacteria die at a **constant rate** (a constant fraction per unit time), e.g., 90 % per minute: 10⁶ → 10⁵ → 10⁴… A plot of **log survivors vs time is a straight line**.","glossVi":"Chết theo tỉ lệ → đường thẳng trên trục log."},{"title":"D-value","bodyEn":"**D** = time at a given temperature to kill **90 %** (1 log). **t = D × (log N₀ − log N)**. 12D for *C. botulinum* spores (D₁₂₁ ≈ 0.2 min) = 2.4 min.","glossVi":"D = thời gian giảm 1 log."},{"title":"Factors and mechanisms","bodyEn":"More microbes → longer time. **Spores** are harder to kill. **Fats and proteins protect** bacteria; **lower pH** kills more easily. **Lower temperature → longer exposure**. Agents act by **altering membrane permeability** or **damaging proteins and nucleic acids**.","glossVi":"N₀, loại vi sinh vật, môi trường, thời gian."}],"traps":["Disinfection kills spores","Microbes die at a constant number per minute","Organic matter increases killing","Log survivors reaches zero"]},{"id":"CTL-02","title":"Heat: moist heat, autoclaving, pasteurization and dry heat","priority":"H","difficulty":2,"minutes":25,"source":"4.The Control of Microbial Growth.pptx: slides 9–13","prereq":[],"hookVi":"Nồi luộc sữa bình của mẹ đun **100 °C** – đủ an toàn cho em bé. Nhưng phòng thí nghiệm vi sinh bắt buộc dùng **nồi hấp (autoclave) 121 °C**, còn que cấy thì hơ **đỏ rực** trên ngọn lửa. Vì sao 100 °C \"chưa đủ\", và vì sao **hơi nước** diệt khuẩn tốt hơn **khí nóng khô** ở cùng nhiệt độ?","predictQuestion":{"stem":"Why is boiling at 100 °C not a sterilization method?","options":["It does not kill vegetative bacteria","Some endospores survive boiling","Water blocks heat transfer","Boiling only works for dry objects"],"answer":1,"explanation":"Đun sôi 100 °C diệt tế bào sinh dưỡng, nhiều virus và nấm, nhưng **một số nội bào tử sống sót** → không phải tiệt trùng. Autoclave 121 °C mới diệt được bào tử."},"lesson":[{"h":"1. Nhiệt ẩm (moist heat) – slide 9–10","body":"**Cơ chế**: phá **liên kết hydro giữa các chuỗi protein** → **đông tụ (coagulate) protein** vi khuẩn. Nước giúp protein đông tụ nhanh → nhiệt ẩm hiệu quả hơn nhiệt khô.\n\n| Phương pháp | Điều kiện | Hiệu quả |\n|---|---|---|\n| **Boiling** (đun sôi) | 100 °C, 1 atm | diệt tế bào sinh dưỡng, phần lớn virus, nấm; **không diệt chắc chắn bào tử** |\n| **Free-flowing steam** (hơi nước không nén) | 100 °C | tương tự đun sôi |\n| **Autoclave** (nồi hấp áp lực) | **121 °C**, áp suất dư **~1 atm (15 psi)**, thường **15 phút** | **diệt tế bào sinh dưỡng và bào tử** → **tiệt trùng** |\n\n**Lưu ý autoclave**:\n- Hơi nước phải **tiếp xúc trực tiếp với bề mặt** dụng cụ (slide 9) → không nút kín bình, không bọc giấy bạc kín khí, đuổi hết không khí.\n- Áp suất chỉ để **nâng nhiệt độ sôi** của nước lên 121 °C; **nhiệt độ** mới là yếu tố diệt khuẩn.\n- Bình dung tích lớn cần **thời gian lâu hơn** để tâm dung dịch đạt 121 °C (slide 11 [fig]).\n- Kiểm tra bằng **băng chỉ thị nhiệt** hoặc **chỉ thị sinh học** (bào tử *Geobacillus stearothermophilus*). [mở rộng]"},{"h":"2. Thanh trùng – pasteurization (slide 12)","body":"- **Đun nóng nhẹ**, **đủ để diệt vi sinh vật gây hỏng** (và gây bệnh) mà **không làm ảnh hưởng nghiêm trọng hương vị** sản phẩm.\n- **Thanh trùng sữa**:\n| Kiểu | Nhiệt độ | Thời gian |\n|---|---|---|\n| **Truyền thống (LTLT – batch)** | **63 °C** | **30 phút** |\n| **HTST** (high temperature short time) | **72 °C** | **15 giây** |\n| **UHT** (ultra-high temperature) | **140 °C** | **< 1 giây** (slide); thực tế ~135–150 °C vài giây |\n\n- Các cặp nhiệt độ – thời gian này là **xử lý tương đương (equivalent treatments)**: nhiệt càng cao, thời gian càng ngắn.\n- Thanh trùng **không phải tiệt trùng**; riêng UHT + đóng gói vô trùng cho sữa bảo quản nhiệt độ phòng nhiều tháng."},{"h":"3. Nhiệt khô (dry heat) – slide 13","body":"**Cơ chế**: **oxy hóa (oxidation)** thành phần tế bào → cần nhiệt độ cao hơn/lâu hơn nhiệt ẩm.\n| Phương pháp | Ứng dụng |\n|---|---|\n| **Direct flaming** (hơ lửa trực tiếp) | tiệt trùng **que cấy (inoculating loop)** – hơ đến đỏ |\n| **Incineration** (thiêu đốt) | tiệt trùng và **tiêu hủy** cốc giấy, túi, băng gạc nhiễm bẩn |\n| **Hot-air sterilization** (tủ sấy) | **170 °C, 2 giờ** – dụng cụ thủy tinh, kim loại, vật chịu nhiệt không ướt được (bột, dầu) |\n\nSo sánh: autoclave 121 °C/15 phút ≈ tủ sấy 170 °C/2 giờ."},{"h":"4. So sánh nhiệt ẩm – nhiệt khô","body":"| | Nhiệt ẩm | Nhiệt khô |\n|---|---|---|\n| Cơ chế | **đông tụ protein** (phá liên kết H) | **oxy hóa** |\n| Điều kiện tiệt trùng | 121 °C, 15 phút | 170 °C, 2 giờ |\n| Truyền nhiệt | nhanh (hơi nước ngưng tụ) | chậm |\n| Dùng cho | môi trường, dung dịch, dụng cụ chịu ẩm | thủy tinh, kim loại, bột, dầu; que cấy |"}],"extension":[{"h":"Thực tế phòng lab CH3004","body":"Bạn sẽ **hấp môi trường 121 °C/15–20 phút**, **sấy dụng cụ thủy tinh 160–170 °C/2 giờ**, **hơ que cấy đến đỏ** trước và sau mỗi lần cấy. Môi trường có đường dễ bị **caramel hóa** nếu hấp quá lâu; dung dịch chịu nhiệt kém (vitamin, kháng sinh) thì **lọc vô trùng** (CTL-03)."},{"h":"Công nghiệp sữa Việt Nam","body":"Sữa tươi thanh trùng (HTST 72–75 °C/15–20 s) phải giữ lạnh, hạn ~7–10 ngày; sữa UHT (~140 °C/2–4 s + đóng hộp giấy vô trùng) để 6–12 tháng ở nhiệt độ phòng. Thanh trùng còn diệt *Mycobacterium bovis, Coxiella burnetii, Listeria*, *Salmonella*."}],"keyCards":[{"title":"Moist heat","bodyEn":"Moist heat breaks **hydrogen bonds** and **coagulates proteins**. **Boiling** (100 °C) and free-flowing steam do not reliably kill endospores. **Autoclave**: **121 °C**, ~1 atm above atmospheric (15 psi), ~15 min, kills vegetative cells **and spores**; steam must **contact the surfaces**.","glossVi":"Autoclave 121 °C diệt cả bào tử."},{"title":"Pasteurization","bodyEn":"Mild heating that kills spoilage organisms without seriously damaging taste. Milk: **63 °C for 30 min** (traditional), **HTST 72 °C for 15 s**, **UHT 140 °C for < 1 s**. Not sterilization.","glossVi":"63/30 – 72/15 s – 140/<1 s."},{"title":"Dry heat","bodyEn":"Kills by **oxidation**. **Direct flaming** (inoculating loops), **incineration** (contaminated paper, dressings), **hot-air oven 170 °C for 2 h**.","glossVi":"Nhiệt khô: oxy hóa; tủ sấy 170 °C 2 h."}],"traps":["Boiling sterilizes","Pressure kills microbes in the autoclave","Dry heat coagulates proteins","Pasteurization equals sterilization"]},{"id":"CTL-03","title":"Filtration, low temperature, desiccation, osmotic pressure and radiation","priority":"H","difficulty":2,"minutes":20,"source":"4.The Control of Microbial Growth.pptx: slides 14–26","prereq":[],"hookVi":"Vaccine, enzyme và dung dịch kháng sinh sẽ **hỏng** nếu đem hấp 121 °C. Vậy làm sao làm chúng vô trùng? Câu trả lời: **lọc** qua màng có lỗ **0,22 μm** – nhỏ hơn vi khuẩn. Còn bơm kim tiêm nhựa dùng một lần thì được tiệt trùng bằng **chùm electron** ngay trong bao bì kín. Mỗi tác nhân vật lý có một \"sở trường\" riêng.","predictQuestion":{"stem":"Which method is best for sterilizing a heat-sensitive antibiotic solution?","options":["Autoclaving","Filtration through a membrane filter","Hot-air oven","Boiling"],"answer":1,"explanation":"Slide 20: **lọc** dùng để tiệt trùng vật liệu **nhạy nhiệt**: một số môi trường, enzyme, vaccine, dung dịch kháng sinh."},"lesson":[{"h":"1. Lọc – filtration (slide 14–20)","body":"- **Filtration**: cho chất lỏng hoặc khí đi qua vật liệu dạng **màng/lưới** có **lỗ đủ nhỏ để giữ vi sinh vật**.\n- Dùng để tiệt trùng vật liệu **nhạy nhiệt**: **một số môi trường nuôi cấy, enzyme, vaccine, dung dịch kháng sinh**.\n- Có nhiều loại màng với **kích thước lỗ khác nhau** cho các mục đích khác nhau:\n| Lỗ màng | Giữ lại |\n|---|---|\n| **0,22–0,45 μm** | vi khuẩn (0,22 μm dùng cho lọc vô trùng) |\n| ~0,01 μm (siêu lọc) | virus, một số protein lớn |\n| **HEPA** (hiệu suất cao, ~0,3 μm) | vi sinh vật trong **không khí** (tủ an toàn sinh học, phòng mổ) [fig] |\n- Vi sinh vật bị giữ **trên màng vẫn còn sống** → lọc cũng dùng để **định lượng** vi sinh vật trong nước (màng lọc đặt lên thạch – GRO-06)."},{"h":"2. Nhiệt độ thấp, làm khô và áp suất thẩm thấu (slide 21–22)","body":"- **Lạnh (refrigeration 4 °C) / đông lạnh**: **kìm khuẩn (bacteriostatic)** – làm chậm trao đổi chất, **không** diệt; vi khuẩn ưa lạnh (*Listeria*) vẫn mọc chậm. [mở rộng]\n- **Desiccation (làm khô)**: mất nước → vi khuẩn **không sinh trưởng, không sinh sản** được nhưng **vẫn sống nhiều năm**. Khi có nước trở lại, chúng **tiếp tục sinh trưởng và phân chia** → đây là nguyên lý của **đông khô (lyophilization / freeze-drying)** để **bảo quản** giống.\n- **Osmotic pressure (áp suất thẩm thấu)**: tạo môi trường **ưu trương** (muối, đường) → nước rời tế bào (**co nguyên sinh**) → ức chế sinh trưởng (ướp muối, mứt)."},{"h":"3. Bức xạ – radiation (slide 23–26)","body":"Tác dụng phụ thuộc **bước sóng, cường độ, thời gian chiếu**.\n\n**a) Bức xạ ion hóa (ionizing radiation)**: **tia gamma, tia X, chùm electron năng lượng cao**.\n- Bước sóng **< 1 nm** → mang **nhiều năng lượng** → **xuyên sâu**.\n- **Ion hóa phân tử nước thành gốc tự do hoạt động** (vd gốc hydroxyl •OH) → phản ứng với thành phần hữu cơ, **đặc biệt DNA**.\n- **Chùm electron** được dùng rộng rãi để **tiệt trùng dược phẩm và dụng cụ y tế dùng một lần** (bơm kim tiêm, găng tay). Tia gamma chiếu xạ thực phẩm, gia vị. [mở rộng]\n\n**b) Bức xạ không ion hóa (nonionizing radiation)**:\n- Bước sóng **> 1 nm**; **không xuyên sâu** → cần **chiếu trực tiếp**.\n- **Tia UV**: DNA hấp thụ mạnh ở **260 nm**; tạo **liên kết giữa hai thymine kề nhau (thymine dimers)** → DNA **sao chép sai**. Dùng khử trùng không khí, bề mặt (tủ cấy), **vaccine và các sản phẩm y tế khác**.\n- **Vi sóng (microwaves)**: diệt vi khuẩn gây bệnh chủ yếu **bằng nhiệt** sinh ra trong thực phẩm; nhiệt không đều → có \"điểm lạnh\".\n\n| | Ion hóa | UV |\n|---|---|---|\n| Bước sóng | < 1 nm | > 1 nm (UV diệt khuẩn ~260 nm) |\n| Năng lượng/xuyên thấu | cao, **xuyên sâu** | thấp hơn, **kém xuyên** |\n| Cơ chế | gốc tự do từ nước → hỏng DNA | **dimer thymine** |\n| Ứng dụng | tiệt trùng dụng cụ nhựa, dược phẩm trong bao bì | khử trùng bề mặt, không khí tủ cấy |"}],"extension":[{"h":"Tủ cấy vô trùng và tủ an toàn sinh học","body":"Tủ cấy trong lab có **đèn UV** (bật 15–30 phút trước khi làm, tắt khi thao tác vì UV hại mắt, da) và **màng HEPA** lọc không khí thổi xuống bề mặt. UV **không xuyên qua** kính, nhựa, lớp bụi → vật bị che vẫn có thể nhiễm."},{"h":"Chiếu xạ thực phẩm ở Việt Nam","body":"Trái cây xuất khẩu (thanh long, nhãn, vải) sang Mỹ, Úc được **chiếu xạ gamma/electron** liều thấp để diệt côn trùng và giảm vi sinh vật – đây là \"tiệt trùng lạnh\", thực phẩm **không trở nên phóng xạ**."}],"keyCards":[{"title":"Filtration","bodyEn":"Passage of liquid or gas through a screen-like material with pores small enough to retain microbes. Used for **heat-sensitive materials**: some **culture media, enzymes, vaccines, antibiotic solutions**. Different membranes have different pore sizes (0.22 μm for bacteria; HEPA for air).","glossVi":"Lọc tiệt trùng vật liệu nhạy nhiệt."},{"title":"Desiccation and osmotic pressure","bodyEn":"**Desiccation**: bacteria cannot grow but remain **viable for years**; they resume growth when water returns → principle of **lyophilization (freeze-drying)**. **Hypertonic** environments (salt, sugar) cause plasmolysis.","glossVi":"Làm khô: ức chế chứ không giết."},{"title":"Radiation","bodyEn":"**Ionizing** (gamma, X-rays, electron beams; λ < 1 nm; high energy; penetrates deeply) ionizes water into **free radicals** that damage DNA; electron beams sterilize pharmaceuticals and disposable medical devices. **Nonionizing** (λ > 1 nm; poor penetration): **UV at 260 nm** forms **thymine dimers**; **microwaves** kill by heating.","glossVi":"Ion hóa: gốc tự do, xuyên sâu. UV: dimer thymine, kém xuyên."}],"traps":["Filtration kills microbes","UV penetrates deeply","Desiccation kills bacteria","Refrigeration sterilizes"]},{"id":"CTL-04","title":"Chemical agents I: phenolics, chlorhexidine, essential oils, halogens, alcohols, heavy metals","priority":"H","difficulty":2,"minutes":25,"source":"4.The Control of Microbial Growth.pptx: slides 27–36","prereq":[],"hookVi":"Trước khi tiêm, y tá lau da bằng **cồn 70 %**; sau mổ, vết thương được bôi **Betadine** (iodine); nước máy có mùi **chlorine**; bạc được thêm vào băng gạc chữa bỏng. Mỗi hóa chất đánh vào một \"điểm yếu\" khác nhau của tế bào vi khuẩn. Và vì sao cồn **70 %** lại diệt khuẩn tốt hơn cồn **100 %**?","predictQuestion":{"stem":"Why is 70% ethanol a better disinfectant than 100% ethanol?","options":["100% ethanol evaporates too slowly","Water is required for alcohol to denature proteins","70% ethanol kills endospores","100% ethanol is an antibiotic"],"answer":1,"explanation":"Slide 34: cồn **biến tính protein – quá trình cần nước**. Cồn tuyệt đối làm đông tụ nhanh lớp ngoài và bay hơi, kém hiệu quả hơn."},"lesson":[{"h":"1. Phenol và phenolics (slide 28–30)","body":"- **Phenol** (carbolic acid – Lister dùng năm 1867) và **O-phenylphenol** **phá màng sinh chất chứa lipid** → **mất các thành phần tế bào chất**.\n- Phenolics vẫn hiệu quả khi có **chất hữu cơ**; dùng khử trùng bề mặt (Lysol). [mở rộng]\n- **Triclosan** (bisphenol): **ức chế enzyme tổng hợp lipid** của màng sinh chất; từng có trong xà phòng, kem đánh răng.\n- ⚠ ***Pseudomonas aeruginosa* kháng triclosan**."},{"h":"2. Chlorhexidine và tinh dầu (slide 31–32)","body":"- **Chlorhexidine** (biguanide): **can thiệp cấu trúc màng**. Dùng rửa tay phẫu thuật, nước súc miệng, sát khuẩn da.\n- **Essential oils (tinh dầu)**: **hỗn hợp hydrocarbon chiết từ thực vật** – bạc hà, thông, cam, tràm (cajeput)…\n  - Tác dụng kháng khuẩn chủ yếu nhờ **phenolics (carvacrol)** và **terpenes (limonene)**."},{"h":"3. Halogens: iodine và chlorine (slide 33–34)","body":"**Iodine (I₂)**:\n- **Làm suy yếu tổng hợp protein** và **thay đổi màng tế bào** – có lẽ bằng cách tạo **phức với amino acid và acid béo không no**.\n- Chế phẩm thương mại phổ biến **Betadine®** là **povidone-iodine**: **iodophor** = iodine + phân tử hữu cơ (polymer **N-vinylpyrrolidone**) giải phóng iodine **từ từ**, **cải thiện khả năng thấm ướt** và là **nguồn dự trữ iodine tự do**.\n- Dùng chủ yếu **sát khuẩn da và điều trị vết thương**.\n\n**Chlorine (Cl₂)**:\n- Trong nước tạo **acid hypochlorous (HOCl)** – **chất oxy hóa mạnh** → **phá hủy hệ thống enzyme** của tế bào.\n- Dùng xử lý nước uống, bể bơi, nước Javel (NaOCl) khử trùng bề mặt. Hiệu quả giảm khi có chất hữu cơ và pH cao. [mở rộng]"},{"h":"4. Cồn – alcohols (slide 34)","body":"- **Ethanol, isopropanol**.\n- **Diệt vi khuẩn (và nấm)** nhưng **không diệt nội bào tử** (và **virus không vỏ**).\n- Cơ chế: **biến tính protein (cần nước)**, **đục thủng màng sinh chất** và **hòa tan lipid màng**.\n- Nồng độ tối ưu **60–90 %** (thường 70 %). [mở rộng]\n- Ưu điểm: bay hơi nhanh, không để lại cặn. Nhược: không diệt bào tử, hiệu quả kém khi có nhiều chất hữu cơ."},{"h":"5. Kim loại nặng – heavy metals (slide 35–36)","body":"- **Ag, Hg, Cu** và hợp chất của chúng.\n- **Ion kim loại nặng tương tác với nhóm sulfhydryl (–SH) của protein** → **biến tính protein**.\n- Hiệu ứng **oligodynamic**: lượng rất nhỏ cũng có tác dụng. Ứng dụng: bạc nitrat nhỏ mắt trẻ sơ sinh (trước đây), băng gạc chứa bạc, CuSO₄ diệt tảo trong bể nước. [mở rộng]"},{"h":"6. Bảng tóm tắt","body":"| Tác nhân | Đích chính | Ghi nhớ |\n|---|---|---|\n| Phenol, O-phenylphenol | **màng** chứa lipid | Lister |\n| Triclosan | **enzyme tổng hợp lipid** | *P. aeruginosa* kháng |\n| Chlorhexidine | **màng** | súc miệng, rửa tay mổ |\n| Tinh dầu | carvacrol (phenolic), limonene (terpene) | tự nhiên |\n| Iodine / povidone-iodine | **tổng hợp protein + màng** (phức với aa, acid béo không no) | Betadine – da, vết thương |\n| Chlorine (HOCl) | **oxy hóa** hệ enzyme | nước uống |\n| Cồn | **biến tính protein (cần nước)** + hòa tan lipid màng | không diệt bào tử |\n| Ag, Hg, Cu | nhóm **–SH** của protein | oligodynamic |"}],"extension":[{"h":"Thực tế: dung dịch rửa tay khô","body":"WHO khuyến nghị dung dịch rửa tay chứa **ethanol ~80 %** hoặc **isopropanol ~75 %** – đủ nước để biến tính protein. Rửa tay khô **không** diệt được bào tử *Clostridioides difficile* và kém với norovirus (virus không vỏ) → khi chăm bệnh nhân tiêu chảy phải rửa tay bằng **xà phòng và nước** (loại bỏ cơ học)."},{"h":"Kháng hóa chất","body":"Triclosan bị FDA hạn chế trong xà phòng (2016) vì lo ngại **chọn lọc vi khuẩn kháng** và thiếu lợi ích so với xà phòng thường. Đây là ví dụ vì sao \"diệt khuẩn 99,9 %\" không phải lúc nào cũng tốt."}],"keyCards":[{"title":"Phenolics and chlorhexidine","bodyEn":"**Phenol** and **O-phenylphenol** damage the lipid-containing plasma membrane → loss of cytoplasmic contents. **Triclosan** inhibits a **lipid-synthesis enzyme**; ***Pseudomonas aeruginosa* is resistant**. **Chlorhexidine** interferes with membrane structure. **Essential oils** act through **phenolics (carvacrol)** and **terpenes (limonene)**.","glossVi":"Phenol phá màng; triclosan chặn tổng hợp lipid."},{"title":"Halogens","bodyEn":"**Iodine** impairs protein synthesis and alters membranes (complexes with amino acids and unsaturated fatty acids). **Betadine = povidone-iodine**, an **iodophor** releasing iodine slowly; used for skin and wounds. **Chlorine** forms **HOCl**, a strong oxidizer that damages enzyme systems.","glossVi":"Iodophor giải phóng iodine từ từ; HOCl oxy hóa."},{"title":"Alcohols and heavy metals","bodyEn":"**Ethanol, isopropanol** kill bacteria and fungi but **not endospores** (or non-enveloped viruses); they **denature proteins (requires water)** and dissolve membrane lipids. **Heavy metals (Ag, Hg, Cu)** bind **sulfhydryl (–SH) groups** → protein denaturation.","glossVi":"Cồn cần nước; kim loại nặng gắn –SH."}],"traps":["Alcohol kills endospores","Triclosan works on Pseudomonas aeruginosa","Pure alcohol works better than 70%","Iodophors release iodine all at once"]},{"id":"CTL-05","title":"Chemical agents II: surfactants, preservatives, food antibiotics, aldehydes, peroxygens; culture preservation","priority":"H","difficulty":2,"minutes":25,"source":"4.The Control of Microbial Growth.pptx: slides 37–44","prereq":[],"hookVi":"Nhãn phô mai ghi **E234 (nisin)** và **E235 (natamycin)**; xúc xích ghi **nitrite**; nước ngọt ghi **natri benzoat**. Đây đều là chất chống vi sinh vật trong thực phẩm – nhưng mỗi chất nhắm một nhóm khác nhau. Và cùng lúc đó, phòng thí nghiệm lại muốn **giữ cho vi khuẩn sống** hàng chục năm để làm giống – bằng **glycerol và −80 °C**.","predictQuestion":{"stem":"Nisin is added to cheese mainly to:","options":["kill molds on the surface","inhibit certain endospore-forming spoilage bacteria","give color","increase fermentation"],"answer":1,"explanation":"Slide 39: **nisin** – một **bacteriocin** – ức chế **vi khuẩn tạo nội bào tử gây hỏng**. **Natamycin** mới là kháng nấm."},"lesson":[{"h":"1. Chất hoạt động bề mặt – surfactants (slide 37)","body":"- **Surface-active agents (surfactants)**: **giảm sức căng bề mặt** giữa các phân tử chất lỏng.\n- **Xà phòng và chất tẩy rửa (soaps and detergents)**: vai trò quan trọng là **loại bỏ cơ học vi sinh vật khi chà rửa (scrubbing)** – không nhất thiết giết.\n- **Hợp chất amoni bậc bốn (quaternary ammonium compounds – quats)**, vd benzalkonium chloride:\n  - khả năng làm sạch liên quan đến **phần tích điện dương (cation)** của phân tử;\n  - **diệt khuẩn mạnh với Gram dương**, **kém hơn với Gram âm**;\n  - **thay đổi tính thấm** của tế bào → **mất thành phần thiết yếu của tế bào chất**."},{"h":"2. Chất bảo quản thực phẩm (slide 38)","body":"| Chất | Cơ chế / đích | Ghi chú |\n|---|---|---|\n| **Acid hữu cơ**: **sorbic acid, benzoic acid** (ở **pH thấp**) | **ức chế trao đổi chất** của tế bào vi khuẩn; acid hữu cơ thường ức chế trao đổi chất của **nấm sợi** | nước ngọt, mứt, bánh; calcium propionate trong bánh mì [mở rộng] |\n| **Nitrate / nitrite** | **ức chế enzyme chứa sắt của vi khuẩn kỵ khí** | xúc xích, thịt nguội – chống *C. botulinum*; tạo màu hồng |"},{"h":"3. Kháng sinh trong thực phẩm (slide 39)","body":"- **Nisin**: thêm vào **phô mai** để **ức chế một số vi khuẩn tạo nội bào tử gây hỏng**.\n  - Là một **bacteriocin** – **protein do một vi khuẩn tạo ra để ức chế vi khuẩn khác** (từ *Lactococcus lactis*).\n  - Có sẵn lượng nhỏ trong nhiều sản phẩm sữa; **không vị, dễ tiêu hóa, không độc**.\n- **Natamycin (pimaricin)**: **kháng sinh kháng nấm** được phép dùng trong thực phẩm, chủ yếu **phô mai**."},{"h":"4. Aldehyde (slide 40–41)","body":"- **Formaldehyde** và **glutaraldehyde**: **bất hoạt protein** bằng cách tạo **liên kết chéo cộng hóa trị** với nhiều nhóm chức hữu cơ của protein (**–NH₂, –OH, –COOH, –SH**).\n- **Khí formaldehyde** là chất khử trùng tuyệt vời.\n- **Formalin** = dung dịch **37 %** khí formaldehyde trong nước: **bảo quản mẫu sinh học**, **bất hoạt vi khuẩn và virus trong vaccine**.\n- **Glutaraldehyde**:\n  - **ít kích ứng** và **hiệu quả hơn** formaldehyde;\n  - khử trùng **dụng cụ bệnh viện**, gồm **ống nội soi** và thiết bị hô hấp;\n  - dung dịch **2 % (Cidex®)**: **diệt khuẩn, diệt lao, diệt virus trong 10 phút**; **diệt bào tử trong 3–10 giờ** → là một trong số ít **chất tiệt trùng hóa học (chemical sterilant)**."},{"h":"5. H₂O₂ và ghi chú chung (slide 42)","body":"- **Hydrogen peroxide (H₂O₂)**: **oxy hóa** thành phần tế bào (gốc tự do). Nhóm peroxygen còn có peracetic acid, ozone. [mở rộng]\n- Slide 42: các tác nhân vật lý và hóa học trên **tác động lên tế bào của các vi sinh vật khác** (nấm, virus…) **theo cơ chế tương tự**."},{"h":"6. Bảo quản tế bào vi khuẩn – giống (slide 43–44)","body":"| Thời hạn | Phương pháp | Chi tiết |\n|---|---|---|\n| **Ngắn hạn** | **4 °C** | trong thời gian ngắn (cấy chuyển định kỳ) |\n| **Dài hạn** | **Đông lạnh sâu (deep freezing)** | huyền phù vi khuẩn + **glycerol 10–30 %** → **đông nhanh ở −70 °C → −95 °C**; cấy chuyển lại sau **vài năm** |\n| **Dài hạn** | **Đông khô (freeze-drying)** | vi khuẩn trong môi trường bảo vệ (**sữa gầy/emulsion, huyết thanh, hoặc natri glutamate**) → cho vào ống/capsule → **làm lạnh nhanh (−54 °C → −72 °C)** → **tách nước bằng máy hút chân không** → **hàn kín** → bảo quản tủ lạnh (**≥ 10 năm**) |\n\n- **Glycerol** là **chất bảo vệ lạnh (cryoprotectant)**: giảm tinh thể đá làm rách màng."}],"extension":[{"h":"Đọc nhãn thực phẩm","body":"- **E200 sorbic acid, E211 sodium benzoate** – nước ngọt, tương ớt, mứt (chống nấm men, mốc ở pH thấp).\n- **E250 sodium nitrite** – lạp xưởng, xúc xích, jambon (chống *C. botulinum*, giữ màu hồng). Giới hạn liều vì nitrite có thể tạo nitrosamine.\n- **E234 nisin, E235 natamycin** – phô mai, sữa chua."},{"h":"Ngân hàng giống vi sinh","body":"Các bộ sưu tập giống như **ATCC** (Mỹ), **VTCC** (Việt Nam – ĐHQG Hà Nội) bảo quản hàng chục nghìn chủng bằng **đông khô** và **nitơ lỏng (−196 °C)**. Trong lab, bạn sẽ bảo quản chủng bằng ống **glycerol stock ở −80 °C**."}],"keyCards":[{"title":"Surfactants","bodyEn":"Surfactants lower surface tension. **Soaps and detergents** remove microbes mechanically by **scrubbing**. **Quats** (cationic) are strongly bactericidal against **Gram-positive** bacteria, less against **Gram-negative**; they change permeability and cause loss of cytoplasmic constituents.","glossVi":"Quats mạnh với Gram dương."},{"title":"Food preservatives and antibiotics","bodyEn":"**Sorbic** and **benzoic acid** (at low pH) inhibit metabolism (especially of molds). **Nitrates/nitrites** inhibit **iron-containing enzymes of anaerobes**. **Nisin**: a **bacteriocin** added to cheese against **endospore-forming** spoilage bacteria; tasteless, digestible, nontoxic. **Natamycin (pimaricin)**: **antifungal** for cheese.","glossVi":"Nisin chống vi khuẩn bào tử; natamycin chống nấm."},{"title":"Aldehydes and H₂O₂","bodyEn":"**Formaldehyde** and **glutaraldehyde** inactivate proteins by **covalent cross-links** with –NH₂, –OH, –COOH, –SH. **Formalin** = 37 % formaldehyde (specimens, vaccines). **2 % glutaraldehyde (Cidex)**: bactericidal, tuberculocidal, virucidal in **10 min**, **sporicidal in 3–10 h**. **H₂O₂** acts by oxidation.","glossVi":"Aldehyde tạo liên kết chéo; Cidex diệt bào tử 3–10 h."},{"title":"Culture preservation","bodyEn":"Short term: **4 °C**. Long term: **deep freezing** with **10–30 % glycerol** at **−70 to −95 °C** (subculture after several years); **freeze-drying** (−54 to −72 °C, vacuum, sealed; **≥ 10 years**).","glossVi":"Glycerol + −80 °C; đông khô ≥ 10 năm."}],"traps":["Quats are best against Gram-negatives","Nisin is antifungal","Glutaraldehyde kills spores in 10 minutes","Soaps always kill bacteria"]},{"id":"GRO-01","title":"Physical requirements: temperature, pH and osmotic pressure","priority":"H","difficulty":2,"minutes":20,"source":"5.Microbial Growth.pptx: slides 1–10","prereq":[],"hookVi":"Tủ lạnh 4 °C giữ thịt tươi được vài ngày chứ **không mãi mãi** – vì có những vi khuẩn **ưa lạnh/chịu lạnh** vẫn mọc chậm ở nhiệt độ này và làm thịt hỏng. Ngược lại, suối nước nóng 80 °C vẫn đầy sự sống. Mỗi vi sinh vật có **nhiệt độ tối thiểu, tối ưu và tối đa** riêng, cùng với khoảng **pH** và **nồng độ muối** chịu được.","predictQuestion":{"stem":"Food kept in a refrigerator (4 °C) eventually spoils mainly because of:","options":["thermophiles","psychrotrophs that can grow slowly at low temperatures","hyperthermophiles","obligate anaerobes only"],"answer":1,"explanation":"**Psychrotrophs** (và psychrophiles) vẫn sinh trưởng chậm ở 0–7 °C → nguyên nhân chính làm hỏng thực phẩm bảo quản lạnh."},"lesson":[{"h":"1. Nhiệt độ (slide 3–4)","body":"Mỗi loài có 3 **nhiệt độ cơ bản**: **tối thiểu** (thấp nhất còn mọc), **tối ưu** (mọc nhanh nhất), **tối đa** (cao nhất còn mọc). Tối ưu thường **gần tối đa** hơn – trên tối ưu một chút, tốc độ rơi rất nhanh vì enzyme biến tính.\n\n| Nhóm | Tên | Kh
