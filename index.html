ls.","example":"The yeast zygote is diploid.","aliases":[]},{"unit":"FUN-02","term":"meiosis","vi":"giảm phân","def":"Division that halves the chromosome number, producing haploid cells.","example":"Meiosis forms four ascospores.","aliases":[]},{"unit":"FUN-02","term":"mitosis","vi":"nguyên phân","def":"Nuclear division that keeps the chromosome number.","example":"Budding involves mitosis.","aliases":[]},{"unit":"FUN-02","term":"ascus","vi":"túi bào tử (nang)","def":"A sac in which ascospores form.","example":"Each ascus holds four yeast ascospores.","aliases":["asci"]},{"unit":"FUN-02","term":"ascospore","vi":"bào tử túi (bào tử nang)","def":"A sexual spore formed inside an ascus.","example":"Ascospores are haploid.","aliases":["ascospores"]},{"unit":"FUN-02","term":"haploid","vi":"đơn bội","def":"Having one set of chromosomes (n).","example":"Haploid yeast has 16 chromosomes.","aliases":["diploid"]},{"unit":"FUN-02","term":"pseudohyphae","vi":"giả sợi","def":"Chains of elongated buds that remain attached.","example":"Candida albicans forms pseudohyphae.","aliases":["pseudohypha"]},{"unit":"FUN-03","term":"counting chamber","vi":"buồng đếm (hồng cầu)","def":"A slide with a grid of known area and depth for direct cell counts.","example":"A counting chamber gives results in minutes.","aliases":["hemocytometer","haemocytometer","Neubauer chamber"]},{"unit":"FUN-03","term":"plate count","vi":"phương pháp đếm khuẩn lạc trên đĩa","def":"Counting colonies from diluted samples to estimate viable cells.","example":"The plate count takes two days.","aliases":["plate counts"]},{"unit":"FUN-03","term":"CFU","vi":"đơn vị hình thành khuẩn lạc","def":"Colony-forming unit: a cell or clump that forms one colony.","example":"Results are reported as CFU/mL.","aliases":["colony-forming unit","colony-forming units"]},{"unit":"FUN-03","term":"methylene blue","vi":"xanh methylene","def":"A dye reduced (decolorized) by live yeast; dead cells stay blue.","example":"Dead cells stain with methylene blue.","aliases":[]},{"unit":"FUN-03","term":"viable","vi":"còn sống (có khả năng sinh trưởng)","def":"Able to grow and reproduce.","example":"Only viable cells form colonies.","aliases":["viability"]},{"unit":"FUN-03","term":"dilution factor","vi":"hệ số pha loãng","def":"How many times a sample was diluted (D = 1/d).","example":"Multiply the count by the dilution factor.","aliases":["dilution"]},{"unit":"FUN-03","term":"basidiomycetes","vi":"nấm đảm","def":"Fungi producing basidiospores on basidia.","example":"Cryptococcus is a basidiomycete yeast.","aliases":["Basidiomycota"]},{"unit":"FUN-03","term":"ascomycetes","vi":"nấm túi (nấm nang)","def":"Fungi producing ascospores in asci.","example":"Saccharomyces is an ascomycete.","aliases":["Ascomycota"]},{"unit":"FUN-04","term":"mold","vi":"nấm mốc (nấm sợi)","def":"A multicellular fungus growing as hyphae.","example":"Penicillium is a mold.","aliases":["molds","mould","filamentous fungi"]},{"unit":"FUN-04","term":"hyphae","vi":"sợi nấm","def":"Long tubular filaments of a mold with chitin walls.","example":"Hyphae grow at their tips.","aliases":["hypha"]},{"unit":"FUN-04","term":"septa","vi":"vách ngăn (sợi nấm)","def":"Cross-walls in hyphae.","example":"Aspergillus hyphae have septa.","aliases":["septum","septate","septate hyphae"]},{"unit":"FUN-04","term":"coenocytic","vi":"cộng bào (không vách ngăn)","def":"Hyphae without septa, containing many nuclei.","example":"Rhizopus has coenocytic hyphae.","aliases":["coenocytic hyphae"]},{"unit":"FUN-04","term":"mycelium","vi":"hệ sợi (khuẩn ty)","def":"The mass of intertwined hyphae.","example":"The mycelium spreads through bread.","aliases":["mycelia"]},{"unit":"FUN-04","term":"vegetative hypha","vi":"sợi dinh dưỡng (sợi cơ chất)","def":"The part of a hypha that obtains nutrients.","example":"Vegetative hyphae penetrate the substrate.","aliases":["vegetative hyphae"]},{"unit":"FUN-04","term":"aerial hypha","vi":"sợi khí sinh","def":"A hypha projecting above the medium, often bearing spores.","example":"Aerial hyphae carry sporangia.","aliases":["aerial hyphae","reproductive hypha"]},{"unit":"FUN-05","term":"spore","vi":"bào tử","def":"A reproductive cell of fungi (asexual or sexual).","example":"Molds spread by spores.","aliases":["spores"]},{"unit":"FUN-05","term":"sporangiospore","vi":"bào tử túi (bào tử kín)","def":"Asexual spore formed inside a sporangium.","example":"Rhizopus releases sporangiospores.","aliases":["sporangiospores"]},{"unit":"FUN-05","term":"sporangium","vi":"túi bào tử","def":"A sac at the tip of a sporangiophore containing sporangiospores.","example":"The black dots on bread are sporangia.","aliases":["sporangia","sporangiophore"]},{"unit":"FUN-05","term":"conidiospore","vi":"bào tử đính (bào tử trần)","def":"Asexual spore not enclosed in a sac.","example":"Penicillium forms chains of conidiospores.","aliases":["conidia","conidium","conidiospores","conidiophore"]},{"unit":"FUN-05","term":"zoospore","vi":"bào tử động","def":"A motile asexual spore with flagella.","example":"Allomyces produces zoospores.","aliases":["zoospores"]},{"unit":"FUN-05","term":"plasmogamy","vi":"chất giao (hợp nhất tế bào chất)","def":"Entry of a haploid donor nucleus into the cytoplasm of a recipient cell.","example":"Plasmogamy precedes karyogamy.","aliases":[]},{"unit":"FUN-05","term":"karyogamy","vi":"nhân giao (hợp nhân)","def":"Fusion of two haploid nuclei into a diploid nucleus.","example":"Karyogamy forms a zygote nucleus.","aliases":[]},{"unit":"FUN-05","term":"zygospore","vi":"bào tử tiếp hợp","def":"Thick-walled sexual spore formed by fusion of two hyphal tips (Zygomycota).","example":"Rhizopus forms zygospores.","aliases":["zygospores","Zygomycota","zygomycetes"]},{"unit":"FUN-05","term":"basidiospore","vi":"bào tử đảm","def":"Sexual spore formed externally on a basidium.","example":"A mushroom gill releases basidiospores.","aliases":["basidiospores"]},{"unit":"FUN-05","term":"basidium","vi":"đảm","def":"Club-shaped cell bearing basidiospores.","example":"Each basidium bears four spores.","aliases":["basidia"]},{"unit":"FUN-05","term":"basidiocarp","vi":"quả thể nấm đảm","def":"The fruiting body (mushroom) of a basidiomycete.","example":"The basidiocarp has gills.","aliases":["gill","gills"]},{"unit":"FUN-06","term":"lichen","vi":"địa y","def":"A symbiosis of a fungus with a green alga or cyanobacterium.","example":"Lichens indicate clean air.","aliases":["lichens"]},{"unit":"FUN-06","term":"crustose","vi":"địa y dạng vỏ","def":"A flat, crustlike lichen tightly attached to the surface.","example":"Crustose lichens grow on rocks.","aliases":["foliose","fruticose"]},{"unit":"FUN-06","term":"symbiosis","vi":"cộng sinh","def":"A close relationship between two different organisms.","example":"A lichen is a symbiosis.","aliases":[]},{"unit":"FUN-06","term":"biomass","vi":"sinh khối","def":"The mass of living cells.","example":"Mold biomass is measured as dry weight.","aliases":[]},{"unit":"FUN-06","term":"dry weight","vi":"khối lượng khô","def":"Mass of cells after drying to constant weight.","example":"Dry weight is used for molds.","aliases":["dry cell weight"]},{"unit":"CTL-01","term":"sterilization","vi":"tiệt trùng","def":"Killing all microorganisms, including endospores.","example":"Autoclaving is a sterilization method.","aliases":["sterilize","sterile"]},{"unit":"CTL-01","term":"disinfection","vi":"khử trùng","def":"Killing pathogenic vegetative microbes on inanimate objects.","example":"Bleach is used for disinfection.","aliases":["disinfectant","disinfect"]},{"unit":"CTL-01","term":"antisepsis","vi":"sát khuẩn","def":"Disinfection of living tissue; the agent is an antiseptic.","example":"Iodine is used for antisepsis of skin.","aliases":["antiseptic"]},{"unit":"CTL-01","term":"bactericidal","vi":"diệt khuẩn","def":"Killing bacteria (-cide).","example":"Alcohol is bactericidal.","aliases":["bactericide","germicide"]},{"unit":"CTL-01","term":"bacteriostatic","vi":"kìm khuẩn","def":"Inhibiting bacterial growth without killing (-static).","example":"Refrigeration is bacteriostatic.","aliases":["bacteriostasis"]},{"unit":"CTL-01","term":"D-value","vi":"giá trị D (thời gian giảm thập phân)","def":"Time at a given temperature to kill 90% of a population.","example":"The D-value of spores is longer than that of vegetative cells.","aliases":["decimal reduction time","D value"]},{"unit":"CTL-01","term":"microbial death rate","vi":"tốc độ chết của vi sinh vật","def":"The constant fraction of a population killed per unit time.","example":"The microbial death rate appears as a straight line on a log plot.","aliases":["death curve"]},{"unit":"CTL-01","term":"12D","vi":"quy tắc 12D","def":"A heat process giving 12 log reductions of C. botulinum spores.","example":"Low-acid canned foods receive a 12D process.","aliases":[]},{"unit":"CTL-01","term":"time of exposure","vi":"thời gian tiếp xúc","def":"How long microbes are exposed to a control agent.","example":"Lower temperatures need a longer time of exposure.","aliases":[]},{"unit":"CTL-02","term":"moist heat","vi":"nhiệt ẩm","def":"Heat with water or steam; kills by coagulating proteins.","example":"Autoclaving uses moist heat.","aliases":[]},{"unit":"CTL-02","term":"autoclave","vi":"nồi hấp áp lực (autoclave)","def":"A device using steam under pressure at 121 °C to sterilize.","example":"Media are sterilized in an autoclave.","aliases":["autoclaving"]},{"unit":"CTL-02","term":"boiling","vi":"đun sôi","def":"Heating in water at 100 °C; not reliable against endospores.","example":"Boiling kills most vegetative cells.","aliases":[]},{"unit":"CTL-02","term":"HTST","vi":"thanh trùng nhiệt độ cao thời gian ngắn","def":"High temperature short time pasteurization: 72 °C for 15 s.","example":"Most milk is HTST pasteurized.","aliases":["UHT","ultra-high temperature"]},{"unit":"CTL-02","term":"dry heat","vi":"nhiệt khô","def":"Heat without moisture; kills by oxidation.","example":"Glassware is sterilized with dry heat.","aliases":["hot-air sterilization"]},{"unit":"CTL-02","term":"incineration","vi":"thiêu đốt","def":"Burning to sterilize and dispose of contaminated materials.","example":"Used dressings are destroyed by incineration.","aliases":[]},{"unit":"CTL-02","term":"direct flaming","vi":"hơ lửa trực tiếp","def":"Heating an object in a flame until red hot.","example":"Inoculating loops are sterilized by direct flaming.","aliases":[]},{"unit":"CTL-02","term":"inoculating loop","vi":"que cấy vòng","def":"A wire loop used to transfer microbes.","example":"Flame the inoculating loop before use.","aliases":[]},{"unit":"CTL-02","term":"coagulate","vi":"đông tụ","def":"To denature and clump proteins.","example":"Moist heat coagulates bacterial proteins.","aliases":["coagulation"]},{"unit":"CTL-03","term":"filtration","vi":"lọc","def":"Passing a liquid or gas through a material with pores small enough to retain microbes.","example":"Vaccines are sterilized by filtration.","aliases":["membrane filter","filter"]},{"unit":"CTL-03","term":"HEPA filter","vi":"màng lọc HEPA","def":"High-efficiency particulate air filter that removes microbes from air.","example":"Biosafety cabinets use HEPA filters.","aliases":["HEPA"]},{"unit":"CTL-03","term":"desiccation","vi":"làm khô","def":"Removal of water; inhibits growth but may not kill.","example":"Desiccation keeps bacteria dormant.","aliases":[]},{"unit":"CTL-03","term":"lyophilization","vi":"đông khô","def":"Freeze-drying: rapid freezing followed by removal of water under vacuum.","example":"Cultures are preserved by lyophilization.","aliases":["freeze-drying"]},{"unit":"CTL-03","term":"osmotic pressure","vi":"áp suất thẩm thấu","def":"The force drawing water across a membrane toward higher solute.","example":"High osmotic pressure preserves jam.","aliases":[]},{"unit":"CTL-03","term":"ionizing radiation","vi":"bức xạ ion hóa","def":"Gamma rays, X-rays, electron beams (λ < 1 nm) that ionize water.","example":"Ionizing radiation sterilizes medical devices.","aliases":["gamma rays","electron beams"]},{"unit":"CTL-03","term":"nonionizing radiation","vi":"bức xạ không ion hóa","def":"Radiation with λ > 1 nm such as UV; poor penetration.","example":"UV is nonionizing radiation.","aliases":[]},{"unit":"CTL-03","term":"UV","vi":"tia cực tím","def":"Ultraviolet light; at 260 nm it forms thymine dimers in DNA.","example":"UV lamps disinfect biosafety cabinets.","aliases":["ultraviolet"]},{"unit":"CTL-03","term":"thymine dimer","vi":"dimer thymine","def":"A covalent bond between adjacent thymines caused by UV.","example":"Thymine dimers block DNA replication.","aliases":["thymine dimers"]},{"unit":"CTL-03","term":"free radical","vi":"gốc tự do","def":"A highly reactive molecule with an unpaired electron.","example":"Radiation creates free radicals from water.","aliases":["free radicals","hydroxyl radical"]},{"unit":"CTL-04","term":"phenol","vi":"phenol (acid carbolic)","def":"A disinfectant that damages lipid-containing membranes.","example":"Lister used phenol in surgery.","aliases":["phenolics","O-phenylphenol","carbolic acid"]},{"unit":"CTL-04","term":"triclosan","vi":"triclosan","def":"A bisphenol that inhibits lipid synthesis; P. aeruginosa is resistant.","example":"Triclosan was added to soaps.","aliases":[]},{"unit":"CTL-04","term":"chlorhexidine","vi":"chlorhexidine","def":"An antiseptic that interferes with membrane structure.","example":"Chlorhexidine is used in mouthwash.","aliases":[]},{"unit":"CTL-04","term":"essential oils","vi":"tinh dầu","def":"Plant hydrocarbon mixtures with phenolics and terpenes.","example":"Essential oils contain carvacrol.","aliases":["carvacrol","limonene"]},{"unit":"CTL-04","term":"iodophor","vi":"iodophor","def":"A complex of iodine with an organic carrier that releases iodine slowly.","example":"Betadine is an iodophor.","aliases":["povidone-iodine","Betadine"]},{"unit":"CTL-04","term":"iodine","vi":"iodine","def":"A halogen that impairs protein synthesis and alters membranes.","example":"Iodine is used on skin.","aliases":[]},{"unit":"CTL-04","term":"chlorine","vi":"chlorine","def":"A halogen that forms HOCl in water.","example":"Chlorine disinfects drinking water.","aliases":[]},{"unit":"CTL-04","term":"hypochlorous acid","vi":"acid hypochlorous (HOCl)","def":"A strong oxidizing agent formed from chlorine in water.","example":"HOCl damages enzymes.","aliases":["HOCl"]},{"unit":"CTL-04","term":"alcohol","vi":"cồn","def":"Ethanol or isopropanol; denatures proteins (requires water) and dissolves lipids.","example":"70% alcohol is used on skin.","aliases":["alcohols","ethanol","isopropanol"]},{"unit":"CTL-04","term":"heavy metals","vi":"kim loại nặng","def":"Ag, Hg, Cu and compounds that bind protein –SH groups.","example":"Silver is a heavy metal antimicrobial.","aliases":["heavy metal"]},{"unit":"CTL-04","term":"sulfhydryl group","vi":"nhóm sulfhydryl (–SH)","def":"A –SH group of proteins targeted by heavy metals.","example":"Mercury binds sulfhydryl groups.","aliases":["sulfhydryl","–SH"]},{"unit":"CTL-05","term":"surfactant","vi":"chất hoạt động bề mặt","def":"A surface-active agent that lowers surface tension.","example":"Soaps are surfactants.","aliases":["surfactants","surface-active agents","detergent","soaps"]},{"unit":"CTL-05","term":"quats","vi":"hợp chất amoni bậc bốn","def":"Quaternary ammonium compounds; cationic surfactants effective against Gram-positives.","example":"Benzalkonium chloride is one of the quats.","aliases":["quaternary ammonium compounds","quat"]},{"unit":"CTL-05","term":"food preservatives","vi":"chất bảo quản thực phẩm","def":"Chemicals such as sorbic acid, benzoic acid and nitrite that inhibit spoilage.","example":"Benzoic acid is a common food preservative.","aliases":["sorbic acid","benzoic acid","preservative"]},{"unit":"CTL-05","term":"nitrite","vi":"nitrite","def":"A preservative inhibiting iron-containing enzymes of anaerobes.","example":"Nitrite prevents botulism in ham.","aliases":["nitrites","nitrate","nitrates"]},{"unit":"CTL-05","term":"bacteriocin","vi":"bacteriocin","def":"A protein made by one bacterium that inhibits another.","example":"Nisin is a bacteriocin.","aliases":["bacteriocins"]},{"unit":"CTL-05","term":"nisin","vi":"nisin","def":"A bacteriocin added to cheese to inhibit endospore-forming bacteria.","example":"Nisin is nontoxic.","aliases":[]},{"unit":"CTL-05","term":"natamycin","vi":"natamycin (pimaricin)","def":"An antifungal antibiotic approved for foods, mainly cheese.","example":"Natamycin prevents mold on cheese.","aliases":["pimaricin"]},{"unit":"CTL-05","term":"aldehyde","vi":"aldehyde","def":"Formaldehyde or glutaraldehyde; inactivates proteins by cross-linking.","example":"Aldehydes are chemical sterilants.","aliases":["aldehydes","formaldehyde"]},{"unit":"CTL-05","term":"glutaraldehyde","vi":"glutaraldehyde","def":"A less irritating aldehyde; 2% Cidex kills spores in 3–10 h.","example":"Endoscopes are disinfected with glutaraldehyde.","aliases":["Cidex"]},{"unit":"CTL-05","term":"formalin","vi":"formalin","def":"A 37% aqueous solution of formaldehyde.","example":"Specimens are preserved in formalin.","aliases":[]},{"unit":"CTL-05","term":"hydrogen peroxide","vi":"hydrogen peroxide (H2O2)","def":"An oxidizing antimicrobial agent.","example":"Hydrogen peroxide acts by oxidation.","aliases":["H2O2","peroxygen"]},{"unit":"CTL-05","term":"glycerol","vi":"glycerol","def":"A cryoprotectant used at 10–30% for deep freezing cultures.","example":"Store stocks in glycerol at −80 °C.","aliases":["cryoprotectant"]},{"unit":"CTL-05","term":"deep freezing","vi":"đông lạnh sâu","def":"Storing cultures at −70 to −95 °C with glycerol.","example":"Deep freezing keeps strains for years.","aliases":[]},{"unit":"GRO-01","term":"psychrophile","vi":"vi sinh vật ưa lạnh","def":"An organism growing best at low temperatures (about 15 °C).","example":"Psychrophiles live in polar seas.","aliases":["psychrophiles"]},{"unit":"GRO-01","term":"psychrotroph","vi":"vi sinh vật chịu lạnh","def":"An organism that grows at 0–7 °C but has a higher optimum; spoils refrigerated food.","example":"Listeria is a psychrotroph.","aliases":["psychrotrophs"]},{"unit":"GRO-01","term":"mesophile","vi":"vi sinh vật ưa ấm","def":"An organism growing best at moderate temperatures (25–40 °C).","example":"Most pathogens are mesophiles.","aliases":["mesophiles"]},{"unit":"GRO-01","term":"thermophile","vi":"vi sinh vật ưa nhiệt","def":"An organism growing best at 50–60 °C.","example":"Thermophiles thrive in compost.","aliases":["thermophiles"]},{"unit":"GRO-01","term":"optimum growth temperature","vi":"nhiệt độ sinh trưởng tối ưu","def":"The temperature at which a species grows fastest.","example":"The optimum growth temperature of E. coli is 37 °C.","aliases":["minimum growth temperature","maximum growth temperature"]},{"unit":"GRO-01","term":"pH","vi":"pH","def":"A measure of acidity; most bacteria prefer 6.5–7.5.","example":"Molds tolerate low pH.","aliases":[]},{"unit":"GRO-01","term":"buffer","vi":"chất đệm","def":"A substance that resists changes in pH.","example":"Phosphate salts act as a buffer.","aliases":["buffers"]},{"unit":"GRO-01","term":"facultative halophile","vi":"vi sinh vật ưa mặn tùy nghi","def":"Does not require salt but tolerates up to 2% (some 15%).","example":"Staphylococcus aureus is a facultative halophile.","aliases":["facultative halophiles"]},{"unit":"GRO-02","term":"chemoheterotroph","vi":"hóa dị dưỡng","def":"Uses organic compounds for energy and carbon.","example":"E. coli is a chemoheterotroph.","aliases":["chemoheterotrophs"]},{"unit":"GRO-02","term":"chemoautotroph","vi":"hóa tự dưỡng","def":"Uses inorganic chemicals for energy and CO2 for carbon.","example":"Nitrifying bacteria are chemoautotrophs.","aliases":["chemoautotrophs"]},{"unit":"GRO-02","term":"photoautotroph","vi":"quang tự dưỡng","def":"Uses light for energy and CO2 for carbon.","example":"Cyanobacteria are photoautotrophs.","aliases":["photoautotrophs"]},{"unit":"GRO-02","term":"nitrogen fixation","vi":"cố định đạm","def":"Conversion of atmospheric N2 into usable nitrogen compounds.","example":"Rhizobium performs nitrogen fixation in legume roots.","aliases":[]},{"unit":"GRO-02","term":"trace elements","vi":"nguyên tố vi lượng","def":"Elements needed in tiny amounts, e.g., Fe, Cu, Mo, Zn.","example":"Trace elements are present in tap water.","aliases":["trace element"]},{"unit":"GRO-02","term":"cofactor","vi":"đồng yếu tố","def":"A non-protein helper required by some enzymes.","example":"Mg2+ is an enzyme cofactor.","aliases":["cofactors"]},{"unit":"GRO-02","term":"coenzyme","vi":"coenzyme","def":"An organic cofactor, often derived from a vitamin.","example":"NAD+ is a coenzyme.","aliases":["coenzymes"]},{"unit":"GRO-02","term":"organic growth factor","vi":"yếu tố sinh trưởng hữu cơ","def":"An essential organic compound an organism cannot synthesize.","example":"Vitamins are organic growth factors for some bacteria.","aliases":["organic growth factors","growth factor"]},{"unit":"GRO-03","term":"obligate aerobe","vi":"hiếu khí bắt buộc","def":"An organism that requires O2.","example":"Pseudomonas is an obligate aerobe.","aliases":["obligate aerobes"]},{"unit":"GRO-03","term":"obligate anaerobe","vi":"kỵ khí bắt buộc","def":"An organism that cannot use O2 and is harmed by it.","example":"Clostridium is an obligate anaerobe.","aliases":["obligate anaerobes"]},{"unit":"GRO-03","term":"aerotolerant anaerobe","vi":"kỵ khí chịu oxy","def":"Ferments, cannot use O2, but tolerates it.","example":"Lactobacillus is an aerotolerant anaerobe.","aliases":["aerotolerant anaerobes"]},{"unit":"GRO-03","term":"microaerophile","vi":"vi hiếu khí","def":"An aerobe requiring less O2 than air.","example":"Campylobacter is a microaerophile.","aliases":["microaerophiles"]},{"unit":"GRO-03","term":"superoxide","vi":"gốc superoxide","def":"The toxic radical O2•− formed during aerobic metabolism.","example":"Superoxide is neutralized by SOD.","aliases":["superoxide radical","superoxide radicals"]},{"unit":"GRO-03","term":"superoxide dismutase","vi":"superoxide dismutase (SOD)","def":"Enzyme converting superoxide to H2O2 and O2.","example":"All aerobes make superoxide dismutase.","aliases":["SOD"]},{"unit":"GRO-03","term":"catalase","vi":"catalase","def":"Enzyme converting H2O2 to water and O2.","example":"Staphylococcus is catalase-positive.","aliases":[]},{"unit":"GRO-03","term":"peroxidase","vi":"peroxidase","def":"Enzyme reducing H2O2 to water.","example":"Peroxidase removes hydrogen peroxide.","aliases":[]},{"unit":"GRO-03","term":"singlet oxygen","vi":"oxy đơn bội (singlet oxygen)","def":"O2 boosted to a higher-energy, very reactive state.","example":"Singlet oxygen damages cells.","aliases":[]},{"unit":"GRO-03","term":"anaerobic jar","vi":"bình kỵ khí","def":"A sealed container in which O2 is removed by H2 on a palladium catalyst.","example":"Clostridium is incubated in an anaerobic jar.","aliases":[]},{"unit":"GRO-04","term":"culture medium","vi":"môi trường nuôi cấy","def":"Nutrient material prepared for growing microbes in the lab.","example":"Nutrient agar is a culture medium.","aliases":["culture media","media","medium"]},{"unit":"GRO-04","term":"inoculum","vi":"giống cấy","def":"Microbes introduced into a medium to start growth.","example":"Add 1 mL of inoculum to the flask.","aliases":[]},{"unit":"GRO-04","term":"culture","vi":"canh trường (nuôi cấy)","def":"Microbes growing and multiplying in or on a medium.","example":"A pure culture contains one species.","aliases":["cultures"]},{"unit":"GRO-04","term":"agar","vi":"thạch (agar)","def":"A seaweed polysaccharide used to solidify media.","example":"Agar melts at about 100 °C.","aliases":["agar plate","slant","deep agar"]},{"unit":"GRO-04","term":"chemically defined medium","vi":"môi trường xác định hóa học","def":"A medium whose exact chemical composition is known.","example":"Glucose–salts medium is chemically defined.","aliases":[]},{"unit":"GRO-04","term":"complex medium","vi":"môi trường phức tạp","def":"A medium with extracts or digests of unknown exact composition.","example":"Nutrient broth is a complex medium.","aliases":["complex media","peptone","yeast extract"]},{"unit":"GRO-04","term":"reducing medium","vi":"môi trường khử","def":"A medium with sodium thioglycolate that removes dissolved O2.","example":"Anaerobes grow in reducing medium.","aliases":["reducing media","thioglycolate"]},{"unit":"GRO-04","term":"selective medium","vi":"môi trường chọn lọc","def":"A medium that suppresses unwanted microbes and favors desired ones.","example":"MacConkey is a selective medium.","aliases":["selective media"]},{"unit":"GRO-04","term":"differential medium","vi":"môi trường phân biệt","def":"A medium that makes colonies of different microbes look different.","example":"Blood agar is a differential medium.","aliases":["differential media"]},{"unit":"GRO-04","term":"enrichment medium","vi":"môi trường tăng sinh","def":"Usually liquid medium that increases small numbers of a desired microbe.","example":"Selenite broth is an enrichment medium.","aliases":["enrichment media","enrichment culture"]},{"unit":"GRO-04","term":"colony","vi":"khuẩn lạc","def":"A visible mass of cells arising from one cell, spore or clump.","example":"Pick one colony to start a pure culture.","aliases":["colonies"]},{"unit":"GRO-04","term":"streak plate","vi":"cấy ria (phương pháp)","def":"Spreading an inoculum over agar in zones to obtain isolated colonies.","example":"The streak plate gives isolated colonies.","aliases":["streak plate method"]},{"unit":"GRO-05","term":"generation time","vi":"thời gian thế hệ","def":"Time required for a cell to divide and the population to double.","example":"The generation time of E. coli can be 20 min.","aliases":["doubling time"]},{"unit":"GRO-05","term":"growth curve","vi":"đường cong sinh trưởng","def":"A plot of log cell number versus time in a batch culture.","example":"The growth curve has four phases.","aliases":[]},{"unit":"GRO-05","term":"batch culture","vi":"nuôi cấy mẻ (theo chu kỳ)","def":"Culture in a closed vessel without adding medium or removing products.","example":"A batch culture passes through lag, log, stationary and death phases.","aliases":[]},{"unit":"GRO-05","term":"lag phase","vi":"pha tiềm phát","def":"Phase with little cell division while cells adapt and make enzymes.","example":"The lag phase is short if the inoculum is young.","aliases":[]},{"unit":"GRO-05","term":"log phase","vi":"pha lũy thừa (log)","def":"Phase of constant exponential division.","example":"Cells in log phase are most sensitive to antibiotics.","aliases":["exponential phase","logarithmic phase"]},{"unit":"GRO-05","term":"stationary phase","vi":"pha cân bằng (ổn định)","def":"Phase in which new cells balance dying cells.","example":"Antibiotics are made in the stationary phase.","aliases":[]},{"unit":"GRO-05","term":"death phase","vi":"pha suy vong (chết)","def":"Phase in which deaths exceed new cells.","example":"Numbers fall logarithmically in the death phase.","aliases":["decline phase"]},{"unit":"GRO-05","term":"exponential growth","vi":"tăng trưởng lũy thừa","def":"Growth in which the population doubles every generation.","example":"Exponential growth gives a straight line on a log plot.","aliases":[]},{"unit":"GRO-06","term":"direct microscopic count","vi":"đếm trực tiếp dưới kính hiển vi","def":"Counting cells in a known volume with a counting chamber.","example":"The direct microscopic count includes dead cells.","aliases":[]},{"unit":"GRO-06","term":"Petroff-Hausser chamber","vi":"buồng đếm Petroff-Hausser","def":"Counting chamber for bacteria: 400 small squares, 1 mm², depth 0.02 mm.","example":"Bacteria are counted in a Petroff-Hausser chamber.","aliases":["Petroff-Hausser"]},{"unit":"GRO-06","term":"serial dilution","vi":"pha loãng liên tiếp","def":"Stepwise dilution of a sample, e.g., tenfold each step.","example":"Serial dilution gives countable plates.","aliases":["serial dilutions"]},{"unit":"GRO-06","term":"pour plate","vi":"đổ đĩa (cấy trộn)","def":"Mixing a sample with melted agar before it solidifies.","example":"Pour plates use 1 mL of sample.","aliases":["spread plate"]},{"unit":"GRO-06","term":"membrane filtration","vi":"lọc màng","def":"Collecting bacteria from a large volume on a membrane filter placed on agar.","example":"Drinking water is tested by membrane filtration.","aliases":[]},{"unit":"GRO-06","term":"MPN","vi":"số có khả năng nhất","def":"Most probable number: a statistical estimate from positive tubes in a dilution series.","example":"Coliforms are estimated by MPN.","aliases":["most probable number"]},{"unit":"GRO-07","term":"turbidity","vi":"độ đục","def":"Cloudiness of a culture caused by cells scattering light.","example":"Turbidity increases as bacteria grow.","aliases":[]},{"unit":"GRO-07","term":"spectrophotometer","vi":"máy quang phổ","def":"An instrument measuring light transmitted through a sample.","example":"OD is read on a spectrophotometer.","aliases":[]},{"unit":"GRO-07","term":"transmittance","vi":"độ truyền quang","def":"The percentage of light passing through a sample (%T).","example":"Higher cell density lowers transmittance.","aliases":["% transmittance","percent transmittance"]},{"unit":"GRO-07","term":"optical density","vi":"mật độ quang (OD)","def":"Absorbance; OD = 2 − log(%T).","example":"Dilute when optical density exceeds 0.7.","aliases":["OD","absorbance","OD600"]},{"unit":"GRO-07","term":"metabolic activity","vi":"hoạt động trao đổi chất","def":"Production of products or use of substrates, used to estimate cell numbers.","example":"CO2 production reflects metabolic activity.","aliases":[]},{"unit":"PRO-01","term":"protist","vi":"nguyên sinh vật","def":"A eukaryote that is not an animal, plant or fungus.","example":"Euglena is a protist.","aliases":["protists"]},{"unit":"PRO-01","term":"protozoa","vi":"động vật nguyên sinh","def":"Unicellular, chemoheterotrophic, usually motile protists.","example":"Paramecium belongs to the protozoa.","aliases":["protozoan"]},{"unit":"PRO-01","term":"algae","vi":"tảo","def":"Photoautotrophic protists with pigments; some multicellular.","example":"Diatoms are algae.","aliases":["alga"]},{"unit":"PRO-01","term":"Excavata","vi":"siêu nhóm Excavata","def":"Protist supergroup with diplomonads, parabasalids and euglenozoans.","example":"Giardia belongs to the Excavata.","aliases":[]},{"unit":"PRO-01","term":"SAR","vi":"siêu nhóm SAR","def":"Stramenopiles, Alveolates and Rhizaria.","example":"Diatoms are in the SAR supergroup.","aliases":["Stramenopiles","Alveolates","Rhizaria"]},{"unit":"PRO-01","term":"Archaeplastida","vi":"siêu nhóm Archaeplastida","def":"Red algae, green algae and land plants.","example":"Red algae belong to Archaeplastida.","aliases":[]},{"unit":"PRO-01","term":"Unikonta","vi":"siêu nhóm Unikonta","def":"Supergroup including slime molds, animals and fungi.","example":"Slime molds are unikonts.","aliases":[]},{"unit":"PRO-01","term":"mixotroph","vi":"sinh vật dinh dưỡng hỗn hợp","def":"An organism that both photosynthesizes and feeds heterotrophically.","example":"Euglena is a mixotroph.","aliases":["mixotrophs","mixotrophic"]},{"unit":"PRO-01","term":"cyst","vi":"nang (bào nang)","def":"A protective resting stage of some protozoa.","example":"Giardia survives outside the host as a cyst.","aliases":["cysts"]},{"unit":"PRO-02","term":"diplomonads","vi":"nhóm diplomonad","def":"Excavate protists with two nuclei, multiple flagella and mitosomes.","example":"Giardia is one of the diplomonads.","aliases":["diplomonad"]},{"unit":"PRO-02","term":"mitosome","vi":"mitosome (ty thể tiêu giảm)","def":"A reduced mitochondrion lacking a functional electron transport chain.","example":"Giardia has mitosomes.","aliases":["mitosomes"]},{"unit":"PRO-02","term":"Giardia","vi":"Giardia","def":"Intestinal diplomonad parasite of mammals.","example":"Giardia forms cysts in water.","aliases":["Giardia intestinalis","Giardia lamblia"]},{"unit":"PRO-02","term":"parabasalids","vi":"nhóm parabasalid","def":"Excavates with hydrogenosomes, e.g., Trichomonas.","example":"Trichomonas belongs to the parabasalids.","aliases":["parabasalid"]},{"unit":"PRO-02","term":"hydrogenosome","vi":"hydrogenosome","def":"A reduced mitochondrion producing energy anaerobically and releasing H2.","example":"Trichomonas has hydrogenosomes.","aliases":["hydrogenosomes"]},{"unit":"PRO-02","term":"Trichomonas","vi":"Trichomonas","def":"Sexually transmitted parabasalid parasite.","example":"Trichomonas vaginalis has an undulating membrane.","aliases":["Trichomonas vaginalis"]},{"unit":"PRO-02","term":"undulating membrane","vi":"màng lượn sóng","def":"An undulating portion of the plasma membrane aiding movement.","example":"Trichomonas moves with an undulating membrane.","aliases":[]},{"unit":"PRO-02","term":"euglenozoans","vi":"nhóm trùng roi euglenozoa","def":"Excavates with a rod inside each flagellum.","example":"Euglena and Trypanosoma are euglenozoans.","aliases":["euglenozoan"]},{"unit":"PRO-02","term":"kinetoplast","vi":"kinetoplast","def":"An organized mass of DNA in the single large mitochondrion of kinetoplastids.","example":"Trypanosoma has a kinetoplast.","aliases":["kinetoplastids"]},{"unit":"PRO-02","term":"Trypanosoma","vi":"Trypanosoma","def":"Kinetoplastid parasite causing sleeping sickness and Chagas disease.","example":"Trypanosoma brucei causes sleeping sickness.","aliases":["Trypanosoma brucei","Trypanosoma cruzi"]},{"unit":"PRO-02","term":"Euglena","vi":"trùng roi xanh Euglena","def":"Mixotrophic euglenid with chloroplasts and an eyespot.","example":"Euglena divides by longitudinal fission.","aliases":["euglenids"]},{"unit":"PRO-02","term":"eyespot","vi":"điểm mắt","def":"A pigmented spot that helps detect light direction.","example":"Euglena uses its eyespot to find light.","aliases":["stigma"]},{"unit":"PRO-03","term":"diatom","vi":"tảo silic (tảo cát)","def":"A unicellular alga with a two-part silica shell.","example":"Diatoms are major marine producers.","aliases":["diatoms"]},{"unit":"PRO-03","term":"frustule","vi":"vỏ silic","def":"The two-part silica wall of a diatom.","example":"The frustule fits together like a box and lid.","aliases":[]},{"unit":"PRO-03","term":"brown algae","vi":"tảo nâu","def":"Multicellular stramenopile algae colored by fucoxanthin.","example":"Kelps are brown algae.","aliases":["kelp"]},{"unit":"PRO-03","term":"fucoxanthin","vi":"fucoxanthin","def":"The brown carotenoid pigment of brown algae that absorbs blue-green light.","example":"Fucoxanthin masks chlorophyll.","aliases":[]},{"unit":"PRO-03","term":"oomycetes","vi":"nấm noãn (oomycete)","def":"Fungus-like stramenopiles with cellulose walls and biflagellated zoospores.","example":"Phytophthora is one of the oomycetes.","aliases":["oomycete","water molds"]},{"unit":"PRO-03","term":"Phytophthora","vi":"Phytophthora","def":"Oomycete genus causing potato late blight and root rots.","example":"Phytophthora infestans caused the Irish famine.","aliases":[]},{"unit":"PRO-03","term":"alternation of generations","vi":"luân phiên thế hệ","def":"A life cycle alternating between multicellular diploid and haploid stages.","example":"Brown algae show alternation of generations.","aliases":["sporophyte","gametophyte"]},{"unit":"PRO-03","term":"oospore","vi":"noãn bào tử","def":"A thick-walled sexual spore of oomycetes.","example":"Oospores survive in soil.","aliases":["oospores"]},{"unit":"PRO-04","term":"alveoli","vi":"túi màng alveoli","def":"Membrane-bound sacs beneath the plasma membrane of alveolates.","example":"Dinoflagellate plates lie in alveoli.","aliases":[]},{"unit":"PRO-04","term":"dinoflagellates","vi":"tảo hai roi (giáp tảo)","def":"Alveolates with two flagella and often a cellulose theca.","example":"Some dinoflagellates cause red tides.","aliases":["dinoflagellate"]},{"unit":"PRO-04","term":"theca","vi":"vỏ giáp (theca)","def":"The armor of cellulose plates in alveoli of dinoflagellates.","example":"The theca protects Pfiesteria.","aliases":[]},{"unit":"PRO-04","term":"apicomplexans","vi":"ngành bào tử trùng (apicomplexa)","def":"Parasitic alveolates transmitted as sporozoites.","example":"Plasmodium belongs to the apicomplexans.","aliases":["apicomplexan"]},{"unit":"PRO-04","term":"Plasmodium","vi":"Plasmodium (ký sinh trùng sốt rét)","def":"Apicomplexan genus causing malaria.","example":"Plasmodium falciparum causes severe malaria.","aliases":["Plasmodium falciparum","malaria"]},{"unit":"PRO-04","term":"sporozoite","vi":"thoa trùng (sporozoite)","def":"The infective stage transmitted from mosquito to human.","example":"Sporozoites travel to the liver.","aliases":["sporozoites"]},{"unit":"PRO-04","term":"merozoite","vi":"mảnh trùng (merozoite)","def":"Stage released by schizonts that infects red blood cells.","example":"Merozoites invade erythrocytes.","aliases":["merozoites"]},{"unit":"PRO-04","term":"schizogony","vi":"sinh sản phân liệt (schizogony)","def":"Multiple rounds of mitosis forming a multinucleate schizont before splitting.","example":"Schizogony occurs in liver cells.","aliases":["schizont","erythrocytic schizogony"]},{"unit":"PRO-04","term":"gametocyte","vi":"giao tử bào","def":"Plasmodium stage that forms gametes in the mosquito.","example":"Mosquitoes ingest gametocytes.","aliases":["gametocytes"]},{"unit":"PRO-04","term":"ciliates","vi":"trùng lông","def":"Alveolates using cilia for movement and feeding.","example":"Paramecium is one of the ciliates.","aliases":["ciliate","cilia","Paramecium"]},{"unit":"PRO-04","term":"macronucleus","vi":"nhân lớn","def":"The large nucleus controlling daily functions in ciliates.","example":"The macronucleus controls metabolism.","aliases":["micronucleus"]},{"unit":"PRO-04","term":"foraminiferans","vi":"trùng lỗ (foram)","def":"Rhizarians with porous CaCO3-hardened tests.","example":"Foram fossils date rocks.","aliases":["forams","foraminiferan"]},{"unit":"PRO-04","term":"test","vi":"vỏ (của trùng lỗ)","def":"The porous shell of a foraminiferan.","example":"The test is hardened with calcium carbonate.","aliases":["tests"]},{"unit":"PRO-04","term":"pseudopodia","vi":"chân giả","def":"Cytoplasmic extensions used for movement and feeding.","example":"Forams extend pseudopodia through pores.","aliases":["pseudopodium"]},{"unit":"PRO-05","term":"red algae","vi":"tảo đỏ","def":"Mostly multicellular marine algae without flagellated stages; source of agar.","example":"Gracilaria is one of the red algae.","aliases":["red alga","Gracilaria"]},{"unit":"PRO-05","term":"agarose","vi":"agarose","def":"The gelling polysaccharide fraction of agar from red algae.","example":"Agarose gels separate DNA.","aliases":[]},{"unit":"PRO-05","term":"green algae","vi":"tảo lục","def":"Algae with chlorophyll a and b: chlorophytes and charophytes.","example":"Chlamydomonas is one of the green algae.","aliases":["chlorophytes","Chlamydomonas","Volvox","Ulva"]},{"unit":"PRO-05","term":"charophytes","vi":"tảo vòng (charophyte)","def":"Green algae most closely related to land plants.","example":"Chara is one of the charophytes.","aliases":["charophyte","Chara","Coleochaete"]},{"unit":"PRO-05","term":"photorespiration","vi":"quang hô hấp","def":"Reaction of RuBisCO with O2 that wastes fixed carbon.","example":"Peroxisomes help recover carbon lost in photorespiration.","aliases":[]},{"unit":"PRO-05","term":"Calvin cycle","vi":"chu trình Calvin","def":"Pathway using ATP and NADPH to convert CO2 into sugar.","example":"The first step of the Calvin cycle fixes CO2 to RuBP.","aliases":[]},{"unit":"PRO-05","term":"phragmoplast","vi":"phragmoplast","def":"A microtubule array forming between daughter nuclei during plant-type cytokinesis.","example":"Chara forms a phragmoplast.","aliases":[]},{"unit":"PRO-05","term":"slime mold","vi":"nấm nhầy","def":"Mycetozoan protist once classified as a fungus.","example":"Slime molds form fruiting bodies.","aliases":["slime molds","mycetozoans"]},{"unit":"PRO-05","term":"plasmodial slime mold","vi":"nấm nhầy hợp bào","def":"Slime mold whose feeding stage is a plasmodium: a multinucleate mass of cytoplasm without internal membranes.","example":"The plasmodium of Physarum is yellow.","aliases":["plasmodial slime molds"]},{"unit":"PRO-05","term":"cellular slime mold","vi":"nấm nhầy tế bào","def":"Slime mold whose separate amoebae aggregate into a slug when food runs out.","example":"Dictyostelium is a cellular slime mold.","aliases":["cellular slime molds","Dictyostelium","slug"]},{"unit":"PRO-05","term":"fruiting body","vi":"thể quả","def":"A spore-producing structure.","example":"Slime molds form fruiting bodies.","aliases":["fruiting bodies"]},{"unit":"VIR-01","term":"virion","vi":"hạt virus (virion)","def":"A complete, fully developed, infectious viral particle.","example":"The virion carries the genome between cells.","aliases":["virions"]},{"unit":"VIR-01","term":"Baltimore classification","vi":"phân loại Baltimore","def":"Grouping of viruses by genome type and route to mRNA.","example":"HIV is group VI in the Baltimore classification.","aliases":[]},{"unit":"VIR-01","term":"viral species","vi":"loài virus","def":"Viruses sharing the same genetic information and host range.","example":"Each viral species has a common name.","aliases":[]},{"unit":"VIR-01","term":"host range","vi":"phạm vi vật chủ","def":"The range of hosts or cells a virus can infect.","example":"Phages have narrow host ranges.","aliases":[]},{"unit":"VIR-01","term":"Herpesviridae","vi":"họ Herpes","def":"The herpesvirus family, HHV-1 to HHV-8.","example":"Herpesviridae includes Varicellovirus.","aliases":["herpesviruses","HHV"]},{"unit":"VIR-01","term":"genus","vi":"chi","def":"Taxonomic rank; virus genus names end in -virus.","example":"Simplexvirus is a genus.","aliases":[]},{"unit":"VIR-01","term":"family","vi":"họ","def":"Taxonomic rank; virus family names end in -viridae.","example":"Herpesviridae is a family.","aliases":[]},{"unit":"VIR-01","term":"Kaposi's sarcoma","vi":"u Kaposi","def":"Cancer caused by HHV-8, mainly in AIDS patients.","example":"HHV-8 causes Kaposi's sarcoma.","aliases":[]},{"unit":"VIR-01","term":"chickenpox","vi":"bệnh thủy đậu","def":"Disease caused by HHV-3 (Varicellovirus).","example":"Chickenpox is caused by HHV-3.","aliases":[]},{"unit":"VIR-02","term":"capsid","vi":"vỏ capsid","def":"The protein coat surrounding a viral genome.","example":"The capsid protects viral nucleic acid.","aliases":["capsids"]},{"unit":"VIR-02","term":"capsomere","vi":"capsomere (đơn vị vỏ)","def":"Protein subunit of a capsid.","example":"Capsomeres assemble into the capsid.","aliases":["capsomeres"]},{"unit":"VIR-02","term":"envelope","vi":"vỏ bao ngoài","def":"A lipid-protein-carbohydrate layer covering the capsid of some viruses.","example":"Influenza has an envelope.","aliases":["enveloped"]},{"unit":"VIR-02","term":"spikes","vi":"gai (spike)","def":"Protein-carbohydrate projections on a viral envelope.","example":"Spikes bind host receptors.","aliases":["spike"]},{"unit":"VIR-02","term":"nucleocapsid","vi":"nucleocapsid","def":"The viral nucleic acid plus its capsid.","example":"The nucleocapsid lies inside the envelope.","aliases":[]},{"unit":"VIR-02","term":"polyhedral","vi":"đa diện","def":"Capsid shape with many faces, often an icosahedron.","example":"Adenovirus is polyhedral.","aliases":["icosahedral"]},{"unit":"VIR-02","term":"bacteriophage","vi":"thể thực khuẩn (phage)","def":"A virus that infects bacteria.","example":"T4 is a bacteriophage.","aliases":["bacteriophages","phage","phages"]},{"unit":"VIR-02","term":"tail fibers","vi":"sợi đuôi","def":"Phage structures that attach to bacterial receptors.","example":"Tail fibers bind E. coli.","aliases":["tail fiber"]},{"unit":"VIR-02","term":"naked virus","vi":"virus trần","def":"A virus without an envelope.","example":"Norovirus is a naked virus.","aliases":["non-enveloped"]},{"unit":"VIR-03","term":"lock and key","vi":"cơ chế ổ khóa – chìa khóa","def":"Matching of viral surface proteins with specific host receptors.","example":"Host recognition works by lock and key.","aliases":[]},{"unit":"VIR-03","term":"receptor","vi":"thụ thể","def":"A host surface molecule bound by a virus.","example":"HIV binds the CD4 receptor.","aliases":["receptors"]},{"unit":"VIR-03","term":"endocytosis","vi":"nhập bào","def":"Uptake of particles by membrane invagination.","example":"Some viruses enter by endocytosis.","aliases":[]},{"unit":"VIR-03","term":"fusion","vi":"hòa màng","def":"Merging of the viral envelope with the host membrane.","example":"Enveloped viruses enter by fusion.","aliases":[]},{"unit":"VIR-03","term":"uncoating","vi":"tháo vỏ","def":"Release of the viral genome from the capsid.","example":"Uncoating follows entry.","aliases":[]},{"unit":"VIR-03","term":"RNA-dependent RNA polymerase","vi":"RNA polymerase phụ thuộc RNA","def":"Viral enzyme that copies RNA from an RNA template.","example":"RNA viruses carry their own polymerase.","aliases":["RdRp","viral polymerase"]},{"unit":"VIR-03","term":"reverse transcriptase","vi":"enzyme phiên mã ngược","def":"Enzyme that makes DNA from an RNA template.","example":"HIV reverse transcriptase makes DNA.","aliases":[]},{"unit":"VIR-03","term":"HIV","vi":"HIV","def":"Human immunodeficiency virus, a retrovirus.","example":"HIV infects CD4 T cells.","aliases":["retrovirus"]},{"unit":"VIR-03","term":"provirus","vi":"tiền virus","def":"Viral DNA integrated into a host chromosome.","example":"HIV persists as a provirus.","aliases":[]},{"unit":"VIR-03","term":"lytic cycle","vi":"chu trình tan","def":"Phage cycle ending in lysis of the host cell.","example":"T4 follows the lytic cycle.","aliases":["lytic","lysis"]},{"unit":"VIR-03","term":"lysogenic cycle","vi":"chu trình tiềm tan","def":"Phage cycle in which the genome is maintained without killing the host.","example":"Lambda can enter the lysogenic cycle.","aliases":["lysogeny","lysogenic","lysogen"]},{"unit":"VIR-03","term":"virulent phage","vi":"phage độc","def":"A phage that multiplies only by the lytic cycle.","example":"T4 is a virulent phage.","aliases":["virulent phages"]},{"unit":"VIR-03","term":"temperate phage","vi":"phage ôn hòa","def":"A phage able to undergo both lytic and lysogenic cycles.","example":"Lambda is a temperate phage.","aliases":["temperate"]},{"unit":"VIR-03","term":"prophage","vi":"prophage (tiền phage)","def":"Phage DNA integrated into the bacterial chromosome.","example":"The prophage replicates with the host chromosome.","aliases":[]},{"unit":"VIR-03","term":"lambda","vi":"phage lambda","def":"A temperate E. coli phage with one short tail fiber.","example":"Lambda integrates as a prophage.","aliases":["phage lambda","λ"]},{"unit":"VIR-03","term":"induction","vi":"cảm ứng (prophage)","def":"Excision of a prophage triggered by DNA damage, starting the lytic cycle.","example":"UV causes induction.","aliases":[]},{"unit":"VIR-03","term":"plaque","vi":"vết tan","def":"A clear zone in a bacterial lawn formed by phage lysis.","example":"Plaques are counted as PFU.","aliases":["PFU","plaques"]},{"unit":"VIR-04","term":"viroid","vi":"viroid","def":"A short naked RNA (300–400 nt) plant pathogen that codes for no protein.","example":"Cadang-cadang is caused by a viroid.","aliases":["viroids"]},{"unit":"VIR-04","term":"virusoid","vi":"virusoid","def":"A viroid-like RNA in a protein coat that needs a helper virus.","example":"Virusoids cause disease only with a virus.","aliases":["virusoids"]},{"unit":"VIR-04","term":"ribozyme","vi":"ribozyme (RNA xúc tác)","def":"An RNA molecule with catalytic activity.","example":"Viroid RNA is a ribozyme.","aliases":[]},{"unit":"VIR-04","term":"gene silencing","vi":"làm im lặng gene","def":"Suppression of gene expression, e.g., via small RNAs.","example":"Viroids may cause disease by gene silencing.","aliases":[]},{"unit":"VIR-04","term":"cadang-cadang","vi":"bệnh cadang-cadang (dừa)","def":"Lethal coconut disease caused by a Cocadviroid.","example":"Cadang-cadang occurs in the Philippines.","aliases":[]},{"unit":"VIR-04","term":"Pospiviroidae","vi":"họ Pospiviroidae","def":"Viroid family: potato, hop, coconut, apple, perilla genera.","example":"Cocadviroid belongs to Pospiviroidae.","aliases":[]},{"unit":"VIR-04","term":"Avsunviroidae","vi":"họ Avsunviroidae","def":"Viroid family: avocado and peach genera.","example":"Avsunviroid infects avocado.","aliases":[]},{"unit":"VIR-04","term":"prion","vi":"prion","def":"An infectious protein causing degenerative brain disease.","example":"Prions resist cooking.","aliases":["prions"]},{"unit":"VIR-04","term":"degenerative brain disease","vi":"bệnh thoái hóa não","def":"Progressive destruction of brain tissue, e.g., by prions.","example":"BSE is a degenerative brain disease.","aliases":["BSE","Creutzfeldt-Jakob disease"]},{"unit":"IDT-01","term":"identification","vi":"định danh","def":"Assigning an unknown isolate to a described taxon using evidence.","example":"Identification uses biochemical tests.","aliases":[]},{"unit":"IDT-01","term":"phenotype","vi":"kiểu hình","def":"Observable traits such as shape, Gram reaction and metabolism.","example":"Older keys use phenotype.","aliases":["phenotypic"]},{"unit":"IDT-01","term":"dichotomous key","vi":"khóa phân đôi","def":"A series of either-or choices leading to identification.","example":"Follow the dichotomous key branch by branch.","aliases":[]},{"unit":"IDT-01","term":"Enterobacteriaceae","vi":"họ vi khuẩn đường ruột","def":"Oxidase-negative Gram-negative rods including E. coli and Salmonella.","example":"All Enterobacteriaceae are oxidase-negative.","aliases":[]},{"unit":"IDT-01","term":"oxidase","vi":"oxidase","def":"Cytochrome c oxidase detected by the oxidase test.","example":"Pseudomonas is oxidase-positive.","aliases":["oxidase test","oxidase-negative"]},{"unit":"IDT-01","term":"lactose fermentation","vi":"lên men lactose","def":"Production of acid (and gas) from lactose.","example":"E. coli shows lactose fermentation.","aliases":[]},{"unit":"IDT-01","term":"Voges-Proskauer test","vi":"phép thử VP","def":"Test detecting acetoin.","example":"Enterobacter is VP-positive.","aliases":["VP","VP test","acetoin"]},{"unit":"IDT-01","term":"IMViC","vi":"bộ IMViC","def":"Indole, methyl red, Voges-Proskauer and citrate tests.","example":"E. coli IMViC is ++--.","aliases":[]},{"unit":"IDT-01","term":"API code","vi":"mã số bộ kit sinh hóa","def":"Numeric profile from summing 4-2-1 weights of positive tests per group.","example":"Code 62343 matches Citrobacter freundii.","aliases":["API 20E"]},{"unit":"IDT-01","term":"chemotaxonomy","vi":"hóa phân loại","def":"Classification using chemical composition such as cell-wall components.","example":"DAP isomers are used in chemotaxonomy.","aliases":[]},{"unit":"IDT-01","term":"diaminopimelic acid","vi":"acid diaminopimelic (DAP)","def":"A peptidoglycan amino acid with LL and meso isomers.","example":"Streptomyces has LL-DAP.","aliases":["DAP","meso-DAP","LL-DAP"]},{"unit":"IDT-01","term":"actinomycetes","vi":"xạ khuẩn","def":"Gram-positive filamentous, spore-forming bacteria such as Streptomyces.","example":"Actinomycetes form mycelium.","aliases":["Actinobacteria","Streptomyces"]},{"unit":"IDT-02","term":"16S rDNA","vi":"gene 16S rDNA","def":"Gene for the small-subunit rRNA of bacteria and archaea, used for identification.","example":"16S rDNA sequencing identified the isolate.","aliases":["16S"]},{"unit":"IDT-02","term":"18S rDNA","vi":"gene 18S rDNA","def":"Small-subunit rRNA gene of eukaryotes.","example":"18S rDNA identifies protists.","aliases":["18S"]},{"unit":"IDT-02","term":"ITS","vi":"vùng ITS","def":"Internal transcribed spacer between rRNA genes; fungal barcode.","example":"ITS sequencing identified the mold.","aliases":["internal transcribed spacer"]},{"unit":"IDT-02","term":"rpoB","vi":"gene rpoB","def":"Gene for the RNA polymerase beta subunit, a protein-coding marker.","example":"rpoB resolves close species.","aliases":[]},{"unit":"IDT-02","term":"primer","vi":"đoạn mồi","def":"A short oligonucleotide that starts DNA synthesis in PCR.","example":"Universal primers bind conserved 16S regions.","aliases":["primers","primer design"]},{"unit":"IDT-02","term":"PCR","vi":"phản ứng chuỗi polymerase","def":"Polymerase chain reaction that amplifies a DNA region.","example":"PCR amplified the 16S gene.","aliases":[]},{"unit":"IDT-02","term":"BLAST","vi":"công cụ BLAST","def":"Basic Local Alignment Search Tool for sequence similarity searches.","example":"BLASTN compares nucleotide sequences.","aliases":["BLASTN","BLASTP"]},{"unit":"IDT-02","term":"query","vi":"trình tự truy vấn","def":"The sequence submitted to BLAST.","example":"The query was 471 nt.","aliases":["subject"]},{"unit":"IDT-02","term":"percent identity","vi":"phần trăm giống hệt","def":"Identical positions divided by alignment length × 100%.","example":"The hit had 100% percent identity.","aliases":["identity"]},{"unit":"IDT-02","term":"query cover","vi":"độ phủ truy vấn","def":"Percentage of the query length covered by the alignment.","example":"Query cover was 100%.","aliases":["query coverage"]},{"unit":"IDT-02","term":"E-value","vi":"giá trị E","def":"Expected number of chance hits with at least this score.","example":"An E-value of 0.0 is highly significant.","aliases":[]},{"unit":"IDT-02","term":"accession","vi":"mã truy cập","def":"Database identifier of a sequence record.","example":"JX293177.1 is an accession.","aliases":["accession number"]},{"unit":"IDT-02","term":"phylogenetic tree","vi":"cây phát sinh chủng loại","def":"A diagram hypothesizing evolutionary relationships.","example":"MEGA builds a phylogenetic tree.","aliases":["phylogenetic trees"]},{"unit":"IDT-02","term":"multiple sequence alignment","vi":"sắp gióng đa trình tự","def":"Alignment placing homologous positions of many sequences in columns.","example":"Multiple sequence alignment precedes tree building.","aliases":[]},{"unit":"IDT-02","term":"bootstrap","vi":"bootstrap","def":"Resampling test of support for tree branches.","example":"A bootstrap of 95 is strong support.","aliases":[]},{"unit":"IDT-02","term":"homology","vi":"tương đồng (cùng nguồn gốc)","def":"Similarity due to shared ancestry.","example":"BLAST searches for homology.","aliases":[]},{"unit":"APP-01","term":"single-cell protein","vi":"protein đơn bào (SCP)","def":"Microbial biomass used as a protein source for food or feed.","example":"Single-cell protein can replace fish meal.","aliases":["SCP"]},{"unit":"APP-01","term":"mycoprotein","vi":"protein nấm (mycoprotein)","def":"Protein-rich biomass of filamentous fungi, e.g., Fusarium venenatum.","example":"Mycoprotein is used in meat substitutes.","aliases":[]},{"unit":"APP-01","term":"Pekilo","vi":"quy trình Pekilo","def":"Finnish process growing Paecilomyces variotii on wood hydrolysates and sulfite waste for feed SCP.","example":"The Pekilo process used pentoses.","aliases":["Paecilomyces variotii"]},{"unit":"APP-01","term":"Methylophilus","vi":"vi khuẩn Methylophilus","def":"Methanol-using bacterium with a 2-h generation time used for SCP.","example":"Methylophilus grows on methanol.","aliases":["Methylophilus methylotrophus"]},{"unit":"APP-01","term":"Spirulina","vi":"tảo xoắn Spirulina","def":"Cyanobacterium harvested as food; protein-rich.","example":"Spirulina was eaten in Mexico.","aliases":[]},{"unit":"APP-01","term":"Chlorella","vi":"tảo Chlorella","def":"Eukaryotic green microalga used as feed.","example":"Chlorella is an algal SCP source.","aliases":[]},{"unit":"APP-01","term":"fish meal","vi":"bột cá","def":"Protein-rich feed made from fish, a target for SCP replacement.","example":"SCP replaced fish meal in salmon diets.","aliases":["fishmeal"]},{"unit":"APP-01","term":"essential amino acid","vi":"amino acid thiết yếu","def":"Amino acid that must be supplied in the diet, e.g., lysine.","example":"SCP is rich in essential amino acids.","aliases":["essential amino acids","lysine","methionine"]},{"unit":"APP-02","term":"substrate","vi":"cơ chất","def":"The raw material microbes use for growth.","example":"Molasses is a common substrate.","aliases":["substrates"]},{"unit":"APP-02","term":"molasses","vi":"rỉ đường","def":"Sugar-rich by-product of sugar refining used as a substrate.","example":"Yeast SCP is grown on molasses.","aliases":[]},{"unit":"APP-02","term":"whey","vi":"váng sữa (whey)","def":"Lactose-rich by-product of cheese making.","example":"Kluyveromyces grows on whey.","aliases":[]},{"unit":"APP-02","term":"C:N ratio","vi":"tỉ lệ C:N","def":"Ratio of carbon to nitrogen in a medium; 10:1 recommended for SCP.","example":"A high C:N ratio exhausts ammonia first.","aliases":[]},{"unit":"APP-02","term":"BOD","vi":"nhu cầu oxy sinh hóa (BOD)","def":"Biological oxygen demand, a measure of organic pollution.","example":"SCP production reduces waste BOD.","aliases":["biological oxygen demand"]},{"unit":"APP-02","term":"submerged fermentation","vi":"lên men chìm","def":"Cultivation in a liquid medium.","example":"Submerged fermentation is aerated and cooled.","aliases":[]},{"unit":"APP-02","term":"semisolid fermentation","vi":"lên men bán rắn","def":"Cultivation with solid substrates in a multiphase system.","example":"Semisolid fermentation needs high investment.","aliases":[]},{"unit":"APP-02","term":"solid-state fermentation","vi":"lên men rắn","def":"Cultivation on moist solid substrates like bran.","example":"Solid-state fermentation keeps 60–65% moisture.","aliases":[]},{"unit":"APP-02","term":"centrifugation","vi":"ly tâm","def":"Separation by spinning at high speed.","example":"Bacteria are harvested by centrifugation.","aliases":[]},{"unit":"APP-02","term":"uric acid","vi":"acid uric","def":"Purine breakdown product; excess causes kidney stones and gout.","example":"High RNA raises uric acid.","aliases":[]},{"unit":"APP-02","term":"biomass yield","vi":"hiệu suất sinh khối","def":"Biomass formed per substrate consumed (Yx/s).","example":"The biomass yield was 0.4 g/g.","aliases":["Yx/s"]},{"unit":"APP-02","term":"mycotoxin","vi":"độc tố nấm","def":"Toxic secondary metabolite of fungi.","example":"Aflatoxin is a mycotoxin.","aliases":["mycotoxins","cyanotoxins"]},{"unit":"APP-03","term":"bioethanol","vi":"ethanol sinh học","def":"Ethanol produced by microbial fermentation of biomass.","example":"Bioethanol is blended into gasoline.","aliases":["ethanol"]},{"unit":"APP-03","term":"alcoholic fermentation","vi":"lên men rượu","def":"Conversion of sugar to ethanol and CO2, regenerating NAD+.","example":"Yeast performs alcoholic fermentation.","aliases":[]},{"unit":"APP-03","term":"NAD+","vi":"NAD⁺","def":"Electron carrier regenerated when acetaldehyde is reduced to ethanol.","example":"Fermentation regenerates NAD+.","aliases":["NADH"]},{"unit":"APP-03","term":"theoretical yield","vi":"hiệu suất lý thuyết","def":"Maximum product per substrate from stoichiometry; 0.511 g/g for ethanol.","example":"The theoretical yield of ethanol is 0.511 g/g.","aliases":[]},{"unit":"APP-03","term":"ethanol yield","vi":"hiệu suất ethanol","def":"Ethanol produced per sugar (initial or consumed).","example":"The ethanol yield was 0.43 g/g.","aliases":["Y_EtOH"]},{"unit":"APP-03","term":"Azolla","vi":"bèo hoa dâu (Azolla)","def":"Floating aquatic fern with symbiotic Anabaena azollae.","example":"Azolla filiculoides was hydrolysed for ethanol.","aliases":["Azolla filiculoides"]},{"unit":"APP-03","term":"lignocellulose","vi":"lignocellulose","def":"Plant material of cellulose, hemicellulose and lignin.","example":"Lignocellulose needs pretreatment.","aliases":["lignocellulosic"]},{"unit":"APP-03","term":"pretreatment","vi":"tiền xử lý","def":"Treatment opening biomass structure, e.g., dilute acid at 121 °C.","example":"Acid pretreatment released sugars.","aliases":["thermal acid hydrolysis"]},{"unit":"APP-03","term":"saccharification","vi":"đường hóa","def":"Enzymatic hydrolysis of polysaccharides to sugars.","example":"Viscozyme was used for saccharification.","aliases":[]},{"unit":"APP-03","term":"SHF","vi":"thủy phân và lên men tách riêng","def":"Separate hydrolysis and fermentation.","example":"The Azolla study used SHF.","aliases":["SSF"]},{"unit":"APP-03","term":"xylose","vi":"đường xylose","def":"A five-carbon sugar from hemicellulose.","example":"S. cerevisiae cannot ferment xylose.","aliases":["pentose"]},{"unit":"APP-03","term":"Kluyveromyces marxianus","vi":"nấm men K. marxianus","def":"Thermotolerant yeast that ferments glucose and xylose.","example":"K. marxianus gave the most ethanol.","aliases":[]},{"unit":"APP-03","term":"HPLC","vi":"sắc ký lỏng hiệu năng cao","def":"High-performance liquid chromatography used to measure sugars and ethanol.","example":"Ethanol was measured by HPLC.","aliases":[]},{"unit":"APP-03","term":"primary metabolite","vi":"chất chuyển hóa sơ cấp","def":"Product of central metabolism formed during growth, e.g., ethanol.","example":"Ethanol is a primary metabolite.","aliases":["primary metabolites"]},{"unit":"APP-04","term":"6-APA","vi":"acid 6-aminopenicillanic (6-APA)","def":"Penicillin nucleus of fused thiazolidine and β-lactam rings.","example":"Acylase converts penicillin G into 6-APA.","aliases":["6-aminopenicillanic acid"]},{"unit":"APP-04","term":"beta-lactam ring","vi":"vòng β-lactam","def":"Four-membered cyclic amide essential for penicillin activity.","example":"β-lactamase opens the beta-lactam ring.","aliases":["β-lactam","thiazolidine"]},{"unit":"APP-04","term":"secondary metabolite","vi":"chất chuyển hóa thứ cấp","def":"Specialized product formed mainly after active growth (idiophase).","example":"Penicillin is a secondary metabolite.","aliases":["secondary metabolites"]},{"unit":"APP-04","term":"idiophase","vi":"pha sản xuất (idiophase)","def":"Phase in which secondary metabolites are produced.","example":"Penicillin accumulates in the idiophase.","aliases":["trophophase"]},{"unit":"APP-04","term":"Penicillium chrysogenum","vi":"nấm Penicillium chrysogenum","def":"Industrial penicillin-producing mold suited to submerged culture.","example":"P. chrysogenum replaced P. notatum.","aliases":["P. chrysogenum","Penicillium notatum"]},{"unit":"APP-04","term":"precursor","vi":"tiền chất","def":"A compound supplied to direct biosynthesis, e.g., phenylacetic acid.","example":"Phenylacetic acid is the precursor of penicillin G.","aliases":["phenylacetic acid"]},{"unit":"APP-04","term":"ACV tripeptide","vi":"tripeptide ACV","def":"δ-(L-α-aminoadipyl)-L-cysteinyl-D-valine made non-ribosomally.","example":"ACV is cyclized to isopenicillin N.","aliases":["isopenicillin N"]},{"unit":"APP-04","term":"fed-batch","vi":"nuôi cấy mẻ có bổ sung (fed-batch)","def":"Batch culture with controlled feeding of nutrients.","example":"Penicillin is made by fed-batch fermentation.","aliases":[]},{"unit":"APP-04","term":"corn steep liquor","vi":"dịch ngâm ngô","def":"Nutrient-rich by-product of corn wet milling.","example":"Corn steep liquor boosts mycelial growth.","aliases":[]},{"unit":"APP-04","term":"penicillinase","vi":"penicillinase (β-lactamase)","def":"Enzyme hydrolysing the β-lactam ring.","example":"Contaminants making penicillinase ruin batches.","aliases":["beta-lactamase","β-lactamase"]},{"unit":"APP-04","term":"penicillin acylase","vi":"penicillin acylase","def":"Enzyme removing the side chain of penicillin to yield 6-APA.","example":"Immobilized penicillin acylase produces 6-APA.","aliases":[]},{"unit":"APP-04","term":"semi-synthetic penicillin","vi":"penicillin bán tổng hợp","def":"Penicillin with a new side chain attached to 6-APA.","example":"Ampicillin is a semi-synthetic penicillin.","aliases":["semi-synthetic penicillins"]},{"unit":"APP-04","term":"extraction","vi":"chiết tách","def":"Transfer of a solute between immiscible phases.","example":"Penicillin extraction uses butyl acetate.","aliases":["counter-current extraction","back-extraction"]},{"unit":"APP-04","term":"pyrogen","vi":"chất gây sốt (pyrogen)","def":"Fever-causing substance removed by charcoal.","example":"Charcoal removes pyrogens.","aliases":["pyrogens"]},{"unit":"APP-04","term":"recovery","vi":"hiệu suất thu hồi","def":"Fraction of product retained through processing steps.","example":"Overall recovery is the product of step recoveries.","aliases":[]},{"unit":"APP-04","term":"strain preservation","vi":"bảo quản chủng","def":"Keeping production strains stable, e.g., in liquid nitrogen.","example":"Strain preservation limits instability.","aliases":[]}],"questions":[{"unit":"HIS-01","type":"recall","difficulty":1,"stem":"In 1665, Robert Hooke used a crude microscope to examine thin slices of cork. What was his main contribution?","options":["He described living \"animalcules\" in rainwater","He named the small boxes he saw \"cells\"","He disproved spontaneous generation","He proved that microbes cause disease"],"answer":1,"explanation":"Hooke (1665) quan sát lát **bần (cork)** và gọi các ô nhỏ là **cells** → mở đường cho **học thuyết tế bào**. Người mô tả **animalcules** sống là Leeuwenhoek (1673).","distractorNotes":["Đây là Leeuwenhoek, không phải Hooke.","","Bác bỏ tự sinh là Redi/Spallanzani/Pasteur.","Liên hệ vi sinh vật – bệnh là Koch (1876)."],"vocab":["cell theory"],"trap":"Hooke saw living microbes","pool":"learn","source":"1.History of Microbiology.pptx slide 3","id":"Q-HIS-01-001"},{"unit":"HIS-01","type":"recall","difficulty":1,"stem":"Anton van Leeuwenhoek is best known as the first person to:","options":["observe living microorganisms","develop a vaccine","grow bacteria in pure culture","use phenol in surgery"],"answer":0,"explanation":"Leeuwenhoek dùng kính **một thấu kính** tự chế (khoảng 400 chiếc) và là người **đầu tiên quan sát vi sinh vật sống** (animalcules), báo cáo cho Hội Hoàng gia Anh từ 1673.","distractorNotes":["","Vaccine: Jenner (1796).","Nuôi cấy thuần: Koch.","Phenol trong phẫu thuật: Lister (1860s)."],"vocab":["animalcules"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 3","id":"Q-HIS-01-002"},{"unit":"HIS-01","type":"not","difficulty":1,"stem":"Which of the following is NOT a cellular organism?","options":["A yeast","A bacterium","A virus","An alga"],"answer":2,"explanation":"**Virus** không có cấu tạo tế bào (không ribosome, không tự trao đổi chất), chỉ nhân lên trong tế bào chủ. Nấm men và tảo là **nhân thực**, vi khuẩn là **nhân sơ** – đều là tế bào.","distractorNotes":["Nấm men là tế bào nhân thực.","Vi khuẩn là tế bào nhân sơ.","","Tảo là nguyên sinh vật nhân thực."],"vocab":["virus","eukaryote"],"trap":"Viruses are tiny bacteria","pool":"learn","source":"1.History of Microbiology.pptx slide 24","id":"Q-HIS-01-003"},{"unit":"HIS-01","type":"concept","difficulty":2,"stem":"A student says: \"If I increase magnification enough, I can always see two very close points separately.\" Why is this wrong?","options":["Magnification makes the image darker","Separating two close points depends on resolution, which has a physical limit","Only electron microscopes magnify images","Resolution depends only on the eyepiece"],"answer":1,"explanation":"Phân biệt hai điểm gần nhau là **độ phân giải (resolution)**, bị giới hạn vật lý (~0,2 μm với kính quang học). Phóng đại thêm mà không tăng độ phân giải chỉ cho ảnh to mà mờ.","distractorNotes":["Không phải lý do chính.","","Kính quang học cũng phóng đại.","Độ phân giải phụ thuộc chủ yếu vật kính và bước sóng ánh sáng."],"vocab":["resolution"],"trap":"Magnification equals resolution","pool":"learn","source":"","id":"Q-HIS-01-004"},{"unit":"HIS-01","type":"concept","difficulty":1,"stem":"Which pair is correctly matched with its cell type?","options":["Yeast – prokaryote","Archaea – eukaryote","Molds – eukaryote","Bacteria – eukaryote"],"answer":2,"explanation":"Nấm mốc (molds) và nấm men đều là **nấm – nhân thực**. Bacteria và Archaea là **nhân sơ**.","distractorNotes":["Nấm men là nhân thực.","Archaea là nhân sơ.","","Vi khuẩn là nhân sơ."],"vocab":["prokaryote","eukaryote"],"trap":null,"pool":"learn","source":"","id":"Q-HIS-01-005"},{"unit":"HIS-01","type":"recall","difficulty":1,"stem":"Which group of microbes includes protozoa, algae, oomycetes and slime molds in the course's classification?","options":["Fungi","Protists","Archaea","Viruses"],"answer":1,"explanation":"Slide 24: **Protists** gồm protozoa, algae (tảo), oomycetes và slime molds (nấm nhầy). Fungi gồm yeasts, molds và nấm lớn.","distractorNotes":["Fungi gồm nấm men, nấm mốc, nấm lớn.","","Archaea là nhân sơ.","Virus không có tế bào."],"vocab":["protist"],"trap":null,"pool":"mock","source":"1.History of Microbiology.pptx slide 24","id":"Q-HIS-01-006","mockSet":3},{"unit":"HIS-01","type":"not","difficulty":1,"stem":"Which statement about Leeuwenhoek is NOT correct?","options":["He made single-lens microscopes","He described \"animalcules\"","He sent letters to the Royal Society","He proposed the germ theory of disease"],"answer":3,"explanation":"Thuyết mầm bệnh gắn với **Pasteur và Koch** (thời kỳ vàng). Leeuwenhoek chỉ quan sát và mô tả, không đưa ra thuyết gây bệnh.","distractorNotes":["Đúng: kính một thấu kính.","Đúng: animalcules.","Đúng: thư gửi Royal Society 1673–1723.",""],"vocab":["germ theory"],"trap":null,"pool":"mock","source":"","id":"Q-HIS-01-007","mockSet":1},{"unit":"HIS-01","type":"application","difficulty":2,"stem":"A virus about 100 nm in diameter must be observed. Which instrument is required and why?","options":["A light microscope, because oil immersion gives 1000× magnification","An electron microscope, because 100 nm is below the ~0.2 μm resolution limit of light microscopes","A hand lens, because viruses are large","A light microscope with a stronger eyepiece"],"answer":1,"explanation":"100 nm = 0,1 μm < giới hạn phân giải ~0,2 μm của kính quang học → cần **kính hiển vi điện tử**. Thêm thị kính mạnh chỉ tăng phóng đại, không tăng độ phân giải.","distractorNotes":["1000× không vượt được giới hạn phân giải.","","Virus rất nhỏ.","Thị kính mạnh hơn = phóng đại rỗng."],"vocab":["resolution","virus"],"trap":null,"pool":"mock","source":"","id":"Q-HIS-01-008","mockSet":1},{"unit":"HIS-02","type":"recall","difficulty":1,"stem":"Who introduced the concept of biogenesis in 1858, stating that living cells arise only from preexisting living cells?","options":["Louis Pasteur","Rudolf Virchow","John Needham","Francesco Redi"],"answer":1,"explanation":"Slide 10: **Rudolf Virchow (1858)** đưa ra khái niệm **biogenesis**. Pasteur (1861) mới là người giải quyết dứt điểm tranh luận bằng thực nghiệm.","distractorNotes":["Pasteur chứng minh bằng thực nghiệm năm 1861.","","Needham ủng hộ tự sinh.","Redi làm thí nghiệm dòi 1668."],"vocab":["biogenesis"],"trap":"Virchow did the swan-neck experiment","pool":"learn","source":"1.History of Microbiology.pptx slide 10","id":"Q-HIS-02-001"},{"unit":"HIS-02","type":"concept","difficulty":2,"stem":"Needham heated broth, poured it into covered flasks and saw it become turbid. Spallanzani repeated the work by heating broth AFTER sealing the flask, and it stayed clear. How did Needham respond?","options":["He accepted biogenesis","He argued that heat destroyed a \"vital force\" and sealing kept it out","He argued the broth contained spores","He argued that Spallanzani used the wrong broth"],"answer":1,"explanation":"Needham cho rằng nhiệt **phá hủy \"sinh lực\" (vital force)** và việc hàn kín **ngăn không khí** mang sinh lực → nên không tự sinh được. Vì vậy cần một thí nghiệm **vẫn cho không khí vào** – chính là bình cổ cong của Pasteur.","distractorNotes":["Needham không chấp nhận.","","Khái niệm nội bào tử chưa được biết lúc đó.","Không phải lập luận của Needham."],"vocab":["spontaneous generation"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 9","id":"Q-HIS-02-002"},{"unit":"HIS-02","type":"concept","difficulty":2,"stem":"What was the key advantage of Pasteur's S-shaped flask over Spallanzani's sealed flask?","options":["It allowed air in while trapping dust and microbes","It reached a higher temperature","It kept the broth free of oxygen","It contained a disinfectant in the neck"],"answer":0,"explanation":"Cổ cong **cho không khí vào** nhưng **giữ bụi mang vi sinh vật**. Như vậy lập luận \"thiếu không khí/sinh lực\" bị loại bỏ.","distractorNotes":["","Nhiệt độ không phải điểm khác biệt quyết định.","Không khí (có O₂) vẫn vào.","Không có hóa chất sát khuẩn."],"vocab":["swan-neck flask"],"trap":"Pasteur sealed the flask","pool":"learn","source":"1.History of Microbiology.pptx slides 10–11","id":"Q-HIS-02-003"},{"unit":"HIS-02","type":"application","difficulty":2,"stem":"A swan-neck flask of sterile broth has stayed clear for a year. The flask is tilted so the broth touches the curved neck and is set upright again. What happens and why?","options":["It stays clear because air cannot carry microbes","It becomes turbid because microbes trapped in the neck enter the broth","It stays clear because the broth was boiled","It becomes turbid because the broth generates life spontaneously"],"answer":1,"explanation":"Vi sinh vật bám ở đoạn cổ cong được dịch cuốn vào → dịch **đục** sau vài ngày. Điều này chứng minh nguồn vi sinh vật là **bụi/không khí**, không phải tự sinh.","distractorNotes":["Không khí mang bụi có vi sinh vật.","","Đun sôi không ngăn tái nhiễm.","Đây là cách giải thích của thuyết tự sinh – bị bác bỏ."],"vocab":["swan-neck flask"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 11","id":"Q-HIS-02-004"},{"unit":"HIS-02","type":"recall","difficulty":1,"stem":"Redi's maggot experiment (1668) showed that:","options":["microorganisms arise from broth","maggots come from fly eggs, not from rotting meat","air contains a vital force","heat kills all microbes"],"answer":1,"explanation":"Thịt đậy gạc (ruồi không chạm) không có dòi → **dòi từ trứng ruồi**. Tuy nhiên nhiều người vẫn tin **vi sinh vật** có thể tự sinh.","distractorNotes":["Không liên quan Redi.","","Đây là lập luận của Needham.","Không phải kết luận của Redi."],"vocab":["spontaneous generation"],"trap":"Redi settled the question for microbes","pool":"learn","source":"1.History of Microbiology.pptx slide 8","id":"Q-HIS-02-005"},{"unit":"HIS-02","type":"not","difficulty":2,"stem":"Which statement about the spontaneous generation debate is NOT correct?","options":["Redi's work did not convince everyone that microbes could not arise spontaneously","Needham supported spontaneous generation","Pasteur's flasks were hermetically sealed so no air could enter","The debate was resolved by Pasteur in 1861"],"answer":2,"explanation":"Bình Pasteur **không bị hàn kín** – cổ bình để hở, uốn cong. Đây chính là điểm khác Spallanzani.","distractorNotes":["Đúng: vẫn nhiều người tin vi sinh vật tự sinh.","Đúng.","","Đúng theo slide 10."],"vocab":["swan-neck flask"],"trap":"Pasteur sealed the flask","pool":"learn","source":"","id":"Q-HIS-02-006"},{"unit":"HIS-02","type":"concept","difficulty":2,"stem":"Which idea was Pasteur's experiment designed to rule out that Spallanzani's experiment could NOT rule out?","options":["That microbes come from the broth itself because air is required","That heat kills microbes","That fly eggs produce maggots","That microbes cause disease"],"answer":0,"explanation":"Spallanzani hàn kín nên người ủng hộ tự sinh bảo \"thiếu không khí\". Pasteur để **không khí vào tự do** mà dịch vẫn vô trùng → loại bỏ luận điểm đó.","distractorNotes":["","Không phải điểm tranh cãi.","Thí nghiệm của Redi.","Thuyết mầm bệnh là chủ đề khác."],"vocab":["spontaneous generation"],"trap":null,"pool":"mock","source":"","id":"Q-HIS-02-007","mockSet":2},{"unit":"HIS-02","type":"recall","difficulty":1,"stem":"Which scientist argued that microorganisms from the air entered Needham's broth after heating?","options":["Virchow","Spallanzani","Hooke","Koch"],"answer":1,"explanation":"**Spallanzani (1765)** cho rằng vi sinh vật từ không khí lọt vào dịch của Needham sau khi đun; ông đun sau khi hàn kín và không thấy mọc.","distractorNotes":["Virchow đưa khái niệm biogenesis.","","Hooke: cork cells.","Koch: định đề gây bệnh."],"vocab":[],"trap":null,"pool":"mock","source":"1.History of Microbiology.pptx slide 9","id":"Q-HIS-02-008","mockSet":3},{"unit":"HIS-02","type":"application","difficulty":2,"stem":"Industrial fermenters receive air through sterile 0.2 μm filters. Which historical experiment used the same principle?","options":["Redi's gauze-covered jar","Pasteur's swan-neck flask","Koch's anthrax experiment","Jenner's vaccination"],"answer":1,"explanation":"Bộ lọc khí vô trùng cho **khí đi qua nhưng giữ vi sinh vật** – giống cổ cong của Pasteur. (Gạc của Redi giữ ruồi, không giữ vi sinh vật.)","distractorNotes":["Gạc chỉ ngăn ruồi, kích thước lỗ quá lớn cho vi sinh vật.","","Không liên quan.","Không liên quan."],"vocab":["aseptic technique"],"trap":null,"pool":"mock","source":"","id":"Q-HIS-02-009","mockSet":1},{"unit":"HIS-03","type":"recall","difficulty":1,"stem":"The period from 1857 to 1914 is known as the:","options":["Age of Discovery","Golden Age of Microbiology","Antibiotic Era","Molecular Age"],"answer":1,"explanation":"Slide 15: **1857–1914 = Golden Age of Microbiology**, do Pasteur và Koch đặt nền móng.","distractorNotes":["Không đúng thuật ngữ.","","Kỷ nguyên kháng sinh bắt đầu từ 1940s.","Không đúng."],"vocab":["Golden Age of Microbiology"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 15","id":"Q-HIS-03-001"},{"unit":"HIS-03","type":"concept","difficulty":2,"stem":"Pasteur discovered that wine and beer became sour because of:","options":["yeasts growing in the presence of air","different bacteria that spoil the drinks","chemical oxidation by air alone","toxins from the barrels"],"answer":1,"explanation":"Nấm men tạo rượu; **các vi khuẩn khác** làm bia/rượu chua và hỏng (slide 16). Vì vậy giải pháp là đun nhẹ để diệt chúng (**pasteurization**).","distractorNotes":["Nấm men tạo rượu, không phải nguyên nhân chính làm chua.","","Pasteur chứng minh quá trình là sinh học.","Không phải kết luận của Pasteur."],"vocab":["fermentation","pasteurization"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 16","id":"Q-HIS-03-002"},{"unit":"HIS-03","type":"recall","difficulty":1,"stem":"In 1835, before Pasteur's work on silkworms, Agostino Bassi showed that silkworm disease was caused by:","options":["a protozoan","a fungus","a virus","a bacterium"],"answer":1,"explanation":"**Bassi (1835)**: một loại **nấm** gây bệnh tằm. Năm 1865 Pasteur tìm ra một tác nhân **khác** là **protozoan**.","distractorNotes":["Protozoan là phát hiện của Pasteur.","","Virus chưa được biết.","Không đúng."],"vocab":["germ theory"],"trap":"Bassi found a protozoan in silkworms","pool":"learn","source":"1.History of Microbiology.pptx slide 18","id":"Q-HIS-03-003"},{"unit":"HIS-03","type":"recall","difficulty":1,"stem":"Joseph Lister applied the germ theory to medicine by:","options":["treating surgical wounds with phenol","vaccinating patients against smallpox","discovering penicillin","isolating Bacillus anthracis"],"answer":0,"explanation":"**Lister (1860s)** xử lý vết mổ bằng **phenol (carbolic acid)** → khởi đầu phẫu thuật sát khuẩn.","distractorNotes":["","Jenner.","Fleming.","Koch."],"vocab":["antisepsis"],"trap":"Lister used alcohol","pool":"learn","source":"1.History of Microbiology.pptx slide 19","id":"Q-HIS-03-004"},{"unit":"HIS-03","type":"concept","difficulty":2,"stem":"In Koch's postulates, why must the pathogen be isolated in PURE culture before being injected into a healthy animal?","options":["To increase its virulence","So that the disease produced can be attributed to one specific microbe","Because mixed cultures cannot grow","To make a vaccine"],"answer":1,"explanation":"Nuôi cấy **thuần** đảm bảo chỉ có **một loại** vi sinh vật → nếu con vật khỏe bị bệnh thì quy được cho **đúng tác nhân đó**.","distractorNotes":[
