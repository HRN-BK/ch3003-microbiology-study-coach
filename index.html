oảng tối ưu (xấp xỉ) [fig] | Ví dụ/ghi chú |\n|---|---|---|---|\n| **Psychrophiles** | ưa lạnh | ~**15 °C** (mọc được ở 0 °C) | sống ở đại dương sâu, vùng cực |\n| **Psychrotrophs** | chịu lạnh | 20–30 °C, nhưng **mọc được ở 0–7 °C** | **gây hỏng thực phẩm trong tủ lạnh** (*Listeria, Pseudomonas*) |\n| **Mesophiles** | ưa ấm | **25–40 °C** (vi khuẩn gây bệnh ~**37 °C**) | phần lớn vi khuẩn, nấm |\n| **Thermophiles** | ưa nhiệt | **50–60 °C** | suối nóng, ủ phân compost |\n| **Hyperthermophiles** (extreme thermophiles) | ưa nhiệt cực độ | **≥ 80 °C** | chủ yếu **archaea** |\n\n- Lạnh chủ yếu **kìm hãm**, không diệt; nóng quá ngưỡng tối đa làm hỏng protein, màng không hồi phục."},{"h":"2. pH (slide 5)","body":"- **Phần lớn vi khuẩn mọc tốt ở pH 6,5–7,5**.\n- **Rất ít vi khuẩn mọc được ở pH < 4**; một số **chịu acid (acid-tolerant)** như vi khuẩn lactic, *Acidithiobacillus*.\n- **Nấm men và nấm mốc** thường mọc tốt ở **pH 5–6** (hơi acid) → môi trường nuôi nấm (Sabouraud, PDA) có pH thấp hơn.\n- Vi sinh vật tạo acid/kiềm khi sinh trưởng → pH thay đổi → cần bổ sung **chất đệm (buffers)**: **peptone, amino acid, muối phosphate**…\n- Phân loại theo pH: **acidophiles** (ưa acid), **neutrophiles** (trung tính), **alkaliphiles** (ưa kiềm). [mở rộng]"},{"h":"3. Áp suất thẩm thấu (slide 6–9)","body":"- Vi khuẩn **cần nước** để sinh trưởng (tế bào ~80 % là nước).\n- **Áp suất thẩm thấu cao** rút nước ra khỏi tế bào. Khi tế bào ở trong dung dịch **ưu trương** (nồng độ chất tan cao hơn trong tế bào), nước đi ra qua màng → **co nguyên sinh (plasmolysis)** – tế bào chất co lại → ức chế sinh trưởng. Đây là nguyên lý bảo quản bằng **muối, đường**.\n- **Extreme halophiles** (cực ưa mặn, **obligate halophiles**): **cần nồng độ muối cao** để sinh trưởng (~30 %; ví dụ archaea *Halobacterium*).\n- **Facultative halophiles** (ưa mặn tùy nghi): **không cần** muối cao nhưng **mọc được ở nồng độ muối tới 2 %** – nồng độ ức chế nhiều sinh vật khác.\n- ! Một vài loài facultative halophile **chịu được cả 15 % muối** (ví dụ *Staphylococcus aureus*).\n- Trong môi trường **nhược trương** (nước cất), vi khuẩn có thành vẫn chịu được; mất thành → vỡ."}],"extension":[{"h":"Thực phẩm: \"vùng nguy hiểm\" 5–60 °C","body":"Vi khuẩn gây bệnh thực phẩm (mesophiles) mọc nhanh nhất trong khoảng **5–60 °C**, đặc biệt ~37 °C. Quy tắc an toàn: giữ đồ nóng **> 60 °C**, đồ lạnh **< 5 °C**, không để thức ăn chín ở nhiệt độ phòng quá 2 giờ. *Listeria monocytogenes* là psychrotroph nguy hiểm vì mọc được cả trong tủ lạnh."},{"h":"Công nghệ: ủ phân compost","body":"Đống ủ phân tự nóng lên **55–70 °C** do trao đổi chất của vi sinh vật: giai đoạn đầu mesophiles hoạt động, sau đó **thermophiles** thay thế và **diệt mầm bệnh, hạt cỏ dại**. Enzyme chịu nhiệt từ thermophiles (amylase, protease) dùng trong bột giặt."}],"keyCards":[{"title":"Temperature groups","bodyEn":"Each species has **minimum, optimum and maximum** growth temperatures. **Psychrophiles** (cold-loving, optimum ~15 °C), **psychrotrophs** (grow at 0–7 °C; spoil refrigerated food), **mesophiles** (25–40 °C; pathogens ~37 °C), **thermophiles** (50–60 °C), **hyperthermophiles** (≥ 80 °C).","glossVi":"Ưa lạnh – ưa ấm – ưa nhiệt."},{"title":"pH","bodyEn":"Most bacteria grow best at **pH 6.5–7.5**; very few below pH 4; some are acid-tolerant. **Yeasts and molds prefer pH 5–6**. Media contain **buffers** (peptone, amino acids, phosphate salts).","glossVi":"Vi khuẩn 6,5–7,5; nấm 5–6."},{"title":"Osmotic pressure","bodyEn":"Hypertonic solutions draw water out → **plasmolysis**. **Extreme halophiles** require high salt. **Facultative halophiles** do not require salt but grow at up to **2 %**; a few tolerate **15 %**.","glossVi":"Co nguyên sinh; ưa mặn bắt buộc vs tùy nghi."}],"traps":["Refrigeration kills bacteria","Molds prefer pH 7.5","Facultative halophiles require high salt"]},{"id":"GRO-02","title":"Chemical requirements: C, N, S, P, trace elements and growth factors","priority":"H","difficulty":2,"minutes":20,"source":"5.Microbial Growth.pptx: slides 11–20","prereq":[],"hookVi":"Nông dân trồng đậu tương gần như **không cần bón đạm**. Bí mật nằm ở các **nốt sần trên rễ**: vi khuẩn *Rhizobium* sống cộng sinh, biến **N₂ trong không khí** thành dạng cây dùng được. Mỗi vi sinh vật cần **C, N, S, P**, nguyên tố vi lượng và đôi khi cả \"vitamin\" – nhưng lấy từ nguồn nào thì mỗi loài một khác.","predictQuestion":{"stem":"Soybean plants need little nitrogen fertilizer because:","options":["their leaves absorb NH3 from air","symbiotic bacteria in root nodules fix atmospheric N2","they do not need nitrogen","soil fungi produce nitrate"],"answer":1,"explanation":"Slide 16: vi khuẩn cố định đạm sống **cộng sinh với rễ cây họ đậu** (đậu tương, đậu, cỏ ba lá…) → **cố định N₂**, cả cây và vi khuẩn cùng dùng."},"lesson":[{"h":"1. Carbon (slide 11–13)","body":"- Ngoài nước, **carbon** là một trong những nhu cầu **quan trọng nhất**: là **bộ khung** của mọi hợp chất hữu cơ.\n- **Một nửa khối lượng khô** của tế bào vi khuẩn là **carbon**.\n- **Kiểu dinh dưỡng** [fig]:\n| Kiểu | Nguồn năng lượng | Nguồn carbon | Ví dụ |\n|---|---|---|---|\n| **Chemoheterotroph** | hóa học (chất hữu cơ) | **hữu cơ** (protein, carbohydrate, lipid) – **cùng nguồn với năng lượng** | phần lớn vi khuẩn, nấm, động vật nguyên sinh |\n| **Chemoautotroph** | hóa học (chất vô cơ: H₂S, NH₃, Fe²⁺) | **CO₂** | vi khuẩn nitrat hóa, oxy hóa lưu huỳnh |\n| **Photoautotroph** | ánh sáng | **CO₂** | vi khuẩn lam, tảo |\n| **Photoheterotroph** | ánh sáng | hữu cơ | vi khuẩn không lưu huỳnh màu tía/lục [mở rộng] |"},{"h":"2. Nitơ, lưu huỳnh, phospho (slide 15–17)","body":"Cần để tổng hợp **protein, DNA, RNA, ATP, phospholipid**…\n\n**Nitơ (N)**:\n- Nhiều vi khuẩn **phân giải thực phẩm chứa protein** và hợp chất chứa N khác; loài khác lấy N từ **NH₄⁺, NO₃⁻**…\n- **Vi khuẩn lam (cyanobacteria)** dùng trực tiếp **N₂ khí quyển** – **cố định đạm (nitrogen fixation)**.\n- Vi sinh vật cố định đạm có loài **sống tự do** (chủ yếu trong đất), loài **cộng sinh với rễ cây họ đậu** (cỏ ba lá, đậu tương, cỏ linh lăng, đậu, đậu Hà Lan) – N cố định được **cả cây và vi khuẩn** sử dụng.\n\n**Lưu huỳnh (S)**:\n- Tổng hợp **amino acid chứa S** (cysteine, methionine) và **vitamin** như **thiamine, biotin**.\n- Nguồn: **SO₄²⁻, H₂S, amino acid chứa S**.\n\n**Phospho (P)**:\n- Cần cho **acid nucleic**, **phospholipid** màng, và **liên kết năng lượng của ATP**.\n- Nguồn quan trọng: **PO₄³⁻** (phosphate)."},{"h":"3. Nguyên tố vi lượng (slide 18)","body":"- **Trace elements**: **Fe²⁺, Cu²⁺, Mo, Zn²⁺**… cần với lượng **rất nhỏ**; phần lớn là **cofactor** của enzyme.\n- Bên cạnh đó **K⁺, Mg²⁺, Ca²⁺**… là các yếu tố quan trọng cho sinh trưởng, cũng là cofactor enzyme (cần lượng lớn hơn).\n- Thường **không cần bổ sung** vì có sẵn trong **nước máy** và các thành phần môi trường."},{"h":"4. Yếu tố sinh trưởng hữu cơ (slide 19–20)","body":"- **Organic growth factors**: hợp chất hữu cơ **thiết yếu** mà sinh vật **không tự tổng hợp được** → phải lấy **trực tiếp từ môi trường**. Với người, nhóm quan trọng là **vitamin**.\n- Phần lớn vitamin là **coenzyme** – cofactor hữu cơ enzyme cần để hoạt động.\n- Nhiều vi khuẩn **tự tổng hợp mọi vitamin**; một số thiếu enzyme → vitamin đó là yếu tố sinh trưởng. Yếu tố sinh trưởng khác: **amino acid, purine, pyrimidine**.\n- Vi sinh vật có nhu cầu dinh dưỡng phức tạp gọi là **fastidious** (khó nuôi). [mở rộng]"}],"extension":[{"h":"Nông nghiệp: phân bón vi sinh","body":"Chế phẩm **Rhizobium** (nốt sần cây họ đậu), **Azotobacter** (cố định N tự do), vi khuẩn **phân giải lân** (hòa tan phosphate khó tan) được bán làm **phân vi sinh** ở Việt Nam – giảm phân hóa học, cải tạo đất. Vi khuẩn lam *Anabaena* cộng sinh với bèo hoa dâu (*Azolla*) từng là \"phân xanh\" cho lúa nước."},{"h":"Công nghệ lên men: công thức môi trường","body":"Khi thiết kế môi trường công nghiệp, kỹ sư tính **tỉ lệ C:N** (ví dụ SCP ~10:1 – bài APP-02), bổ sung nguồn N rẻ (urê, (NH₄)₂SO₄), P (KH₂PO₄), Mg (MgSO₄) và dựa vào nước/nguyên liệu thô (rỉ đường, bột ngô) để cung cấp vi lượng và vitamin."}],"keyCards":[{"title":"Carbon","bodyEn":"Carbon is the backbone of organic compounds; **half the dry weight** of a bacterium is carbon. **Chemoheterotrophs** get carbon from their energy source (organic compounds). **Chemoautotrophs** and **photoautotrophs** use **CO₂**.","glossVi":"Nửa khối lượng khô là carbon."},{"title":"N, S, P","bodyEn":"N, S, P are needed for proteins, DNA, RNA, ATP, phospholipids. N from proteins, **NH₄⁺, NO₃⁻**, or **N₂ by nitrogen fixation** (cyanobacteria; symbionts of legume roots). **S**: S-amino acids, **thiamine, biotin**; sources SO₄²⁻, H₂S. **P**: nucleic acids, phospholipids, **ATP**; source PO₄³⁻.","glossVi":"N – cố định đạm; S – thiamine, biotin; P – ATP."},{"title":"Trace elements and growth factors","bodyEn":"**Trace elements** (Fe, Cu, Mo, Zn) are needed in tiny amounts as enzyme **cofactors** and are usually present in tap water. **Organic growth factors** are organic compounds an organism cannot synthesize (vitamins as **coenzymes**, amino acids, purines, pyrimidines).","glossVi":"Vi lượng = cofactor; yếu tố sinh trưởng = hữu cơ không tự tổng hợp."}],"traps":["Trace elements must always be added","Chemoautotrophs use glucose as carbon source","All cyanobacteria fix nitrogen"]},{"id":"GRO-03","title":"Oxygen requirements and toxic forms of oxygen","priority":"H","difficulty":2,"minutes":20,"source":"5.Microbial Growth.pptx: slides 21–27","prereq":[],"hookVi":"Vết thương sâu do đạp đinh gỉ nguy hiểm hơn vết xước ngoài da – vì trong mô sâu **không có oxy**, nơi lý tưởng cho *Clostridium tetani* (uốn ván), một vi khuẩn **kỵ khí bắt buộc**: oxy **giết** nó. Nhưng tại sao oxy – thứ nuôi sống chúng ta – lại độc với nó?","predictQuestion":{"stem":"Why is oxygen toxic to obligate anaerobes?","options":["Oxygen dissolves their cell walls","They lack enzymes such as superoxide dismutase and catalase to neutralize toxic forms of oxygen","Oxygen blocks their flagella","They use oxygen as a nutrient too quickly"],"answer":1,"explanation":"Trao đổi chất có oxy tạo **superoxide, H₂O₂**… Kỵ khí bắt buộc **thiếu SOD và catalase** nên bị các dạng oxy độc phá hủy."},"lesson":[{"h":"1. Năm nhóm theo nhu cầu oxy (slide 21–22)","body":"Vi khuẩn **dùng O₂** tạo được **nhiều năng lượng** hơn từ chất dinh dưỡng.\n| Nhóm | Đặc điểm | Vị trí mọc trong ống thạch thioglycolate [fig] |\n|---|---|---|\n| **Obligate aerobes** (hiếu khí bắt buộc) | **cần O₂** để sống | **trên bề mặt** |\n| **Facultative anaerobes** (kỵ khí tùy nghi) | **dùng O₂ khi có**; khi không có thì **lên men hoặc hô hấp kỵ khí** | khắp ống, **dày nhất ở trên** |\n| **Obligate anaerobes** (kỵ khí bắt buộc) | **không dùng** O₂; phần lớn **bị O₂ làm hại** | **chỉ ở đáy** |\n| **Aerotolerant anaerobes** (kỵ khí chịu oxy) | **lên men**, không dùng O₂ nhưng **chịu được** O₂; vi khuẩn lactic có **SOD** trung hòa superoxide | **đều khắp ống** |\n| **Microaerophiles** (vi hiếu khí) | hiếu khí nhưng cần **lượng O₂ nhỏ** (thấp hơn không khí) | **dải hẹp dưới bề mặt** |\n\nVí dụ [mở rộng]: *Pseudomonas, Micrococcus* (hiếu khí bắt buộc); *E. coli, S. cerevisiae* (kỵ khí tùy nghi); *Clostridium* (kỵ khí bắt buộc); *Lactobacillus, Streptococcus* (chịu oxy); *Campylobacter, Helicobacter* (vi hiếu khí)."},{"h":"2. Các dạng oxy độc (slide 23–25)","body":"| Dạng | Mô tả | Enzyme trung hòa |\n|---|---|---|\n| **Singlet oxygen** (¹O₂) | O₂ bình thường được **nâng lên trạng thái năng lượng cao**, **cực kỳ hoạt động** | carotenoid (sắc tố) [mở rộng] |\n| **Superoxide radicals** (O₂•⁻, superoxide anion) | hình thành **lượng nhỏ trong hô hấp bình thường** của sinh vật dùng O₂ làm chất nhận electron cuối (tạo nước). Kỵ khí bắt buộc khi gặp O₂ cũng tạo superoxide. **Rất độc**: cướp electron của phân tử bên cạnh → phản ứng dây chuyền | **Superoxide dismutase (SOD)**: O₂•⁻ + O₂•⁻ + 2H⁺ → H₂O₂ + O₂ |\n| **Hydrogen peroxide** (H₂O₂) | sản phẩm của SOD, vẫn độc | **Catalase**: 2H₂O₂ → 2H₂O + O₂; **Peroxidase**: H₂O₂ + 2H⁺ → 2H₂O |\n| **Hydroxyl radical** (•OH) | dạng hoạt động mạnh nhất, tạo từ H₂O₂ hoặc bức xạ ion hóa | – |\n\n- **Mọi sinh vật muốn sống trong không khí phải có SOD** để trung hòa superoxide.\n- Enzyme theo nhóm: hiếu khí bắt buộc & kỵ khí tùy nghi: **SOD + catalase**; chịu oxy: **SOD**, không catalase; kỵ khí bắt buộc: **không có (hoặc rất ít)**. [fig]\n- Xét nghiệm **catalase** (nhỏ H₂O₂ → sủi bọt O₂) giúp phân biệt *Staphylococcus* (+) với *Streptococcus* (−). [mở rộng]"},{"h":"3. Nuôi cấy kỵ khí (slide 26–27)","body":"- **Bình kỵ khí (anaerobic jar)**: gói tạo khí khi thêm nước: **NaHCO₃ + NaBH₄ + H₂O → H₂ + CO₂**; H₂ kết hợp O₂ trên **chất xúc tác palladium** → H₂O → loại O₂. Có chỉ thị methylene blue (không màu khi hết O₂). [fig]\n- **Môi trường khử (reducing media)** chứa **sodium thioglycolate** kết hợp với O₂ hòa tan (bài GRO-04).\n- Slide 27: **Các vi sinh vật khác cũng có nhu cầu vật lý & hóa học tương tự vi khuẩn.**"}],"extension":[{"h":"Y tế: vết thương sâu và uốn ván","body":"Vết thương đâm sâu, dập nát, ít máu nuôi → **môi trường kỵ khí** → bào tử *C. tetani* nảy mầm, tiết độc tố thần kinh. Vì vậy vết thương sâu cần **làm sạch, mở rộng** (đưa O₂ vào) và **tiêm phòng uốn ván**. Liệu pháp **oxy cao áp** điều trị hoại thư sinh hơi (*C. perfringens*)."},{"h":"Công nghệ: sục khí trong nồi lên men","body":"Nồi lên men hiếu khí (sản xuất penicillin, acid citric, SCP) phải **sục khí và khuấy** liên tục vì O₂ tan rất kém trong nước (~7–8 mg/L ở 25 °C). Lên men kỵ khí (ethanol, biogas, acid lactic) thì loại oxy. Hiểu nhóm oxy của vi sinh vật quyết định thiết kế thiết bị."}],"keyCards":[{"title":"Five oxygen groups","bodyEn":"**Obligate aerobes** require O₂. **Facultative anaerobes** use O₂ when present, otherwise ferment or respire anaerobically. **Obligate anaerobes** cannot use O₂ and are harmed by it. **Aerotolerant anaerobes** ferment but tolerate O₂ (lactic acid bacteria have **SOD**). **Microaerophiles** need less O₂ than air.","glossVi":"5 nhóm theo oxy."},{"title":"Toxic oxygen","bodyEn":"**Singlet oxygen**: high-energy, very reactive O₂. **Superoxide** (O₂•⁻): formed in small amounts during normal aerobic respiration; neutralized by **superoxide dismutase (SOD)** → H₂O₂ + O₂. **H₂O₂** removed by **catalase** (→ H₂O + O₂) or **peroxidase**. All organisms growing in air must make SOD.","glossVi":"SOD → catalase/peroxidase."},{"title":"Anaerobic culture","bodyEn":"**Anaerobic jar**: NaHCO₃ + NaBH₄ + H₂O → H₂ + CO₂; H₂ removes O₂ on a palladium catalyst. **Reducing media** contain sodium thioglycolate.","glossVi":"Bình kỵ khí; môi trường thioglycolate."}],"traps":["Aerotolerant anaerobes use O2 for respiration","Microaerophiles grow at the surface","Singlet oxygen is the same as superoxide","Obligate anaerobes have catalase"]},{"id":"GRO-04","title":"Culture media and pure cultures","priority":"H","difficulty":2,"minutes":25,"source":"5.Microbial Growth.pptx: slides 28–41","prereq":[],"hookVi":"Mẫu nước giếng cần kiểm tra *E. coli* – nhưng trong đó có hàng trăm loài vi khuẩn khác. Nếu cấy lên thạch dinh dưỡng thường, bạn sẽ thấy \"một rừng\" khuẩn lạc. Giải pháp: dùng môi trường **chọn lọc** (ức chế loài không mong muốn) và **phân biệt** (làm *E. coli* đổi màu khác). Rồi dùng **cấy ria** để thu **khuẩn lạc thuần**.","predictQuestion":{"stem":"MacConkey agar contains bile salts and crystal violet (inhibit Gram-positives) and lactose with a pH indicator (lactose fermenters turn pink). This medium is:","options":["only selective","only differential","both selective and differential","chemically defined and reducing"],"answer":2,"explanation":"Muối mật + crystal violet **ức chế Gram dương → chọn lọc**; lactose + chỉ thị pH làm **khuẩn lạc lên men lactose màu hồng → phân biệt**."},"lesson":[{"h":"1. Môi trường nuôi cấy – khái niệm (slide 28–29)","body":"- **Culture medium**: môi trường chứa **chất dinh dưỡng** được chuẩn bị cho vi sinh vật **sinh trưởng trong phòng thí nghiệm**.\n- **Tiêu chuẩn** của một môi trường:\n  1. **phải chứa đúng chất dinh dưỡng** cho vi sinh vật cụ thể;\n  2. **đủ ẩm**, **pH điều chỉnh phù hợp**, **mức oxy thích hợp**;\n  3. **ban đầu phải vô trùng**;\n  4. **ủ ở nhiệt độ thích hợp**.\n- **Inoculum** (giống cấy): vi sinh vật đưa vào môi trường để bắt đầu sinh trưởng.\n- **Culture** (canh trường/nuôi cấy): vi sinh vật **sinh trưởng và nhân lên** trong/trên môi trường.\n- **Môi trường pha sẵn (ready-to-use)**: chỉ cần thêm nước và tiệt trùng."},{"h":"2. Agar và các dạng môi trường (slide 29)","body":"- **Agar**: **polysaccharide phức tạp** chiết từ **tảo biển** (tảo đỏ *Gelidium, Gracilaria* – PRO-05); là **chất làm đông**.\n  - **Nóng chảy ở ~100 °C**, nhưng **giữ trạng thái lỏng tới dưới ~40 °C** → đổ đĩa ở 45–50 °C không làm chết vi khuẩn; ủ 37 °C (thậm chí 60 °C) thạch vẫn đông.\n  - Rất ít vi sinh vật phân giải được agar → không bị \"ăn\" mất.\n- Các dạng: **deep agar** (thạch đứng trong ống), **slant** (thạch nghiêng), **agar plate** (đĩa thạch Petri), và **broth** (môi trường lỏng)."},{"h":"3. Phân loại theo thành phần (slide 30–31)","body":"| Loại | Định nghĩa | Ví dụ |\n|---|---|---|\n| **Chemically defined medium** (xác định hóa học) | **biết chính xác thành phần hóa học** | glucose + muối vô cơ (nuôi *E. coli*); môi trường nghiên cứu nhu cầu dinh dưỡng |\n| **Complex medium** (phức tạp) | gồm dịch chiết **nấm men, thịt, thực vật** hoặc **protein thủy phân (peptone)**; thành phần **thay đổi nhẹ theo từng lô** | nutrient broth/agar, LB, PDA |"},{"h":"4. Phân loại theo chức năng (slide 32–37)","body":"| Loại | Nguyên lý | Ví dụ |\n|---|---|---|\n| **Reducing media** (môi trường khử) | chứa **sodium thioglycolate** kết hợp hóa học với **O₂ hòa tan** → loại O₂ | nuôi **kỵ khí**; ống thioglycolate |\n| **Selective media** (chọn lọc) | **ức chế** vi khuẩn không mong muốn, **khuyến khích** vi sinh vật cần tìm | thạch muối mannitol (7,5 % NaCl – *Staphylococcus*); Sabouraud (pH thấp – nấm) |\n| **Differential media** (phân biệt) | giúp **phân biệt khuẩn lạc** loài cần tìm với loài khác **trên cùng đĩa** | thạch máu (tan máu), EMB, MacConkey |\n| **Enrichment media** (tăng sinh) | thường **lỏng**; tạo điều kiện cho **một loài ít ỏi** ban đầu **tăng lên mức phát hiện được**, còn loài khác thì không | canh selenite tăng sinh *Salmonella* |\n\n- Enrichment cũng là **một dạng chọn lọc**, nhưng mục đích là **nâng số lượng rất nhỏ** lên mức phát hiện.\n- Một môi trường có thể vừa **chọn lọc vừa phân biệt** (MacConkey, mannitol salt agar)."},{"h":"5. Khuẩn lạc và nuôi cấy thuần (slide 38–41)","body":"- **Colony** (khuẩn lạc): về lý thuyết phát sinh từ **một bào tử hoặc một tế bào sinh dưỡng**, hoặc từ **một nhóm cùng loài dính nhau** thành cụm, chuỗi → vì vậy đếm là **CFU**.\n- **Pure culture** (nuôi cấy thuần): chỉ chứa **một loài**.\n- **Streak plate method** (cấy ria): dùng que cấy **ria mẫu thành nhiều vùng** trên mặt thạch, mỗi vùng pha loãng dần → vùng cuối có **khuẩn lạc tách rời** → cấy chuyển một khuẩn lạc sang môi trường mới → nuôi cấy thuần."}],"extension":[{"h":"Kiểm nghiệm thực phẩm & nước","body":"Quy trình tìm *Salmonella* trong thực phẩm (ISO 6579): **tiền tăng sinh** (canh peptone đệm) → **tăng sinh chọn lọc** (RVS, MKTTn) → **cấy phân lập** trên thạch chọn lọc–phân biệt (XLD) → **khẳng định sinh hóa** (IDT-01). Mỗi bước dùng đúng một loại môi trường trong bài."},{"h":"Lab CH3004","body":"Bạn sẽ pha môi trường (cân, hòa tan, chỉnh pH, hấp 121 °C), đổ đĩa khi thạch còn ~45–50 °C, làm thạch nghiêng giữ giống và **cấy ria 4 vùng** để phân lập. Hiểu tính chất agar (đông < 40 °C) giúp bạn không đổ đĩa quá nóng (đọng hơi nước) hay quá nguội (vón cục)."}],"keyCards":[{"title":"Culture medium basics","bodyEn":"A **culture medium** supplies nutrients for lab growth. Criteria: right **nutrients**, adequate **moisture**, adjusted **pH**, suitable **oxygen**, **initially sterile**, incubated at the proper **temperature**. **Inoculum** = microbes introduced; **culture** = microbes growing. **Agar** (from seaweed) melts at ~100 °C and stays liquid until < 40 °C.","glossVi":"Agar chảy ~100 °C, đông < 40 °C."},{"title":"Defined vs complex","bodyEn":"**Chemically defined**: exact chemical composition known. **Complex**: yeast, meat or plant extracts or protein digests; composition varies slightly from batch to batch.","glossVi":"Xác định vs phức tạp."},{"title":"Functional media","bodyEn":"**Reducing** (sodium thioglycolate removes O₂). **Selective** (suppress unwanted, encourage desired). **Differential** (distinguish colonies on one plate). **Enrichment** (usually liquid; increases very small numbers of the desired organism to detectable levels).","glossVi":"Khử – chọn lọc – phân biệt – tăng sinh."},{"title":"Pure cultures","bodyEn":"A **colony** arises from a single cell or spore or a clump of the same organism. The **streak plate** spreads cells so isolated colonies form → **pure culture**.","glossVi":"Cấy ria → khuẩn lạc tách rời."}],"traps":["Complex media have exactly known composition","Enrichment media distinguish colonies","Agar solidifies at 100 °C","One colony always comes from one cell"]},{"id":"GRO-05","title":"Binary fission, generation time and the growth curve","priority":"H","difficulty":3,"minutes":30,"source":"6.The Growth of Bacterial Cultures.pptx: slides 1–12","prereq":[],"hookVi":"Một tế bào *E. coli* chia đôi mỗi 20 phút. Nếu điều kiện lý tưởng kéo dài, sau **48 giờ** khối lượng vi khuẩn sẽ vượt **khối lượng Trái Đất**! Điều đó không xảy ra vì dinh dưỡng cạn và chất thải tích tụ – quần thể đi qua **4 pha**: tiềm phát, lũy thừa, cân bằng, suy vong. Biết **thời gian thế hệ** giúp dự đoán khi nào sữa để ngoài bị hỏng.","predictQuestion":{"stem":"A culture has 10^4 cells/mL at 6 h and 10^8 cells/mL at 10 h during exponential growth. What is the generation time?","options":["1 h","about 0.3 h (18 min)","4 h","0.1 h"],"answer":1,"explanation":"Slide 9: g = log2 × (t − t₀)/(log Nt − log N₀) = 0,301 × 4/4 = **0,301 h ≈ 18 phút**."},"lesson":[{"h":"1. Phân đôi (slide 3–5)","body":"- Vi khuẩn sinh sản chủ yếu bằng **phân đôi (binary fission)** [fig]: tế bào dài ra → **DNA nhân đôi** → màng và thành **lõm vào** → **vách ngăn** → hai tế bào con.\n- Mỗi lần phân chia số tế bào **nhân đôi**: 1 → 2 → 4 → 8 → … = **2ⁿ** sau n thế hệ. Tăng trưởng **lũy thừa** → vẽ **log số tế bào** theo thời gian được đường thẳng."},{"h":"2. Thời gian thế hệ (slide 6–7)","body":"- **Generation time (g)**: thời gian để **một tế bào phân chia** (và **quần thể tăng gấp đôi**).\n- Thay đổi nhiều **giữa các loài** và theo **điều kiện môi trường** (nhiệt độ, dinh dưỡng…).\n- **Phần lớn vi khuẩn: 1–3 giờ**; một số cần **> 24 giờ** mỗi thế hệ (vd *Mycobacterium tuberculosis* ~18–24 h). *E. coli* trong điều kiện tối ưu ~20 phút. [mở rộng]"},{"h":"3. Công thức tính (slide 8–9)","body":"| Công thức | Ý nghĩa |\n|---|---|\n| **Nt = N₀ × 2ⁿ** | số tế bào sau n thế hệ |\n| **log Nt = log N₀ + n × log 2** | lấy log hai vế |\n| **n = (log Nt − log N₀) / log 2** | số thế hệ trong khoảng (t − t₀) |\n| **g = (t − t₀) / n** | thời gian thế hệ |\n| **g = log 2 × (t − t₀) / (log Nt − log N₀)** | công thức gộp |\n\nKý hiệu: **t₀** – thời điểm có N₀ tế bào; **t** – thời điểm có Nt tế bào; **n** – số thế hệ trong khoảng (t − t₀). **log 2 = 0,301**.\n\n**Ví dụ slide 9**: nồi lên men có vi khuẩn ở pha sinh trưởng: **10⁴ tế bào/mL lúc 6 h**, **10⁸ tế bào/mL lúc 10 h**.\ng = 0,301 × (10 − 6)/(8 − 4) = 0,301 × 4/4 = **0,301 h** (≈ 18 phút). Số thế hệ n = 4/0,301 ≈ **13,3**.\n\n⚠ Chỉ áp dụng trong **pha lũy thừa**. Dùng **log₁₀** nhất quán; nhớ chia cho **log 2** chứ không phải nhân."},{"h":"4. Đường cong sinh trưởng và 4 pha (slide 10–12)","body":"Trong **nuôi cấy mẻ (batch culture)** – môi trường không bổ sung, không lấy ra [fig]:\n| Pha | Đặc điểm | Vì sao |\n|---|---|---|\n| **Lag phase** (tiềm phát) | **số tế bào gần như không đổi**; tế bào hoạt động trao đổi chất mạnh, tổng hợp enzyme, **thích nghi** | làm quen môi trường mới |\n| **Log (exponential) phase** (lũy thừa) | số tế bào **tăng theo cấp số nhân**, g ngắn nhất và ổn định; tế bào **nhạy nhất** với kháng sinh, bức xạ | dinh dưỡng dồi dào |\n| **Stationary phase** (cân bằng) | số tế bào **mới sinh = số chết** → tổng không đổi | **cạn dinh dưỡng**, **tích tụ chất thải**, pH thay đổi; bắt đầu tạo nội bào tử, chất chuyển hóa bậc 2 (kháng sinh) |\n| **Death (decline) phase** (suy vong) | số chết **> số sinh** → giảm (cũng theo log) | môi trường cạn kiệt |\n\n- Pha lag dài hơn nếu giống cấy già, hoặc chuyển sang môi trường khác hẳn. [mở rộng]\n- Nuôi cấy **liên tục (chemostat)** giữ tế bào ở pha log bằng cách bổ sung môi trường mới và lấy dịch ra liên tục. [mở rộng]"}],"extension":[{"h":"An toàn thực phẩm: vì sao đồ ăn để ngoài 4 giờ nguy hiểm","body":"Giả sử thức ăn nhiễm 100 tế bào *S. aureus* (g ≈ 30 phút ở 30 °C). Sau 4 giờ = **8 thế hệ**: 100 × 2⁸ = **25.600 tế bào**; sau 8 giờ (16 thế hệ) ≈ **6,5 triệu** – đủ tạo độc tố ruột gây ngộ độc. Đây là lý do \"không để quá 2 giờ ở nhiệt độ phòng\"."},{"h":"Công nghiệp: thu sản phẩm đúng pha","body":"- **Sinh khối, chất chuyển hóa bậc 1** (ethanol, acid amin, enzyme): thu ở **cuối pha log** (APP-01).\n- **Chất chuyển hóa bậc 2** (penicillin): hình thành chủ yếu ở **pha cân bằng (idiophase)** (APP-04).\n- Giống cấy nên lấy ở **pha log** để rút ngắn pha lag trong nồi lên men lớn."}],"keyCards":[{"title":"Generation time","bodyEn":"**Generation time** = time for a cell to divide and the population to **double**. It varies with the organism and conditions; most bacteria **1–3 h**, some **> 24 h**.","glossVi":"Phần lớn vi khuẩn 1–3 h."},{"title":"Formulas","bodyEn":"Nt = N₀·2ⁿ; log Nt = log N₀ + n·log 2; **n = (log Nt − log N₀)/log 2**; **g = (t − t₀)/n = log 2·(t − t₀)/(log Nt − log N₀)**. Example: 10⁴ at 6 h, 10⁸ at 10 h → g = 0.301·4/4 = **0.301 h**.","glossVi":"g = 0,301 × Δt / Δlog N."},{"title":"Growth curve","bodyEn":"Batch culture phases: **lag** (no increase; adapting, synthesizing enzymes), **log/exponential** (constant doubling; most sensitive to drugs), **stationary** (births = deaths; nutrients exhausted, wastes accumulate), **death/decline** (deaths exceed births).","glossVi":"Tiềm phát → lũy thừa → cân bằng → suy vong."}],"traps":["No metabolic activity in lag phase","Stationary phase means all cells are dead","Multiply by log 2 instead of dividing to get n","Generation time is the same for all bacteria"]},{"id":"GRO-06","title":"Direct counts: counting chambers, plate count, serial dilution, filtration and MPN","priority":"H","difficulty":3,"minutes":30,"source":"6.The Growth of Bacterial Cultures.pptx: slides 13–27","prereq":[],"hookVi":"Tiêu chuẩn nước uống: **0 CFU *E. coli* / 100 mL**. Làm sao phát hiện được vài con vi khuẩn trong 100 mL nước? Không thể nhìn dưới kính – phải **lọc** cả 100 mL qua màng rồi đặt màng lên thạch. Còn với sữa chứa hàng triệu vi khuẩn/mL, ta **pha loãng** nhiều lần mới đếm được. Mỗi mật độ cần một phương pháp khác nhau.","predictQuestion":{"stem":"To count coliform bacteria in drinking water with very few bacteria, the best direct method is:","options":["direct microscopic count","membrane filtration of a large volume followed by incubation of the filter on agar","turbidity","dry weight"],"answer":1,"explanation":"Slide 21–22: **lọc** một thể tích lớn qua màng giữ vi khuẩn → đặt màng lên thạch → đếm khuẩn lạc. Phù hợp mẫu **rất ít vi khuẩn**."},"lesson":[{"h":"1. Đếm trực tiếp dưới kính hiển vi (slide 13–17)","body":"- Tính dựa trên **số tế bào đếm được trong một thể tích xác định** của dịch chứa tế bào; dịch phải được **pha loãng** tới mật độ đếm được.\n- **Buồng đếm Petroff-Hausser** (cho vi khuẩn) [fig]:\n  - **25 ô lớn × 16 ô nhỏ = 400 ô nhỏ**; tổng diện tích **1 mm²**; chiều sâu **0,02 mm**.\n  - Thể tích toàn lưới: 1 mm² × 0,02 mm = 0,02 mm³ = **2 × 10⁻⁵ mL** (1 mL = 1000 mm³).\n- **Buồng đếm hồng cầu (hemocytometer)** (cho nấm men, tế bào lớn): sâu **0,1 mm** → thể tích 1 mm² là **10⁻⁴ mL**.\n| Buồng | h_c | V_c (1 mm²) |\n|---|---|---|\n| Hemocytometer | 0,1 mm | **10⁻⁴ mL** |\n| Petroff-Hausser | 0,02 mm | **2 × 10⁻⁵ mL** |\n- **Mật độ = (số tế bào đếm / thể tích đếm) × hệ số pha loãng**.\n- Ưu: nhanh, không cần ủ. Nhược: **đếm cả tế bào chết**, khó đếm vi khuẩn di động, cần mật độ cao (~10⁷/mL). [mở rộng]"},{"h":"2. Đếm khuẩn lạc – plate count (slide 18–20)","body":"- Dùng được cho **cả vi khuẩn và nấm men**.\n- **Nguyên lý**: một tế bào sống sẽ sinh trưởng, phân chia qua nhiều thế hệ tạo **một khuẩn lạc – CFU (colony forming unit)**. Đếm khuẩn lạc → số tế bào sống trong một thể tích dịch.\n- Phải **pha loãng** dịch tế bào tới mức thích hợp để đếm được (thường **30–300 khuẩn lạc/đĩa**).\n- **Pha loãng liên tiếp (serial dilution)**: 1 mL mẫu + 9 mL nước muối sinh lý = 10⁻¹; tiếp tục → 10⁻², 10⁻³… [fig]\n- Cấy: **đổ đĩa (pour plate)** – 1 mL mẫu trộn với thạch nóng chảy ~45 °C; **trải đĩa (spread plate)** – 0,1 mL trải trên mặt thạch.\n- **CFU/mL = số khuẩn lạc / (thể tích cấy (mL) × độ pha loãng)** = số khuẩn lạc × hệ số pha loãng / thể tích cấy.\n- Ví dụ: 0,1 mL từ ống 10⁻⁵ cho 150 khuẩn lạc → 150/(0,1 × 10⁻⁵) = **1,5 × 10⁸ CFU/mL**.\n- Ưu: chỉ đếm **tế bào sống**, độ nhạy cao. Nhược: cần **24–48 h**, cụm tế bào = 1 CFU."},{"h":"3. Lọc màng – filtration (slide 21–22)","body":"- Cho **thể tích lớn** mẫu (100 mL nước, đồ uống) qua **màng lọc** có lỗ nhỏ giữ vi khuẩn (~0,45 μm).\n- Đặt màng lên **đĩa thạch** (hoặc đệm thấm môi trường) → ủ → khuẩn lạc mọc trên màng → đếm.\n- Dùng khi **số lượng vi khuẩn rất ít** (kiểm tra coliform trong nước uống)."},{"h":"4. Phương pháp MPN – Most Probable Number (slide 23–27)","body":"- **Nguyên lý**: **càng nhiều** vi khuẩn trong mẫu, **càng cần pha loãng nhiều** mới đến mức **không còn vi khuẩn** nào mọc trong các ống của dãy pha loãng.\n- Thực hiện: cấy **nhiều ống lặp** (thường **3 hoặc 5 ống**) ở mỗi mức pha loãng (vd 10 mL, 1 mL, 0,1 mL mẫu) vào môi trường lỏng → ủ → **ghi dấu hiệu sinh trưởng** (đục, sinh khí trong ống Durham, đổi màu) = ống dương tính.\n- Tổ hợp số ống dương tính (vd **5-3-1**) → tra **bảng MPN** → số vi khuẩn **có khả năng nhất** trong 100 mL (kèm khoảng tin cậy 95 %). [fig]\n- Là **ước lượng thống kê**; dùng khi vi khuẩn **không mọc trên thạch** hoặc cần phát hiện bằng đặc tính trong môi trường lỏng (coliform: lên men lactose sinh khí)."},{"h":"5. So sánh các phương pháp trực tiếp","body":"| Phương pháp | Đếm gì | Ưu | Nhược |\n|---|---|---|---|\n| Buồng đếm | mọi tế bào (sống + chết) | nhanh | cần mật độ cao; không phân biệt sống/chết |\n| Plate count | tế bào sống (CFU) | nhạy, chỉ sống | 24–48 h; cụm = 1 CFU |\n| Lọc màng | tế bào sống trong thể tích lớn | phát hiện mật độ rất thấp | mẫu đục làm tắc màng |\n| MPN | ước lượng thống kê tế bào sống | dùng môi trường lỏng, đặc tính sinh hóa | kém chính xác, cần bảng tra |"}],"extension":[{"h":"Tiêu chuẩn vi sinh Việt Nam (tham khảo)","body":"- **QCVN 01-1:2018/BYT** (nước sạch sinh hoạt): *E. coli* và coliform chịu nhiệt **< 1 CFU/100 mL** – kiểm bằng **lọc màng** hoặc **MPN**.\n- Sữa tươi nguyên liệu, thực phẩm: chỉ tiêu **tổng vi sinh vật hiếu khí** (TPC) bằng **đổ đĩa**, tính CFU/g hoặc CFU/mL.\nĐây chính là các kỹ thuật bạn thực hành ở lab CH3004."}],"keyCards":[{"title":"Direct microscopic count","bodyEn":"Count cells in a known volume of a diluted suspension. **Petroff-Hausser**: 25 × 16 = **400 small squares**, area **1 mm²**, depth **0.02 mm** → **2 × 10⁻⁵ mL**. Hemocytometer: depth **0.1 mm** → **10⁻⁴ mL**. Cells/mL = count ÷ volume × dilution factor.","glossVi":"Petroff-Hausser: 2×10⁻⁵ mL; hồng cầu: 10⁻⁴ mL."},{"title":"Plate count","bodyEn":"A living cell grows into a **colony (CFU)**; works for bacteria and yeast. **Serial dilution** then pour or spread plate; count plates with **30–300** colonies. **CFU/mL = colonies ÷ (volume plated × dilution)**.","glossVi":"CFU/mL = số KL / (V × độ pha loãng)."},{"title":"Filtration and MPN","bodyEn":"**Filtration**: large volumes through a membrane that retains bacteria; filter placed on agar (few bacteria, e.g., water). **MPN**: replicate tubes in a dilution series; the more bacteria, the more dilution is needed before no tubes grow; positive-tube pattern → **MPN table** (statistical estimate).","glossVi":"Lọc màng cho mẫu loãng; MPN = ước lượng thống kê."}],"traps":["Direct counts distinguish live and dead cells","CFU always equals number of cells","Multiply colonies by volume plated","MPN is an exact count"]},{"id":"GRO-07","title":"Indirect methods: turbidity/OD, dry weight, metabolic activity; building a batch growth curve","priority":"H","difficulty":3,"minutes":20,"source":"6.The Growth of Bacterial Cultures.pptx: slides 28–33","prereq":[],"hookVi":"Nhà nghiên cứu cần theo dõi *E. coli* sinh trưởng **mỗi 30 phút** trong 10 giờ. Đếm khuẩn lạc thì phải chờ 1 ngày mới có kết quả. Giải pháp: đo **độ đục (OD₆₀₀)** bằng máy quang phổ – **mất 10 giây**. Nhưng độ đục phản ánh **sinh khối**, không phân biệt tế bào sống hay chết.","predictQuestion":{"stem":"A spectrophotometer reads 10% transmittance for a culture. What is its optical density (OD)?","options":["0.1","1.0","2.0","10"],"answer":1,"explanation":"Slide 30: **OD = 2 − log(%T)** = 2 − log 10 = 2 − 1 = **1,0**."},"lesson":[{"h":"1. Độ đục – turbidity (slide 28–30)","body":"- Vi khuẩn sinh trưởng làm dịch nuôi **đục**. Đo bằng **máy quang phổ (spectrophotometer)**:\n  - Chùm sáng đi qua dịch tế bào tới **bộ thu (detector)**: **càng nhiều tế bào, càng ít ánh sáng tới bộ thu**.\n  - Sự thay đổi ánh sáng chuyển thành **% độ truyền qua (% transmittance, %T)**.\n- **Độ hấp thụ (absorbance) hay mật độ quang (optical density – OD)**: **OD = 2 − log(%T)**.\n  - %T = 100 → OD = 0; %T = 10 → OD = 1; %T = 1 → OD = 2.\n- Thường đo ở **600 nm (OD₆₀₀)**.\n- **Cần pha loãng khi OD₆₀₀ > 0,7** (ngoài vùng tuyến tính).\n- Quy đổi (slide): **OD₆₀₀ = 1 ≈ 8 × 10⁸ tế bào *E. coli*/mL**; ***S. cerevisiae*: ≈ 3 × 10⁷ tế bào/mL** (tế bào men to hơn nên cùng OD ít tế bào hơn).\n- Ưu: **nhanh, không phá mẫu**. Nhược: **không phân biệt sống/chết**; cần ≥ 10⁶–10⁷ tế bào/mL mới đục; không dùng được cho nấm sợi."},{"h":"2. Khối lượng khô – dry weight (slide 31)","body":"1. **Ly tâm** dịch tế bào → tách và thu **sinh khối**.\n2. **Rửa** sinh khối (loại môi trường còn bám).\n3. **Sấy** ở nhiệt độ thích hợp để tế bào **chỉ mất nước**, tới **khối lượng không đổi** → cân (g/L).\n- Là phương pháp chính cho **nấm sợi** và trong công nghiệp (g DCW/L)."},{"h":"3. Dựa vào hoạt động trao đổi chất (slide 32)","body":"- Giả định lượng **sản phẩm trao đổi chất** (acid, CO₂, ATP) hoặc **cơ chất tiêu thụ** (O₂, glucose) **tỉ lệ với số tế bào**.\n- Ví dụ: đo **lượng acid** tạo ra, **CO₂** thải ra, **O₂ tiêu thụ**, **ATP** (phát quang luciferase – kiểm tra vệ sinh bề mặt), khử thuốc nhuộm (resazurin, MTT). [mở rộng]"},{"h":"4. Xây dựng đường cong sinh trưởng nuôi cấy mẻ (slide 33)","body":"Các bước:\n1. Chuẩn bị **giống vi khuẩn đã hoạt hóa** để cấy.\n2. Chuẩn bị **môi trường lỏng** trong dụng cụ thích hợp.\n3. **Cấy** giống vào môi trường.\n4. **Nuôi** trong điều kiện thích hợp (nhiệt độ, lắc…).\n5. **Lấy mẫu định kỳ**, xác định **mật độ sinh khối** bằng phương pháp phù hợp (OD, đếm khuẩn lạc, khối lượng khô…) **cho đến khi sinh khối giảm** theo thời gian nuôi.\n6. **Vẽ đường cong** biểu diễn sự phụ thuộc của lượng sinh khối vào thời gian nuôi (log sinh khối – thời gian) → xác định các pha và **g**."},{"h":"5. Tổng hợp: chọn phương pháp nào?","body":"| Câu hỏi | Phương pháp phù hợp |\n|---|---|\n| Cần kết quả **ngay**, theo dõi liên tục | **OD** |\n| Chỉ tế bào **sống** | **plate count**, lọc màng, MPN |\n| Mẫu **rất loãng** (nước) | **lọc màng**, MPN |\n| **Nấm sợi**, công nghiệp | **khối lượng khô** |\n| Tổng số tế bào (sống + chết) | **buồng đếm** |"}],"extension":[{"h":"Lab và công nghiệp","body":"- Trong lab sinh học phân tử, người ta cấy *E. coli* qua đêm, pha loãng rồi đợi đến **OD₆₀₀ ≈ 0,4–0,6** (giữa pha log) mới cảm ứng biểu hiện protein hay làm tế bào khả biến.\n- Nồi lên men công nghiệp gắn **cảm biến quang học/điện dung** đo sinh khối trực tuyến, **cảm biến O₂ hòa tan, CO₂ khí thải** – chính là \"phương pháp dựa trên trao đổi chất\" ở quy mô lớn.\n- Máy đo **ATP** cầm tay kiểm tra độ sạch bề mặt chế biến thực phẩm chỉ trong 15 giây."}],"keyCards":[{"title":"Turbidity","bodyEn":"A spectrophotometer measures light passing through a culture; more cells → less light reaches the detector → lower **% transmittance**. **OD = 2 − log(%T)**. Dilute when **OD₆₀₀ > 0.7**. **OD₆₀₀ = 1 ≈ 8 × 10⁸ *E. coli*/mL** (≈ 3 × 10⁷ *S. cerevisiae*/mL).","glossVi":"OD = 2 − log %T; pha loãng khi > 0,7."},{"title":"Dry weight and metabolic activity","bodyEn":"**Dry weight**: centrifuge, wash, dry to **constant mass**, weigh. **Metabolic activity**: measure products (acid, CO₂, ATP) or consumption (O₂) assumed proportional to cell number.","glossVi":"Khối lượng khô; hoạt động trao đổi chất."},{"title":"Batch growth curve","bodyEn":"Activate the inoculum → prepare liquid medium → inoculate → incubate → **sample periodically** and measure biomass until it declines → **plot biomass (log) vs time**.","glossVi":"6 bước dựng đường cong sinh trưởng."}],"traps":["OD distinguishes live and dead cells","OD = log(%T)","Same OD means same cell number for yeast and E. coli"]},{"id":"PRO-01","title":"Protist overview: supergroups, nutrition, reproduction; fungi vs algae vs protozoa","priority":"H","difficulty":1,"minutes":20,"source":"9-10.Protists.pptx: slides 1–12, 102","prereq":[],"hookVi":"Một giọt nước ao dưới kính hiển vi chứa cả *Euglena* xanh bơi bằng roi, *Paramecium* phủ lông bơi, tảo silic vỏ thủy tinh và amip bò bằng chân giả. Tất cả được gọi chung là **nguyên sinh vật (protists)** – nhóm \"thập cẩm\" của sinh vật **nhân thực** không phải động vật, thực vật hay nấm. Làm sao sắp xếp thế giới hỗn độn này?","predictQuestion":{"stem":"Which statement about protists is correct?","options":["They are all prokaryotes","They are eukaryotes that are not animals, plants or fungi, and they show very diverse nutrition","They are all photosynthetic","They are all parasites"],"answer":1,"explanation":"Protists là **nhân thực** rất đa dạng: có loài **quang tự dưỡng**, **dị dưỡng**, và **dinh dưỡng hỗn hợp (mixotroph)**."},"lesson":[{"h":"1. Protists là gì?","body":"- **Protists** (nguyên sinh vật): nhóm **sinh vật nhân thực** rất đa dạng, **phần lớn đơn bào**, một số tập đoàn hoặc đa bào (tảo nâu khổng lồ).\n- Không phải một nhánh tiến hóa duy nhất – là cách gọi \"tiện dụng\" cho nhân thực **không phải** động vật, thực vật, nấm.\n- Theo slide 24 (bài HIS-01): protists gồm **protozoa, algae, oomycetes, slime molds**."},{"h":"2. Bốn siêu nhóm (slide 4–8)","body":"| Siêu nhóm | Các nhóm trong bài |\n|---|---|\n| **Excavata** | **diplomonads** (*Giardia*), **parabasalids** (*Trichomonas*), **euglenozoans** (kinetoplastids *Trypanosoma*; euglenids *Euglena*), Percolozoa (*Naegleria*) |\n| **SAR** (Stramenopiles – Alveolates – Rhizaria) | Stramenopiles: **diatoms, brown algae, oomycetes**; Alveolates: **dinoflagellates, apicomplexans, ciliates**; Rhizaria: **foraminiferans** |\n| **Archaeplastida** | **red algae, green algae** (chlorophytes, charophytes) (+ thực vật trên cạn) |\n| **Unikonta** | **slime molds** (nấm nhầy) (+ động vật, nấm) |\n\nMẹo nhớ: **E-S-A-U** = Excavata, SAR, Archaeplastida, Unikonta."},{"h":"3. Dinh dưỡng đa dạng (slide 9)","body":"| Kiểu | Mô tả | Ví dụ |\n|---|---|---|\n| **Photoautotrophs** (quang tự dưỡng) | có **lục lạp**, quang hợp | tảo silic, tảo nâu, tảo đỏ, tảo lục |\n| **Heterotrophs** (dị dưỡng) | hấp thụ chất hữu cơ hoặc **ăn (thực bào)** các hạt thức ăn | *Giardia, Trypanosoma, Paramecium*, oomycetes |\n| **Mixotrophs** (dinh dưỡng hỗn hợp) | **vừa quang hợp vừa dị dưỡng** | *Euglena*, nhiều dinoflagellates |"},{"h":"4. Sinh sản đa dạng (slide 10–11)","body":"- **Vô tính (asexual)**: phân đôi (dọc ở *Euglena*, *Trichomonas*), phân nhiều (schizogony ở *Plasmodium*), nảy chồi, bào tử.\n- **Hữu tính (sexual)**: qua **thụ tinh (fertilization)** và **giảm phân (meiosis)**; có nhiều kiểu vòng đời [fig]:\n  - vòng đời **đơn bội trội** (hợp tử là giai đoạn 2n duy nhất – *Chlamydomonas*);\n  - **luân phiên thế hệ** giữa thể bào tử 2n và thể giao tử n (tảo nâu *Laminaria*, *Ulva*);\n  - **lưỡng bội trội** (oomycetes, tảo silic).\n- Quy tắc đọc vòng đời: **thụ tinh: n + n → 2n**; **giảm phân: 2n → n**; **nguyên phân giữ nguyên** mức bội."},{"h":"5. Phân biệt nấm – tảo – động vật nguyên sinh (slide 102)","body":"| Đặc điểm | **Fungi** (nấm) | **Algae** (tảo) | **Protozoa** (ĐV nguyên sinh) |\n|---|---|---|---|\n| Giới | Fungi | **Protist** | **Protist** |\n| Kiểu dinh dưỡng | **hóa dị dưỡng** | **quang tự dưỡng** | **hóa dị dưỡng** |\n| Đa bào | **tất cả, trừ nấm men** | **một số** | **không** |\n| Sắp xếp tế bào | đơn bào; sợi; thể quả (nấm lớn) | đơn bào; tập đoàn; sợi; mô | **đơn bào** |\n| Cách lấy dinh dưỡng | **hấp thụ** | hấp thụ | **hấp thụ; tiêu hóa (qua miệng tế bào)** |\n| Đặc điểm khác | **bào tử** vô tính và hữu tính | **sắc tố** | **di động**; một số tạo **nang (cyst)** |"}],"extension":[{"h":"Protists quanh ta","body":"- **Tảo** tạo ra khoảng một nửa lượng O₂ trên Trái Đất và là nền tảng chuỗi thức ăn biển.\n- Ký sinh trùng nguyên sinh gây bệnh lớn: **sốt rét** (*Plasmodium*), **lỵ amip** (*Entamoeba*), **tiêu chảy** (*Giardia*), **bệnh ngủ** (*Trypanosoma*).\n- Công nghiệp: **agar** (tảo đỏ), **alginate** (tảo nâu – làm đặc kem, thuốc), **bột tảo Spirulina** (thực ra là vi khuẩn lam), đất tảo cát (diatomaceous earth) lọc bia."}],"keyCards":[{"title":"What protists are","bodyEn":"**Protists** are diverse, mostly unicellular **eukaryotes** that are not animals, plants or fungi; they include protozoa, algae, oomycetes and slime molds and do not form a single evolutionary clade.","glossVi":"Nhân thực, không phải ĐV/TV/nấm."},{"title":"Supergroups","bodyEn":"**Excavata** (diplomonads, parabasalids, euglenozoans), **SAR** (stramenopiles: diatoms, brown algae, oomycetes; alveolates: dinoflagellates, apicomplexans, ciliates; rhizarians: forams), **Archaeplastida** (red and green algae), **Unikonta** (slime molds).","glossVi":"E-S-A-U."},{"title":"Nutrition and reproduction","bodyEn":"Protists are **photoautotrophs**, **heterotrophs** or **mixotrophs**. They reproduce **asexually** and **sexually** (fertilization + meiosis) with various life cycles.","glossVi":"Quang tự dưỡng, dị dưỡng, hỗn hợp."},{"title":"Fungi vs algae vs protozoa","bodyEn":"Fungi: chemoheterotrophs, multicellular except yeasts, absorb nutrients, asexual/sexual spores. Algae: photoautotrophs, some multicellular, pigments. Protozoa: chemoheterotrophs, unicellular, absorb or ingest through a mouth, motile, some form cysts.","glossVi":"Bảng so sánh slide cuối."}],"traps":["Protists are prokaryotes","All algae are multicellular","Protozoa are photoautotrophs"]},{"id":"PRO-02","title":"Excavata: diplomonads, parabasalids and euglenozoans","priority":"H","difficulty":2,"minutes":25,"source":"9-10.Protists.pptx: slides 13–33","prereq":[],"hookVi":"Du khách uống nước suối \"trong vắt\" ở vùng núi rồi bị tiêu chảy kéo dài, phân mỡ, đầy hơi – thủ phạm là *Giardia*, một sinh vật nhân thực **không có ty thể hoạt động bình thường**. Cùng siêu nhóm Excavata còn có *Trypanosoma* gây **bệnh ngủ** châu Phi và *Euglena* xanh lá vừa quang hợp vừa ăn. Họ hàng nhưng lối sống khác nhau hoàn toàn.","predictQuestion":{"stem":"Giardia lives in the oxygen-poor intestine. What is unusual about its mitochondria?","options":["It has very large mitochondria","It has reduced mitochondria (mitosomes) without a functional electron transport chain","It has chloroplasts instead","It has hydrogenosomes that release H2"],"answer":1,"explanation":"Slide 14: diplomonads có **mitosome** – ty thể tiêu giảm, **không có chuỗi truyền electron** hoạt động → lấy năng lượng bằng con đường **kỵ khí**."},"lesson":[{"h":"1. Diplomonads – Giardia (slide 14–16)","body":"- Có **ty thể tiêu giảm gọi là mitosomes**: **không có chuỗi truyền electron hoạt động** → **không dùng O₂** để khai thác năng lượng từ carbohydrate; năng lượng lấy từ **con đường sinh hóa kỵ khí**.\n- Nhiều loài **ký sinh**, nổi tiếng là ***Giardia intestinalis*** (*G. lamblia*) sống trong **ruột động vật có vú**.\n- Có **hai nhân bằng nhau** và **nhiều roi** (trông như \"khuôn mặt\").\n- Vòng đời [fig]: **nang (cyst)** theo nước/thức ăn vào ruột → **thể hoạt động (trophozoite)** bám niêm mạc ruột non, nhân lên → tạo nang mới theo phân ra ngoài."},{"h":"2. Parabasalids – Trichomonas (slide 17–21)","body":"- Cũng có **ty thể tiêu giảm** gọi là **hydrogenosomes**: tạo **một phần năng lượng theo kiểu kỵ khí**, **giải phóng khí H₂** là sản phẩm phụ.\n- Đại diện nổi tiếng: ***Trichomonas vaginalis*** – ký sinh **lây qua đường tình dục**, nhiễm khoảng **140 triệu người mỗi năm** (slide).\n- Di chuyển dọc lớp niêm mạc đường sinh dục – tiết niệu nhờ **roi** và **màng lượn sóng (undulating membrane)** (một phần màng sinh chất uốn sóng).\n- Sinh sản **phân đôi dọc**; không có giai đoạn nang điển hình.\n\n| | Mitosome (*Giardia*) | Hydrogenosome (*Trichomonas*) |\n|---|---|---|\n| Nguồn gốc | ty thể tiêu giảm | ty thể tiêu giảm |\n| Tạo năng lượng | không trực tiếp (không ETC) | **có**, kỵ khí |\n| Sản phẩm phụ đặc trưng | – | **H₂** |"},{"h":"3. Euglenozoans – đặc điểm chung (slide 22–23)","body":"- Nhánh đa dạng: **dị dưỡng săn mồi, quang tự dưỡng, dinh dưỡng hỗn hợp, ký sinh**.\n- Đặc điểm hình thái phân biệt: **một thanh (rod) có cấu trúc xoắn hoặc tinh thể bên trong mỗi roi**.\n- Hai nhóm được nghiên cứu nhiều nhất: **kinetoplastids** và **euglenids**."},{"h":"4. Kinetoplastids – Trypanosoma (slide 24–27)","body":"- Có **một ty thể lớn duy nhất** chứa một **khối DNA có tổ chức gọi là kinetoplast**.\n- Có loài ăn vi khuẩn trong nước ngọt, biển, đất ẩm; có loài **ký sinh** động vật, thực vật, protists khác.\n- Chi ***Trypanosoma*** gây bệnh ở người:\n  - ***Trypanosoma brucei*** → **bệnh ngủ châu Phi (sleeping sickness)**, truyền qua ruồi tsetse.\n  - ***Trypanosoma cruzi*** → **bệnh Chagas** (Nam Mỹ), truyền qua **phân** của bọ xít hút máu."},{"h":"5. Euglenids – Euglena (slide 28–30)","body":"- ***Euglena***: tế bào hình thoi, có **roi** (một roi dài nhô ra), **lục lạp** (quang hợp), **điểm mắt (eyespot/stigma)** giúp nhận biết ánh sáng, **không bào co bóp** thải nước thừa, lớp **pellicle** protein dưới màng giúp giữ hình nhưng vẫn linh hoạt.\n- **Dinh dưỡng hỗn hợp**: có ánh sáng → quang hợp; thiếu ánh sáng → hấp thụ chất hữu cơ, thực bào.\n- Sinh sản **phân đôi dọc (longitudinal binary fission)**."},{"h":"6. Percolozoa – Naegleria fowleri (slide 31–32)","body":"- ***Naegleria fowleri*** – \"amip ăn não\": sống trong **nước ngọt ấm** (hồ, suối nước nóng); vào mũi khi bơi lặn → theo dây thần kinh khứu giác lên não gây **viêm não – màng não tiên phát (PAM)**, tử vong rất cao.\n- Có thể chuyển đổi giữa dạng **amip**, dạng **có roi** và **nang**. [mở rộng]"}],"extension":[{"h":"Sức khỏe cộng đồng","body":"- *Giardia* – nang **kháng chlorine** tương đối tốt → nước uống cần **lọc** (màng 1 μm) hoặc **đun sôi**. Du khách nên tránh uống nước suối chưa xử lý.\n- *Trichomonas* – bệnh lây qua đường tình dục phổ biến nhất không do virus; điều trị bằng metronidazole (thuốc được hoạt hóa trong điều kiện kỵ khí nhờ hydrogenosome!).\n- Bệnh ngủ châu Phi từng giết hàng trăm nghìn người; nhờ kiểm soát ruồi tsetse và thuốc mới, số ca giảm mạnh."}],"keyCards":[{"title":"Diplomonads","bodyEn":"Have **mitosomes** (reduced mitochondria) lacking functional electron transport chains, so they cannot use O₂; energy comes from **anaerobic pathways**. Many are parasites, e.g., ***Giardia intestinalis*** in mammalian intestines. **Two equal-sized nuclei** and **multiple flagella**.","glossVi":"Giardia: mitosome, 2 nhân, nhiều roi."},{"title":"Parabasalids","bodyEn":"Have **hydrogenosomes** that generate some energy anaerobically, releasing **H₂**. ***Trichomonas vaginalis*** is a sexually transmitted parasite (~140 million infections/year) that moves with **flagella and an undulating membrane**.","glossVi":"Trichomonas: hydrogenosome, H₂."},{"title":"Euglenozoans","bodyEn":"A rod with a **spiral or crystalline structure inside each flagellum**. **Kinetoplastids**: one large mitochondrion with a **kinetoplast** (organized DNA); *Trypanosoma brucei* (**sleeping sickness**), *T. cruzi* (**Chagas disease**). **Euglenids**: *Euglena*, mixotrophic, **longitudinal binary fission**.","glossVi":"Kinetoplast; Trypanosoma; Euglena."}],"traps":["Mitosomes release hydrogen gas","The kinetoplast is a second nucleus","Trypanosoma cruzi causes sleeping sickness","Giardia has one nucleus"]},{"id":"PRO-03","title":"Stramenopiles: diatoms, brown algae and oomycetes","priority":"M","difficulty":2,"minutes":20,"source":"9-10.Protists.pptx: slides 34–51","prereq":[],"hookVi":"Nạn đói khoai tây Ireland (1845–1849) làm **1 triệu người chết**. Thủ phạm *Phytophthora infestans* trông **giống nấm** – có sợi, bào tử – nhưng thực ra là **oomycete**, họ hàng gần của **tảo nâu** và **tảo silic**. Thành tế bào của nó là **cellulose**, không phải chitin. Ngoại hình có thể đánh lừa phân loại.","predictQuestion":{"stem":"Phytophthora infestans (potato blight) looks like a fungus but is an oomycete. Which feature shows it is not a true fungus?","options":["It forms hyphae","Its cell walls are made of cellulose rather than chitin","It absorbs nutrients","It produces spores"],"answer":1,"explanation":"Oomycetes có **thành cellulose** và **zoospore 2 roi**, thuộc **Stramenopiles** – khác nấm thật (thành **chitin**)."},"lesson":[{"h":"1. Stramenopiles trong SAR","body":"- **SAR** là nhóm **rất đa dạng** được định nghĩa bằng **sự tương đồng DNA** (slide 34).\n- **Stramenopiles**: nhiều loài có **2 roi khác nhau** – một roi có **lông dạng ống (hairy)** và một roi **nhẵn** (ở giai đoạn có roi).\n- Trong bài: **diatoms (tảo silic), brown algae (tảo nâu), oomycetes**."},{"h":"2. Diatoms – tảo silic (slide 35–36)","body":"- Tảo **đơn bào**, **quang hợp**, cực kỳ phong phú ở biển và nước ngọt (**thực vật phù du**).\n- Có **vỏ (frustule)** bằng **silica (SiO₂)** gồm **hai nửa lồng vào nhau** như hộp và nắp. [fig]\n- Sinh sản vô tính: mỗi tế bào con nhận **một nửa vỏ cũ** và tạo **nửa mới nhỏ hơn bên trong** → kích thước trung bình **giảm dần** qua các thế hệ; kích thước được phục hồi nhờ **sinh sản hữu tính** tạo **auxospore**. [mở rộng]\n- Xác tảo silic tích tụ → **đất tảo cát (diatomaceous earth)**: chất lọc, chất đánh bóng, thuốc trừ sâu tự nhiên."},{"h":"3. Brown algae – tảo nâu (slide 37–45)","body":"- **Đa bào**, có loài rất lớn (tảo bẹ **kelp** dài hàng chục mét – *Laminaria, Macrocystis*); dạng sợi nhỏ như ***Ectocarpus*** (sinh vật mô hình, *Ectocarpus sp.* Ec32).\n- Cơ thể (thallus) gồm **phiến (blade)**, **cuống (stipe)**, **bộ phận bám (holdfast)** – không phải lá, thân, rễ thật.\n- **Thành phần sắc tố** (slide 41):\n  - **Fucoxanthin**: **sắc tố chính tạo màu nâu**; hấp thụ hiệu quả ánh sáng **lam-lục đến lục** → quang hợp được ở **vùng nước sâu hoặc bị che bóng**; **che lấp** chlorophyll a và c.\n  - **Chlorophyll a & c**: có nhưng màu xanh bị fucoxanthin át.\n  - Carotenoid phụ: violaxanthin, β-carotene – góp phần hấp thụ ánh sáng, không ảnh hưởng nhiều tới màu.\n- **Vòng đời luân phiên thế hệ** (*Laminaria*, *Ectocarpus*): **thể bào tử 2n** → giảm phân → **bào tử động (zoospore) n** → **thể giao tử n** (nhỏ) → giao tử → thụ tinh → **hợp tử 2n** → thể bào tử. [fig]\n- Polysaccharide: **alginate**, **fucoidan** (khác fucoxanthin là sắc tố). [mở rộng]"},{"h":"4. Oomycetes – nấm noãn (slide 46–51)","body":"- Gồm **nấm nước (water molds)**, **mốc trắng**, **mốc sương (downy mildews)**; ví dụ ***Phytophthora***.\n- **Giống nấm** về hình thái (**sợi**, hấp thụ dinh dưỡng) nhưng **khác**:\n  - thành tế bào bằng **cellulose** (nấm: chitin);\n  - **giai đoạn lưỡng bội** chiếm ưu thế;\n  - **zoospore có 2 roi** (đặc trưng Stramenopiles) – slide 48–49: cấu trúc và đặc tính bơi của zoospore *Phytophthora*, tiếp nhận tín hiệu hóa học từ rễ cây chủ.\n- Sinh sản hữu tính tạo **oospore (noãn bào tử)** vách dày, sống sót lâu trong đất.\n- *Phytophthora infestans* – bệnh **mốc sương khoai tây/cà chua** (nạn đói Ireland); *Plasmopara viticola* – mốc sương nho."}],"extension":[{"h":"Tảo trong công nghiệp và đời sống","body":"- **Alginate** từ tảo nâu: chất làm đặc trong kem, sữa chua, băng gạc cầm máu, cố định tế bào (tế bào nấm men bọc alginate trong lên men liên tục – liên hệ công nghệ sinh học).\n- **Fucoxanthin** được nghiên cứu làm thực phẩm chức năng chống oxy hóa.\n- Tảo silic là **chỉ thị chất lượng nước** và nguồn O₂ lớn của đại dương."},{"h":"Nông nghiệp: bệnh do oomycetes ở Việt Nam","body":"*Phytophthora* gây **bệnh chết nhanh cây hồ tiêu**, thối rễ sầu riêng, mốc sương cà chua – thiệt hại lớn ở Tây Nguyên, miền Tây. Thuốc trừ nấm thông thường nhắm chitin/ergosterol **kém hiệu quả** vì oomycetes không phải nấm thật → phải dùng thuốc đặc hiệu (metalaxyl)."}],"keyCards":[{"title":"Stramenopiles","bodyEn":"SAR is defined by **DNA similarities**. Stramenopiles typically have a **hairy flagellum and a smooth flagellum**. Examples: **diatoms, brown algae, oomycetes**.","glossVi":"Hai roi khác nhau."},{"title":"Diatoms and brown algae","bodyEn":"**Diatoms**: unicellular photosynthetic algae with a two-part **silica** shell (frustule). **Brown algae**: multicellular (e.g., *Ectocarpus*, kelps); **fucoxanthin** gives the brown color, absorbs **blue-green to green** light (deeper or shaded water) and **masks chlorophyll a and c**; alternation of generations.","glossVi":"Tảo silic vỏ silica; tảo nâu fucoxanthin."},{"title":"Oomycetes","bodyEn":"Water molds, white rusts, downy mildews (***Phytophthora***). Fungus-like hyphae, but **cellulose walls**, dominant diploid stage and **biflagellated zoospores**; sexual **oospores**.","glossVi":"Giống nấm nhưng thành cellulose."}],"traps":["Oomycetes are true fungi","Chlorophyll gives brown algae their color","Diatom walls are cellulose"]},{"id":"PRO-04","title":"Alveolates and Rhizaria: dinoflagellates, apicomplexans, ciliates and forams","priority":"H","difficulty":2,"minutes":25,"source":"9-10.Protists.pptx: slides 52–71","prereq":[],"hookVi":"Mỗi năm vẫn có hàng trăm triệu ca **sốt rét**. Ký sinh trùng *Plasmodium* luân phiên sống trong **muỗi** và **người**, lúc ở gan, lúc ở hồng cầu, mỗi giai đoạn một tên. Nó là họ hàng của *Paramecium* và của tảo hai roi gây **thủy triều đỏ** – cả ba cùng thuộc nhóm **Alveolates** có túi màng (alveoli) dưới màng tế bào.","predictQuestion":{"stem":"In the malaria life cycle, which stage is injected into humans by the mosquito?","options":["Merozoites","Sporozoites","Gametocytes","Oospores"],"answer":1,"explanation":"Slide 59: dạng truyền giữa các vật chủ là tế bào nhỏ gọi là **sporozoites**, được muỗi tiêm vào máu người."},"lesson":[{"h":"1. Alveolates – đặc điểm chung","body":"- Có các **túi màng (alveoli)** nằm ngay **dưới màng sinh chất**.\n- Gồm **dinoflagellates, apicomplexans, ciliates**."},{"h":"2. Dinoflagellates – tảo hai roi (slide 52–58)","body":"- **Vỏ ngoài (theca)** gồm các **tấm cellulose** nằm **trong các alveoli** màng → tạo lớp giáp cứng liên tục ngay dưới màng sinh chất (ví dụ *Pfiesteria shumwayae*).\n- Có **2 roi**: một roi nằm trong **rãnh ngang**, một roi **dọc** → chuyển động xoay tròn. [fig]\n- **Dinh dưỡng hỗn hợp (mixotrophic)**: **dị dưỡng**, và trong một số điều kiện **quang hợp**; ăn hạt hữu cơ hoặc con mồi bằng **thực bào**.\n- Sinh sản phổ biến bằng **phân đôi vô tính**.\n- Một số loài bùng phát gây **thủy triều đỏ (red tide)**, tiết độc tố tích lũy trong nghêu sò. [mở rộng]"},{"h":"3. Apicomplexans – Plasmodium (slide 59–62)","body":"- **Ký sinh động vật**; có **phức hợp đỉnh (apical complex)** giúp xâm nhập tế bào chủ.\n- Dạng truyền giữa các vật chủ là tế bào nhỏ gọi là **sporozoites**.\n- Vòng đời phức tạp với **cả giai đoạn vô tính và hữu tính**, thường cần **hai hoặc nhiều vật chủ**.\n- ***Plasmodium*** gây **sốt rét (malaria)**, sống ở **muỗi và người**; slide: nhiễm **~300 triệu người** ở vùng nhiệt đới, **~2 triệu ca tử vong/năm** (số liệu cũ).\n\n**Vòng đời *Plasmodium falciparum*** [fig]:\n1. Muỗi *Anopheles* cái đốt → tiêm **sporozoites** vào máu.\n2. Sporozoites vào **tế bào gan (hepatocyte)**; trong **không bào ký sinh (parasitophorous vacuole)**, mỗi trophozoite thực hiện **schizogony** – **nhiều vòng nguyên phân** tạo tế bào hợp bào (**coenocyte**) gọi là **schizont** → giải phóng **merozoites**.\n3. Merozoites xâm nhập **hồng cầu**; nhân lên (**schizogony hồng cầu – erythrocytic schizogony**), phá vỡ hồng cầu → **cơn sốt**. Ở giai đoạn schizont, ký sinh trùng **nhân đôi DNA nhiều lần** và các lần nguyên phân diễn ra **không đồng bộ**.\n4. Một số merozoites biệt hóa thành **gametocytes** (giao tử bào).\n5. Muỗi hút máu nhận gametocytes → trong ruột muỗi tạo **giao tử, thụ tinh** → hợp tử → noãn nang → tạo sporozoites mới về tuyến nước bọt.\n- **Muỗi**: vật chủ **chính** (sinh sản hữu tính); **người**: vật chủ **trung gian** (sinh sản vô tính)."},{"h":"4. Ciliates – trùng lông (slide 63–65)","body":"- Dùng **lông (cilia)** để **di chuyển và kiếm ăn**; ví dụ ***Paramecium***.\n- Có **2 loại nhân**: **nhân lớn (macronucleus)** – điều khiển hoạt động hằng ngày; **nhân nhỏ (micronucleus)** – vai trò trong sinh sản hữu tính.\n- **Rãnh miệng (oral groove)** → **không bào tiêu hóa (food vacuole)**; **không bào co bóp (contractile vacuole)** thải nước thừa.\n- Sinh sản: **vô tính – phân đôi ngang**; **hữu tính – tiếp hợp (conjugation)**: hai tế bào trao đổi nhân nhỏ → tái tổ hợp di truyền (không tăng số lượng). [fig]"},{"h":"5. Foraminiferans – trùng lỗ (Rhizaria) (slide 66–71)","body":"- **Forams** có **vỏ (test) xốp nhiều lỗ**, là **một mảnh chất hữu cơ** thường **được cứng hóa bằng calcium carbonate (CaCO₃)**.\n- **Chân giả (pseudopodia)** thò qua các lỗ → dùng để **bơi, tạo vỏ và kiếm ăn**.\n- Có loài lấy dinh dưỡng từ **quang hợp của tảo cộng sinh** sống trong vỏ.\n- **Hóa thạch foram** là **chỉ thị tuyệt vời để đối chiếu tuổi đá trầm tích** ở các nơi khác nhau trên thế giới (dùng trong thăm dò dầu khí). Vỏ nhiều buồng nhưng vẫn là **đơn bào**."}],"extension":[{"h":"Sốt rét và thuốc artemisinin","body":"**Artemisinin** chiết từ cây thanh hao hoa vàng (*Artemisia annua*) – công trình đoạt Nobel 2015 của Tu Youyou – diệt nhanh thể trong hồng cầu. Việt Nam từng là điểm nóng sốt rét và đã giảm mạnh số ca nhờ màn tẩm hóa chất, phun thuốc diệt muỗi, điều trị phối hợp artemisinin. Kháng artemisinin đang xuất hiện ở Tiểu vùng sông Mekong."},{"h":"Thủy triều đỏ và an toàn hải sản","body":"Một số dinoflagellates (*Alexandrium, Karenia*) tiết **saxitoxin, brevetoxin** tích lũy trong nghêu, sò → ngộ độc liệt cơ, có thể tử vong. Nấu chín **không phá** độc tố. Cơ quan thú y thủy sản giám sát mật độ tảo độc ở vùng nuôi nhuyễn thể."}],"keyCards":[{"title":"Dinoflagellates","bodyEn":"External covering (**theca**) of **cellulose plates inside membranous alveoli**, just beneath the plasma membrane (e.g., *Pfiesteria shumwayae*). Two flagella. **Mixotrophic**: heterotrophic and, under some conditions, photosynthetic; ingest prey by **phagocytosis**. Commonly reproduce by **asexual binary fission**.","glossVi":"Giáp cellulose trong alveoli; hỗn hợp."},{"title":"Apicomplexans","bodyEn":"Animal **parasites**; the stage transmitted between hosts is the **sporozoite**. Complex cycle with **asexual and sexual stages**, often **two or more hosts**. *Plasmodium* causes **malaria**, lives in **mosquitoes and humans** (~300 million infected, ~2 million deaths/year per lecture). In liver cells, trophozoites undergo **schizogony** → **schizont** (coenocyte) → merozoites; **erythrocytic schizogony** in red blood cells.","glossVi":"Sporozoite → gan → hồng cầu → gametocyte."},{"title":"Ciliates and forams","bodyEn":"**Ciliates** (*Paramecium*) use cilia to move and feed; **macronucleus** and **micronucleus**; conjugation. **Forams**: porous **tests** of organic material hardened with **CaCO₃**; pseudopodia for swimming, test formation and feeding; some host symbiotic algae; fossils **date sedimentary rocks**.","glossVi":"Ciliates 2 loại nhân; forams vỏ CaCO₃."}],"traps":["Merozoites are injected by mosquitoes","Forams are multicellular because of many chambers","Dinoflagellate theca is silica","Humans are the definitive host of Plasmodium"]},{"id":"PRO-05","title":"Archaeplastida (red and green algae) and slime molds","priority":"M","difficulty":2,"minutes":20,"source":"9-10.Protists.pptx: slides 72–101","prereq":[],"hookVi":"Đĩa thạch bạn dùng trong lab làm từ **agar** chiết từ **tảo đỏ** *Gracilaria*; rong biển cuộn sushi (nori) cũng là tảo đỏ. Còn **tảo lục** *Chara* được xem là họ hàng gần nhất của **thực vật trên cạn**. Và trên khúc gỗ mục trong rừng ẩm, một khối **nhầy vàng cam bò chậm** – nấm nhầy – từng bị xếp nhầm vào nấm.","predictQuestion":{"stem":"Agar used in microbiology media is extracted from:","options":["brown algae","red algae such as Gracilaria","green algae","diatoms"],"answer":1,"explanation":"Slide 77: **tảo đỏ *Gracilaria dura*** dùng chiết **agarose/agar**."},"lesson":[{"h":"1. Tảo đỏ – red algae (slide 72–78)","body":"- Thuộc **Archaeplastida**; đa số **đa bào**, sống ở biển, một số ở **vùng nước sâu** (sắc tố **phycoerythrin** hấp thụ ánh sáng lam, tạo màu đỏ) [mở rộng].\n- **Không có giai đoạn mang roi** trong vòng đời.\n- Ứng dụng: **agar/agarose** (*Gracilaria dura* – slide 77, Gupta et al. 2011 nghiên cứu sinh trưởng và đặc tính agarose của thể giao tử đực, cái và thể bào tử), **carrageenan**, **nori** (*Porphyra/Pyropia*).\n- Vòng đời *Gracilaria* **ba pha**: **thể giao tử (n)** → thụ tinh → **thể quả bào tử (carposporophyte, 2n)** trên thể cái → **quả bào tử 2n** → **thể tứ bào tử (tetrasporophyte, 2n)** → giảm phân → **tứ bào tử n** → thể giao tử. [fig] (Ba pha nhưng chỉ **hai mức bội**.)"},{"h":"2. Tảo lục – chlorophytes (slide 79–85)","body":"- Có **chlorophyll a và b** (giống thực vật), dự trữ tinh bột, thành cellulose. [mở rộng]\n- Đa dạng hình thức tổ chức:\n  - **đơn bào**: *Chlamydomonas* (2 roi; vòng đời **đơn bội trội**, hợp tử 2n là giai đoạn lưỡng bội duy nhất);\n  - **tập đoàn**: *Volvox, Pediastrum*;\n  - **đa bào**: *Ulva* (rau diếp biển – luân phiên thế hệ, hai thế hệ giống nhau về hình dạng);\n  - **hợp bào nhiều nhân**: *Caulerpa*."},{"h":"3. Tảo lục – charophytes (slide 86–91)","body":"**Charophytes** (*Chara, Coleochaete*) là **tảo duy nhất chia sẻ 4 đặc điểm với thực vật trên cạn**:\n1. **Phức hợp tổng hợp cellulose dạng hoa thị (rosette-shaped cellulose synthase complexes)** trên màng sinh chất → tổng hợp **vi sợi cellulose** cho thành tế bào.\n2. **Enzyme peroxisome** giúp **hạn chế mất chất hữu cơ do quang hô hấp (photorespiration)**:\n   - Phản ứng đầu tiên chu trình Calvin: **ribulose-1,5-bisphosphate + CO₂ → 2 3-phosphoglycerate**.\n   - Nếu RuBisCO phản ứng với **O₂** thay vì CO₂: ribulose-1,5-bisphosphate + O₂ → 3-phosphoglycerate + **phosphoglycolate** → glycolate → vào **peroxisome**: glycine → vào **ty thể**: serine → về **peroxisome**: glycerate → về **lục lạp** tham gia chu trình Calvin.\n   - **Peroxisome của các tảo khác không có** các enzyme này.\n   - (Chu trình Calvin dùng **ATP và NADPH** để biến CO₂ thành đường.)\n3. **Cấu trúc tinh trùng (có roi)** tương tự.\n4. Ở chi *Chara* và *Coleochaete*, **phragmoplast** (hệ **vi ống**) hình thành giữa hai nhân của hai tế bào mới sau phân chia."},{"h":"4. Nấm nhầy – slime molds (Unikonta) (slide 92–101)","body":"- **Mycetozoans (\"fungus animals\")**; **trước đây bị xem là nấm sợi**. Chia 2 nhánh phân biệt bằng **chu trình sinh sản**:\n\n**a) Plasmodial slime molds (nấm nhầy hợp bào)**:\n- Màu **sáng** (thường **vàng hoặc cam**).\n- **Không phải đa bào**: là **một khối tế bào chất không ngăn bởi màng sinh chất**, chứa **nhiều nhân lưỡng bội** – sản phẩm của **nguyên phân không kèm phân chia tế bào chất** (plasmodium).\n- Gặp **điều kiện khắc nghiệt** → biệt hóa thành **thể quả (fruiting bodies)** phục vụ **sinh sản hữu tính** (giảm phân → bào tử n).\n- Phần lớn nhỏ, nhưng nhóm **Myxogastria** tạo plasmodium lớn **nhìn thấy bằng mắt thường**.\n\n**b) Cellular slime molds (nấm nhầy tế bào)** – vd *Dictyostelium*:\n- **Giai đoạn kiếm ăn**: các tế bào (amip đơn bội) **hoạt động riêng lẻ**.\n- **Khi cạn thức ăn**: tế bào **kết tụ thành khối giống con sên (slug)** hoạt động như một đơn vị.\n- **Khác** plasmodium: các tế bào kết tụ **vẫn tách biệt bởi màng sinh chất riêng**.\n- Cuối cùng khối kết tụ tạo **thể quả vô tính (asexual fruiting body)** → bào tử.\n\n| | Hợp bào (plasmodial) | Tế bào (cellular) |\n|---|---|---|\n| Dạng kiếm ăn | **plasmodium** 1 khối nhiều nhân **2n** | **amip đơn bội riêng lẻ** |\n| Màng giữa các nhân | **không** | **có** (mỗi tế bào) |\n| Khi đói | thể quả **hữu tính** | kết tụ \"slug\" → thể quả **vô tính** |"}],"extension":[{"h":"Agar – từ biển vào phòng thí nghiệm","body":"Việt Nam trồng rong câu *Gracilaria* ở đầm phá (Thừa Thiên Huế, Ninh Thuận) để chiết **agar** – dùng trong thạch rau câu, mỹ phẩm và môi trường vi sinh. Agarose tinh khiết dùng cho **điện di DNA** (IDT-02)."},{"h":"Nấm nhầy \"thông minh\"","body":"*Physarum polycephalum* (nấm nhầy hợp bào) có thể tìm đường ngắn nhất qua mê cung và \"thiết kế\" mạng lưới giống hệ thống đường sắt Tokyo (Nobel Ig 2010). *Dictyostelium* là sinh vật mô hình nghiên cứu **tín hiệu tế bào (cAMP)** và sự biệt hóa."}],"keyCards":[{"title":"Red algae","bodyEn":"Mostly multicellular marine algae; no flagellated stages. ***Gracilaria dura*** is used for **agarose** extraction. Life cycle has three phases: gametophyte (n), carposporophyte (2n), tetrasporophyte (2n).","glossVi":"Tảo đỏ → agar."},{"title":"Green algae","bodyEn":"**Chlorophytes**: *Chlamydomonas* (unicellular), *Volvox* (colonial), *Ulva* (multicellular). **Charophytes** share 4 features with land plants: **rosette cellulose-synthase complexes**; **peroxisome enzymes** limiting photorespiration losses; similar **flagellated sperm**; **phragmoplast** (microtubules) between daughter nuclei in *Chara* and *Coleochaete*.","glossVi":"Charophytes: 4 điểm giống thực vật."},{"title":"Slime molds","bodyEn":"Mycetozoans, once thought to be fungi. **Plasmodial**: bright yellow/orange **plasmodium** = one mass of cytoplasm with **many diploid nuclei**, no membranes between them (mitosis without cytokinesis); forms fruiting bodies for **sexual** reproduction. **Cellular**: individual cells feed; when food runs out they **aggregate into a slug** whose cells keep their **own membranes**; form an **asexual** fruiting body.","glossVi":"Hợp bào vs tế bào."}],"traps":["Plasmodial slime molds are multicellular","Cellular slime mold cells fuse into one cytoplasm","Slime molds are true fungi","All algae peroxisomes limit photorespiration"]},{"id":"VIR-01","title":"Virions, virus classification and nomenclature (Herpesviridae)","priority":"H","difficulty":1,"minutes":20,"source":"11.Viruses_Viroids_Prions.pptx: slides 1–11","prereq":[],"hookVi":"Thủy đậu hồi nhỏ, bệnh zona lúc về già, mụn rộp ở môi, u Kaposi ở bệnh nhân AIDS – nghe như 4 bệnh chẳng liên quan, nhưng đều do các thành viên của **một họ virus: Herpesviridae**. Muốn đọc được tên virus (chi, họ, bộ) và hiểu vì sao chúng \"cùng họ\", cần học quy tắc phân loại virus.","predictQuestion":{"stem":"A virus name ends in -viridae. Which taxonomic rank is this?","options":["Genus","Family","Order","Species"],"answer":1,"explanation":"Hậu tố **-viridae** = **họ (family)**; **-virus** = **chi (genus)**. (Slide 7 in nhầm \"-viridar\".)"},"lesson":[{"h":"1. Virion là gì? (slide 4)","body":"- **Virion** là **hạt virus hoàn chỉnh, phát triển đầy đủ, có khả năng lây nhiễm**, gồm **nucleic acid** được bao bởi **vỏ protein** (capsid) – vỏ **bảo vệ** genome khỏi môi trường và là **phương tiện truyền** từ tế bào chủ này sang tế bào chủ khác.\n- Virus **không có cấu tạo tế bào**, **không có ribosome**, không tự chuyển hóa → **ký sinh nội bào bắt buộc**; chỉ nhân lên **bên trong tế bào chủ**.\n- Kích thước rất nhỏ (khoảng **20–1000 nm**) – phần lớn chỉ thấy bằng **kính hiển vi điện tử**. [fig, mở rộng]\n\n| Đặc điểm | Vi khuẩn | Virus |\n|---|---|---|\n| Cấu tạo tế bào | có | **không** |\n| Nucleic acid | **cả DNA và RNA** | **DNA hoặc RNA** (một loại) |\n| Ribosome | có | **không** |\n| Nhân lên | phân đôi | **lắp ráp** từ các thành phần mới tổng hợp |\n| Nhạy kháng sinh | thường có | **không** |"},{"h":"2. Tiêu chí phân loại virus (slide 5–6)","body":"Virus được phân loại dựa trên:\n1. **Triệu chứng bệnh** (disease symptoms)\n2. **Vật chủ bị nhiễm** (infected hosts: động vật, thực vật, vi khuẩn – phage)\n3. **Hình thái virus** (viral morphology)\n4. **Loại vật chất di truyền** (DNA/RNA, sợi đơn/kép)\n5. **Cơ chế sao chép vật chất di truyền** (→ **hệ thống Baltimore**, slide 6)\n\n**Hệ Baltimore** – mọi virus đều phải tạo **mRNA** để ribosome chủ dịch mã [fig]:\n\n| Nhóm | Genome | Đường đến mRNA | Ví dụ |\n|---|---|---|---|\n| I | **dsDNA** | phiên mã trực tiếp | Herpes, Adeno, phage T4 |\n| II | **ssDNA** | → dsDNA → mRNA | Parvovirus |\n| III | **dsRNA** | RdRp của virus | Reovirus (rotavirus) |\n| IV | **(+)ssRNA** | genome **chính là mRNA** | Polio, coronavirus |\n| V | **(−)ssRNA** | RdRp tạo (+)mRNA | cúm, sởi, dại |\n| VI | ssRNA-RT | RNA → DNA (**phiên mã ngược**) → mRNA | **HIV** (retrovirus) |\n| VII | dsDNA-RT | qua RNA trung gian | viêm gan B |"},{"h":"3. Quy tắc đặt tên (slide 7)","body":"| Bậc | Hậu tố | Ví dụ |\n|---|---|---|\n| **Bộ (order)** | **-virales** (slide ghi \"-ales\") | *Herpesvirales* |\n| **Họ (family)** | **-viridae** (slide in nhầm \"-viridar\") | *Herpesviridae* |\n| **Chi (genus)** | **-virus** | *Simplexvirus* |\n\n- **Loài virus (viral species)**: nhóm virus **có cùng thông tin di truyền và cùng ổ sinh thái (phạm vi vật chủ – host range)**.\n- Loài virus được gọi bằng **tên thông thường mô tả** (vd human immunodeficiency virus); **phân loài** (nếu có) đánh **số** (HIV-1, HIV-2; HHV-1...)."},{"h":"4. Herpesviridae – ví dụ họ virus (slide 9)","body":"| Tên | Chi (genus) | Bệnh |\n|---|---|---|\n| **HHV-1 & HHV-2** | *Simplexvirus* | **mụn rộp môi (cold sores)**; HHV-2 chủ yếu herpes sinh dục |\n| **HHV-3** | *Varicellovirus* | **thủy đậu (chickenpox)** (tái hoạt → zona) |\n| **HHV-4** (Epstein-Barr) | *Lymphocryptovirus* | **tăng bạch cầu đơn nhân nhiễm trùng (infectious mononucleosis)** |\n| **HHV-5** | *Cytomegalovirus* | **bệnh thể vùi CMV** |\n| **HHV-6** | *Roseolovirus* | **roseola** (sốt phát ban trẻ nhỏ) |\n| **HHV-7** | *Roseolovirus* | nhiễm hầu hết trẻ sơ sinh, **phát ban giống sởi** |\n| **HHV-8** | *Rhadinovirus* | **u Kaposi (Kaposi's sarcoma)**, chủ yếu ở bệnh nhân **AIDS** |\n\nMẹo: 1-2 môi, 3 thủy đậu, 4 \"hôn\" (mono = bệnh nụ hôn), 5 CMV, 6-7 Roseolo, 8 Kaposi."}],"extension":[{"h":"Virus và thuốc","body":"- Kháng sinh **không** diệt virus (không có thành peptidoglycan, ribosome riêng). Thuốc kháng virus nhắm enzyme đặc hiệu của virus: **acyclovir** (DNA polymerase của herpes), **thuốc ức chế reverse transcriptase và protease** (HIV), **oseltamivir** (neuraminidase cúm).\n- Vaccine: thủy đậu (HHV-3), zona; ngừa HPV – liên hệ Jenner (HIS-04)."}],"keyCards":[{"title":"Virion","bodyEn":"A **virion** is a complete, fully developed, **infectious** viral particle of **nucleic acid** surrounded by a **protein coat** that protects it and serves as a vehicle of transmission between host cells.","glossVi":"Hạt virus hoàn chỉnh, lây nhiễm."},{"title":"Classification and naming","bodyEn":"Viruses are classified by disease symptoms, hosts, morphology, type of genetic material and its replication mechanism (Baltimore). Genus **-virus**, family **-viridae**, order **-virales** (slide: -ales). A **viral species** shares the same genetic information and ecological niche (**host range**); common names, subspecies numbered.","glossVi":"Chi -virus, họ -viridae."},{"title":"Herpesviridae","bodyEn":"HHV-1/2 *Simplexvirus* (cold sores); HHV-3 *Varicellovirus* (chickenpox); HHV-4 *Lymphocryptovirus* (infectious mononucleosis); HHV-5 *Cytomegalovirus* (CMV inclusion disease); HHV-6/7 *Roseolovirus* (roseola; measles-like rashes in infants); HHV-8 *Rhadinovirus* (**Kaposi's sarcoma**, AIDS patients).","glossVi":"HHV-1 → HHV-8."}],"traps":["-virus is the family suffix","Viruses contain both DNA and RNA","HHV-8 causes chickenpox"]},{"id":"VIR-02","title":"Virus structure: genome, capsid, capsomeres, envelope and spikes; phages","priority":"H","difficulty":1,"minutes":20,"source":"11.Viruses_Viroids_Prions.pptx: slides 12–19","prereq":[],"hookVi":"Vì sao rửa tay bằng xà phòng diệt được virus cúm và SARS-CoV-2 khá tốt, nhưng lại kém với norovirus gây ngộ độc thực phẩm? Câu trả lời nằm ở **cấu trúc hạt virus**: loại có **vỏ bao lipid (envelope)** thì xà phòng, cồn phá được lớp màng; loại **trần** chỉ có capsid protein thì bền hơn nhiều.","predictQuestion":{"stem":"Which structure is present in ALL virions?","options":["Envelope","Spikes","Capsid (protein coat) around the nucleic acid","Tail fibers"],"answer":2,"explanation":"Mọi virion có **nucleic acid + capsid**. Envelope, spike, đuôi chỉ có ở một số virus."},"lesson":[{"h":"1. Nucleic acid (slide 12)","body":"Genome virus có thể là:\n- **DNA hoặc RNA** (không bao giờ cả hai trong virion);\n- **sợi đơn (ss) hoặc sợi kép (ds)**;\n- **thẳng (linear) hoặc vòng (circular)**;\n- gồm **một hoặc nhiều nhiễm sắc thể** (phân đoạn – vd cúm có 8 đoạn RNA)."},{"h":"2. Capsid và capsomere (slide 13–14)","body":"- **Capsid**: **vỏ protein bao quanh genome** virus.\n- Hình dạng capsid: **hình que/xoắn (rod-shaped/helical)** (virus khảm thuốc lá, dại), **đa diện (polyhedral)** – thường là **khối 20 mặt (icosahedron)** (adenovirus, polio), **phức tạp (complex)** (phage T4, poxvirus).\n- Capsid gồm các **tiểu đơn vị protein gọi là capsomeres**. Một capsomere có thể **gồm một hoặc nhiều protein**. **Cách sắp xếp capsomere là đặc trưng cho từng virus**.\n- **Nucleocapsid** = nucleic acid + capsid. [mở rộng]"},{"h":"3. Envelope và spikes (slide 15–17)","body":"- **Envelope (vỏ bao)**: lớp **bao ngoài capsid**, thường gồm **lipid, protein và carbohydrate**.\n- Envelope có thể có **nguồn gốc từ tế bào chủ** (lipid lấy từ màng chủ khi **nảy chồi**) **hoặc do virus mã hóa** (các protein virus).\n- Tùy loài, envelope có thể được phủ **phức hợp protein–carbohydrate gọi là spikes (gai)** – vd **hemagglutinin (H)** và **neuraminidase (N)** của cúm → tên H1N1, H5N1. [mở rộng]\n- Virus **không có envelope** = **virus trần (non-enveloped/naked)** – vẫn có capsid.\n\n| | Virus có envelope | Virus trần |\n|---|---|---|\n| Lớp ngoài cùng | màng lipid + spikes | capsid protein |\n| Xà phòng, cồn, dung môi lipid | **dễ bất hoạt** | **bền hơn** |\n| Ví dụ | cúm, HIV, herpes, SARS-CoV-2 | norovirus, polio, adenovirus |"},{"h":"4. Chức năng capsid và envelope (slide 18)","body":"- **Giúp virus tiếp xúc và tấn công tế bào** (gắn thụ thể – \"ổ khóa – chìa khóa\").\n- **Bảo vệ nucleic acid** của virus (khỏi enzyme nuclease, môi trường)."},{"h":"5. Virus phức tạp – bacteriophage (slide 19)","body":"- **Bacteriophages (phage)**: virus **tấn công tế bào vi khuẩn**; đặt tên **Type 1 (T1), T2, … T7**.\n- **Phage T-chẵn (T2, T4, T6)** có cấu trúc phức tạp: **đầu (head)** đa diện chứa **dsDNA**; **cổ (collar)**; **bao đuôi (tail sheath)** co rút; **lõi đuôi (tail core)**; **tấm đáy (base plate)**; **sợi đuôi (tail fibers)** gắn vào thụ thể trên thành vi khuẩn. [fig]"}],"extension":[{"h":"Ứng dụng: phage trong công nghiệp và y học","body":"- **Nhiễm phage** là tai họa lớn trong nhà máy **sữa chua, phô mai** (phage *Lactococcus* làm hỏng mẻ lên men) → luân phiên chủng khởi động, vệ sinh CIP.\n- **Liệu pháp phage (phage therapy)** được thử nghiệm để trị vi khuẩn **đa kháng kháng sinh**.\n- Phage lambda, M13 là công cụ **vector nhân dòng** và **phage display** (Nobel Hóa 2018)."}],"keyCards":[{"title":"Genome","bodyEn":"Viral nucleic acid is **DNA or RNA**, **single- or double-stranded**, **linear or circular**, and consists of **one or more chromosomes**.","glossVi":"DNA hoặc RNA."},{"title":"Capsid","bodyEn":"The **capsid** is the protein coat around the genome; shape **rod-shaped (helical), polyhedral or complex**. It is built of protein subunits called **capsomeres** (one or more proteins each); their arrangement is **specific to each virus**.","glossVi":"Capsid từ capsomeres."},{"title":"Envelope and spikes","bodyEn":"An **envelope** covers the capsid; lipids, proteins and carbohydrates; of **host cell origin or virally encoded**. May bear **spikes** (protein–carbohydrate complexes). Functions: **contact/attack the cell** and **protect the nucleic acid**. Complex viruses: **bacteriophages** T1–T7.","glossVi":"Envelope, spikes, phage."}],"traps":["Naked viruses have no capsid","A capsomere is always a single protein","Envelopes are made entirely by the virus"]},{"id":"VIR-03","title":"Viral multiplication: animal viruses, HIV, lytic and lysogenic phage cycles","priority":"H","difficulty":2,"minutes":30,"source":"11.Viruses_Viroids_Prions.pptx: slides 20–34","prereq":[],"hookVi":"Vì sao một tế bào vi khuẩn bị phage T4 tấn công lại vỡ tung sau khoảng 25 phút, giải phóng ~200 phage con; còn tế bào mang phage lambda thì vẫn sống, phân chia bình thường nhiều thế hệ – cho tới khi bị chiếu UV thì đột ngột vỡ hàng loạt? Đó là khác biệt giữa **chu trình tan** và **chu trình tiềm tan**.","predictQuestion":{"stem":"Why can viruses multiply only inside host cells?","options":["They are too small","They lack ribosomes and metabolic machinery","They are killed by oxygen","They have no nucleic acid"],"answer":1,"explanation":"Slide 20: virus **không có ribosome** → không thể tự tổng hợp protein, không thể nhân lên ngoài tế bào chủ."},"lesson":[{"h":"1. Nguyên tắc chung (slide 20–21)","body":"- Virus **chỉ nhân lên trong tế bào chủ**; **không có ribosome** nên không thể nhân lên bên ngoài.\n- Nhận biết tế bào chủ theo cơ chế **\"ổ khóa – chìa khóa\" (lock & key)**: **protein bề mặt virus** khớp với **phân tử thụ thể đặc hiệu** trên tế bào chủ → giải thích **phạm vi vật chủ** và **tính hướng mô**.\n- Cách xâm nhập phụ thuộc loại virus và tế bào:\n  - **Phage T-chẵn**: dùng **bộ máy đuôi** phức tạp **chọc thủng thành vi khuẩn**, bơm DNA vào (capsid ở ngoài).\n  - Một số virus vào bằng **nhập bào (endocytosis)**.\n  - **Virus có envelope**: **hòa màng (fusion)** với màng sinh chất chủ."},{"h":"2. Các bước nhân lên của virus (slide 24–27)","body":"**Bám (attachment) → xâm nhập (penetration/entry) → tháo vỏ (uncoating) → tổng hợp (biosynthesis) → lắp ráp (assembly/maturation) → giải phóng (release)**\n\n- Trong tế bào, **protein virus điều khiển tế bào chủ**, tái lập trình để **sao chép nucleic acid virus** và **tạo protein virus**.\n- **Tế bào chủ cung cấp**: **nucleotide** (tạo nucleic acid virus), **enzyme, ribosome, tRNA, amino acid, ATP** và các thành phần khác để làm protein virus.\n- **Virus DNA** dùng **DNA polymerase của tế bào chủ** để tổng hợp genome từ khuôn DNA virus (theo slide; một số virus DNA lớn như herpes, pox mã hóa polymerase riêng).\n- **Virus RNA** dùng **polymerase của virus** (RNA-dependent RNA polymerase – RdRp) để sao chép genome từ khuôn RNA (tế bào chủ không có enzyme này).\n- Sau khi nucleic acid và capsomere được tạo ra, chúng **lắp ráp ngay** thành virus mới (slide 25).\n- Giải phóng: **ly giải** (virus trần) hoặc **nảy chồi (budding)** – virus có envelope lấy màng chủ làm envelope."},{"h":"3. HIV – retrovirus (slide 29)","body":"1. **gp120** (spike) gắn **thụ thể CD4** (và đồng thụ thể CCR5/CXCR4) trên **tế bào T hỗ trợ**.\n2. **Hòa màng** → capsid vào tế bào chất, tháo vỏ.\n3. **Reverse transcriptase** (phiên mã ngược): **RNA → DNA** (sợi kép).\n4. DNA vào nhân, **integrase** chèn vào nhiễm sắc thể chủ → **provirus** (có thể tiềm ẩn nhiều năm).\n5. Phiên mã → mRNA và RNA genome mới; dịch mã → protein; **protease** cắt protein tiền thân.\n6. Lắp ráp, **nảy chồi** qua màng → virion có en
