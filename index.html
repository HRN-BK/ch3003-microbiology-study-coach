hác nhau.","distractorNotes":["","Đảo hai cột.","Sai.","Quên query dài 471."],"vocab":["percent identity","query cover"],"trap":null,"pool":"learn","source":"","id":"Q-IDT-02-005"},{"unit":"IDT-02","type":"concept","difficulty":2,"stem":"In the lecture example, a 471-nt 16S query shows 100% identity and 100% query cover to several Streptomyces records (S. flaveus and Streptomyces sp.). The best conclusion is:","options":["The isolate is certainly S. flaveus strain X418","The isolate belongs to the genus Streptomyces; this fragment alone cannot resolve the species","The isolate is a fungus","The whole genome is identical to S. flaveus"],"answer":1,"explanation":"Nhiều hit đồng hạng 100% → chỉ chắc cấp **chi**; chỉ so 471 nt, không phải toàn gene/bộ gene.","distractorNotes":["Quá mức.","","Streptomyces là vi khuẩn.","Chỉ 471 nt."],"vocab":["BLAST"],"trap":"100% identity over 471 nt proves the species","pool":"learn","source":"12.Identification of Microorganisms.pptx slides 20–22","id":"Q-IDT-02-006"},{"unit":"IDT-02","type":"concept","difficulty":2,"stem":"What does a smaller E-value in a BLAST result indicate?","options":["A longer sequence","The match is less likely to occur by chance (more significant)","Lower identity","The species is more common"],"answer":1,"explanation":"E-value = số hit tương đương kỳ vọng xuất hiện **ngẫu nhiên**; càng nhỏ càng có ý nghĩa.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["E-value"],"trap":null,"pool":"learn","source":"","id":"Q-IDT-02-007"},{"unit":"IDT-02","type":"recall","difficulty":1,"stem":"Which BLAST program compares a protein query with a protein database?","options":["BLASTN","BLASTP","PCR","Clustal"],"answer":1,"explanation":"**BLASTP** – protein; **BLASTN** – nucleotide.","distractorNotes":["Nucleotide.","","Không phải BLAST.","Căn chỉnh đa trình tự."],"vocab":["BLAST"],"trap":"BLASTP compares nucleotide sequences","pool":"learn","source":"","id":"Q-IDT-02-008"},{"unit":"IDT-02","type":"concept","difficulty":2,"stem":"A node on a phylogenetic tree has a bootstrap value of 90. This means:","options":["the sequences are 90% identical","the clade appeared in 90% of the resampled trees","90% of the species are correct","the branch length is 0.90"],"answer":1,"explanation":"Bootstrap = % lần lặp lấy mẫu lại có xuất hiện nhánh đó – đo **độ tin cậy** của nhánh.","distractorNotes":["Không phải độ giống.","","Sai.","Độ dài nhánh khác."],"vocab":["bootstrap","phylogenetic tree"],"trap":"Bootstrap 90 means 90% similarity","pool":"learn","source":"","id":"Q-IDT-02-009"},{"unit":"IDT-02","type":"recall","difficulty":1,"stem":"Which of the following is a protein-coding gene used as an identification marker in the lecture list?","options":["16S rDNA","ITS","rpoB","25S rDNA"],"answer":2,"explanation":"**rpoB** mã hóa tiểu đơn vị β của RNA polymerase; các marker còn lại là rRNA/vùng đệm.","distractorNotes":["rRNA.","Vùng đệm.","","rRNA."],"vocab":["rpoB"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-02-010","mockSet":2},{"unit":"IDT-02","type":"not","difficulty":2,"stem":"Which is NOT a step in constructing a phylogenetic tree according to the lecture?","options":["Multiple sequence alignment","Choosing evolutionary models and methods","Determining the reliability of the tree","Gram staining the isolate"],"answer":3,"explanation":"Slide 17: căn chỉnh đa trình tự, chọn mô hình/phương pháp, đánh giá độ tin cậy.","distractorNotes":["Có.","Có.","Có.",""],"vocab":["phylogenetic tree"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-02-011","mockSet":3},{"unit":"IDT-02","type":"calc","difficulty":2,"stem":"In the lecture BLAST hit, the subject region 29–499 aligns to the query 1–471. How many positions does the subject region span?","options":["470","471","499","528"],"answer":1,"explanation":"499 − 29 + **1** = **471** (tính cả hai đầu).","distractorNotes":["Quên +1.","","Sai.","Sai."],"vocab":["BLAST"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-02-012","mockSet":2},{"unit":"IDT-02","type":"concept","difficulty":2,"stem":"What is the role of primers in molecular identification?","options":["They stain the cells","They define and allow PCR amplification of the target gene region","They digest DNA","They sequence proteins"],"answer":1,"explanation":"Primer gắn hai đầu vùng đích → **PCR** khuếch đại vùng đó.","distractorNotes":["Sai.","","Enzyme giới hạn.","Sai."],"vocab":["primer","PCR"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-02-013","mockSet":3},{"unit":"IDT-02","type":"not","difficulty":2,"stem":"Which gene is NOT listed in the lecture as a specific gene sequence for identification?","options":["16S rDNA","ITS","rpoB","Insulin gene"],"answer":3,"explanation":"Slide 17: 16S, 23S, 18S, ITS, 25S, rpoB.","distractorNotes":["Có.","Có.","Có.",""],"vocab":["16S rDNA"],"trap":null,"pool":"mock","source":"","id":"Q-IDT-02-014","mockSet":1},{"unit":"APP-01","type":"recall","difficulty":1,"stem":"According to the reference, SCP contains how much protein on a dry-matter basis?","options":["10–20%","30–40%","60–82%","90–99%"],"answer":2,"explanation":"SCP: **60–82% protein** (chất khô).","distractorNotes":["Quá thấp.","Nấm sợi 30–50%.","","SCP không phải protein tinh khiết."],"vocab":["single-cell protein"],"trap":"SCP is pure protein","pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-001"},{"unit":"APP-01","type":"recall","difficulty":1,"stem":"The Pekilo process in Finland produced SCP using which organism?","options":["Methylophilus methylotrophus","Paecilomyces variotii (a filamentous fungus)","Spirulina maxima","Saccharomyces cerevisiae"],"answer":1,"explanation":"**Pekilo**: nấm sợi ***Paecilomyces variotii*** trên đường pentose, dịch thủy phân gỗ, nước thải sulfite.","distractorNotes":["Vi khuẩn methanol.","","Tảo lam.","Nấm men."],"vocab":["Pekilo"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-002"},{"unit":"APP-01","type":"recall","difficulty":1,"stem":"Which SCP source has the LOWEST nucleic acid content according to the reference?","options":["Bacteria","Algae (3–8%)","Fungi (7–10%)","Yeasts"],"answer":1,"explanation":"Tảo **3–8%**; nấm **7–10%**; vi khuẩn cao nhất.","distractorNotes":["Cao nhất.","","Cao hơn tảo.","Cao."],"vocab":[],"trap":"Algae have the highest nucleic acid content","pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-003"},{"unit":"APP-01","type":"concept","difficulty":2,"stem":"SCP is described as deficient in which amino acids, so that supplementation is required when used as feed?","options":["Lysine and threonine","Methionine and cysteine (sulfur-containing)","Glycine and alanine","Glutamate and aspartate"],"answer":1,"explanation":"SCP thiếu amino acid **chứa lưu huỳnh**: **methionine, cysteine**; giàu lysine.","distractorNotes":["SCP giàu lysine, threonine.","","Sai.","Sai."],"vocab":[],"trap":"Fungal SCP is rich in methionine and cysteine","pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-004"},{"unit":"APP-01","type":"recall","difficulty":1,"stem":"Fungi cultivated for SCP contain how much protein according to the reference?","options":["3–8%","30–50%","60–82%","above 90%"],"answer":1,"explanation":"Nấm: **30–50% protein**; amino acid đạt chuẩn FAO.","distractorNotes":["Nucleic acid tảo.","","SCP chung.","Sai."],"vocab":["mycoprotein"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-005"},{"unit":"APP-01","type":"concept","difficulty":2,"stem":"The amino acid profile of bacterial SCP most closely resembles that of:","options":["soy protein","fish protein","wheat gluten","gelatin"],"answer":1,"explanation":"SCP vi khuẩn **giống protein cá**; SCP nấm men **giống protein đậu nành**.","distractorNotes":["Nấm men.","","Sai.","Sai."],"vocab":["single-cell protein"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-006"},{"unit":"APP-01","type":"recall","difficulty":1,"stem":"Methylophilus, a bacterial SCP producer, has a generation time of about:","options":["2 hours","2 days","2 weeks","20 seconds"],"answer":0,"explanation":"Tài liệu: *Methylophilus* spp. có thời gian thế hệ **2 h**.","distractorNotes":["","Sai.","Sai.","Sai."],"vocab":["generation time"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-007"},{"unit":"APP-01","type":"not","difficulty":2,"stem":"Which is NOT a listed advantage of algae as SCP sources?","options":["Protein content up to 70%","Good source of omega-3 fatty acids","Low nucleic acid content (3–8%)","Very fast growth to high density (>50 g/L)"],"answer":3,"explanation":"Tảo **mọc chậm, mật độ thấp (1–2 g/L)** – là nhược điểm.","distractorNotes":["Có.","Có.","Có.",""],"vocab":["algae"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-01-008"},{"unit":"APP-01","type":"recall","difficulty":1,"stem":"Which organism is the source of mycoprotein mentioned in the reference?","options":["Fusarium venenatum","Chlorella vulgaris","Bacillus subtilis","Penicillium chrysogenum"],"answer":0,"explanation":"Mycoprotein từ ***Fusarium venenatum*** – được báo cáo làm giảm insulin và đường huyết.","distractorNotes":["","Tảo.","Vi khuẩn.","Sản xuất penicillin."],"vocab":["mycoprotein"],"trap":null,"pool":"mock","source":"","id":"Q-APP-01-009","mockSet":3},{"unit":"APP-01","type":"not","difficulty":2,"stem":"Which is NOT a component of SCP besides protein, according to the reference?","options":["Carbohydrates","Nucleic acids","Vitamins and minerals","Peptidoglycan-free pure amino acids only"],"answer":3,"explanation":"SCP gồm protein + carbohydrate, nucleic acid, chất béo, khoáng, vitamin; không phải amino acid tinh khiết.","distractorNotes":["Có.","Có.","Có.",""],"vocab":["single-cell protein"],"trap":null,"pool":"mock","source":"","id":"Q-APP-01-010","mockSet":2},{"unit":"APP-01","type":"concept","difficulty":2,"stem":"Why is vitamin B12 mentioned as an advantage of bacterial SCP?","options":["Bacteria cannot make B12","Bacteria are reported to contain high vitamin B12, while algae are rich in vitamin A","B12 is toxic","Only fungi make B12"],"answer":1,"explanation":"Tài liệu: **vi khuẩn giàu B12**, **tảo giàu vitamin A**.","distractorNotes":["Ngược.","","Sai.","Sai."],"vocab":["single-cell protein"],"trap":null,"pool":"mock","source":"","id":"Q-APP-01-011","mockSet":1},{"unit":"APP-01","type":"application","difficulty":2,"stem":"A feed company wants an SCP with the lowest nucleic acid content to reduce uric-acid risk. Which source fits best?","options":["Bacterial SCP","Algal SCP","Fungal SCP","Yeast SCP"],"answer":1,"explanation":"**Tảo 3–8%** nucleic acid – thấp nhất.","distractorNotes":["RNA cao nhất.","","7–10%.","Cao."],"vocab":[],"trap":null,"pool":"mock","source":"","id":"Q-APP-01-012","mockSet":2},{"unit":"APP-02","type":"recall","difficulty":1,"stem":"What proportion of total SCP production cost is typically due to substrates?","options":["5–10%","20–30%","45–75%","over 95%"],"answer":2,"explanation":"Cơ chất = **45–75%** tổng chi phí (chủ yếu nguồn carbon).","distractorNotes":["Sai.","Chất thải nông–công nghiệp.","","Sai."],"vocab":["substrate"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-02-001"},{"unit":"APP-02","type":"concept","difficulty":2,"stem":"What happens if the C:N ratio of the medium is much higher than 10:1?","options":["Ammonia is wasted because it cannot enter cells","Ammonia disappears before all sugars are consumed, so the required biomass is not obtained","Cells grow faster","Nucleic acid content falls to zero"],"answer":1,"explanation":"Thừa C → **amonia cạn trước khi đường được dùng hết** → không đạt sinh khối. (1:1 thì amonia bị lãng phí.)","distractorNotes":["Đó là tỉ lệ 1:1.","","Sai.","Sai."],"vocab":["C:N ratio"],"trap":"A C:N ratio of 1:1 is optimal","pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-02-002"},{"unit":"APP-02","type":"recall","difficulty":1,"stem":"In SCP production, bacteria and filamentous fungi are usually recovered respectively by:","options":["filtration; centrifugation","centrifugation; filtration","distillation; extraction","sedimentation; distillation"],"answer":1,"explanation":"Vi khuẩn nhỏ → **ly tâm**; nấm sợi → **lọc**.","distractorNotes":["Ngược.","","Sai.","Sai."],"vocab":["centrifugation"],"trap":"Filamentous fungi are recovered by centrifugation","pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-02-003"},{"unit":"APP-02","type":"recall","difficulty":1,"stem":"Solid-state fermentation for SCP uses substrates such as wheat or rice bran spread on flat beds at a moisture level of:","options":["5–10%","20–30%","60–65%","95–100%"],"answer":2,"explanation":"Độ ẩm **60–65%**.","distractorNotes":["Quá khô.","Sai.","","Là lên men chìm."],"vocab":["solid-state fermentation"],"trap":"Solid-state fermentation needs no moisture","pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-02-004"},{"unit":"APP-02","type":"concept","difficulty":2,"stem":"Why is high nucleic acid content the main anti-nutritional factor of SCP?","options":["It causes vitamin deficiency","It raises serum uric acid, which can lead to kidney stones","It is indigestible fiber","It lowers protein content to zero"],"answer":1,"explanation":"Nucleic acid (purine) → **acid uric** huyết thanh ↑ → **sỏi thận**.","distractorNotes":["Sai.","","Đó là thành tế bào.","Sai."],"vocab":["uric acid"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-02-005"},{"unit":"APP-02","type":"not","difficulty":2,"stem":"Which statement about submerged fermentation for SCP (as described in the reference) is NOT correct?","options":["The substrate is in liquid form with all nutrients","It is carried out in a fermenter operated continuously","Aeration and cooling are needed because heat is generated","It uses dry bran on flat trays with 60–65% moisture"],"answer":3,"explanation":"Khay cám ẩm 60–65% là **lên men rắn**.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["submerged fermentation"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-02-006"},{"unit":"APP-02","type":"recall","difficulty":1,"stem":"Using agro-industrial wastes for SCP production reduces their biological oxygen demand (BOD) by almost:","options":["10%","30%","80%","100%"],"answer":2,"explanation":"Giảm BOD **gần 80%** và giảm chi phí xử lý.","distractorNotes":["Sai.","Sai.","","Sai."],"vocab":["BOD"],"trap":null,"pool":"learn","source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021)","id":"Q-APP-02-007"},{"unit":"APP-02","type":"concept","difficulty":2,"stem":"Why are hydrocarbons considered a problematic substrate for SCP?","options":["They contain no carbon","They are non-renewable, expensive (30–70% of cost) and politically controversial because they are also fuels","They are toxic to all bacteria","They contain too much nitrogen"],"answer":1,"explanation":"Hydrocarbon từ khí/dầu **không tái tạo**, đắt, cạnh tranh nhiên liệu.","distractorNotes":["Sai.","","Nhiều vi khuẩn dùng được.","Sai."],"vocab":["substrate"],"trap":null,"pool":"mock","source":"","id":"Q-APP-02-008","mockSet":3},{"unit":"APP-02","type":"recall","difficulty":1,"stem":"According to the reference, semisolid fermentation for SCP:","options":["requires low investment","requires high capital investment and operating cost; a U-loop fermenter is used to study mass and energy transport","uses no oxygen","is only used for algae"],"answer":1,"explanation":"Lên men bán rắn: **vốn và chi phí vận hành cao**; **U-loop fermenter**.","distractorNotes":["Ngược.","","Sai.","Sai."],"vocab":["semisolid fermentation"],"trap":null,"pool":"mock","source":"","id":"Q-APP-02-009","mockSet":1},{"unit":"APP-02","type":"not","difficulty":2,"stem":"Which is NOT listed as a limitation of bacterial SCP?","options":["High RNA content","Risk of contamination","Endotoxins","Very low protein content (below 10%)"],"answer":3,"explanation":"Vi khuẩn có protein **cao**; hạn chế là RNA, nhiễm tạp, nội độc tố.","distractorNotes":["Có.","Có.","Có.",""],"vocab":["endotoxin"],"trap":null,"pool":"mock","source":"","id":"Q-APP-02-010","mockSet":1},{"unit":"APP-02","type":"calc","difficulty":2,"stem":"A batch culture's dry biomass rises from 2 to 14 g/L while the substrate falls from 50 to 20 g/L. What is the biomass yield on substrate consumed (Yx/s)?","options":["0.28 g/g","0.40 g/g","0.47 g/g","0.70 g/g"],"answer":1,"explanation":"Y = (14 − 2)/(50 − 20) = 12/30 = **0,40 g/g**.","distractorNotes":["Dùng 14/50 – sai cơ sở.","","Dùng 14/30.","Sai."],"vocab":["biomass yield"],"trap":null,"pool":"mock","source":"","id":"Q-APP-02-011","mockSet":1},{"unit":"APP-02","type":"calc","difficulty":2,"stem":"100 kg of dry biomass contains 45% protein, and processing retains 90% of the protein. How much protein remains in the product?","options":["40.5 kg","45 kg","50 kg","90 kg"],"answer":0,"explanation":"100 × 0,45 × 0,90 = **40,5 kg**.","distractorNotes":["","Quên hệ số thu hồi.","Sai.","Sai."],"vocab":["single-cell protein"],"trap":null,"pool":"learn","source":"","id":"Q-APP-02-012"},{"unit":"APP-03","type":"recall","difficulty":1,"stem":"Which yeast gave the highest ethanol concentration (26.8 g/L, Y = 0.43) from Azolla hydrolysate?","options":["Saccharomyces cerevisiae","Pichia stipitis","Kluyveromyces marxianus","Candida lusitaniae"],"answer":2,"explanation":"***K. marxianus*** – dùng hết cả glucose và xylose trong 60 h.","distractorNotes":["Thấp nhất.","Trung bình.","","Thứ hai (23,2 g/L)."],"vocab":["Kluyveromyces marxianus"],"trap":null,"pool":"learn","source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","id":"Q-APP-03-001"},{"unit":"APP-03","type":"concept","difficulty":2,"stem":"Why did Saccharomyces cerevisiae give the lowest ethanol yield from Azolla hydrolysate?","options":["It was killed by acid","It utilized only glucose and left the xylose unused","It produced lactic acid","It needs light"],"answer":1,"explanation":"*S. cerevisiae* (chủng tự nhiên) **chỉ dùng glucose**; 33,2 g/L xylose còn lại.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["xylose"],"trap":"S. cerevisiae ferments xylose well","pool":"learn","source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","id":"Q-APP-03-002"},{"unit":"APP-03","type":"calc","difficulty":2,"stem":"What is the theoretical maximum yield of ethanol from glucose (MW glucose 180.16, ethanol 46.07)?","options":["0.256 g/g","0.511 g/g","1.000 g/g","2.000 g/g"],"answer":1,"explanation":"2 × 46,07 / 180,16 = **0,511 g/g**.","distractorNotes":["Chỉ tính 1 mol ethanol.","","Quên CO₂.","Nhầm mol với gam."],"vocab":["theoretical yield"],"trap":"Theoretical yield is 1 g ethanol per g glucose","pool":"learn","source":"","id":"Q-APP-03-003"},{"unit":"APP-03","type":"concept","difficulty":2,"stem":"In alcoholic fermentation, what is the main role of converting acetaldehyde to ethanol?","options":["To produce extra ATP","To regenerate NAD+ so glycolysis can continue","To fix CO2","To make pyruvate"],"answer":1,"explanation":"Bước acetaldehyde → ethanol dùng NADH, **tái sinh NAD⁺**; ATP (2 ròng) đến từ đường phân.","distractorNotes":["Không tạo ATP.","","Sai – tạo CO₂ ở bước trước.","Sai."],"vocab":["NAD+"],"trap":"The ethanol step produces extra ATP","pool":"learn","source":"","id":"Q-APP-03-004"},{"unit":"APP-03","type":"recall","difficulty":1,"stem":"Azolla filiculoides, used as ethanol feedstock, is:","options":["a brown alga","a floating aquatic fern living in symbiosis with the nitrogen-fixing cyanobacterium Anabaena azollae","a yeast","a cyanobacterium"],"answer":1,"explanation":"*Azolla* là **dương xỉ thủy sinh nổi**, cộng sinh ***Anabaena azollae***.","distractorNotes":["Sai.","","Sai.","Anabaena mới là vi khuẩn lam."],"vocab":["Azolla"],"trap":"Azolla is an alga","pool":"learn","source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","id":"Q-APP-03-005"},{"unit":"APP-03","type":"recall","difficulty":1,"stem":"The optimal thermal acid hydrolysis conditions for Azolla in the study were:","options":["50 mM HCl, 30 °C, 10 min","14% (w/v) slurry, 200 mM H2SO4, 121 °C, 60 min","250 mM HNO3, 100 °C, 5 h","No acid, 37 °C"],"answer":1,"explanation":"14% w/v, **200 mM H₂SO₄**, **121 °C, 60 phút** → 16,7 g/L đường đơn.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["pretreatment"],"trap":null,"pool":"learn","source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","id":"Q-APP-03-006"},{"unit":"APP-03","type":"recall","difficulty":1,"stem":"Which enzyme preparation was selected for saccharification, producing 61.6 g/L monosaccharides at 16 U/mL?","options":["Celluclast","Viscozyme","Cellic C-Tec2","Amylase"],"answer":1,"explanation":"**Viscozyme** (cellulase + hemicellulase), 16 U/mL, 48 h.","distractorNotes":["Thấp hơn.","","Thấp nhất.","Không dùng."],"vocab":["saccharification"],"trap":null,"pool":"learn","source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","id":"Q-APP-03-007"},{"unit":"APP-03","type":"calc","difficulty":2,"stem":"100 g glucose is supplied; 80 g is consumed and 36 g ethanol is formed. What is the ethanol yield on sugar CONSUMED, and what % of the theoretical maximum (0.511 g/g) is this?","options":["0.36 g/g; 70%","0.45 g/g; 88%","0.45 g/g; 45%","0.80 g/g; 157%"],"answer":1,"explanation":"36/80 = **0,45 g/g**; 0,45/0,511 = **88%**. (Trên đường ban đầu: 0,36 g/g ≈ 70%.)","distractorNotes":["Đó là trên đường ban đầu.","","Nhầm % lý thuyết.","Sai."],"vocab":["ethanol yield"],"trap":null,"pool":"learn","source":"","id":"Q-APP-03-008"},{"unit":"APP-03","type":"concept","difficulty":2,"stem":"In the Azolla study, the ethanol yield coefficient Y_EtOH was calculated as:","options":["max ethanol / sugar consumed","max ethanol / total initial monosaccharides (glucose + xylose)","ethanol / biomass","CO2 / glucose"],"answer":1,"explanation":"Phương trình 3: **[EtOH]max / [đường đơn ban đầu]**.","distractorNotes":["Không phải cơ sở của bài.","","Sai.","Sai."],"vocab":["ethanol yield"],"trap":null,"pool":"mock","source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","id":"Q-APP-03-009","mockSet":2},{"unit":"APP-03","type":"recall","difficulty":1,"stem":"The process used in the Azolla study, where saccharification is done first and fermentation afterwards, is called:","options":["SSF (simultaneous saccharification and fermentation)","SHF (separate hydrolysis and fermentation)","Solid-state fermentation","Continuous culture"],"answer":1,"explanation":"Bài báo dùng **SHF**.","distractorNotes":["Đồng thời.","","Khác khái niệm.","Sai."],"vocab":["SHF"],"trap":null,"pool":"mock","source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","id":"Q-APP-03-010","mockSet":3},{"unit":"APP-03","type":"not","difficulty":2,"stem":"Which statement about the Azolla ethanol study is NOT correct?","options":["Fermentation was semianaerobic at 30 °C","Ethanol was measured by HPLC","K. marxianus consumed glucose and xylose completely within 60 h","S. cerevisiae fermented xylose better than all other yeasts"],"answer":3,"explanation":"*S. cerevisiae* **không dùng xylose**.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["xylose"],"trap":null,"pool":"mock","source":"","id":"Q-APP-03-011","mockSet":3},{"unit":"APP-03","type":"calc","difficulty":2,"stem":"A fermentation starts with 61 g/L total monosaccharides and reaches a maximum of 26.8 g/L ethanol. Y_EtOH on initial sugar is about:","options":["0.22 g/g","0.37 g/g","0.44 g/g","0.51 g/g"],"answer":2,"explanation":"26,8 / 61 ≈ **0,44 g/g** (bài báo làm tròn 0,43 với 61,6 g/L).","distractorNotes":["Sai.","Sai.","","Giới hạn lý thuyết."],"vocab":["ethanol yield"],"trap":null,"pool":"mock","source":"","id":"Q-APP-03-012","mockSet":2},{"unit":"APP-04","type":"recall","difficulty":1,"stem":"The nucleus of natural penicillin (6-APA) consists of:","options":["a thiazolidine ring fused to a β-lactam ring","two β-lactam rings","a benzene ring and a lactone","a peptidoglycan fragment"],"answer":0,"explanation":"**6-APA** = vòng **thiazolidine** ngưng tụ với vòng **β-lactam**.","distractorNotes":["","Sai.","Sai.","Sai."],"vocab":["6-APA","beta-lactam ring"],"trap":null,"pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-001"},{"unit":"APP-04","type":"recall","difficulty":1,"stem":"Adding phenylacetic acid to a P. chrysogenum fermentation causes the fungus to produce:","options":["penicillin K","penicillin F","penicillin G","penicillin V"],"answer":2,"explanation":"Tiền chất **phenylacetic acid → penicillin G** (thay vì penicillin K). Phenoxyacetic → penicillin V.","distractorNotes":["Không có tiền chất.","P. notatum.","","Phenoxyacetic acid."],"vocab":["precursor"],"trap":null,"pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-002"},{"unit":"APP-04","type":"recall","difficulty":1,"stem":"Industrial penicillin is produced by:","options":["anaerobic batch fermentation in bottles","aerobic fed-batch submerged fermentation in stirred tank fermenters","solid-state fermentation on bran","continuous chemostat culture"],"answer":1,"explanation":"**Hiếu khí, fed-batch, lên men chìm, bồn khuấy**.","distractorNotes":["Lịch sử, dễ nhiễm.","","Sai.","Khó do chủng không ổn định."],"vocab":["fed-batch"],"trap":"Penicillin production is anaerobic","pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-003"},{"unit":"APP-04","type":"concept","difficulty":2,"stem":"During penicillin recovery, the filtered broth is acidified to pH 2.0–2.5 and extracted quickly into butyl acetate. Why quickly?","options":["Butyl acetate evaporates","Penicillin is quite unstable at low pH","The mycelium regrows","Penicillin becomes insoluble in solvents"],"answer":1,"explanation":"Penicillin **kém bền ở pH thấp** → chiết ngay (Podbielniak ngược dòng).","distractorNotes":["Không phải lý do chính.","","Đã loại hệ sợi.","Ngược: acid hóa giúp tan vào dung môi."],"vocab":["extraction"],"trap":"Penicillin is extracted into solvent at pH 7.5","pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-004"},{"unit":"APP-04","type":"concept","difficulty":2,"stem":"Why is contamination such a serious problem in penicillin fermentation?","options":["Contaminants produce too much penicillin","Many microorganisms produce penicillinase (β-lactamase) that destroys penicillin","Contaminants lower the temperature","Penicillin kills the fungus"],"answer":1,"explanation":"**Penicillinase** thủy phân vòng β-lactam → mất hoạt tính; vi sinh vật có enzyme này phân bố rộng.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["penicillinase"],"trap":null,"pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-005"},{"unit":"APP-04","type":"recall","difficulty":1,"stem":"Which carbon source is traditionally used in penicillin production media?","options":["Lactose","Methanol","Cellulose","Starch-free paraffin"],"answer":0,"explanation":"**Lactose** (dùng chậm); glucose, sucrose, glycerol, sorbitol cũng có thể dùng.","distractorNotes":["","Sai.","Sai.","Sai."],"vocab":[],"trap":null,"pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-006"},{"unit":"APP-04","type":"concept","difficulty":2,"stem":"What is the role of corn steep liquor in penicillin media?","options":["It is the side-chain precursor only","It supplies amino acids and minerals that support abundant mycelium and spore formation","It inhibits contamination","It lowers pH for extraction"],"answer":1,"explanation":"Dịch ngâm ngô chứa **amino acid** cần cho hệ sợi và **khoáng** (K, P, Mg, S, Zn, Cu).","distractorNotes":["Không chỉ vậy.","","Sai.","Sai."],"vocab":["corn steep liquor"],"trap":null,"pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-007"},{"unit":"APP-04","type":"concept","difficulty":2,"stem":"How are semi-synthetic penicillins made?","options":["By adding more lactose","Penicillin acylase removes the natural acyl side chain to give 6-APA, to which new acyl groups are attached","β-lactamase opens the β-lactam ring","By UV mutation of the fungus"],"answer":1,"explanation":"**Penicillin acylase** (cố định, từ *E. coli*) cắt chuỗi bên → **6-APA** → gắn chuỗi bên mới.","distractorNotes":["Sai.","","β-lactamase làm mất hoạt tính.","Đó là cải tiến chủng."],"vocab":["penicillin acylase","semi-synthetic penicillin"],"trap":"Penicillinase removes the side chain to give 6-APA","pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-008"},{"unit":"APP-04","type":"recall","difficulty":1,"stem":"The biosynthesis of penicillin starts from which three amino acids?","options":["Glycine, alanine, serine","L-α-aminoadipic acid, L-cysteine, L-valine","Lysine, arginine, histidine","Phenylalanine, tyrosine, tryptophan"],"answer":1,"explanation":"**AAA + cysteine + valine → ACV** (không qua ribosome).","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["ACV tripeptide"],"trap":null,"pool":"learn","source":"","id":"Q-APP-04-009"},{"unit":"APP-04","type":"recall","difficulty":1,"stem":"Charcoal treatment of crude sodium penicillin is used to remove:","options":["water","pyrogens (fever-causing substances)","the β-lactam ring","sodium ions"],"answer":1,"explanation":"Than hoạt tính loại **pyrogen**; lọc Seitz loại vi khuẩn.","distractorNotes":["Sai.","","Sẽ mất hoạt tính.","Sai."],"vocab":["pyrogen"],"trap":null,"pool":"learn","source":"Week-15 Penicillin reference","id":"Q-APP-04-010"},{"unit":"APP-04","type":"calc","difficulty":2,"stem":"Three sequential recovery steps retain 90%, 80% and 95% of the penicillin entering each step. What is the overall recovery?","options":["88.3%","68.4%","80.0%","265%"],"answer":1,"explanation":"0,90 × 0,80 × 0,95 = **0,684 = 68,4%** (nhân, không lấy trung bình).","distractorNotes":["Lấy trung bình – sai.","","Sai.","Cộng – sai."],"vocab":["recovery"],"trap":null,"pool":"learn","source":"","id":"Q-APP-04-011"},{"unit":"APP-04","type":"recall","difficulty":1,"stem":"High-yielding P. chrysogenum strains are genetically unstable. Which is a preservation method mentioned?","options":["Storing spores at room temperature in broth","Spore suspension frozen under liquid nitrogen","Autoclaving the spores","Storing mycelium in 70% ethanol"],"answer":1,"explanation":"Nitơ lỏng; đông khô; trộn đất/cát vô trùng rồi làm khô.","distractorNotes":["Sai.","","Diệt bào tử.","Diệt."],"vocab":["strain preservation"],"trap":null,"pool":"mock","source":"","id":"Q-APP-04-012","mockSet":1},{"unit":"APP-04","type":"not","difficulty":2,"stem":"Which statement about penicillin fermentation is NOT correct according to the reference?","options":["It is aerobic with 0.5–1.0 vvm aeration","Temperature is maintained around 25–27 °C","Fermenters of 40,000–200,000 L are used","Continuous fermentation is standard because strains are very stable"],"answer":3,"explanation":"Lên men liên tục **khó** vì chủng **không ổn định**; thay bằng batch fill and draw.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["fed-batch"],"trap":null,"pool":"mock","source":"","id":"Q-APP-04-013","mockSet":2},{"unit":"APP-04","type":"concept","difficulty":2,"stem":"After extraction into organic solvent, penicillin is back-extracted into water by:","options":["lowering pH to 1","adding KOH or NaOH to raise pH to 7.0–7.5","heating to 121 °C","adding more butyl acetate"],"answer":1,"explanation":"Nâng **pH 7,0–7,5** → muối penicillin ion hóa tan vào nước.","distractorNotes":["Sai.","","Phá penicillin.","Sai."],"vocab":["extraction"],"trap":null,"pool":"mock","source":"","id":"Q-APP-04-014","mockSet":2},{"unit":"APP-04","type":"not","difficulty":2,"stem":"Which is NOT an improvement of semi-synthetic penicillins over natural ones mentioned in the reference?","options":["Acid stability","Resistance to β-lactamases","Expanded antimicrobial effectiveness","Activity against viruses"],"answer":3,"explanation":"Penicillin không có tác dụng với virus.","distractorNotes":["Có.","Có.","Có.",""],"vocab":["semi-synthetic penicillin"],"trap":null,"pool":"mock","source":"","id":"Q-APP-04-015","mockSet":1},{"unit":"APP-04","type":"calc","difficulty":2,"stem":"In a fed-batch, penicillin is 10 g/L in 1 L at t0 and 8 g/L in 2 L later. How much penicillin (g) is in the fermenter at each time?","options":["10 g then 8 g (decreased)","10 g then 16 g (increased)","10 g then 4 g","20 g then 16 g"],"answer":1,"explanation":"m = C × V: 10 × 1 = 10 g; 8 × 2 = **16 g** – tổng lượng **tăng** dù nồng độ giảm do pha loãng.","distractorNotes":["Nhầm nồng độ với khối lượng.","","Sai.","Sai."],"vocab":["fed-batch"],"trap":null,"pool":"mock","source":"","id":"Q-APP-04-016","mockSet":3}],"workedExamples":[{"id":"WE-01","unit":"CTL-01","title":"D-value and survivors after heating","problem":"A milk sample contains 2 × 10⁶ CFU/mL of a heat-resistant vegetative bacterium. At 65 °C its D-value is 3 min.\n(a) How many log reductions are achieved by holding for 15 min?\n(b) How many CFU/mL survive?\n(c) How long would be needed to reach 1 CFU/mL?","steps":[{"prompt":"Log reductions = t / D = 15 / 3 = ?","answer":5,"input":"number","hint":"Chia thời gian cho D"},{"prompt":"log N₀ = log(2 × 10⁶) = ? (2 decimals)","answer":6.3,"input":"number","hint":"log 2 = 0,30"},{"prompt":"log N = log N₀ − 5 = ?","answer":1.3,"input":"number"},{"prompt":"N = 10^1.30 ≈ ? CFU/mL","answer":20,"input":"number","hint":"10^1,3 ≈ 20"},{"prompt":"Time to reach log N = 0: t = D × (log N₀ − 0) = 3 × 6.30 = ? min","answer":18.9,"input":"number"}],"finalAnswer":"(a) 5 log; (b) ≈ 20 CFU/mL; (c) ≈ 18.9 min.","explanationVi":"Luôn làm việc với **log**: số log giảm = t/D. Nhớ log(2 × 10⁶) = 6,30 chứ không phải 6.","fadeLevels":{"0":[],"1":[4],"2":[2,3,4],"3":"all"}},{"id":"WE-02","unit":"CTL-01","title":"Designing a 12D canning process","problem":"Spores of Clostridium botulinum have D₁₂₁ = 0.25 min. A cannery wants a 12D process.\n(a) What holding time at 121 °C is required?\n(b) If one can initially contains 10³ spores, what is the expected number of survivors per can after the 12D process?\n(c) Out of how many cans would you expect one to contain a surviving spore?","steps":[{"prompt":"Holding time = 12 × D = ? min","answer":3.0,"input":"number"},{"prompt":"log survivors per can = 3 − 12 = ?","answer":-9,"input":"number"},{"prompt":"Survivors per can = 10^−9. Expected cans per survivor = 10^? ","answer":9,"input":"number"}],"finalAnswer":"(a) 3.0 min; (b) 10⁻⁹ spores per can; (c) about 1 can in 10⁹ (one billion).","explanationVi":"Mô hình log không đạt 0 → tiệt trùng được hiểu là **xác suất sống sót rất nhỏ**. 10⁻⁹ bào tử/hộp nghĩa là trung bình 1 tỉ hộp có 1 hộp còn bào tử.","fadeLevels":{"0":[],"1":[2],"2":[0,1,2],"3":"all"}},{"id":"WE-03","unit":"GRO-05","title":"Generation time from the lecture example","problem":"A fermenter contains bacteria in the growth phase: 10⁴ cells/mL at 6 h and 10⁸ cells/mL at 10 h.\nCalculate (a) the number of generations and (b) the generation time. Use log 2 = 0.301.","steps":[{"prompt":"t − t₀ = ? h","answer":4,"input":"number"},{"prompt":"log Nt − log N₀ = ?","answer":4,"input":"number"},{"prompt":"n = (log Nt − log N₀)/log 2 = ? (1 decimal)","answer":13.3,"input":"number","hint":"4 / 0,301"},{"prompt":"g = (t − t₀)/n = ? h (3 decimals)","answer":0.301,"input":"number"},{"prompt":"Convert g to minutes = ? min","answer":18.06,"input":"number","hint":"0,301 × 60"}],"finalAnswer":"n ≈ 13.3 generations; g = 0.301 h ≈ 18 min.","explanationVi":"Công thức gộp: g = log 2 × Δt / Δlog N = 0,301 × 4/4 = 0,301 h. Đây đúng là ví dụ slide 9.","fadeLevels":{"0":[],"1":[4],"2":[2,3,4],"3":"all"}},{"id":"WE-04","unit":"GRO-05","title":"Generation time from counts that are not powers of ten","problem":"During exponential growth a culture has 3.0 × 10⁵ cells/mL at 1.0 h and 2.4 × 10⁷ cells/mL at 4.0 h.\nFind the number of generations and the generation time (minutes). log 2 = 0.301.","steps":[{"prompt":"log N₀ = log(3.0 × 10⁵) = ? (2 decimals)","answer":5.48,"input":"number","hint":"log 3 = 0,477"},{"prompt":"log Nt = log(2.4 × 10⁷) = ? (2 decimals)","answer":7.38,"input":"number","hint":"log 2,4 = 0,380"},{"prompt":"Δlog N = ? (2 decimals)","answer":1.9,"input":"number"},{"prompt":"n = Δlog N / 0.301 = ? (1 decimal)","answer":6.3,"input":"number"},{"prompt":"g = 180 min / n = ? min","answer":28.5,"input":"number","hint":"180 / 6,32"}],"finalAnswer":"n ≈ 6.3 generations; g ≈ 28.5 min.","explanationVi":"Kiểm tra nhanh: Nt/N₀ = 80 ≈ 2^6,32 → hợp lý. Sai lầm thường gặp: quên đổi 3 h sang 180 phút, hoặc lấy log sai phần định trị.","fadeLevels":{"0":[],"1":[4],"2":[2,3,4],"3":"all"}},{"id":"WE-05","unit":"GRO-05","title":"Predicting cell numbers in food left at room temperature","problem":"Cooked rice contains 200 cells/g of Bacillus cereus. At 30 °C its generation time is 30 min and the lag phase lasts 1 h.\nEstimate the number of cells after 5 h at 30 °C, assuming exponential growth after the lag.","steps":[{"prompt":"Time in exponential phase = 5 − 1 = ? h","answer":4,"input":"number"},{"prompt":"Number of generations n = 4 h / 0.5 h = ?","answer":8,"input":"number"},{"prompt":"2ⁿ = ?","answer":256,"input":"number"},{"prompt":"Nt = 200 × 256 = ? cells/g","answer":51200,"input":"number"}],"finalAnswer":"About 5.1 × 10⁴ cells/g after 5 h.","explanationVi":"Trừ pha lag trước khi tính số thế hệ. Nếu không có pha lag, kết quả sẽ là 200 × 2¹⁰ = 204.800 – gấp 4 lần.","fadeLevels":{"0":[],"1":[3],"2":[1,2,3],"3":"all"}},{"id":"WE-06","unit":"GRO-06","title":"Serial dilution and plate count","problem":"A milk sample is diluted by transferring 1 mL into 9 mL of saline six times in series (10⁻¹ to 10⁻⁶). 0.1 mL of each of the 10⁻⁴, 10⁻⁵ and 10⁻⁶ dilutions is spread on plates, giving 1,850, 176 and 21 colonies.\n(a) Which plate is countable? (b) Calculate CFU/mL of the milk.","steps":[{"prompt":"Countable range is 30–300. Which dilution? (answer as the exponent, e.g., −5)","answer":-5,"input":"number"},{"prompt":"Volume plated × dilution = 0.1 × 10⁻⁵ = 10^? ","answer":-6,"input":"number"},{"prompt":"CFU/mL = 176 / 10⁻⁶ = ? × 10⁸ (2 decimals)","answer":1.76,"input":"number"}],"finalAnswer":"The 10⁻⁵ plate (176 colonies) → 1.76 × 10⁸ CFU/mL.","explanationVi":"Nhớ nhân thêm hệ số của thể tích cấy 0,1 mL (×10). Đĩa 21 khuẩn lạc < 30 nên không dùng.","fadeLevels":{"0":[],"1":[2],"2":[0,1,2],"3":"all"}},{"id":"WE-07","unit":"GRO-06","title":"Petroff-Hausser count with dilution","problem":"A bacterial culture is diluted 1:10. In a Petroff-Hausser chamber (400 small squares over 1 mm², depth 0.02 mm), 5 randomly chosen large squares (each = 16 small squares) contain a total of 48 cells.\nFind the concentration in the original culture.","steps":[{"prompt":"Area counted = 5 large squares × (1/25 mm²) = ? mm²","answer":0.2,"input":"number"},{"prompt":"Volume counted = 0.2 mm² × 0.02 mm = ? mm³","answer":0.004,"input":"number"},{"prompt":"Convert to mL: 0.004 mm³ = ? × 10⁻⁶ mL","answer":4,"input":"number"},{"prompt":"Cells/mL in diluted sample = 48 / (4 × 10⁻⁶) = ? × 10⁷","answer":1.2,"input":"number"},{"prompt":"Original = × 10 → ? × 10⁸ cells/mL","answer":1.2,"input":"number"}],"finalAnswer":"1.2 × 10⁸ cells/mL in the original culture.","explanationVi":"Luôn tính **đúng thể tích thực sự đã đếm** (5 ô lớn chứ không phải toàn lưới), rồi mới nhân hệ số pha loãng.","fadeLevels":{"0":[],"1":[4],"2":[2,3,4],"3":"all"}},{"id":"WE-08","unit":"GRO-06","title":"Reading an MPN result","problem":"Five tubes each were inoculated with 10 mL, 1 mL and 0.1 mL of a water sample. Positive tubes: 5, 3, 1.\nThe 5-tube MPN table gives an index of 110 MPN/100 mL for the combination 5-3-1 (95% limits 40–300).\n(a) What does \"5-3-1\" mean? (b) Estimate bacteria per mL.","steps":[{"prompt":"How many tubes were positive at the 1 mL level?","answer":3,"input":"number"},{"prompt":"MPN per 100 mL = ?","answer":110,"input":"number"},{"prompt":"MPN per mL = 110/100 = ?","answer":1.1,"input":"number"}],"finalAnswer":"5 of 5 tubes at 10 mL, 3 of 5 at 1 mL, 1 of 5 at 0.1 mL were positive; MPN ≈ 110/100 mL ≈ 1.1/mL (95% CI 40–300/100 mL).","explanationVi":"MPN là **ước lượng thống kê** – luôn báo kèm khoảng tin cậy; không phải số đếm chính xác.","fadeLevels":{"0":[],"1":[2],"2":[0,1,2],"3":"all"}},{"id":"WE-09","unit":"GRO-07","title":"From % transmittance to cell density","problem":"An E. coli culture diluted 1:4 reads 20% transmittance at 600 nm. Use OD = 2 − log(%T), log 20 = 1.301, and OD600 = 1 ≈ 8 × 10⁸ cells/mL.\n(a) OD of the diluted sample? (b) Is it in the reliable range (≤ 0.7)? (c) Cell density of the undiluted culture?","steps":[{"prompt":"OD = 2 − 1.301 = ? (3 decimals)","answer":0.699,"input":"number"},{"prompt":"Is OD ≤ 0.7? (1 = yes, 0 = no)","answer":1,"input":"number"},{"prompt":"Cells/mL in diluted sample = 0.699 × 8 × 10⁸ = ? × 10⁸ (2 decimals)","answer":5.59,"input":"number"},{"prompt":"Undiluted = × 4 → ? × 10⁹ cells/mL (2 decimals)","answer":2.24,"input":"number"}],"finalAnswer":"OD ≈ 0.70 (just within range); undiluted ≈ 2.2 × 10⁹ cells/mL.","explanationVi":"Khi đo mẫu đã pha loãng, **nhân lại hệ số pha loãng**. Nếu OD > 0,7 phải pha loãng thêm rồi đo lại.","fadeLevels":{"0":[],"1":[3],"2":[1,2,3],"3":"all"}},{"id":"WE-10","unit":"GRO-07","title":"Reading a growth curve and finding g from OD data","problem":"OD600 readings of a batch culture (OD proportional to cell number):\nt (h):   0     1     2     3     4     5     6     7\nOD600: 0.020 0.021 0.040 0.080 0.160 0.320 0.450 0.460\n(a) Identify the lag phase. (b) Find the generation time during log phase. (c) When does stationary phase begin?","steps":[{"prompt":"The lag phase ends at t = ? h","answer":1,"input":"number"},{"prompt":"From 2 h to 5 h, OD increases from 0.040 to 0.320: fold increase = ?","answer":8,"input":"number"},{"prompt":"Number of generations n = log₂ 8 = ?","answer":3,"input":"number"},{"prompt":"g = 3 h / 3 = ? h","answer":1,"input":"number"},{"prompt":"Stationary phase begins at about t = ? h","answer":6,"input":"number"}],"finalAnswer":"Lag 0–1 h; log phase 1–5 h with g = 1 h (OD doubles each hour); stationary from about 6 h.","explanationVi":"Trong pha log, OD **gấp đôi sau mỗi g**. Nhận diện pha log bằng các khoảng thời gian bằng nhau có hệ số tăng bằng nhau.","fadeLevels":{"0":[],"1":[4],"2":[2,3,4],"3":"all"}},{"id":"WE-11","unit":"VIR-03","title":"Phage titer by plaque assay","problem":"A phage lysate is serially diluted. 0.1 mL of the 10^-7 dilution mixed with host E. coli in soft agar gives 62 plaques. Find the titer (PFU/mL).","steps":[{"prompt":"Volume plated (mL)?","answer":0.1,"input":"number"},{"prompt":"Dilution factor of the plated tube (as a number, e.g. 1e-7)?","answer":1e-07,"input":"number"},{"prompt":"Amount of original lysate plated (mL) = volume × dilution?","answer":1e-08,"input":"number"},{"prompt":"Titer = plaques / amount of original lysate (PFU/mL)?","answer":6200000000.0,"input":"number"}],"finalAnswer":"6.2 × 10^9 PFU/mL","explanationVi":"Tính như CFU: PFU/mL = số plaque / (thể tích × độ pha loãng) = 62 / (0,1 × 10⁻⁷) = 62 / 10⁻⁸ = 6,2 × 10⁹.","fadeLevels":{"0":[],"1":[3],"2":[1,2,3],"3":"all"}},{"id":"WE-12","unit":"IDT-01","title":"Computing a biochemical kit profile code","problem":"A 15-test kit is read in 5 groups of 3 tests with weights 4, 2, 1. Results (+/−) by group: G1: + + −; G2: + + +; G3: − + +; G4: + − −; G5: − + +. Find the 5-digit code.","steps":[{"prompt":"Group 1 digit (4+2)?","answer":6,"input":"number"},{"prompt":"Group 2 digit?","answer":7,"input":"number"},{"prompt":"Group 3 digit?","answer":3,"input":"number"},{"prompt":"Group 4 digit?","answer":4,"input":"number"},{"prompt":"Group 5 digit?","answer":3,"input":"number"},{"prompt":"Full code (5 digits as a number)?","answer":67343,"input":"number"}],"finalAnswer":"67343","explanationVi":"Mỗi nhóm cộng trọng số của phản ứng dương: 4+2=6; 4+2+1=7; 2+1=3; 4; 2+1=3 → mã 67343 rồi tra bảng của bộ kit. Không cộng gộp cả 15 phản ứng thành một số.","fadeLevels":{"0":[],"1":[5],"2":[3,4,5],"3":"all"}},{"id":"WE-13","unit":"IDT-02","title":"Reading a BLAST alignment","problem":"A 16S query is 520 nt long. The best hit aligns query positions 21–520 (no gaps) with 495 identical positions. Compute the alignment length, query cover and percent identity.","steps":[{"prompt":"Alignment length (nt) = 520 − 21 + 1?","answer":500,"input":"number"},{"prompt":"Query cover (%) = 500/520 × 100?","answer":96.15,"input":"number"},{"prompt":"Percent identity (%) = 495/500 × 100?","answer":99,"input":"number"},{"prompt":"Is 99% identity over 96% cover enough to name the species with certainty?","answer":"no","input":"choice","choices":["yes","no"]}],"finalAnswer":"Alignment 500 nt; query cover ≈ 96.2%; identity 99%; species not certain","explanationVi":"Độ dài căn chỉnh tính cả hai đầu. Identity và query cover có mẫu số khác nhau. 99% trên 16S thường chỉ gợi ý chi/loài gần – cần so với chủng chuẩn, gene khác và kiểu hình.","fadeLevels":{"0":[],"1":[3],"2":[1,2,3],"3":"all"}},{"id":"WE-14","unit":"APP-02","title":"Biomass yield and recovered protein","problem":"A yeast batch culture (constant volume) goes from 1.5 to 21.5 g/L dry biomass while glucose falls from 60 to 10 g/L. The harvested biomass (dry) contains 48% protein and downstream processing keeps 85% of the protein. Find Yx/s and the protein in the product per litre of culture.","steps":[{"prompt":"Biomass formed (g/L) = 21.5 − 1.5?","answer":20,"input":"number"},{"prompt":"Substrate consumed (g/L) = 60 − 10?","answer":50,"input":"number"},{"prompt":"Yx/s (g/g)?","answer":0.4,"input":"number"},{"prompt":"Protein in harvested biomass (g/L) = 21.5 × 0.48?","answer":10.32,"input":"number"},{"prompt":"Protein kept after processing (g/L) = 10.32 × 0.85?","answer":8.772,"input":"number"}],"finalAnswer":"Yx/s = 0.40 g/g; ≈ 8.77 g protein per litre","explanationVi":"Hiệu suất sinh khối dùng phần **tạo thêm** chia phần **đã tiêu thụ**. Protein thu được = sinh khối khô × phần protein × hệ số thu hồi (dùng số thập phân: 48% = 0,48).","fadeLevels":{"0":[],"1":[4],"2":[2,3,4],"3":"all"}},{"id":"WE-15","unit":"APP-03","title":"Ethanol yield on two bases and % of theoretical","problem":"A batch starts with 120 g/L glucose. At the end, 20 g/L glucose remains and ethanol is 45 g/L (none at the start). MW glucose 180.16, ethanol 46.07.","steps":[{"prompt":"Theoretical yield (g/g) = 2 × 46.07 / 180.16?","answer":0.5114,"input":"number","hint":"Tính đến 4 chữ số thập phân."},{"prompt":"Glucose consumed (g/L)?","answer":100,"input":"number"},{"prompt":"Yield on glucose consumed (g/g)?","answer":0.45,"input":"number"},{"prompt":"% of theoretical on consumed basis = 0.45/0.5114 × 100?","answer":88.0,"input":"number"},{"prompt":"Yield on initial glucose (g/g) = 45/120?","answer":0.375,"input":"number"},{"prompt":"% of theoretical on initial basis?","answer":73.3,"input":"number"}],"finalAnswer":"Y consumed = 0.45 g/g (88% of theoretical); Y initial = 0.375 g/g (73.3%)","explanationVi":"Luôn ghi rõ mẫu số: đường **đã tiêu thụ** hay **ban đầu**. Giới hạn 0,511 g/g < 1 vì một nửa khối lượng carbon đi ra dạng CO₂.","fadeLevels":{"0":[],"1":[5],"2":[3,4,5],"3":"all"}},{"id":"WE-16","unit":"APP-04","title":"Fed-batch mass balance and overall recovery","problem":"A fed-batch penicillin fermenter holds 50,000 L at 4 g/L at 96 h. Feeding raises the volume to 60,000 L and the titre to 6 g/L at 160 h. Recovery then runs: filtration 95%, solvent extraction 85%, back-extraction 90%, crystallization 92%.","steps":[{"prompt":"Penicillin at 96 h (kg) = 4 g/L × 50,000 L ÷ 1000?","answer":200,"input":"number"},{"prompt":"Penicillin at 160 h (kg)?","answer":360,"input":"number"},{"prompt":"Net increase (kg)?","answer":160,"input":"number"},{"prompt":"Overall recovery (fraction) = 0.95 × 0.85 × 0.90 × 0.92?","answer":0.6686,"input":"number","hint":"Nhân các hệ số, làm tròn 4 chữ số."},{"prompt":"Crystalline penicillin obtained (kg) from 360 kg?","answer":240.7,"input":"number"}],"finalAnswer":"360 kg in broth; overall recovery ≈ 66.9%; ≈ 241 kg product","explanationVi":"Khi thể tích thay đổi, dùng khối lượng m = C × V chứ không so nồng độ. Thu hồi chung là **tích** các bước: 0,95 × 0,85 × 0,90 × 0,92 ≈ 0,669 → 360 × 0,669 ≈ 240,7 kg.","fadeLevels":{"0":[],"1":[4],"2":[2,3,4],"3":"all"}}],"flashcards":[{"unit":"HIS-01","kind":"fact","front":"Who named \"cells\" and in what year?","back":"Robert Hooke, 1665 (cork slices).","id":"F-HIS-01-001"},{"unit":"HIS-01","kind":"fact","front":"Who first observed living microorganisms?","back":"Anton van Leeuwenhoek, 1673 – \"animalcules\" (single-lens microscope).","id":"F-HIS-01-002"},{"unit":"HIS-01","kind":"number","front":"Resolution limit of a light microscope?","back":"About 0.2 μm (200 nm).","id":"F-HIS-01-003"},{"unit":"HIS-01","kind":"trap","front":"TRUE/FALSE: Hooke saw living bacteria in cork.","back":"FALSE – he saw empty cell walls of dead cork cells.","id":"F-HIS-01-004"},{"unit":"HIS-02","kind":"fact","front":"Needham (1745) vs Spallanzani (1765): who supported spontaneous generation?","back":"Needham. Spallanzani heated broth after sealing and saw no growth.","id":"F-HIS-02-001"},{"unit":"HIS-02","kind":"fact","front":"Who proposed biogenesis and when?","back":"Rudolf Virchow, 1858.","id":"F-HIS-02-002"},{"unit":"HIS-02","kind":"fact","front":"What did Pasteur's S-neck flask prove (1861)?","back":"Microbes in air contaminate broth; air itself does not produce microbes.","id":"F-HIS-02-003"},{"unit":"HIS-02","kind":"trap","front":"TRUE/FALSE: Pasteur's flasks were sealed.","back":"FALSE – open to air; the curved neck trapped dust.","id":"F-HIS-02-004"},{"unit":"HIS-02","kind":"fact","front":"Why did Redi's result not end the debate?","back":"Many believed microorganisms were simple enough to arise from nonliving matter.","id":"F-HIS-02-005"},{"unit":"HIS-03","kind":"number","front":"Years of the Golden Age of Microbiology?","back":"1857–1914.","id":"F-HIS-03-001"},{"unit":"HIS-03","kind":"fact","front":"What did Lister use on surgical wounds?","back":"Phenol (carbolic acid) solution – 1860s.","id":"F-HIS-03-002"},{"unit":"HIS-03","kind":"fact","front":"Bassi (1835) vs Pasteur (1865): agents of silkworm disease?","back":"Bassi: a fungus. Pasteur: a protozoan.","id":"F-HIS-03-003"},{"unit":"HIS-03","kind":"fact","front":"Koch's postulates in 4 words?","back":"Find in every case – isolate (pure culture) – reproduce disease – re-isolate.","id":"F-HIS-03-004"},{"unit":"HIS-03","kind":"trap","front":"TRUE/FALSE: pasteurization kills endospores.","back":"FALSE – it only kills spoilage organisms and pathogens; it does not sterilize.","id":"F-HIS-03-005"},{"unit":"HIS-04","kind":"fact","front":"Ehrlich 1910: drug and disease?","back":"Salvarsan (arsenic derivative) against syphilis.","id":"F-HIS-04-001"},{"unit":"HIS-04","kind":"fact","front":"Fleming 1928: organism and product?","back":"Penicillium notatum (P. chrysogenum) → penicillin; industrial after 1940.","id":"F-HIS-04-002"},{"unit":"HIS-04","kind":"fact","front":"Pasteur 1880 vaccine principle?","back":"Chicken cholera bacteria cultured long in the lab lost virulence but still gave immunity.","id":"F-HIS-04-003"},{"unit":"HIS-04","kind":"fact","front":"Two drug groups found after 1930?","back":"Dye derivatives and sulfonamides (synthetic).","id":"F-HIS-04-004"},{"unit":"HIS-04","kind":"trap","front":"TRUE/FALSE: antibiotics can cure the flu.","back":"FALSE – influenza is viral; antibiotics act on bacterial targets.","id":"F-HIS-04-005"},{"unit":"BAC-01","kind":"number","front":"Typical size of a bacterium?","back":"0.2–2.0 μm in diameter, 2–8 μm long.","id":"F-BAC-01-001"},{"unit":"BAC-01","kind":"fact","front":"Division planes → arrangement of cocci?","back":"1 plane: diplo/strepto; 2 planes: tetrad; 3 planes: sarcinae; random: staphylo.","id":"F-BAC-01-002"},{"unit":"BAC-01","kind":"fact","front":"Vibrio vs spirillum vs spirochete?","back":"Curved rod / rigid helix with external flagella / flexible helix with axial filaments.","id":"F-BAC-01-003"},{"unit":"BAC-01","kind":"trap","front":"TRUE/FALSE: every rod-shaped bacterium is in the genus Bacillus.","back":"FALSE – bacillus is a shape; Bacillus is one genus.","id":"F-BAC-01-004"},{"unit":"BAC-02","kind":"fact","front":"Capsule vs slime layer?","back":"Capsule: organized, firmly attached. Slime layer: unorganized, loose.","id":"F-BAC-02-001"},{"unit":"BAC-02","kind":"fact","front":"Four bacteria given as capsule examples?","back":"Streptococcus pneumoniae, Bacillus anthracis, Streptococcus mutans, Klebsiella pneumoniae.","id":"F-BAC-02-002"},{"unit":"BAC-02","kind":"fact","front":"Three parts of a flagellum?","back":"Filament (flagellin), hook, basal body.","id":"F-BAC-02-003"},{"unit":"BAC-02","kind":"number","front":"How many pili per cell (lecture)?","back":"Only 1 or 2.","id":"F-BAC-02-004"},{"unit":"BAC-02","kind":"trap","front":"TRUE/FALSE: fimbriae are used for swimming.","back":"FALSE – attachment. Flagella swim; axial filaments give corkscrew motion.","id":"F-BAC-02-005"},{"unit":"BAC-03","kind":"fact","front":"Peptidoglycan backbone and bond?","back":"Alternating NAG and NAM, β-1,4 glycosidic bonds; 10–65 units per chain.","id":"F-BAC-03-001"},{"unit":"BAC-03","kind":"fact","front":"Four amino acids of the side chain (lecture notes)?","back":"L-alanine, D-glutamate, diaminopimelic acid (DAP), D-alanine.","id":"F-BAC-03-002"},{"unit":"BAC-03","kind":"fact","front":"Penicillin target?","back":"Transpeptidase – the enzyme that makes peptide cross-bridges.","id":"F-BAC-03-003"},{"unit":"BAC-03","kind":"number","front":"Mycolic acid content of the Mycobacterium wall?","back":"About 60%.","id":"F-BAC-03-004"},{"unit":"BAC-03","kind":"trap","front":"TRUE/FALSE: lipoteichoic acid links to peptidoglycan only.","back":"FALSE – lipoteichoic acid links to the plasma membrane; wall teichoic acid links to peptidoglycan.","id":"F-BAC-03-005"},{"unit":"BAC-04","kind":"fact","front":"Four steps of the Gram stain?","back":"Crystal violet → iodine → alcohol/acetone → safranin.","id":"F-BAC-04-001"},{"unit":"BAC-04","kind":"fact","front":"Three parts of LPS?","back":"Lipid A (endotoxin), core polysaccharide, O polysaccharide (O antigen).","id":"F-BAC-04-002"},{"unit":"BAC-04","kind":"fact","front":"Effects of lipid A in the host?","back":"Fever, dilation of blood vessels, shock, blood clotting.","id":"F-BAC-04-003"},{"unit":"BAC-04","kind":"fact","front":"Name 5 things the outer membrane blocks.","back":"Detergents, heavy metals, bile salts, certain dyes, antibiotics (penicillin), lysozyme.","id":"F-BAC-04-004"},{"unit":"BAC-04","kind":"trap","front":"TRUE/FALSE: Mycoplasma is Gram-negative because it has a thin wall.","back":"FALSE – Mycoplasma has no cell wall; its membrane contains sterols.","id":"F-BAC-04-005"},{"unit":"BAC-05","kind":"fact","front":"Peripheral vs integral membrane proteins?","back":"Peripheral: catalyze reactions, support. Integral: transport channels.","id":"F-BAC-05-001"},{"unit":"BAC-05","kind":"fact","front":"Three agents that damage the bacterial membrane?","back":"Alcohols, quaternary ammonium compounds, polymyxin.","id":"F-BAC-05-002"},{"unit":"BAC-05","kind":"fact","front":"Electron donors of purple sulfur bacteria?","back":"Sulfide, thiosulfate (some: H2, Fe2+, NO2−); no O2 released; sulfur granules formed.","id":"F-BAC-05-003"},{"unit":"BAC-05","kind":"fact","front":"Hypo-, iso-, hypertonic: water direction?","back":"Hypotonic: in (swell/lysis). Isotonic: no net. Hypertonic: out (plasmolysis).","id":"F-BAC-05-004"},{"unit":"BAC-05","kind":"trap","front":"TRUE/FALSE: facilitated diffusion requires ATP.","back":"FALSE – it is passive; it only needs a carrier protein.","id":"F-BAC-05-005"},{"unit":"BAC-06","kind":"fact","front":"Seven inclusions in the lecture?","back":"Volutin, polysaccharide granules, lipid inclusions, sulfur granules, carboxysomes, gas vacuoles, magnetosomes.","id":"F-BAC-06-001"},{"unit":"BAC-06","kind":"fact","front":"Stains for volutin, polysaccharide and lipid inclusions?","back":"Methylene blue (red), iodine, Sudan dye.","id":"F-BAC-06-002"},{"unit":"BAC-06","kind":"number","front":"Ribosome sizes: bacteria vs eukaryotes?","back":"70S (30S + 50S) vs 80S (40S + 60S).","id":"F-BAC-06-003"},{"unit":"BAC-06","kind":"fact","front":"Two endospore-forming genera?","back":"Bacillus and Clostridium.","id":"F-BAC-06-004"},{"unit":"BAC-06","kind":"trap","front":"TRUE/FALSE: endospore formation increases cell number.","back":"FALSE – one cell makes one endospore.","id":"F-BAC-06-005"},{"unit":"BAC-07","kind":"fact","front":"Four modes of bacterial reproduction?","back":"Binary fission, budding (Hyphomicrobium), fragmentation, conidiospores (actinomycetes).","id":"F-BAC-07-001"},{"unit":"BAC-07","kind":"fact","front":"Six criteria for Bergey's phenotypic groups?","back":"Gram reaction, cell shape, arrangement, oxygen requirement, motility, nutrition/metabolism.","id":"F-BAC-07-002"},{"unit":"BAC-07","kind":"fact","front":"Weakness of phenotypic classification?","back":"It does not provide a clear evolutionary history.","id":"F-BAC-07-003"},{"unit":"BAC-07","kind":"fact","front":"Gram reactions of Firmicutes, Actinobacteria, Deinococcus-Thermus, Proteobacteria?","back":"Gram+, Gram+, Gram+, mostly Gram−.","id":"F-BAC-07-004"},{"unit":"BAC-08","kind":"fact","front":"Pseudomurein vs peptidoglycan?","back":"Pseudomurein has NAT (N-acetyl talosaminuronic acid) instead of NAM and no D-amino acids.","id":"F-BAC-08-001"},{"unit":"BAC-08","kind":"fact","front":"Archaeal vs bacterial membrane lipids?","back":"Archaea: ether-linked branched isoprenoids (can form monolayers). Bacteria: ester-linked fatty acids.","id":"F-BAC-08-002"},{"unit":"BAC-08","kind":"fact","front":"Three main physiological groups of archaea?","back":"Methanogens, extreme halophiles, extreme thermophiles.","id":"F-BAC-08-003"},{"unit":"BAC-08","kind":"trap","front":"TRUE/FALSE: Halobacterium belongs to the domain Bacteria.","back":"FALSE – it is an archaeon.","id":"F-BAC-08-004"},{"unit":"FUN-01","kind":"fact","front":"Three polysaccharides of the yeast wall?","back":"Glucan (β-1,3/β-1,6), mannan (α-1,6 with α-1,2/α-1,3), chitin (β-1,4, bud scars).","id":"F-FUN-01-001"},{"unit":"FUN-01","kind":"fact","front":"Two periplasmic enzymes of yeast?","back":"Invertase (sucrose → glucose + fructose) and phosphatase.","id":"F-FUN-01-002"},{"unit":"FUN-01","kind":"number","front":"Chromosome number of haploid S. cerevisiae?","back":"16 linear chromosomes.","id":"F-FUN-01-003"},{"unit":"FUN-01","kind":"fact","front":"Mitochondrial inner membrane enzymes (lecture)?","back":"NADH dehydrogenase, succinate dehydrogenase, ATP synthase.","id":"F-FUN-01-004"},{"unit":"FUN-01","kind":"trap","front":"TRUE/FALSE: yeast ribosomes are 70S like bacteria.","back":"FALSE – cytoplasmic yeast ribosomes are 80S.","id":"F-FUN-01-005"},{"unit":"FUN-02","kind":"number","front":"2 acetyl-CoA through the citric acid cycle give?","back":"4 CO2, 6 NADH, 2 FADH2, 2 ATP.","id":"F-FUN-02-001"},{"unit":"FUN-02","kind":"fact","front":"Ethanol fermentation equation?","back":"C6H12O6 → 2 C2H5OH + 2 CO2 (net 2 ATP from glycolysis).","id":"F-FUN-02-002"},{"unit":"FUN-02","kind":"fact","front":"S. cerevisiae life cycle in one line?","back":"Haploid α + haploid a → diploid zygote (buds) → meiosis → 4 haploid ascospores in an ascus.","id":"F-FUN-02-003"},{"unit":"FUN-02","kind":"fact","front":"Budding vs fission yeasts?","back":"Saccharomyces cerevisiae buds; Schizosaccharomyces pombe divides by fission.","id":"F-FUN-02-004"},{"unit":"FUN-02","kind":"trap","front":"TRUE/FALSE: only haploid yeast cells can bud.","back":"FALSE – both haploid and diploid cells bud by mitosis.","id":"F-FUN-02-005"},{"unit":"FUN-03","kind":"fact","front":"Chamber vs plate count – 2 slide keywords?","back":"Time & materials (chamber fast, cheap) and dead cells (chamber counts them; plates count viable only).","id":"F-FUN-03-001"},{"unit":"FUN-03","kind":"number","front":"Volume over 1 mm² of a 0.1 mm deep chamber?","back":"0.1 mm³ = 10⁻⁴ mL.","id":"F-FUN-03-002"},{"unit":"FUN-03","kind":"fact","front":"Yeast spores vs bacterial endospores?","back":"Yeast spores: reproductive (sexual/asexual). Endospores: survival only.","id":"F-FUN-03-003"},{"unit":"FUN-03","kind":"fact","front":"Methylene blue result?","back":"Live cells colorless (reduce the dye); dead cells blue.","id":"F-FUN-03-004"},{"unit":"FUN-04","kind":"fact","front":"Septate vs coenocytic hyphae?","back":"Septate: cross-walls, cell-like units (Aspergillus, Penicillium). Coenocytic: no septa, multinucleate (Rhizopus, Mucor).","id":"F-FUN-04-001"},{"unit":"FUN-04","kind":"fact","front":"Where do hyphae grow?","back":"At the tips; any fragment can grow into a new hypha.","id":"F-FUN-04-002"},{"unit":"FUN-04","kind":"fact","front":"Vegetative vs aerial hypha?","back":"Vegetative: obtains nutrients. Aerial: projects above the medium, bears spores.","id":"F-FUN-04-003"},{"unit":"FUN-04","kind":"trap","front":"TRUE/FALSE: mold hyphae have peptidoglycan walls.","back":"FALSE – chitin.","id":"F-FUN-04-004"},{"unit":"FUN-05","kind":"fact","front":"Three asexual spores of molds?","back":"Sporangiospores (in a sporangium), conidiospores (not enclosed), zoospores (flagellated).","id":"F-FUN-05-001"},{"unit":"FUN-05","kind":"fact","front":"Three phases of sexual reproduction?","back":"Plasmogamy → karyogamy → meiosis.","id":"F-FUN-05-002"},{"unit":"FUN-05","kind":"fact","front":"Sexual spores and phyla?","back":"Zygospore – Zygomycota (Rhizopus); ascospore – Ascomycota (Neurospora); basidiospore – Basidiomycota (mushrooms, Itajahya).","id":"F-FUN-05-003"},{"unit":"FUN-05","kind":"fact","front":"Mushroom hierarchy?","back":"Basidiocarp → gills → basidia → basidiospores.","id":"F-FUN-05-004"},{"unit":"FUN-05","kind":"trap","front":"TRUE/FALSE: basidiospores form inside the basidium.","back":"FALSE – outside; ascospores form inside the ascus.","id":"F-FUN-05-005"},{"unit":"FUN-06","kind":"fact","front":"Lichen partners?","back":"A fungus + a green alga or cyanobacterium.","id":"F-FUN-06-001"},{"unit":"FUN-06","kind":"fact","front":"Three lichen forms?","back":"Crustose (crust), foliose (leaflike), fruticose (shrubby).","id":"F-FUN-06-002"},{"unit":"FUN-06","kind":"fact","front":"Two ways to quantify molds?","back":"Spore quantification (chamber/CFU) and biomass quantification (dry weight).","id":"F-FUN-06-003"},{"unit":"CTL-01","kind":"fact","front":"Sterilization vs disinfection vs antisepsis?","back":"Sterilization: all microbes incl. spores. Disinfection: pathogenic vegetative cells on objects. Antisepsis: disinfection of living tissue.","id":"F-CTL-01-001"},{"unit":"CTL-01","kind":"fact","front":"Four factors affecting killing?","back":"Number of microbes; microbial characteristics (spores); environment (fats/proteins protect, low pH helps); time of exposure.","id":"F-CTL-01-002"},{"unit":"CTL-01","kind":"fact","front":"Formula linking time, D and logs?","back":"t = D × (log N₀ − log N).","id":"F-CTL-01-003"},{"unit":"CTL-01","kind":"number","front":"12D time if D121 = 0.2 min?","back":"2.4 min.","id":"F-CTL-01-004"},{"unit":"CTL-01","kind":"trap","front":"TRUE/FALSE: 90% kill per minute means 900,000 die every minute.","back":"FALSE – a constant fraction dies; the number killed falls each minute.","id":"F-CTL-01-005"},{"unit":"CTL-02","kind":"number","front":"Autoclave conditions?","back":"121 °C, ~1 atm (15 psi) above atmospheric, ~15 min.","id":"F-CTL-02-001"},{"unit":"CTL-02","kind":"number","front":"Three milk pasteurization regimes?","back":"63 °C/30 min; HTST 72 °C/15 s; UHT 140 °C/<1 s.","id":"F-CTL-02-002"},{"unit":"CTL-02","kind":"number","front":"Hot-air oven sterilization?","back":"170 °C for 2 hours.","id":"F-CTL-02-003"},{"unit":"CTL-02","kind":"fact","front":"Moist vs dry heat mechanisms?","back":"Moist: breaks H-bonds, coagulates proteins. Dry: oxidation.","id":"F-CTL-02-004"},{"unit":"CTL-02","kind":"trap","front":"TRUE/FALSE: autoclave pressure is what kills the microbes.","back":"FALSE – pressure raises the steam temperature to 121 °C.","id":"F-CTL-02-005"},{"unit":"CTL-03","kind":"fact","front":"What is filtration used for (4 examples)?","back":"Heat-sensitive materials: some culture media, enzymes, vaccines, antibiotic solutions.","id":"F-CTL-03-001"},{"unit":"CTL-03","kind":"fact","front":"Ionizing radiation: examples, λ, mechanism?","back":"Gamma, X-rays, electron beams; <1 nm; ionize water into free radicals that damage DNA.","id":"F-CTL-03-002"},{"unit":"CTL-03","kind":"number","front":"UV wavelength most absorbed by DNA?","back":"260 nm → thymine dimers.","id":"F-CTL-03-003"},{"unit":"CTL-03","kind":"trap","front":"TRUE/FALSE: desiccation kills bacteria.","back":"FALSE – they stay viable; this is the basis of lyophilization.","id":"F-CTL-03-004"},{"unit":"CTL-04","kind":"fact","front":"Phenol vs triclosan mechanism?","back":"Phenol: damages lipid membrane → leakage. Triclosan: inhibits lipid biosynthesis enzyme.","id":"F-CTL-04-001"},{"unit":"CTL-04","kind":"fact","front":"What is Betadine?","back":"Povidone-iodine, an iodophor: iodine + N-vinylpyrrolidone polymer; releases iodine slowly; skin/wounds.","id":"F-CTL-04-002"},{"unit":"CTL-04","kind":"fact","front":"Why can't alcohols sterilize?","back":"They do not kill endospores (or non-enveloped viruses).","id":"F-CTL-04-003"},{"unit":"CTL-04","kind":"fact","front":"Heavy metals target?","back":"Sulfhydryl (–SH) groups of proteins → denaturation.","id":"F-CTL-04-004"},{"unit":"CTL-04","kind":"trap","front":"TRUE/FALSE: 100% ethanol works better than 70%.","back":"FALSE – water is needed for protein denaturation.","id":"F-CTL-04-005"},{"unit":"CTL-05","kind":"fact","front":"Quats are most effective against?","back":"Gram-positive bacteria (less against Gram-negative); act on permeability.","id":"F-CTL-05-001"},{"unit":"CTL-05","kind":"fact","front":"Nisin vs natamycin?","back":"Nisin: bacteriocin vs endospore-forming bacteria in cheese. Natamycin (pimaricin): antifungal.","id":"F-CTL-05-002"},{"unit":"CTL-05","kind":"number","front":"Cidex (2% glutaraldehyde) times?","back":"Bactericidal, tuberculocidal, virucidal in 10 min; sporicidal in 3–10 h.","id":"F-CTL-05-003"},{"unit":"CTL-05","kind":"number","front":"Deep freezing and freeze-drying conditions?","back":"Glycerol 10–30%, −70 to −95 °C; freeze-drying −54 to −72 °C, vacuum, sealed, ≥10 years.","id":"F-CTL-05-004"},{"unit":"CTL-05","kind":"fact","front":"Aldehyde target groups?","back":"–NH2, –OH, –COOH, –SH on proteins (covalent cross-links).","id":"F-CTL-05-005"},{"unit":"GRO-01","kind":"fact","front":"Five temperature groups?","back":"Psychrophiles (~15 °C), psychrotrophs (grow 0–7 °C), mesophiles (25–40 °C), thermophiles (50–60 °C), hyperthermophiles (≥80 °C).","id":"F-GRO-01-001"},{"unit":"GRO-01","kind":"number","front":"pH optimum: bacteria vs yeasts/molds?","back":"Bacteria 6.5–7.5 (few below 4); yeasts/molds 5–6.","id":"F-GRO-01-002"},{"unit":"GRO-01","kind":"number","front":"Facultative halophiles tolerate?","back":"Up to 2% salt; a few up to 15%.","id":"F-GRO-01-003"},{"unit":"GRO-01","kind":"trap","front":"TRUE/FALSE: refrigeration sterilizes food.","back":"FALSE – it is bacteriostatic; psychrotrophs still grow.","id":"F-GRO-01-004"},{"unit":"GRO-02","kind":"fact","front":"Carbon fraction of bacterial dry weight?","back":"About one half.","id":"F-GRO-02-001"},{"unit":"GRO-02","kind":"fact","front":"Uses of N, S, P?","back":"N: proteins, nucleic acids. S: S-amino acids, thiamine, biotin. P: nucleic acids, phospholipids, ATP.","id":"F-GRO-02-002"},{"unit":"GRO-02","kind":"fact","front":"Nitrogen fixers in the lecture?","back":"Cyanobacteria; free-living soil bacteria; symbionts of legume roots (clover, soybean, alfalfa, beans, peas).","id":"F-GRO-02-003"},{"unit":"GRO-02","kind":"fact","front":"Examples of organic growth factors?","back":"Vitamins (coenzymes), amino acids, purines, pyrimidines.","id":"F-GRO-02-004"},{"unit":"GRO-03","kind":"fact","front":"Five oxygen groups and tube positions?","back":"Obligate aerobe: top. Facultative: throughout, densest top. Obligate anaerobe: bottom. Aerotolerant: evenly. Microaerophile: narrow band below surface.","id":"F-GRO-03-001"},{"unit":"GRO-03","kind":"fact","front":"SOD and catalase reactions?","back":"SOD: 2 O2•− + 2H+ → H2O2 + O2. Catalase: 2 H2O2 → 2 H2O + O2.","id":"F-GRO-03-002"},{"unit":"GRO-03","kind":"fact","front":"Anaerobic jar gas reaction (slide)?","back":"NaHCO3 + NaBH4 + H2O → H2 + CO2; H2 + O2 → H2O on palladium.","id":"F-GRO-03-003"},{"unit":"GRO-03","kind":"trap","front":"TRUE/FALSE: aerotolerant anaerobes respire with O2.","back":"FALSE – they ferment; they only tolerate O2 (SOD).","id":"F-GRO-03-004"},{"unit":"GRO-04","kind":"fact","front":"Four criteria of a culture medium?","back":"Right nutrients; moisture, pH, oxygen; initially sterile; proper incubation temperature.","id":"F-GRO-04-001"},{"unit":"GRO-04","kind":"number","front":"Agar melting and solidifying temperatures?","back":"Melts ~100 °C; stays liquid until below ~40 °C.","id":"F-GRO-04-002"},{"unit":"GRO-04","kind":"fact","front":"Reducing, selective, differential, enrichment media?","back":"Reducing: thioglycolate removes O2. Selective: suppress unwanted. Differential: colonies look different. Enrichment: raise small numbers to detectable levels (usually liquid).","id":"F-GRO-04-003"},{"unit":"GRO-04","kind":"trap","front":"TRUE/FALSE: enrichment medium and differential medium mean the same.","back":"FALSE.","id":"F-GRO-04-004"},{"unit":"GRO-05","kind":"fact","front":"Formula for generation time?","back":"g = log 2 × (t − t₀) / (log Nt − log N₀); n = (log Nt − log N₀)/log 2.","id":"F-GRO-05-001"},{"unit":"GRO-05","kind":"number","front":"Lecture example result?","back":"10⁴ at 6 h → 10⁸ at 10 h: g = 0.301 h (~18 min).","id":"F-GRO-05-002"},{"unit":"GRO-05","kind":"number","front":"Typical generation time of most bacteria?","back":"1–3 h; some > 24 h.","id":"F-GRO-05-003"},{"unit":"GRO-05","kind":"fact","front":"Four phases of a batch growth curve?","back":"Lag, log (exponential), stationary, death (decline).","id":"F-GRO-05-004"},{"unit":"GRO-05","kind":"trap","front":"TRUE/FALSE: cells are inactive in the lag phase.","back":"FALSE – they are metabolically active, making enzymes; they just don't divide much.","id":"F-GRO-05-005"},{"unit":"GRO-06","kind":"number","front":"Petroff-Hausser dimensions?","back":"25 × 16 = 400 small squares; 1 mm²; depth 0.02 mm; volume 2 × 10⁻⁵ mL.","id":"F-GRO-06-001"},{"unit":"GRO-06","kind":"fact","front":"CFU/mL formula?","back":"Colonies ÷ (volume plated in mL × dilution).","id":"F-GRO-06-002"},{"unit":"GRO-06","kind":"number","front":"Countable plate range?","back":"30–300 colonies.","id":"F-GRO-06-003"},{"unit":"GRO-06","kind":"fact","front":"MPN principle?","back":"The more bacteria, the more dilution needed before no tubes grow; read from an MPN table.","id":"F-GRO-06-004"},{"unit":"GRO-06","kind":"trap","front":"TRUE/FALSE: MPN gives an exact count.","back":"FALSE – it is a statistical estimate.","id":"F-GRO-06-005"},{"unit":"GRO-07","kind":"fact","front":"OD formula?","back":"OD = 2 − log(%T).","id":"F-GRO-07-001"},{"unit":"GRO-07","kind":"number","front":"OD600 = 1 corresponds to?","back":"~8 × 10⁸ E. coli/mL; ~3 × 10⁷ S. cerevisiae/mL. Dilute if OD > 0.7.","id":"F-GRO-07-002"},{"unit":"GRO-07","kind":"fact","front":"Dry weight steps?","back":"Centrifuge → wash → dry to constant mass → weigh.","id":"F-GRO-07-003"},{"unit":"GRO-07","kind":"fact","front":"Six steps to construct a batch growth curve?","back":"Activate inoculum; prepare liquid medium; inoculate; cultivate; sample periodically until biomass declines; plot biomass vs time.","id":"F-GRO-07-004"},{"unit":"PRO-01","kind":"fact","front":"Four protist supergroups?","back":"Excavata, SAR, Archaeplastida, Unikonta.","id":"F-PRO-01-001"},{"unit":"PRO-01","kind":"fact","front":"Three nutritional forms of protists?","back":"Photoautotrophs, heterotrophs, mixotrophs.","id":"F-PRO-01-002"},{"unit":"PRO-01","kind":"fact","front":"Fungi vs algae vs protozoa nutrition?","back":"Fungi: chemoheterotroph (absorb). Algae: photoautotroph. Protozoa: chemoheterotroph (absorb or ingest).","id":"F-PRO-01-003"},{"unit":"PRO-01","kind":"trap","front":"TRUE/FALSE: all algae are multicellular.","back":"FALSE – only some.","id":"F-PRO-01-004"},{"unit":"PRO-02","kind":"fact","front":"Mitosome vs hydrogenosome?","back":"Mitosome (Giardia): no functional ETC. Hydrogenosome (Trichomonas): anaerobic energy, releases H2.","id":"F-PRO-02-001"},{"unit":"PRO-02","kind":"fact","front":"Giardia features?","back":"Two equal nuclei, multiple flagella, mitosomes; intestinal parasite; cyst ↔ trophozoite.","id":"F-PRO-02-002"},{"unit":"PRO-02","kind":"fact","front":"Trypanosoma brucei vs T. cruzi?","back":"Sleeping sickness vs Chagas disease.","id":"F-PRO-02-003"},{"unit":"PRO-02","kind":"number","front":"Trichomonas vaginalis infections per year (lecture)?","back":"About 140 million.","id":"F-PRO-02-004"},{"unit":"PRO-02","kind":"trap","front":"TRUE/FALSE: the kinetoplast is a nucleus.","back":"FALSE – it is DNA inside a large mitochondrion.","id":"F-PRO-02-005"},{"unit":"PRO-03","kind":"fact","front":"Brown algae pigments (lecture)?","back":"Fucoxanthin (main, brown, absorbs blue-green/green, masks chlorophyll), chlorophyll a & c, minor violaxanthin, β-carotene.","id":"F-PRO-03-001"},{"unit":"PRO-03","kind":"fact","front":"Oomycetes vs true fungi?","back":"Oomycetes: cellulose walls, diploid dominant, biflagellated zoospores. Fungi: chitin walls.","id":"F-PRO-03-002"},{"unit":"PRO-03","kind":"fact","front":"Diatom shell material?","back":"Silica (two overlapping halves).","id":"F-PRO-03-003"},{"unit":"PRO-03","kind":"trap","front":"TRUE/FALSE: Phytophthora is a true fungus.","back":"FALSE – it is an oomycete (stramenopile).","id":"F-PRO-03-004"},{"unit":"PRO-04","kind":"fact","front":"Dinoflagellate theca?","back":"Cellulose plates inside membranous alveoli beneath the plasma membrane.","id":"F-PRO-04-001"},{"unit":"PRO-04","kind":"fact","front":"Plasmodium life cycle stages?","back":"Sporozoites (mosquito → blood) → liver schizogony → merozoites → red-cell schizogony → gametocytes → mosquito (sexual).","id":"F-PRO-04-002"},{"unit":"PRO-04","kind":"number","front":"Malaria figures in the lecture?","back":"~300 million infected, ~2 million deaths per year.","id":"F-PRO-04-003"},{"unit":"PRO-04","kind":"fact","front":"Foram test and uses?","back":"Organic material hardened with CaCO3; pseudopodia through pores; fossils date sedimentary rocks.","id":"F-PRO-04-004"},{"unit":"PRO-04","kind":"fact","front":"Two nuclei of ciliates?","back":"Macronucleus (daily functions) and micronucleus (sexual/genetic exchange).","id":"F-PRO-04-005"},{"unit":"PRO-05","kind":"fact","front":"Red alga used for agarose?","back":"Gracilaria dura.","id":"F-PRO-05-001"},{"unit":"PRO-05","kind":"fact","front":"Four charophyte features shared with land plants?","back":"Rosette cellulose-synthase complexes; peroxisome enzymes limiting photorespiration loss; similar flagellated sperm; phragmoplast (Chara, Coleochaete).","id":"F-PRO-05-002"},{"unit":"PRO-05","kind":"fact","front":"Plasmodial vs cellular slime molds?","back":"Plasmodial: multinucleate diploid mass, no membranes, sexual fruiting bodies. Cellular: separate cells aggregate into a slug, keep membranes, asexual fruiting body.","id":"F-PRO-05-003"},{"unit":"PRO-05","kind":"fact","front":"Photorespiration path (lecture)?","back":"Phosphoglycolate → glycolate → peroxisome (glycine) → mitochondrion (serine) → peroxisome (glycerate) → chloroplast (Calvin cycle).","id":"F-PRO-05-004"},{"unit":"VIR-01","kind":"fact","front":"Virus naming suffixes?","back":"Genus -virus; family -viridae; order -virales (slide: -ales).","id":"F-VIR-01-001"},{"unit":"VIR-01","kind":"fact","front":"HHV-1 to HHV-8?","back":"1-2 cold sores (Simplex); 3 chickenpox (Varicello); 4 mono (Lymphocrypto); 5 CMV; 6 roseola; 7 measles-like rash infants (Roseolo); 8 Kaposi's sarcoma (Rhadino).","id":"F-VIR-01-002"},{"unit":"VIR-01","kind":"fact","front":"Five virus classification criteria?","back":"Disease symptoms, hosts, morphology, genetic material type, replication mechanism.","id":"F-VIR-01-003"},{"unit":"VIR-01","kind":"trap","front":"Slide typo: family suffix?","back":"-viridae (slide printed -viridar).","id":"F-VIR-01-004"},{"unit":"VIR-02","kind":"fact","front":"Viral genome possibilities?","back":"DNA or RNA; ss or ds; linear or circular; one or more chromosomes.","id":"F-VIR-02-001"},{"unit":"VIR-02","kind":"fact","front":"Capsid shapes?","back":"Rod-shaped (helical), polyhedral, complex.","id":"F-VIR-02-002"},{"unit":"VIR-02","kind":"fact","front":"Envelope composition and origin?","back":"Lipids, proteins, carbohydrates; host cell origin or virally encoded; may carry spikes.","id":"F-VIR-02-003"},{"unit":"VIR-02","kind":"trap","front":"TRUE/FALSE: a naked virus has no capsid.","back":"FALSE – it lacks only an envelope.","id":"F-VIR-02-004"},{"unit":"VIR-03","kind":"fact","front":"Three entry mechanisms (lecture)?","back":"T-even phage tail punctures wall; endocytosis; fusion (enveloped viruses).","id":"F-VIR-03-001"},{"unit":"VIR-03","kind":"fact","front":"DNA vs RNA virus genome replication (lecture)?","back":"DNA viruses: host DNA polymerase. RNA viruses: viral polymerase on RNA templates.","id":"F-VIR-03-002"},{"unit":"VIR-03","kind":"fact","front":"Virulent vs temperate phage?","back":"Virulent: lytic only (T4). Temperate: lytic and lysogenic (lambda).","id":"F-VIR-03-003"},{"unit":"VIR-03","kind":"fact","front":"HIV key steps?","back":"gp120–CD4 binding, fusion, reverse transcription, integration (provirus), transcription/translation, protease, budding.","id":"F-VIR-03-004"},{"unit":"VIR-03","kind":"trap","front":"Lambda tail vs T4 tail?","back":"Lambda: one short tail fiber; T4: several long tail fibers.","id":"F-VIR-03-005"},{"unit":"VIR-04","kind":"number","front":"Viroid length?","back":"300–400 nucleotides, naked RNA.","id":"F-VIR-04-001"},{"unit":"VIR-04","kind":"fact","front":"Viroid replication and pathogenesis?","back":"Host RNA polymerase in nucleus/chloroplast; ribozyme cuts continuous RNA; no proteins coded; gene silencing.","id":"F-VIR-04-002"},{"unit":"VIR-04","kind":"fact","front":"Viroid families and genera?","back":"Pospiviroidae: Pospiviroid (potato), Hostuviroid (hop), Cocadviroid (coconut), Apscaviroid (apple), Coleviroid (perilla). Avsunviroidae: Avsunviroid (avocado), Pelamoviroid (peach).","id":"F-VIR-04-003"},{"unit":"VIR-04","kind":"fact","front":"Prion facts (lecture)?","back":"Proteins; degenerative brain diseases; spread by contaminated equipment or ingesting infected tissue; incubation ≥10 years; not inactivated by normal cooking.","id":"F-VIR-04-004"},{"unit":"VIR-04","kind":"trap","front":"Virusoid vs viroid?","back":"Virusoid has a protein coat and needs co-infection with a virus to cause disease.","id":"F-VIR-04-005"},{"unit":"IDT-01","kind":"fact","front":"Bergey's Determinative (1980–84) volumes?","back":"1 Gram-negative; 2 Gram-positive; 3 remaining + some Gram-neg + archaea; 4 actinomycetes.","id":"F-IDT-01-001"},{"unit":"IDT-01","kind":"fact","front":"Current Bergey's (5 volumes, 16S)?","back":"2001 Archaea & photoautotrophs; 2005 Proteobacteria; 2009 Firmicutes; 2011 Bacteroidetes, Spirochaetes, Tenericutes…; 2012 Actinobacteria.","id":"F-IDT-01-002"},{"unit":"IDT-01","kind":"fact","front":
