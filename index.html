"Mục đích không phải tăng độc lực.","","Nuôi cấy hỗn hợp vẫn mọc được.","Không phải mục đích của định đề."],"vocab":["pure culture","Koch's postulates"],"trap":null,"pool":"learn","source":"","id":"Q-HIS-03-005"},{"unit":"HIS-03","type":"not","difficulty":2,"stem":"Which is NOT one of Koch's postulates?","options":["The same pathogen must be present in every case of the disease","The pathogen must be isolated and grown in pure culture","The pathogen must be killed by heat before injection","The pathogen must be re-isolated from the experimentally infected host"],"answer":2,"explanation":"Không có bước \"giết bằng nhiệt\". Tác nhân **sống** từ nuôi cấy thuần được tiêm vào vật chủ khỏe để tái hiện bệnh.","distractorNotes":["Định đề 1.","Định đề 2.","","Định đề 4."],"vocab":["Koch's postulates"],"trap":null,"pool":"learn","source":"","id":"Q-HIS-03-006"},{"unit":"HIS-03","type":"application","difficulty":3,"stem":"A new disease is caused by an agent that cannot be grown on any artificial medium. Which of Koch's postulates cannot be satisfied in the classic way?","options":["Finding the agent in every case","Growing the agent in pure culture","Observing symptoms in the patient","Comparing symptoms between patients"],"answer":1,"explanation":"Không nuôi cấy trên môi trường nhân tạo → **không lập được nuôi cấy thuần** (định đề 2, kéo theo 3–4). Ví dụ: virus, *Treponema pallidum*, *M. leprae*.","distractorNotes":["Vẫn có thể thấy tác nhân.","","Không phải định đề.","Không phải định đề."],"vocab":["Koch's postulates","pure culture"],"trap":"Koch's postulates apply to every disease","pool":"learn","source":"","id":"Q-HIS-03-007"},{"unit":"HIS-03","type":"recall","difficulty":1,"stem":"Robert Koch's first proof that a bacterium causes a specific disease (1876) involved:","options":["Mycobacterium tuberculosis and tuberculosis","Bacillus anthracis and anthrax","Vibrio cholerae and cholera","Treponema pallidum and syphilis"],"answer":1,"explanation":"Slide 19: năm **1876**, Koch chứng minh ***Bacillus anthracis*** gây **bệnh than (anthrax)** ở gia súc.","distractorNotes":["Lao là năm 1882.","","Tả là năm 1883.","Giang mai – Ehrlich chữa bằng salvarsan."],"vocab":["anthrax"],"trap":null,"pool":"mock","source":"1.History of Microbiology.pptx slide 19","id":"Q-HIS-03-008","mockSet":2},{"unit":"HIS-03","type":"not","difficulty":2,"stem":"Which statement about pasteurization is NOT correct?","options":["It uses heat","It was first developed to prevent spoilage of wine and beer","It kills all microorganisms including endospores","It aims to preserve the taste of the product"],"answer":2,"explanation":"Thanh trùng **không** tiêu diệt mọi vi sinh vật, đặc biệt **không diệt nội bào tử** – đó là mục tiêu của tiệt trùng (sterilization).","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["pasteurization","sterilization"],"trap":"Pasteurization sterilizes","pool":"mock","source":"","id":"Q-HIS-03-009","mockSet":2},{"unit":"HIS-03","type":"concept","difficulty":2,"stem":"Why was the germ theory difficult to accept in the 19th century?","options":["Microscopes had not been invented","People believed diseases came from bad air or vapors, and it was hard to believe microbes moved into hosts","Vaccines had already cured all diseases","Koch's postulates were rejected by Pasteur"],"answer":1,"explanation":"Slide 18: người ta tin bệnh do **khí độc từ cống, đầm lầy (miasma)** và khó tin vi sinh vật từ nơi khác di chuyển vào cây/động vật gây bệnh.","distractorNotes":["Kính hiển vi đã có từ thế kỷ 17.","","Sai.","Sai."],"vocab":["germ theory"],"trap":null,"pool":"mock","source":"1.History of Microbiology.pptx slide 18","id":"Q-HIS-03-010","mockSet":3},{"unit":"HIS-03","type":"concept","difficulty":2,"stem":"Pasteur showed that fermentation is:","options":["a purely chemical reaction caused by air","a biological process carried out by yeasts in the absence of air","a process that requires bacteria to produce alcohol","the same as putrefaction"],"answer":1,"explanation":"Pasteur: **nấm men** chuyển đường thành rượu **khi không có không khí** → lên men là quá trình **sinh học**.","distractorNotes":["Quan niệm cũ bị Pasteur bác bỏ.","","Vi khuẩn làm chua, nấm men tạo rượu.","Thối rữa là quá trình khác."],"vocab":["fermentation"],"trap":null,"pool":"mock","source":"","id":"Q-HIS-03-011","mockSet":1},{"unit":"HIS-04","type":"recall","difficulty":1,"stem":"Paul Ehrlich's salvarsan (1910), an arsenic derivative, was used to treat:","options":["tuberculosis","syphilis","smallpox","anthrax"],"answer":1,"explanation":"Slide 22: **salvarsan** (dẫn xuất arsenic) chống vi khuẩn gây **giang mai (syphilis)** – *Treponema pallidum*.","distractorNotes":["Không đúng.","","Đậu mùa là bệnh virus – Jenner.","Bệnh than – Koch."],"vocab":["chemotherapy"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 22","id":"Q-HIS-04-001"},{"unit":"HIS-04","type":"recall","difficulty":1,"stem":"Which organism did Fleming observe inhibiting bacterial growth in 1928?","options":["Saccharomyces cerevisiae","Penicillium notatum (P. chrysogenum)","Aspergillus niger","Streptomyces griseus"],"answer":1,"explanation":"Fleming (Scotland, 1928) phát hiện nấm ***Penicillium notatum*** (***P. chrysogenum***) ức chế vi khuẩn → **penicillin**.","distractorNotes":["Nấm men làm bánh mì/rượu.","","Dùng sản xuất acid citric.","Nguồn streptomycin (Waksman)."],"vocab":["penicillin"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 22","id":"Q-HIS-04-002"},{"unit":"HIS-04","type":"concept","difficulty":2,"stem":"Pasteur found that chicken cholera bacteria cultured in the lab for a long time:","options":["became more virulent","lost their ability to cause disease but could still induce immunity","turned into viruses","produced penicillin"],"answer":1,"explanation":"Slide 21 (1880): vi khuẩn **mất khả năng gây bệnh** (giảm độc lực – attenuation) nhưng **vẫn gây miễn dịch** → Pasteur gọi là **vaccines**.","distractorNotes":["Ngược lại.","","Sai.","Không liên quan."],"vocab":["attenuated","vaccine"],"trap":null,"pool":"learn","source":"1.History of Microbiology.pptx slide 21","id":"Q-HIS-04-003"},{"unit":"HIS-04","type":"concept","difficulty":2,"stem":"What is the main difference between a vaccine and an antibiotic?","options":["A vaccine kills bacteria directly; an antibiotic stimulates immunity","A vaccine induces immunity before infection; an antibiotic acts on the microbe to treat infection","Both are made only from molds","There is no difference"],"answer":1,"explanation":"Vaccine **huấn luyện hệ miễn dịch** (phòng bệnh); kháng sinh **tác động lên vi khuẩn** (điều trị). Hai cơ chế khác nhau.","distractorNotes":["Đảo ngược.","","Sai.","Sai."],"vocab":["vaccine","antibiotic"],"trap":"Vaccines are antibiotics","pool":"learn","source":"","id":"Q-HIS-04-004"},{"unit":"HIS-04","type":"not","difficulty":2,"stem":"Which statement about antibiotics after Fleming's discovery is NOT correct?","options":["Penicillin was produced on an industrial scale after 1940","Thousands of other antibiotics were discovered","All antibiotics are harmless to humans and animals","Antibiotic-resistant microorganisms appeared"],"answer":2,"explanation":"Slide 22: nhiều kháng sinh **độc với người và động vật**, và vi sinh vật **kháng kháng sinh** đã xuất hiện.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["antibiotic resistance"],"trap":null,"pool":"learn","source":"","id":"Q-HIS-04-005"},{"unit":"HIS-04","type":"recall","difficulty":1,"stem":"Jenner's work in 1796 is regarded as the origin of:","options":["pasteurization","vaccination","chemotherapy","aseptic surgery"],"answer":1,"explanation":"**Jenner (1796)** → **vaccination**; sự bảo vệ cơ thể nhờ vaccine gọi là **immunity**.","distractorNotes":["Pasteur.","","Ehrlich.","Lister."],"vocab":["vaccination","immunity"],"trap":null,"pool":"mock","source":"1.History of Microbiology.pptx slide 21","id":"Q-HIS-04-006","mockSet":2},{"unit":"HIS-04","type":"concept","difficulty":2,"stem":"Salvarsan and sulfonamides differ from penicillin because they are:","options":["produced by bacteria","synthetic chemicals rather than substances produced by microorganisms","vaccines","effective only against viruses"],"answer":1,"explanation":"Salvarsan (arsenic) và sulfonamide là **thuốc tổng hợp hóa học**. Penicillin là **kháng sinh** – chất do vi sinh vật (nấm *Penicillium*) tạo ra.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["antibiotic","chemotherapy"],"trap":"Salvarsan is an antibiotic from a mold","pool":"mock","source":"","id":"Q-HIS-04-007","mockSet":3},{"unit":"HIS-04","type":"application","difficulty":2,"stem":"A patient with influenza (a viral infection) asks for penicillin. Based on how penicillin works, what is the best response?","options":["Penicillin will cure influenza quickly","Penicillin targets bacterial cell walls, which viruses do not have, so it will not treat influenza","Penicillin works only if injected","Penicillin is a vaccine against influenza"],"answer":1,"explanation":"Penicillin ức chế tổng hợp **peptidoglycan** của vi khuẩn; virus **không có thành tế bào** → vô tác dụng, lại còn chọn lọc vi khuẩn kháng thuốc.","distractorNotes":["Sai.","","Đường dùng không phải vấn đề.","Penicillin không phải vaccine."],"vocab":["penicillin","virus"],"trap":"Antibiotics treat viral infections","pool":"mock","source":"","id":"Q-HIS-04-008","mockSet":1},{"unit":"BAC-01","type":"recall","difficulty":1,"stem":"Cocci that divide in three perpendicular planes and remain attached form:","options":["tetrads","sarcinae","staphylococci","streptococci"],"answer":1,"explanation":"Ba mặt phẳng vuông góc → khối lập phương 8 tế bào = **sarcinae**. Hai mặt phẳng → tetrad; ngẫu nhiên → staphylococci; một mặt phẳng → chuỗi.","distractorNotes":["Tetrad: 2 mặt phẳng.","","Staphylococci: mặt phẳng ngẫu nhiên.","Streptococci: 1 mặt phẳng, chuỗi."],"vocab":["sarcinae","tetrad"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slides 6–8","id":"Q-BAC-01-001"},{"unit":"BAC-01","type":"concept","difficulty":2,"stem":"Which feature distinguishes a spirillum from a spirochete?","options":["Spirilla are curved rods; spirochetes are cocci","Spirilla are rigid helices moved by external flagella; spirochetes are flexible helices moved by axial filaments","Spirilla are Gram-positive; spirochetes lack a cell wall","There is no difference"],"answer":1,"explanation":"**Spirillum**: xoắn cứng, **roi ngoài**. **Spirochete**: xoắn mềm, **sợi trục (axial filament)** dưới vỏ ngoài.","distractorNotes":["Que cong là vibrio.","","Không phải tiêu chí phân biệt.","Có khác biệt rõ."],"vocab":["spirillum","spirochete","axial filament"],"trap":"Spirilla move with axial filaments","pool":"learn","source":"2-3.Bacteria.pptx slides 9–10","id":"Q-BAC-01-002"},{"unit":"BAC-01","type":"recall","difficulty":1,"stem":"A comma-shaped (curved rod) bacterium such as the cholera agent is called a:","options":["vibrio","spirillum","coccobacillus","sarcina"],"answer":0,"explanation":"Que cong như dấu phẩy = **vibrio** (*Vibrio cholerae*).","distractorNotes":["","Spirillum xoắn nhiều vòng, cứng.","Coccobacillus là que rất ngắn.","Sarcina là khối cầu khuẩn."],"vocab":["vibrio"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-01-003"},{"unit":"BAC-01","type":"not","difficulty":1,"stem":"Which of the following is NOT a typical arrangement of bacilli?","options":["Diplobacilli","Streptobacilli","Sarcinae","Single bacillus"],"answer":2,"explanation":"**Sarcinae** là cách sắp xếp của **cầu khuẩn** (3 mặt phẳng). Trực khuẩn chỉ chia theo mặt phẳng ngang → đơn, đôi, chuỗi.","distractorNotes":["Đúng là của trực khuẩn.","Đúng là của trực khuẩn.","","Đúng là của trực khuẩn."],"vocab":["sarcinae"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-01-004"},{"unit":"BAC-01","type":"concept","difficulty":2,"stem":"A lab report says \"Gram-positive bacilli, genus Bacillus\". A student writes \"all rod-shaped bacteria belong to Bacillus\". What is the error?","options":["Rods are always Gram-negative","\"bacillus\" describes a shape, while Bacillus is one genus; many genera are rod-shaped","Bacillus is a coccus","Genus names are never capitalized"],"answer":1,"explanation":"**bacillus** (thường) = hình que; ***Bacillus*** (hoa, nghiêng) = một chi. *E. coli, Clostridium, Lactobacillus* đều hình que nhưng không thuộc chi *Bacillus*.","distractorNotes":["Sai: có que Gram dương.","","Sai.","Tên chi luôn viết hoa."],"vocab":["bacillus"],"trap":"bacillus shape = Bacillus genus","pool":"learn","source":"","id":"Q-BAC-01-005"},{"unit":"BAC-01","type":"application","difficulty":2,"stem":"A Gram stain of pus shows spherical cells in irregular grape-like clusters. Which arrangement term and likely genus fit best?","options":["Streptococci – Streptococcus","Staphylococci – Staphylococcus","Diplococci – Neisseria","Sarcinae – Sarcina"],"answer":1,"explanation":"Chùm nho = phân chia theo **nhiều mặt phẳng ngẫu nhiên** = **staphylococci**, gợi ý chi *Staphylococcus*. Tuy vậy cần thêm xét nghiệm để xác định loài.","distractorNotes":["Streptococci tạo chuỗi.","","Diplococci là đôi.","Sarcinae là khối 8."],"vocab":["staphylococci"],"trap":"Arrangement identifies species","pool":"mock","source":"","id":"Q-BAC-01-006","mockSet":1},{"unit":"BAC-01","type":"recall","difficulty":1,"stem":"Bacteria that can take several shapes (e.g., Rhizobium, Corynebacterium) are described as:","options":["monomorphic","pleomorphic","coccobacilli","filamentous"],"answer":1,"explanation":"**Pleomorphic** = đa hình. Phần lớn vi khuẩn là **monomorphic** (một hình dạng).","distractorNotes":["Ngược nghĩa.","","Là một hình dạng cụ thể.","Không đúng."],"vocab":["pleomorphic"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-01-007","mockSet":2},{"unit":"BAC-01","type":"concept","difficulty":2,"stem":"Cocci dividing in two perpendicular planes that remain attached form:","options":["diplococci","tetrads","sarcinae","streptococci"],"answer":1,"explanation":"Hai mặt phẳng vuông góc → nhóm **4 tế bào (tetrad)**.","distractorNotes":["Diplococci: 1 mặt phẳng, 2 tế bào.","","Sarcinae: 3 mặt phẳng.","Streptococci: 1 mặt phẳng, chuỗi."],"vocab":["tetrad"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-01-008","mockSet":3},{"unit":"BAC-02","type":"recall","difficulty":1,"stem":"The glycocalyx of bacteria is located:","options":["inside the plasma membrane","external to the cell wall","between the two membranes of Gram-negative cells","inside the nucleoid"],"answer":1,"explanation":"Slide 15: glycocalyx là polymer nhớt **bên ngoài thành tế bào**.","distractorNotes":["Đó là tế bào chất.","","Đó là vùng chu chất.","Sai."],"vocab":["glycocalyx"],"trap":"Capsule is inside the cell wall","pool":"learn","source":"2-3.Bacteria.pptx slide 15","id":"Q-BAC-02-001"},{"unit":"BAC-02","type":"concept","difficulty":2,"stem":"How does a capsule increase the virulence of Streptococcus pneumoniae?","options":["It produces toxins","It protects the bacterium from phagocytosis by host cells","It allows the cell to swim toward nutrients","It transfers resistance genes"],"answer":1,"explanation":"Capsule che bề mặt vi khuẩn khiến bạch cầu **khó thực bào** → vi khuẩn sống sót và gây bệnh.","distractorNotes":["Capsule không phải độc tố.","","Đó là roi.","Đó là pili/plasmid."],"vocab":["capsule","virulence","phagocytosis"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 15","id":"Q-BAC-02-002"},{"unit":"BAC-02","type":"recall","difficulty":1,"stem":"A bacterium with a tuft of flagella at one end is described as:","options":["monotrichous","amphitrichous","lophotrichous","peritrichous"],"answer":2,"explanation":"**Lophotrichous** = chùm roi ở một đầu. Mono = 1 roi; amphi = hai đầu; peri = khắp bề mặt.","distractorNotes":["1 roi.","Roi ở hai đầu.","","Roi khắp bề mặt."],"vocab":["flagella"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-02-003"},{"unit":"BAC-02","type":"concept","difficulty":2,"stem":"Which statement correctly contrasts fimbriae and pili?","options":["Fimbriae are used for swimming; pili for attachment","Fimbriae are numerous and used for attachment; pili are few (1–2) and join cells for DNA transfer","Both are made of flagellin","Pili are shorter than fimbriae"],"answer":1,"explanation":"Slide 20–21: **fimbriae** nhiều, ngắn, dùng **bám**; **pili** 1–2/tế bào, dài hơn, nối tế bào để **chuyển DNA**.","distractorNotes":["Không cái nào dùng để bơi như roi.","","Chúng làm từ pilin.","Ngược lại."],"vocab":["fimbriae","pili","conjugation"],"trap":"Fimbriae are for swimming","pool":"learn","source":"","id":"Q-BAC-02-004"},{"unit":"BAC-02","type":"application","difficulty":2,"stem":"A mutant of Neisseria gonorrhoeae cannot produce fimbriae. What is the most likely consequence?","options":["It cannot swim","It cannot attach to host mucous membranes and fails to cause disease","It loses its outer membrane","It becomes Gram-positive"],"answer":1,"explanation":"Slide 20: fimbriae giúp **bám**; mất fimbriae → **không gây bệnh**.","distractorNotes":["Fimbriae không phải cơ quan bơi.","","Không liên quan.","Không liên quan."],"vocab":["fimbriae"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 20","id":"Q-BAC-02-005"},{"unit":"BAC-02","type":"recall","difficulty":1,"stem":"Treponema pallidum, the cause of syphilis, moves by means of:","options":["peritrichous flagella","axial filaments","fimbriae","a capsule"],"answer":1,"explanation":"Xoắn thể (spirochetes) như *T. pallidum* và *Borrelia burgdorferi* di chuyển bằng **sợi trục (axial filaments)** dưới vỏ ngoài.","distractorNotes":["Không phải.","","Fimbriae để bám.","Capsule không dùng để di chuyển."],"vocab":["axial filament","spirochete"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 19","id":"Q-BAC-02-006"},{"unit":"BAC-02","type":"concept","difficulty":2,"stem":"In a biofilm, the glycocalyx that helps cells attach to surfaces and to each other is called EPS. Which is NOT a function of EPS stated in the lecture?","options":["Protects cells within it","Facilitates communication among cells","Carries out protein synthesis","Helps cells survive by attaching to surfaces"],"answer":2,"explanation":"EPS bảo vệ, giúp giao tiếp và giúp bám sống sót. **Tổng hợp protein** là việc của **ribosome**, không phải EPS.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["EPS","biofilm"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 15","id":"Q-BAC-02-007"},{"unit":"BAC-02","type":"not","difficulty":2,"stem":"Which statement about archaella is NOT correct?","options":["They are motility structures of archaea","They rotate like flagella","They are identical in structure to bacterial flagella","They are powered by ATP"],"answer":2,"explanation":"Archaella **khác** roi vi khuẩn về protein, nguồn năng lượng (ATP) và cấu trúc (không có kênh rỗng).","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["archaella"],"trap":"Archaella are bacterial flagella","pool":"mock","source":"","id":"Q-BAC-02-008","mockSet":3},{"unit":"BAC-02","type":"recall","difficulty":1,"stem":"The protein that makes up the filament of a bacterial flagellum is:","options":["pilin","flagellin","tubulin","actin"],"answer":1,"explanation":"Sợi roi làm từ **flagellin**. **Pilin** tạo fimbriae/pili; tubulin là roi nhân thực.","distractorNotes":["Pilin là của fimbriae/pili.","","Tubulin: vi ống nhân thực.","Actin: vi sợi nhân thực."],"vocab":["flagella"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-02-009","mockSet":1},{"unit":"BAC-02","type":"application","difficulty":2,"stem":"A bacterium swims straight for a while, then tumbles and changes direction; runs become longer when it moves toward glucose. This behavior is:","options":["phototaxis","chemotaxis","conjugation","phagocytosis"],"answer":1,"explanation":"Di chuyển theo gradient **hóa chất** = **chemotaxis**, thực hiện nhờ luân phiên **run–tumble** của roi.","distractorNotes":["Phototaxis: theo ánh sáng.","","Tiếp hợp: chuyển DNA.","Thực bào: tế bào chủ nuốt vi khuẩn."],"vocab":["taxis"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-02-010","mockSet":2},{"unit":"BAC-02","type":"not","difficulty":2,"stem":"Which bacterium is NOT listed in the lecture as using a capsule to avoid phagocytosis?","options":["Streptococcus pneumoniae","Klebsiella pneumoniae","Bacillus anthracis","Treponema pallidum"],"answer":3,"explanation":"Slide 15 liệt kê *S. pneumoniae, B. anthracis, S. mutans, K. pneumoniae*. ***T. pallidum*** được nêu với **sợi trục**.","distractorNotes":["Có trong danh sách.","Có trong danh sách.","Có trong danh sách.",""],"vocab":["capsule"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-02-011","mockSet":2},{"unit":"BAC-03","type":"recall","difficulty":1,"stem":"The glycan backbone of peptidoglycan consists of alternating:","options":["glucose and galactose","NAG and NAM","NAG and NAT","glycerol and phosphate"],"answer":1,"explanation":"Khung peptidoglycan: **NAG** (N-acetylglucosamine) và **NAM** (N-acetylmuramic acid) nối β-1,4. **NAT** thay NAM trong pseudomurein của Archaea.","distractorNotes":["Sai.","","Đây là pseudomurein (Archaea).","Đây là teichoic acid."],"vocab":["peptidoglycan"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 28","id":"Q-BAC-03-001"},{"unit":"BAC-03","type":"concept","difficulty":2,"stem":"Penicillin kills growing bacteria because it:","options":["hydrolyzes the bond between NAM and NAG","inactivates transpeptidase, preventing formation of peptide cross-bridges","dissolves the outer membrane","inhibits 70S ribosomes"],"answer":1,"explanation":"Slide 28: penicillin **bất hoạt transpeptidase** (enzyme tạo cầu nối chéo) → không xây được thành mới → tế bào đang sinh trưởng vỡ.","distractorNotes":["Đó là lysozyme.","","Không phải cơ chế penicillin.","Đó là streptomycin/erythromycin."],"vocab":["penicillin","transpeptidase"],"trap":"Lysozyme and penicillin act the same way","pool":"learn","source":"2-3.Bacteria.pptx slide 28","id":"Q-BAC-03-002"},{"unit":"BAC-03","type":"concept","difficulty":2,"stem":"Where is the tetrapeptide side chain attached in peptidoglycan?","options":["To NAG","To NAM","To teichoic acid","To lipid A"],"answer":1,"explanation":"Tetrapeptide gắn vào **NAM**.","distractorNotes":["Sai.","","Sai.","Lipid A thuộc LPS Gram âm."],"vocab":["peptidoglycan"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-03-003"},{"unit":"BAC-03","type":"recall","difficulty":1,"stem":"Which molecule spans the peptidoglycan layer and is linked to the plasma membrane in Gram-positive bacteria?","options":["Wall teichoic acid","Lipoteichoic acid","Lipopolysaccharide","Porin"],"answer":1,"explanation":"Slide 34: **lipoteichoic acid** xuyên lớp peptidoglycan và **gắn vào màng sinh chất**; wall teichoic acid gắn vào peptidoglycan.","distractorNotes":["Gắn với peptidoglycan, không phải màng.","","LPS là của Gram âm.","Porin là của Gram âm."],"vocab":["teichoic acid"],"trap":"Teichoic acid is in Gram-negative walls","pool":"learn","source":"2-3.Bacteria.pptx slide 34","id":"Q-BAC-03-004"},{"unit":"BAC-03","type":"concept","difficulty":2,"stem":"Teichoic acids are negatively charged. According to the lecture, this allows them to:","options":["bind and regulate the movement of cations into and out of the cell","block penicillin","act as endotoxins","form porins"],"answer":0,"explanation":"Slide 37: tích điện âm → **gắn và điều hòa cation** ra vào tế bào.","distractorNotes":["","Không.","Nội độc tố là lipid A.","Không."],"vocab":["teichoic acid"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 37","id":"Q-BAC-03-005"},{"unit":"BAC-03","type":"application","difficulty":3,"stem":"Gram-positive cells are treated with lysozyme in an isotonic sucrose solution. They become spherical but do not burst. Then they are moved to distilled water. What happens?","options":["Nothing, because the membrane is intact","They form protoplasts that now lyse due to osmotic water uptake","They regrow the wall immediately","They become Gram-negative"],"answer":1,"explanation":"Lysozyme loại thành → **protoplast** (sống được trong môi trường đẳng trương). Chuyển sang nước cất (nhược trương) → nước vào → **vỡ (osmotic lysis)** vì không còn thành chống áp lực.","distractorNotes":["Màng không đủ chống áp suất thẩm thấu.","","Không tái tạo tức thì.","Không."],"vocab":["protoplast","lysozyme"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-03-006"},{"unit":"BAC-03","type":"recall","difficulty":1,"stem":"The cell wall of Mycobacterium contains about 60% of:","options":["teichoic acid","mycolic acid","lipopolysaccharide","chitin"],"answer":1,"explanation":"Slide 37: thành *Mycobacterium* gồm **60 % mycolic acid**, còn lại peptidoglycan → kháng acid.","distractorNotes":["Sai.","","Sai.","Chitin ở thành nấm."],"vocab":["mycolic acid","acid-fast"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 37","id":"Q-BAC-03-007"},{"unit":"BAC-03","type":"not","difficulty":2,"stem":"Which is NOT a feature of the Gram-positive cell wall?","options":["Multiple layers of peptidoglycan","Teichoic acids","An outer membrane containing LPS","Sensitivity to penicillin"],"answer":2,"explanation":"Màng ngoài chứa **LPS** là đặc trưng của **Gram âm**.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["lipopolysaccharide"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-03-008","mockSet":1},{"unit":"BAC-03","type":"concept","difficulty":2,"stem":"Which amino acid in the peptidoglycan side chain is unusual because it is a D-isomer?","options":["L-alanine","D-glutamate","Glycine","L-lysine only"],"answer":1,"explanation":"Chuỗi bên: L-Ala, **D-Glu**, DAP, **D-Ala** – có **D-amino acid**, khác protein thông thường. (Pseudomurein của Archaea **không** có D-amino acid.)","distractorNotes":["L-Ala là dạng L thông thường.","","Glycine không có đồng phân quang học.","Sai."],"vocab":["peptidoglycan"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-03-009","mockSet":3},{"unit":"BAC-03","type":"application","difficulty":2,"stem":"Lysozyme in tears protects the eye mainly against which bacteria?","options":["Gram-positive bacteria, whose peptidoglycan is exposed","Gram-negative bacteria, whose peptidoglycan is covered by an outer membrane","Mycoplasma, which lacks a wall","Viruses"],"answer":0,"explanation":"Lysozyme cắt peptidoglycan; ở **Gram dương** lớp này **lộ ra ngoài** nên dễ bị tấn công. Gram âm có màng ngoài che chắn; Mycoplasma không có thành.","distractorNotes":["","Màng ngoài cản lysozyme.","Không có đích tác động.","Virus không có peptidoglycan."],"vocab":["lysozyme"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-03-010","mockSet":1},{"unit":"BAC-03","type":"not","difficulty":2,"stem":"Which statement about penicillin is NOT correct?","options":["It targets transpeptidase","It is most effective against actively growing cells","It is toxic to human cells because they contain peptidoglycan","Gram-positive bacteria are generally more sensitive to it"],"answer":2,"explanation":"Tế bào người **không có peptidoglycan** → penicillin có **độc tính chọn lọc**.","distractorNotes":["Đúng.","Đúng.","","Đúng (thành dày lộ ra)."],"vocab":["penicillin","selective toxicity"],"trap":"Human cells have peptidoglycan","pool":"mock","source":"","id":"Q-BAC-03-011","mockSet":3},{"unit":"BAC-04","type":"recall","difficulty":1,"stem":"Lipid A of Gram-negative bacteria is important medically because it:","options":["is a capsule that prevents phagocytosis","is an endotoxin causing fever, vasodilation, shock and blood clotting","is the target of penicillin","forms porins"],"answer":1,"explanation":"Slide 41: **lipid A là nội độc tố** → sốt, giãn mạch, sốc, đông máu.","distractorNotes":["Capsule là glycocalyx.","","Đích của penicillin là transpeptidase.","Porin là protein."],"vocab":["lipid A","endotoxin"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 41","id":"Q-BAC-04-001"},{"unit":"BAC-04","type":"concept","difficulty":2,"stem":"During the Gram stain, what makes Gram-negative cells lose the crystal violet–iodine complex?","options":["Iodine cannot enter Gram-negative cells","Alcohol dissolves the outer membrane and the thin peptidoglycan cannot retain the complex","Safranin displaces crystal violet","Gram-negative cells have no plasma membrane"],"answer":1,"explanation":"Cồn **hòa tan lipid màng ngoài**, lớp peptidoglycan **mỏng** không giữ phức CV-I → mất màu → bắt safranin (hồng).","distractorNotes":["Iodine vào được cả hai.","","Safranin nhuộm cả hai, nhưng tím đậm che màu ở Gram dương.","Sai."],"vocab":["Gram stain"],"trap":"Safranin stains only Gram-negatives","pool":"learn","source":"","id":"Q-BAC-04-002"},{"unit":"BAC-04","type":"recall","difficulty":1,"stem":"The periplasmic space of Gram-negative bacteria contains high concentrations of:","options":["teichoic acids","degrading enzymes and transport proteins","ribosomes","mycolic acid"],"answer":1,"explanation":"Slide 38: vùng chu chất chứa **nhiều enzyme phân giải và protein vận chuyển**.","distractorNotes":["Teichoic acid ở Gram dương.","","Ribosome ở tế bào chất.","Acid mycolic ở Mycobacterium."],"vocab":["periplasmic space"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 38","id":"Q-BAC-04-003"},{"unit":"BAC-04","type":"not","difficulty":2,"stem":"Which substance is NOT listed as being blocked by the Gram-negative outer membrane?","options":["Bile salts","Lysozyme","Penicillin","Small nutrients passing through porins"],"answer":3,"explanation":"Chất dinh dưỡng nhỏ **đi qua porin** (nucleotide, amino acid, vitamin B12, sắt…). Muối mật, lysozyme, penicillin, chất tẩy, kim loại nặng bị cản.","distractorNotes":["Bị cản.","Bị cản.","Bị cản.",""],"vocab":["outer membrane","porin"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slides 40–41","id":"Q-BAC-04-004"},{"unit":"BAC-04","type":"concept","difficulty":2,"stem":"Why are Gram-negative bacteria generally more sensitive to mechanical breakage than Gram-positive bacteria?","options":["They lack a plasma membrane","Their peptidoglycan layer is thin","They have teichoic acid","They have no LPS"],"answer":1,"explanation":"Slide 39: peptidoglycan **mỏng** → **nhạy tác động cơ học**.","distractorNotes":["Có màng sinh chất.","","Gram âm không có teichoic acid.","Có LPS."],"vocab":["peptidoglycan"],"trap":"Gram-negative has thicker peptidoglycan","pool":"learn","source":"2-3.Bacteria.pptx slide 39","id":"Q-BAC-04-005"},{"unit":"BAC-04","type":"application","difficulty":2,"stem":"A student Gram-stains a 5-day-old culture of a Gram-positive Bacillus and sees many pink cells. The most likely explanation is:","options":["The organism changed to Gram-negative","Old cells have damaged walls that no longer retain crystal violet","Safranin was omitted","Iodine was added twice"],"answer":1,"explanation":"Tế bào **già** có thành tổn thương → không giữ phức CV-I → bắt màu hồng giả. Nên nhuộm tế bào non 18–24 h.","distractorNotes":["Phản ứng Gram gắn với cấu trúc thành, không \"đổi loài\".","","Nếu bỏ safranin, tế bào mất màu sẽ không màu, không hồng.","Không gây mất màu."],"vocab":["Gram stain"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-04-006"},{"unit":"BAC-04","type":"concept","difficulty":2,"stem":"The O polysaccharide of LPS is useful in the laboratory because it:","options":["acts as an antigen that distinguishes strains (e.g., E. coli O157)","anchors LPS in the membrane","is the endotoxin","forms the peptide cross-bridge"],"answer":0,"explanation":"Chuỗi **O** là **kháng nguyên O** dùng phân biệt serotype, ví dụ *E. coli* **O157**:H7.","distractorNotes":["","Đó là lipid A.","Đó là lipid A.","Sai."],"vocab":["lipopolysaccharide"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-04-007","mockSet":2},{"unit":"BAC-04","type":"not","difficulty":2,"stem":"Which is NOT a component of the Gram-negative outer membrane?","options":["Lipopolysaccharide","Porins","Lipoproteins","Teichoic acid"],"answer":3,"explanation":"**Teichoic acid** chỉ có ở **Gram dương**.","distractorNotes":["Có.","Có.","Có.",""],"vocab":["teichoic acid","outer membrane"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-04-008","mockSet":2},{"unit":"BAC-04","type":"concept","difficulty":2,"stem":"The strong negative charge of the Gram-negative outer membrane is an important factor in:","options":["evading phagocytosis and the actions of complement","retaining crystal violet","making the cell acid-fast","forming endospores"],"answer":0,"explanation":"Slide 40: điện tích âm mạnh giúp **tránh thực bào và bổ thể**.","distractorNotes":["","Gram âm không giữ CV.","Kháng acid là acid mycolic.","Không liên quan."],"vocab":["outer membrane","complement"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-04-009","mockSet":3},{"unit":"BAC-04","type":"application","difficulty":3,"stem":"A drug solution is autoclaved and is sterile, yet patients develop fever after injection. The contaminating bacteria were Gram-negative. The most likely cause is:","options":["surviving endospores","heat-stable lipid A (endotoxin) from dead cells","teichoic acid","live bacteria growing in the vial"],"answer":1,"explanation":"Autoclave diệt vi khuẩn nhưng **lipid A chịu nhiệt**, vẫn gây sốt → phải kiểm tra endotoxin (LAL).","distractorNotes":["Gram âm thường không tạo nội bào tử; dung dịch đã vô trùng.","","Teichoic acid ở Gram dương.","Dung dịch đã vô trùng."],"vocab":["endotoxin"],"trap":"Endotoxin is released from living cells only","pool":"mock","source":"","id":"Q-BAC-04-010","mockSet":1},{"unit":"BAC-04","type":"recall","difficulty":1,"stem":"In the Gram stain, the mordant that forms a complex with crystal violet is:","options":["safranin","iodine","alcohol","methylene blue"],"answer":1,"explanation":"**Iodine** là chất cẩn màu (mordant), tạo phức CV-I.","distractorNotes":["Safranin là màu phụ.","","Cồn là chất tẩy.","Không dùng trong nhuộm Gram."],"vocab":["Gram stain"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-04-011","mockSet":2},{"unit":"BAC-05","type":"recall","difficulty":1,"stem":"Unlike eukaryotic membranes, bacterial plasma membranes generally lack sterols. Which bacterium is the exception?","options":["Escherichia coli","Mycoplasma","Bacillus subtilis","Mycobacterium"],"answer":1,"explanation":"Slide 43: màng vi khuẩn **không có sterol**, **ngoại trừ *Mycoplasma*** (không có thành, sterol giúp màng bền hơn).","distractorNotes":["Không có sterol.","","Không có sterol.","Không có sterol; có acid mycolic ở thành."],"vocab":[],"trap":"Bacterial membranes contain sterols","pool":"learn","source":"2-3.Bacteria.pptx slide 43","id":"Q-BAC-05-001"},{"unit":"BAC-05","type":"concept","difficulty":2,"stem":"Glucose enters a bacterial cell down its concentration gradient with the help of a permease and without energy input. This is:","options":["simple diffusion","facilitated diffusion","active transport","group translocation"],"answer":1,"explanation":"Có protein (**permease**) + thuận gradient + không tốn năng lượng = **khuếch tán được hỗ trợ**.","distractorNotes":["Không cần protein.","","Cần năng lượng, ngược gradient.","Glucose bị phosphoryl hóa, tốn năng lượng."],"vocab":["facilitated diffusion","permease"],"trap":"Facilitated diffusion needs ATP","pool":"learn","source":"2-3.Bacteria.pptx slide 48","id":"Q-BAC-05-002"},{"unit":"BAC-05","type":"concept","difficulty":2,"stem":"In group translocation, glucose is:","options":["pumped out of the cell","phosphorylated as it is transported, trapping it inside the cell","converted to CO2 in the membrane","moved by simple diffusion"],"answer":1,"explanation":"Slide 50: gắn nhóm chức trong khi vận chuyển – **glucose bị phosphoryl hóa** → glucose-6-P không đi ra được.","distractorNotes":["Ngược chiều.","","Không.","Không."],"vocab":["group translocation"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 50","id":"Q-BAC-05-003"},{"unit":"BAC-05","type":"application","difficulty":2,"stem":"Bacteria are suspended in distilled water after their cell walls have been removed by lysozyme. What happens?","options":["Plasmolysis","Water enters and the cells lyse","No net water movement","Cells form endospores"],"answer":1,"explanation":"Nước cất là môi trường **nhược trương** → nước vào; không có thành chống áp lực → **vỡ**.","distractorNotes":["Co nguyên sinh xảy ra ở ưu trương.","","Chỉ ở đẳng trương.","Không liên quan."],"vocab":["osmosis","hypotonic"],"trap":"Hypotonic makes cells shrink","pool":"learn","source":"","id":"Q-BAC-05-004"},{"unit":"BAC-05","type":"recall","difficulty":1,"stem":"Which molecules cross the bacterial plasma membrane by simple diffusion according to the lecture?","options":["Glucose and amino acids","Oxygen and carbon dioxide","Proteins","Na+ and K+ ions"],"answer":1,"explanation":"Slide 48: **O₂, CO₂** – phân tử nhỏ, không phân cực – khuếch tán đơn giản. Glucose và amino acid cần permease.","distractorNotes":["Cần permease.","","Quá lớn.","Ion cần kênh/protein."],"vocab":["simple diffusion"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 48","id":"Q-BAC-05-005"},{"unit":"BAC-05","type":"concept","difficulty":2,"stem":"Purple sulfur bacteria carry out photosynthesis but do not produce oxygen because:","options":["they lack chlorophyll","they use sulfide or thiosulfate instead of water as the electron donor","they are anaerobic and destroy oxygen","they have no chromatophores"],"answer":1,"explanation":"Slide 47: chúng **không dùng nước** làm chất khử mà dùng **sulfide, thiosulfate** (hoặc H₂, Fe²⁺, NO₂⁻) → không giải phóng O₂; tích **hạt lưu huỳnh**.","distractorNotes":["Chúng có bacteriochlorophyll.","","Không phải lý do.","Chúng có hệ màng quang hợp."],"vocab":["chromatophores"],"trap":"Purple sulfur bacteria release O2","pool":"learn","source":"2-3.Bacteria.pptx slide 47","id":"Q-BAC-05-006"},{"unit":"BAC-05","type":"not","difficulty":2,"stem":"Which agent does NOT act mainly by damaging the bacterial plasma membrane?","options":["Alcohols","Quaternary ammonium compounds","Polymyxin","Penicillin"],"answer":3,"explanation":"Slide 45: cồn, quats, polymyxin phá màng. **Penicillin** ức chế **tổng hợp thành** (transpeptidase).","distractorNotes":["Phá màng.","Phá màng.","Phá màng.",""],"vocab":["penicillin"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-05-007"},{"unit":"BAC-05","type":"recall","difficulty":1,"stem":"In the fluid mosaic model, which membrane proteins serve mainly as transport channels?","options":["Peripheral proteins","Integral proteins","Glycocalyx proteins","Flagellin"],"answer":1,"explanation":"Slide 44: **integral proteins** = kênh vận chuyển; **peripheral proteins** = xúc tác, nâng đỡ.","distractorNotes":["Xúc tác/nâng đỡ.","","Không phải protein màng.","Protein roi."],"vocab":["integral protein"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-05-008","mockSet":3},{"unit":"BAC-05","type":"concept","difficulty":2,"stem":"Which property distinguishes active transport from facilitated diffusion?","options":["Only active transport uses membrane proteins","Active transport requires energy and can move substances against a gradient","Facilitated diffusion moves water only","Active transport occurs only in eukaryotes"],"answer":1,"explanation":"Cả hai đều dùng protein; **chỉ vận chuyển chủ động tốn năng lượng và đi ngược gradient**.","distractorNotes":["Cả hai đều dùng protein.","","Sai.","Vi khuẩn có vận chuyển chủ động."],"vocab":["active transport"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-05-009","mockSet":1},{"unit":"BAC-05","type":"application","difficulty":2,"stem":"Why can salting fish (15% NaCl) preserve it against most bacteria?","options":["Salt denatures DNA directly","The hypertonic environment draws water out of cells, causing plasmolysis","Salt is an antibiotic","Salt makes the medium hypotonic"],"answer":1,"explanation":"Muối tạo môi trường **ưu trương** → nước rời tế bào → **co nguyên sinh** → ức chế sinh trưởng.","distractorNotes":["Không phải cơ chế chính.","","Sai.","Ngược lại."],"vocab":["plasmolysis","hypertonic"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-05-010","mockSet":2},{"unit":"BAC-05","type":"not","difficulty":2,"stem":"Which statement about the bacterial plasma membrane is NOT correct?","options":["It is the site of ATP production","It is selectively permeable","Its phospholipids and proteins are fixed in place","It is composed of phospholipids and proteins"],"answer":2,"explanation":"Slide 44: phospholipid và protein **di chuyển khá tự do** (khảm lỏng), **không cố định**.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["fluid mosaic"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-05-011","mockSet":1},{"unit":"BAC-06","type":"recall","difficulty":1,"stem":"Metachromatic granules (volutin) contain inorganic phosphate and appear red when stained with:","options":["iodine","Sudan dye","methylene blue","safranin"],"answer":2,"explanation":"Slide 54: **volutin** chứa phosphate vô cơ, **đỏ với methylene blue**.","distractorNotes":["Iodine nhuộm hạt polysaccharide.","Sudan nhuộm lipid.","","Không đúng."],"vocab":["volutin"],"trap":"Volutin stains with iodine","pool":"learn","source":"2-3.Bacteria.pptx slide 54","id":"Q-BAC-06-001"},{"unit":"BAC-06","type":"recall","difficulty":1,"stem":"Which inclusion contains the enzyme ribulose 1,5-diphosphate carboxylase for CO2 fixation?","options":["Magnetosome","Carboxysome","Gas vacuole","Volutin"],"answer":1,"explanation":"**Carboxysome** chứa RuBisCO – cố định CO₂.","distractorNotes":["Chứa Fe₃O₄.","","Chứa túi khí.","Chứa phosphate."],"vocab":["carboxysome"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 54","id":"Q-BAC-06-002"},{"unit":"BAC-06","type":"concept","difficulty":2,"stem":"Why is endospore formation NOT considered a means of reproduction?","options":["Endospores contain no DNA","One vegetative cell produces only one endospore, which germinates into one cell","Endospores are formed only by fungi","Endospores divide by budding"],"answer":1,"explanation":"**1 tế bào → 1 bào tử → 1 tế bào**: số lượng không tăng. Nội bào tử là cấu trúc **sống sót**.","distractorNotes":["Nội bào tử chứa DNA.","","Nội bào tử là của vi khuẩn.","Không."],"vocab":["endospore","germination"],"trap":"Endospores are for reproduction","pool":"learn","source":"","id":"Q-BAC-06-003"},{"unit":"BAC-06","type":"concept","difficulty":2,"stem":"Which feature contributes most to the heat resistance of endospores?","options":["A large amount of water in the core","Very low water content and dipicolinic acid with calcium in the core","An outer membrane with LPS","Numerous flagella"],"answer":1,"explanation":"Lõi **rất ít nước**, chứa **acid dipicolinic + Ca²⁺** bảo vệ DNA và protein; thêm cortex và spore coat dày.","distractorNotes":["Ngược lại.","","Không liên quan.","Không liên quan."],"vocab":["endospore","dipicolinic acid"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-06-004"},{"unit":"BAC-06","type":"recall","difficulty":1,"stem":"Bacterial ribosomes are:","options":["80S, with 40S and 60S subunits","70S, with 30S and 50S subunits","70S, with 20S and 50S subunits","60S, with 30S and 30S subunits"],"answer":1,"explanation":"Vi khuẩn: **70S = 30S + 50S** (S là hệ số lắng, không cộng số học). Nhân thực: 80S = 40S + 60S.","distractorNotes":["Đó là ribosome nhân thực.","","Sai.","Sai."],"vocab":["ribosome"],"trap":"70S = 30S + 50S arithmetic","pool":"learn","source":"","id":"Q-BAC-06-005"},{"unit":"BAC-06","type":"concept","difficulty":2,"stem":"Plasmids are best described as:","options":["essential chromosomes containing all housekeeping genes","small, self-replicating extrachromosomal DNA molecules that may carry resistance genes","RNA molecules that code for ribosomes","protein granules for phosphate storage"],"answer":1,"explanation":"Plasmid: DNA vòng nhỏ, **ngoài nhiễm sắc thể**, **tự sao chép**, **không thiết yếu**, có thể mang gene kháng kháng sinh, độc tố, tiếp hợp.","distractorNotes":["Plasmid không thiết yếu.","","Sai.","Đó là volutin."],"vocab":["plasmid"],"trap":"Plasmids are essential","pool":"learn","source":"","id":"Q-BAC-06-006"},{"unit":"BAC-06","type":"application","difficulty":2,"stem":"A freshwater bacterium floats near the surface to capture light. Which inclusion most likely helps it?","options":["Magnetosomes","Gas vacuoles","Lipid inclusions","Sulfur granules"],"answer":1,"explanation":"**Gas vacuoles** (túi khí) giúp vi khuẩn thủy sinh **nổi** lên vùng có ánh sáng.","distractorNotes":["Định hướng từ trường.","","Dự trữ lipid.","Dự trữ lưu huỳnh."],"vocab":["gas vacuole"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-06-007"},{"unit":"BAC-06","type":"not","difficulty":2,"stem":"Which pair of inclusion and content is NOT correct?","options":["Magnetosome – Fe3O4","Polysaccharide granules – glycogen and starch","Lipid inclusions – stained with Sudan dye","Volutin – elemental sulfur"],"answer":3,"explanation":"**Volutin** chứa **phosphate vô cơ**; lưu huỳnh nằm ở **sulfur granules**.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["volutin"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-06-008","mockSet":3},{"unit":"BAC-06","type":"recall","difficulty":1,"stem":"Endospores are produced mainly by which bacterial genera?","options":["Escherichia and Salmonella","Bacillus and Clostridium","Streptococcus and Staphylococcus","Neisseria and Vibrio"],"answer":1,"explanation":"Nội bào tử chủ yếu ở trực khuẩn Gram dương ***Bacillus*** (hiếu khí) và ***Clostridium*** (kỵ khí).","distractorNotes":["Gram âm, không tạo nội bào tử.","","Không tạo nội bào tử.","Không tạo nội bào tử."],"vocab":["endospore"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-06-009","mockSet":3},{"unit":"BAC-06","type":"concept","difficulty":2,"stem":"Streptomycin inhibits bacterial protein synthesis without killing human cells mainly because:","options":["human cells have no ribosomes","it binds the 30S subunit of 70S bacterial ribosomes, which differ from 80S eukaryotic ribosomes","it blocks peptidoglycan","it dissolves bacterial membranes"],"answer":1,"explanation":"Ribosome **70S** vi khuẩn khác **80S** nhân thực → thuốc gắn **30S** có độc tính chọn lọc.","distractorNotes":["Sai.","","Đó là penicillin.","Đó là polymyxin."],"vocab":["ribosome","selective toxicity"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-06-010","mockSet":1},{"unit":"BAC-06","type":"not","difficulty":2,"stem":"Which is NOT true of the bacterial nucleoid?","options":["It usually contains a single circular chromosome","It is surrounded by a nuclear envelope","It contains double-stranded DNA","It lacks a membrane"],"answer":1,"explanation":"Vùng nhân **không có màng nhân** – đặc điểm nhân sơ.","distractorNotes":["Đúng.","","Đúng.","Đúng."],"vocab":["nucleoid"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-06-011","mockSet":2},{"unit":"BAC-07","type":"recall","difficulty":1,"stem":"Most bacteria reproduce by:","options":["budding","binary fission","sexual spores","conjugation"],"answer":1,"explanation":"**Phân đôi (binary fission)** là kiểu sinh sản phổ biến nhất. Nảy chồi ở *Hyphomicrobium*; tiếp hợp là chuyển gene, không phải sinh sản.","distractorNotes":["Chỉ vài nhóm (Hyphomicrobium).","","Vi khuẩn không có bào tử hữu tính.","Tiếp hợp không tăng số lượng."],"vocab":["binary fission"],"trap":"Conjugation is reproduction","pool":"learn","source":"2-3.Bacteria.pptx slides 71–72","id":"Q-BAC-07-001"},{"unit":"BAC-07","type":"recall","difficulty":1,"stem":"Hyphomicrobium is shown in the lecture as an example of bacterial reproduction by:","options":["binary fission","budding","fragmentation","endospore formation"],"answer":1,"explanation":"Slide 73: ***Hyphomicrobium*** sinh sản bằng **nảy chồi (budding)**.","distractorNotes":["Không.","","Không.","Nội bào tử không phải sinh sản."],"vocab":["budding"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 73","id":"Q-BAC-07-002"},{"unit":"BAC-07","type":"not","difficulty":2,"stem":"Which criterion is NOT used in Bergey's phenotypic grouping of bacteria described in the lecture?","options":["Reaction to Gram stain","Oxygen requirement","Cell arrangement","16S rRNA sequence"],"answer":3,"explanation":"Slide 60: Gram, hình dạng, sắp xếp, nhu cầu oxy, di động, dinh dưỡng/trao đổi chất. **16S rRNA** là cơ sở của phân loại **phân tử** (slide 65).","distractorNotes":["Có dùng.","Có dùng.","Có dùng.",""],"vocab":["Bergey's Manual"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 60","id":"Q-BAC-07-003"},{"unit":"BAC-07","type":"concept","difficulty":2,"stem":"The main weakness of classifying bacteria only by Gram reaction, shape and metabolism is that it:","options":["cannot identify pathogens","does not provide a clear evolutionary history of bacteria","requires DNA sequencing","applies only to archaea"],"answer":1,"explanation":"Slide 61–62: **\"Does not provide a clear evolutionary history of bacteria\"**.","distractorNotes":["Vẫn hỗ trợ nhận diện.","","Không cần DNA.","Sai."],"vocab":["phylogeny"],"trap":"Bergey's phenotypic groups show evolution","pool":"learn","source":"","id":"Q-BAC-07-004"},{"unit":"BAC-07","type":"concept","difficulty":2,"stem":"Why is 16S rRNA used to build phylogenetic trees of bacteria?","options":["It is found only in pathogenic bacteria","It is present in all prokaryotes and its sequence changes slowly, reflecting evolutionary relationships","It codes for flagellin","It determines the Gram reaction"],"answer":1,"explanation":"16S rRNA có ở **mọi** nhân sơ, chức năng **bảo tồn**, biến đổi chậm → phản ánh quan hệ tiến hóa.","distractorNotes":["Có ở mọi nhân sơ.","","Sai.","Sai."],"vocab":["16S rRNA"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-07-005"},{"unit":"BAC-07","type":"recall","difficulty":1,"stem":"According to the lecture, Firmicutes and Actinobacteria are:","options":["Gram-negative","Gram-positive","archaea","wall-less"],"answer":1,"explanation":"Slide 69: **Firmicutes (Gram+)**, **Actinobacteria (Gram+)**, Deinococcus-Thermus (Gram+); Proteobacteria phần lớn Gram âm.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["Firmicutes"],"trap":null,"pool":"learn","source":"2-3.Bacteria.pptx slide 69","id":"Q-BAC-07-006"},{"unit":"BAC-07","type":"recall","difficulty":1,"stem":"Which phylum is described in the lecture as \"most Gram-negative\" and includes E. coli?","options":["Firmicutes","Proteobacteria","Actinobacteria","Deinococcus-Thermus"],"answer":1,"explanation":"**Proteobacteria** (phần lớn Gram âm) gồm *E. coli, Salmonella, Pseudomonas*.","distractorNotes":["Gram dương.","","Gram dương.","Gram dương."],"vocab":["Proteobacteria"],"trap":"Proteobacteria are Gram-positive","pool":"mock","source":"2-3.Bacteria.pptx slide 69","id":"Q-BAC-07-007","mockSet":2},{"unit":"BAC-07","type":"application","difficulty":2,"stem":"A starting population of 500 cells undergoes 4 generations of binary fission with no death. How many cells are there?","options":["2,000","8,000","4,000","1,000"],"answer":1,"explanation":"N = N₀ × 2ⁿ = 500 × 2⁴ = 500 × 16 = **8.000**.","distractorNotes":["500 × 4 – nhân với n thay vì 2ⁿ.","","500 × 2³ – thiếu một thế hệ.","Chỉ 1 thế hệ."],"vocab":["binary fission"],"trap":null,"pool":"mock","source":"","steps":["N = N₀ × 2ⁿ","2⁴ = 16","500 × 16 = 8000"],"id":"Q-BAC-07-008","mockSet":3},{"unit":"BAC-07","type":"recall","difficulty":1,"stem":"Acidobacteria are described in the lecture as:","options":["a new, diverse phylum associated with acidic conditions","Gram-positive spore formers","photosynthetic oxygen producers","wall-less parasites"],"answer":0,"explanation":"Slide 69: **Acidobacteria – ngành mới, đa dạng, ưa acid**. Aquificae sống môi trường khắc nghiệt.","distractorNotes":["","Sai.","Đó là Cyanobacteria.","Sai."],"vocab":[],"trap":null,"pool":"mock","source":"2-3.Bacteria.pptx slide 69","id":"Q-BAC-07-009","mockSet":1},{"unit":"BAC-08","type":"recall","difficulty":1,"stem":"Pseudomurein, found in the walls of some archaea, differs from peptidoglycan because it contains:","options":["N-acetyl talosaminuronic acid instead of NAM and no D-amino acids","teichoic acid and LPS","chitin and glucan","more D-amino acids than peptidoglycan"],"answer":0,"explanation":"Slide 76: pseudomurein chứa **NAT thay NAM** và **không có D-amino acid**.","distractorNotes":["","Không.","Đó là thành nấm.","Ngược lại."],"vocab":["pseudomurein"],"trap":"Pseudomurein contains NAM","pool":"learn","source":"2-3.Bacteria.pptx slide 76","id":"Q-BAC-08-001"},{"unit":"BAC-08","type":"concept","difficulty":2,"stem":"Why are archaea naturally resistant to penicillin and lysozyme?","options":["They have an outer membrane like Gram-negative bacteria","They lack typical peptidoglycan, the target of both agents","They produce β-lactamase","They have 80S ribosomes"],"answer":1,"explanation":"Penicillin và lysozyme đều nhắm **peptidoglycan**; archaea **không có** (pseudomurein với liên kết β-1,3 không bị lysozyme cắt).","distractorNotes":["Không phải lý do chung.","","Không phải lý do.","Archaea có ribosome 70S."],"vocab":["pseudomurein"],"trap":"Archaea have peptidoglycan","pool":"learn","source":"","id":"Q-BAC-08-002"},{"unit":"BAC-08","type":"concept","difficulty":2,"stem":"Archaeal membrane lipids differ from bacterial lipids in that they:","options":["are ester-linked straight fatty acids","are ether-linked branched isoprenoid chains, sometimes forming monolayers","contain cholesterol","lack glycerol"],"answer":1,"explanation":"Archaea: **ether + isoprenoid phân nhánh**, có thể tạo **lớp đơn tetraether** chịu nhiệt.","distractorNotes":["Đó là vi khuẩn.","","Sai.","Có glycerol."],"vocab":["ether lipid"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-08-003"},{"unit":"BAC-08","type":"recall","difficulty":1,"stem":"Archaea that produce methane from CO2 and H2 in anaerobic environments are called:","options":["extreme halophiles","methanogens","thermophiles","cyanobacteria"],"answer":1,"explanation":"**Methanogens** – kỵ khí nghiêm ngặt, tạo **CH₄** (bể biogas, dạ cỏ).","distractorNotes":["Ưa mặn.","","Ưa nhiệt.","Vi khuẩn quang hợp."],"vocab":["methanogen"],"trap":null,"pool":"learn","source":"","id":"Q-BAC-08-004"},{"unit":"BAC-08","type":"not","difficulty":2,"stem":"Which statement about archaea is NOT correct?","options":["They are prokaryotes","Some live in extremely salty or hot environments","Halobacterium is a member of the domain Bacteria","They lack typical peptidoglycan"],"answer":2,"explanation":"***Halobacterium*** là **archaea** (cực ưa mặn) dù tên có \"bacterium\".","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["extreme halophile"],"trap":"Halobacterium is a bacterium","pool":"learn","source":"","id":"Q-BAC-08-005"},{"unit":"BAC-08","type":"application","difficulty":2,"stem":"A prokaryote grows at 95 °C in a hydrothermal vent, is not inhibited by penicillin and has ether-linked membrane lipids. It is most likely:","options":["a Gram-positive bacterium","a hyperthermophilic archaeon","a fungus","a mycoplasma"],"answer":1,"explanation":"Nhiệt độ cực cao + không nhạy penicillin + **lipid ether** → **archaea ưa nhiệt cực độ**.","distractorNotes":["Vi khuẩn có lipid ester.","","Nấm là nhân thực, không sống ở 95 °C.","Mycoplasma có lipid ester và sterol."],"vocab":["hyperthermophile","ether lipid"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-08-006","mockSet":2},{"unit":"BAC-08","type":"concept","difficulty":2,"stem":"Which feature do archaea share with bacteria rather than with eukaryotes?","options":["Ether-linked lipids","No membrane-bound nucleus and 70S ribosomes","Pseudomurein","Cellulose cell walls"],"answer":1,"explanation":"Archaea và Bacteria đều **nhân sơ**, không nhân có màng, ribosome **70S**.","distractorNotes":["Chỉ archaea có.","","Chỉ một số archaea.","Ở thực vật."],"vocab":["prokaryote"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-08-007","mockSet":3},{"unit":"BAC-08","type":"recall","difficulty":1,"stem":"Extreme halophiles are archaea that require:","options":["temperatures above 80 °C","high salt concentrations (about 15–30%)","strictly anaerobic conditions to make methane","low pH below 2 only"],"answer":1,"explanation":"Cực ưa mặn cần muối **cao** (15–30 %), ví dụ *Halobacterium*.","distractorNotes":["Đó là ưa nhiệt.","","Đó là methanogen.","Không đúng."],"vocab":["extreme halophile"],"trap":null,"pool":"mock","source":"","id":"Q-BAC-08-008","mockSet":1},{"unit":"FUN-01","type":"recall","difficulty":1,"stem":"In the Saccharomyces cerevisiae cell wall, chitin is found mainly in:","options":["the periplasmic space","bud scars","the nucleus","the vacuole"],"answer":1,"explanation":"Slide 8: **chitin** (N-acetylglucosamine, β-1,4) tập trung chủ yếu ở **sẹo chồi (bud scars)**.","distractorNotes":["Khoang chu chất chứa invertase, phosphatase.","","Sai.","Sai."],"vocab":["chitin","bud scar"],"trap":"Chitin is spread evenly in the wall","pool":"learn","source":"7. Yeasts.pptx slide 8","id":"Q-FUN-01-001"},{"unit":"FUN-01","type":"recall","difficulty":1,"stem":"Invertase in the yeast periplasmic space catalyzes:","options":["glucose → ethanol + CO2","sucrose → glucose + fructose","starch → maltose","lactose → glucose + galactose"],"answer":1,"explanation":"Slide 9: **invertase**: sucrose → **glucose + fructose**.","distractorNotes":["Đó là lên men ethanol (nhiều enzyme).","","Đó là amylase.","Đó là β-galactosidase."],"vocab":["invertase"],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 9","id":"Q-FUN-01-002"},{"unit":"FUN-01","type":"not","difficulty":2,"stem":"Which is NOT a major component of the Saccharomyces cerevisiae cell wall?","options":["Glucan","Mannan","Chitin","Peptidoglycan"],"answer":3,"explanation":"**Peptidoglycan** là thành phần thành **vi khuẩn**. Thành nấm men: glucan, mannan, chitin (+ mannoprotein, lipid, phosphate).","distractorNotes":["Có.","Có.","Có.",""],"vocab":["glucan","mannan","peptidoglycan"],"trap":"Yeast walls contain peptidoglycan","pool":"learn","source":"","id":"Q-FUN-01-003"},{"unit":"FUN-01","type":"recall","difficulty":1,"stem":"How many linear chromosomes does the haploid nucleus of Saccharomyces cerevisiae contain?","options":["1 circular chromosome","16","23","46"],"answer":1,"explanation":"Slide 14: bộ gene gồm **16 nhiễm sắc thể thẳng** (đơn bội; lưỡng bội 32).","distractorNotes":["Đó là vi khuẩn.","","Người đơn bội.","Người lưỡng bội."],"vocab":[],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 14","id":"Q-FUN-01-004"},{"unit":"FUN-01","type":"concept","difficulty":2,"stem":"The yeast vacuole helps regulate osmotic pressure because it:","options":["contains 70S ribosomes","stores amino acids, polyphosphates and metal ions","is surrounded by peptidoglycan","produces ATP"],"answer":1,"explanation":"Slide 18: không bào chứa **amino acid, polyphosphate, ion kim loại** → **điều hòa áp suất thẩm thấu**; còn chứa enzyme thủy phân protein.","distractorNotes":["Sai.","","Sai.","ATP do ty thể."],"vocab":["vacuole"],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 18","id":"Q-FUN-01-005"},{"unit":"FUN-01","type":"recall","difficulty":1,"stem":"Where are NADH dehydrogenase, succinate dehydrogenase and ATP synthase located in the yeast mitochondrion?","options":["Outer membrane","Inner membrane","Matrix","Intermembrane space"],"answer":1,"explanation":"Slide 20: **màng trong** chứa NADH dehydrogenase, succinate dehydrogenase, ATP synthase, protein vận chuyển. Màng ngoài: enzyme chuyển hóa lipid; chất nền: TCA, oxy hóa acid béo, mtDNA.","distractorNotes":["Enzyme chuyển hóa lipid.","","TCA, mtDNA.","Không phải."],"vocab":["mitochondrion"],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 20","id":"Q-FUN-01-006"},{"unit":"FUN-01","type":"concept","difficulty":2,"stem":"Which cytoskeletal elements does the lecture describe in yeast, and what is one function?","options":["Peptidoglycan; shape","Microtubules and microfilaments; moving organelles and participating in cell division","Flagella; swimming","Pili; DNA transfer"],"answer":1,"explanation":"Slide 11: bộ khung gồm **vi ống và vi sợi** → giữ hình dạng, ổn định cấu trúc, **di chuyển bào quan**, tham gia **phân chia**.","distractorNotes":["Sai.","","Nấm men không có roi.","Sai."],"vocab":["cytoskeleton"],"trap":null,"pool":"learn","source":"","id":"Q-FUN-01-007"},{"unit":"FUN-01","type":"not","difficulty":2,"stem":"Which statement about the yeast mitochondrion is NOT correct?","options":["It contains its own DNA","The matrix contains enzymes of the citric acid cycle","Its shape and number are fixed regardless of growth conditions","The inner membrane contains ATP synthase"],"answer":2,"explanation":"Slide 21: hình dạng, kích thước, số lượng ty thể **thay đổi theo loài, giai đoạn sinh trưởng và điều kiện dinh dưỡng**.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["mitochondrion"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-01-008","mockSet":3},{"unit":"FUN-01","type":"recall","difficulty":1,"stem":"Which organelle contains oxidizing enzymes in the yeast cell?","options":["Golgi body","Peroxisome","Vacuole","Nucleus"],"answer":1,"explanation":"Slide 19: **peroxisome** chứa enzyme oxy hóa.","distractorNotes":["Golgi: đóng gói protein.","","Không bào: protease, dự trữ.","Nhân: DNA."],"vocab":["peroxisome"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-01-009","mockSet":2},{"unit":"FUN-01","type":"concept","difficulty":2,"stem":"Why does penicillin have no effect on yeasts?","options":["Yeasts have an outer membrane","Yeast walls are made of glucan, mannan and chitin, not peptidoglycan","Yeasts have 70S ribosomes","Yeasts produce invertase"],"answer":1,"explanation":"Penicillin nhắm **transpeptidase của peptidoglycan**; thành nấm men **không có peptidoglycan**.","distractorNotes":["Nấm men không có màng ngoài kiểu Gram âm.","","Nấm men có 80S.","Không liên quan."],"vocab":["cell wall","penicillin"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-01-010","mockSet":3},{"unit":"FUN-01","type":"application","difficulty":2,"stem":"A yeast strain lacking invertase is grown on a medium whose only sugar is sucrose. What is expected?","options":["Normal growth, because sucrose diffuses in freely","Poor or no growth, because sucrose cannot be split into glucose and fructose","Faster growth","The strain will form endospores"],"answer":1,"explanation":"Không có **invertase** → không thủy phân được sucrose → thiếu nguồn carbon dùng được → sinh trưởng kém.","distractorNotes":["Sucrose cần được thủy phân trước.","","Sai.","Nấm men không tạo nội bào tử."],"vocab":["invertase"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-01-011","mockSet":1},{"unit":"FUN-02","type":"calc","difficulty":2,"stem":"According to the lecture, how many NADH molecules are produced when TWO acetyl-CoA molecules pass through the citric acid cycle?","options":["3","6","4","2"],"answer":1,"explanation":"Slide 23: 2 acetyl-CoA → **4 CO₂, 6 NADH, 2 FADH₂, 2 ATP**.","distractorNotes":["Đó là cho 1 acetyl-CoA.","","Đó là số CO₂.","Đó là số FADH₂ hoặc ATP."],"vocab":["citric acid cycle"],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 23","steps":["Mỗi acetyl-CoA tạo 3 NADH","2 × 3 = 6 NADH"],"id":"Q-FUN-02-001"},{"unit":"FUN-02","type":"recall","difficulty":1,"stem":"Saccharomyces cerevisiae is best described as a:","options":["obligate aerobe","obligate anaerobe","facultative anaerobe","photoautotroph"],"answer":2,"explanation":"Slide 23: *S. cerevisiae* là **facultative anaerobe** – hô hấp khi có O₂, lên men khi không có.","distractorNotes":["Nó sống được không có O₂.","Nó dùng O₂ khi có.","","Nấm là dị dưỡng."],"vocab":["facultative anaerobe"],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 23","id":"Q-FUN-02-002"},{"unit":"FUN-02","type":"concept","difficulty":2,"stem":"Which statement about budding in S. cerevisiae is correct?","options":["Only haploid cells can bud","Budding involves meiosis","Both haploid and diploid cells can reproduce by budding through mitosis","Budding produces four ascospores"],"answer":2,"explanation":"Slide 29: **tế bào đơn bội và lưỡng bội** đều **nảy chồi bằng nguyên phân**.","distractorNotes":["Sai.","Nảy chồi là nguyên phân.","","Ascospore là sinh sản hữu tính."],"vocab":["budding"],"trap":"Only haploid cells can bud","pool":"learn","source":"7. Yeasts.pptx slide 29","id":"Q-FUN-02-003"},{"unit":"FUN-02","type":"concept","difficulty":2,"stem":"In the S. cerevisiae life cycle, what is the product of mating between a haploid α cell and a haploid a cell?","options":["Four ascospores","A diploid zygote","A haploid bud","A pseudohypha"],"answer":1,"explanation":"α + a → **hợp tử lưỡng bội (2n)**. Sau đó (khi đói) mới giảm phân tạo 4 bào tử túi.","distractorNotes":["Đó là sau giảm phân.","","Sai.","Sai."],"vocab":["mating type","zygote"],"trap":null,"pool":"learn","source":"","id":"Q-FUN-02-004"},{"unit":"FUN-02","type":"recall","difficulty":1,"stem":"A yeast that divides by fission, like bacteria, is:","options":["Saccharomyces cerevisiae","Schizosaccharomyces pombe","Candida albicans","Cryptococcus neoformans"],"answer":1,"explanation":"***Schizosaccharomyces pombe*** – phân đôi. *S. cerevisiae* – nảy chồi.","distractorNotes":["Nảy chồi.","","Nảy chồi, tạo giả sợi.","Nảy chồi."],"vocab":["fission"],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 30","id":"Q-FUN-02-005"},{"unit":"FUN-02","type":"calc","difficulty":2,"stem":"In ethanol fermentation, how many moles of ethanol and CO2 are produced from 1 mole of glucose (ideal equation)?","options":["1 ethanol + 1 CO2","2 ethanol + 2 CO2","2 ethanol + 6 CO2","3 ethanol + 3 CO2"],"answer":1,"explanation":"C₆H₁₂O₆ → **2 C₂H₅OH + 2 CO₂** (cân bằng: 6 C = 2×2 + 2×1).","distractorNotes":["Không cân bằng carbon.","","6 CO₂ là hô hấp hoàn toàn.","Không cân bằng."],"vocab":["fermentation"],"trap":null,"pool":"learn","source":"","steps":["C bên trái = 6","2 ethanol (4 C) + 2 CO₂ (2 C) = 6 C"],"id":"Q-FUN-02-006"},{"unit":"FUN-02","type":"concept","difficulty":2,"stem":"Why does yeast grow (increase in biomass) much more under aerobic conditions than during fermentation?","options":["Oxygen is a nutrient that becomes cell mass","Respiration yields much more ATP per glucose than fermentation (2 ATP)","Fermentation kills the cells","Ethanol is used as a building block"],"answer":1,"explanation":"Hô hấp tạo **nhiều ATP** hơn nhiều so với **2 ATP** của lên men → nhiều năng lượng cho sinh tổng hợp → sinh khối cao.","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["respiration","fermentation"],"trap":"Fermentation gives more ATP than respiration","pool":"learn","source":"","id":"Q-FUN-02-007"},{"unit":"FUN-02","type":"not","difficulty":2,"stem":"Which statement about sexual reproduction of S. cerevisiae is NOT correct?","options":["It involves haploid cells of mating types a and α","The diploid undergoes meiosis to form haploid spores","The spores are enclosed in an ascus","It is achieved by budding of haploid cells"],"answer":3,"explanation":"Nảy chồi là **vô tính**. Hữu tính = giao phối α × a + giảm phân tạo bào tử túi.","distractorNotes":["Đúng.","Đúng.","Đúng.",""],"vocab":["ascus","meiosis"],"trap":"Budding uses meiosis","pool":"mock","source":"","id":"Q-FUN-02-008","mockSet":1},{"unit":"FUN-02","type":"recall","difficulty":1,"stem":"Meiosis of a diploid S. cerevisiae cell typically produces how many ascospores per ascus?","options":["2","4","8","16"],"answer":1,"explanation":"Một lần giảm phân → **4 bào tử túi đơn bội** trong một ascus (ở nấm mốc Ascomycota thường là 8 do thêm một lần nguyên phân).","distractorNotes":["Sai.","","Thường gặp ở nấm mốc túi (Neurospora).","Sai."],"vocab":["ascospore"],"trap":"Ascus contains 8 spores in S. cerevisiae","pool":"mock","source":"","id":"Q-FUN-02-009","mockSet":2},{"unit":"FUN-02","type":"calc","difficulty":2,"stem":"Two acetyl-CoA molecules enter the citric acid cycle. How many CO2 molecules are released by the cycle?","options":["2","4","6","3"],"answer":1,"explanation":"Slide 23: 2 acetyl-CoA → **4 CO₂** (2 mỗi vòng).","distractorNotes":["Đó là cho 1 acetyl-CoA.","","Nhầm với số NADH.","Sai."],"vocab":["citric acid cycle"],"trap":null,"pool":"mock","source":"","steps":["1 acetyl-CoA → 2 CO₂","2 × 2 = 4"],"id":"Q-FUN-02-010","mockSet":2},{"unit":"FUN-02","type":"application","difficulty":2,"stem":"Chains of elongated yeast buds that remain attached look like hyphae. These are called:","options":["true hyphae","pseudohyphae","mycelia","conidiophores"],"answer":1,"explanation":"Chồi không tách tạo chuỗi = **giả sợi (pseudohyphae)**, ví dụ *Candida albicans*.","distractorNotes":["Sợi thật là của nấm mốc.","","Hệ sợi nấm mốc.","Cuống bào tử đính."],"vocab":["pseudohyphae"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-02-011","mockSet":3},{"unit":"FUN-03","type":"not","difficulty":2,"stem":"Which comparison between yeasts and bacteria is NOT correct?","options":["Yeasts have 80S ribosomes; bacteria have 70S","Yeast membranes contain sterols; most bacterial membranes do not","Yeast walls contain peptidoglycan; bacterial walls contain chitin","Yeast spores are reproductive; bacterial endospores are not"],"answer":2,"explanation":"Ngược lại: thành **nấm men** là glucan–mannan–chitin; thành **vi khuẩn** là **peptidoglycan**.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["peptidoglycan","chitin"],"trap":null,"pool":"learn","source":"7. Yeasts.pptx slide 37","id":"Q-FUN-03-001"},{"unit":"FUN-03","type":"concept","difficulty":2,"stem":"What is the main disadvantage of counting yeast cells with a red-blood-cell counting chamber compared with plate counts?","options":["It takes 2–3 days","It counts dead cells as well as live cells unless a viability stain is used","It requires large amounts of media","It cannot count cells at high density"],"answer":1,"explanation":"Buồng đếm **đếm cả tế bào chết**; muốn phân biệt phải nhuộm **methylene blue**. Nó lại **nhanh** và **ít vật tư**.","distractorNotes":["Đó là nhược điểm của đếm đĩa.","","Đó là nhược điểm của đếm đĩa.","Ngược lại, nó cần mật độ cao."],"vocab":["counting chamber","plate count"],"trap":"Chamber counts only live cells","pool":"learn","source":"7. Yeasts.pptx slides 44–48","id":"Q-FUN-03-002"},{"unit":"FUN-03","type":"calc","difficulty":2,"stem":"A yeast suspension diluted 10-fold is placed in a counting chamber. 150 cells are counted in a volume of 10⁻⁴ mL. What is the cell concentration of the original suspension?","options":["1.5 × 10⁶ cells/mL","1.5 × 10⁷ cells/mL","1.5 × 10⁵ cells/mL","1.5 × 10⁸ cells/mL"],"answer":1,"explanation":"C = 150 / 10⁻⁴ × 10 = 1,5 × 10⁶ × 10 = **1,5 × 10⁷ tế bào/mL**.","distractorNotes":["Quên nhân hệ số pha loãng 10.","","Chia thay vì nhân hệ số pha loãng.","Nhân thừa một bậc 10."],"vocab":["counting chamber","dilution factor"],"trap":null,"pool":"learn","source":"","steps":["C = N / V × D","150 / 10⁻⁴ = 1,5 × 10⁶","× 10 = 1,5 × 10⁷ tế bào/mL"],"id":"Q-FUN-03-003"},{"unit":"FUN-03","type":"recall","difficulty":1,"stem":"In a methylene blue viability test of yeast, dead cells appear:","options":["colorless","blue","red","green"],"answer":1,"explanation":"Tế bào **sống khử** methylene blue → không màu; tế bào **chết** không khử được → **xanh**.","distractorNotes":["Đó là tế bào sống.","","Sai.","Sai."],"vocab":["methylene blue"],"trap":null,"pool":"learn","source":"","id":"Q-FUN-03-004"},{"unit":"FUN-03","type":"concept","difficulty":2,"stem":"\"Yeast\" is best described as:","options":["a single phylum of fungi","a unicellular growth form found in several fungal groups (e.g., ascomycetes and basidiomycetes)","a type of bacterium","a protist"],"answer":1,"explanation":"Nấm men là **dạng sinh trưởng đơn bào**, có trong nhiều nhóm (Ascomycetes: *Saccharomyces*; Basidiomycetes: *Cryptococcus*).","distractorNotes":["Không phải một ngành.","","Nấm men là nấm nhân thực.","Không phải nguyên sinh vật."],"vocab":["yeast"],"trap":"Yeast is a phylum","pool":"learn","source":"","id":"Q-FUN-03-005"},{"unit":"FUN-03","type":"calc","difficulty":2,"stem":"0.1 mL of a 10⁻⁵ dilution of a yeast culture is spread on a plate and gives 64 colonies. What is the viable count of the original culture?","options":["6.4 × 10⁶ CFU/mL","6.4 × 10⁷ CFU/mL","6.4 × 10⁵ CFU/mL","6.4 × 10⁸ CFU/mL"],"answer":1,"explanation":"CFU/mL = 64 / (0,1 × 10⁻⁵) = 64 × 10⁶ = **6,4 × 10⁷ CFU/mL**.","distractorNotes":["Quên chia cho 0,1 mL.","","Sai hai bậc.","Nhân thừa một bậc."],"vocab":["CFU","plate count"],"trap":null,"pool":"learn","source":"","steps":["CFU/mL = số khuẩn lạc / (V × d)","V × d = 0,1 × 10⁻⁵ = 10⁻⁶","64 / 10⁻⁶ = 6,4 × 10⁷"],"id":"Q-FUN-03-006"},{"unit":"FUN-03","type":"not","difficulty":2,"stem":"Which is NOT an advantage of the plate count method over the counting chamber?","options":["It counts only viable cells","It can detect low cell numbers","It gives results within minutes","Contaminants can be seen as different colonies"],"answer":2,"explanation":"Đếm đĩa cần **2–3 ngày ủ** – đó là **nhược điểm**. Buồng đếm mới cho kết quả trong vài phút.","distractorNotes":["Ưu điểm.","Ưu điểm.","","Ưu điểm."],"vocab":["plate count"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-03-007","mockSet":2},{"unit":"FUN-03","type":"recall","difficulty":1,"stem":"Which metabolic description applies to yeasts according to the yeast–bacteria comparison table?","options":["Autotrophic and strictly anaerobic","Heterotrophic and facultatively anaerobic","Photoautotrophic","Chemoautotrophic and aerobic"],"answer":1,"explanation":"Bảng slide 37: nấm men **dị dưỡng, kỵ khí tùy nghi**; vi khuẩn đa dạng hơn (tự dưỡng/dị dưỡng; hiếu khí/kỵ khí).","distractorNotes":["Sai.","","Sai.","Sai."],"vocab":["facultative anaerobe"],"trap":null,"pool":"mock","source":"7. Yeasts.pptx slide 37","id":"Q-FUN-03-008","mockSet":1},{"unit":"FUN-03","type":"application","difficulty":3,"stem":"A counting chamber gives 2.0 × 10⁸ cells/mL, of which 25% stain blue with methylene blue. What is the estimated concentration of LIVE cells?","options":["5.0 × 10⁷ cells/mL","1.5 × 10⁸ cells/mL","2.0 × 10⁸ cells/mL","2.5 × 10⁷ cells/mL"],"answer":1,"explanation":"25 % bắt màu xanh = **chết** → sống 75 %: 2,0 × 10⁸ × 0,75 = **1,5 × 10⁸ tế bào/mL**.","distractorNotes":["Đó là số tế bào chết.","","Đó là tổng số.","Sai."],"vocab":["methylene blue"],"trap":null,"pool":"mock","source":"","steps":["Tế bào xanh = chết = 25 %","Sống = 75 %","2,0 × 10⁸ × 0,75 = 1,5 × 10⁸"],"id":"Q-FUN-03-009","mockSet":2},{"unit":"FUN-03","type":"recall","difficulty":1,"stem":"Cryptococcus is an example of a yeast belonging to:","options":["Ascomycetes","Basidiomycetes","Bacteria","Protists"],"answer":1,"explanation":"*Cryptococcus* là nấm men thuộc **Basidiomycetes**; *Saccharomyces* thuộc Ascomycetes.","distractorNotes":["Saccharomyces.","","Sai.","Sai."],"vocab":["basidiomycetes"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-03-010","mockSet":3},{"unit":"FUN-04","type":"recall","difficulty":1,"stem":"Hyphae that lack cross-walls and contain many nuclei in a continuous cytoplasm are called:","options":["septate","coenocytic","aerial","pseudohyphae"],"answer":1,"explanation":"**Coenocytic** = không vách ngăn, nhiều nhân (ví dụ *Rhizopus, Mucor*).","distractorNotes":["Có vách ngăn.","","Chỉ vị trí/chức năng.","Chuỗi tế bào nấm men."],"vocab":["coenocytic","septa"],"trap":"Coenocytic hyphae have septa","pool":"learn","source":"","id":"Q-FUN-04-001"},{"unit":"FUN-04","type":"recall","difficulty":1,"stem":"The cell wall of mold hyphae is made mainly of:","options":["peptidoglycan","chitin","cellulose only","lipopolysaccharide"],"answer":1,"explanation":"Slide 10: sợi nấm là ống tế bào có **thành chitin**.","distractorNotes":["Thành vi khuẩn.","","Thành thực vật/tảo lục/oomycetes.","Màng ngoài Gram âm."],"vocab":["chitin","hyphae"],"trap":"Mold walls are peptidoglycan","pool":"learn","source":"8. Molds.pptx slide 10","id":"Q-FUN-04-002"},{"unit":"FUN-04","type":"concept","difficulty":2,"stem":"Which hyphae usually bear the reproductive spores of a mold?","options":["Vegetative hyphae growing in the substrate","Aerial hyphae projecting above the medium","Septa","Rhizoids only"],"answer":1,"explanation":"Slide 14: **aerial (reproductive) hyphae** vươn lên trên bề mặt và **thường mang bào tử**.","distractorNotes":["Sợi dinh dưỡng hấp thụ chất dinh dưỡng.","","Septa là vách ngăn.","Không đúng."],"vocab":["aerial hypha"],"trap":null,"pool":"learn","source":"8. Molds.pptx slide 14","id":"Q-FUN-04-003"},{"unit":"FUN-04","type":"concept","difficulty":2,"stem":"How do hyphae elongate?","options":["By binary fission of each cell","Mainly by growth at the tips","By budding along the length","By fusion of spores"],"answer":1,"explanation":"Slide 12: sợi nấm **kéo dài ở đỉnh (tip)** và phân nhánh.","distractorNotes":["Không.","","Nảy chồi là nấm men.","Không."],"vocab":["hyphae"],"trap":null,"pool":"learn","source":"8. Molds.pptx slide 12","id":"Q-FUN-04-004"},{"unit":"FUN-04","type":"application","difficulty":2,"stem":"A mold colony is broken into small hyphal fragments by vigorous shaking and spread on agar. Many colonies appear. This shows that:","options":["only spores can reproduce molds","each hyphal fragment can elongate into a new hypha","hyphae are killed by shaking","molds are unicellular"],"answer":1,"explanation":"Slide 12: **mỗi phần sợi đều có khả năng sinh trưởng**; đoạn sợi đứt ra mọc thành sợi mới → **phân mảnh**.","distractorNotes":["Mảnh sợi cũng tạo khuẩn lạc.","","Sai.","Sai."],"vocab":["fragmentation"],"trap":"Only spores can start a new colony","pool":"learn","source":"","id":"Q-FUN-04-005"},{"unit":"FUN-04","type":"not","difficulty":2,"stem":"Which statement about septate hyphae is NOT correct?","options":["They contain cross-walls called septa","Septa divide them into cell-like units","They are the typical hyphae of Rhizopus","Septa usually have pores"],"answer":2,"explanation":"*Rhizopus* có sợi **cộng bào (coenocytic)**. Sợi có vách ngăn điển hình ở *Aspergillus, Penicillium*.","distractorNotes":["Đúng.","Đúng.","","Đúng."],"vocab":["septate hyphae"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-04-006","mockSet":3},{"unit":"FUN-04","type":"recall","difficulty":1,"stem":"The visible mass of intertwined hyphae of a mold is called:","options":["a septum","a mycelium","a sporangium","a thallus of lichen"],"answer":1,"explanation":"**Mycelium** = khối sợi nấm đan xen.","distractorNotes":["Vách ngăn.","","Túi bào tử.","Tản địa y."],"vocab":["mycelium"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-04-007","mockSet":1},{"unit":"FUN-04","type":"concept","difficulty":2,"stem":"Vegetative hyphae mainly function to:","options":["produce sexual spores","obtain nutrients from the substrate","photosynthesize","attach to host cells like fimbriae"],"answer":1,"explanation":"Slide 14: **vegetative hypha** = phần sợi **lấy chất dinh dưỡng**.","distractorNotes":["Không phải chính.","","Nấm không quang hợp.","Không."],"vocab":["vegetative hypha"],"trap":null,"pool":"mock","source":"","id":"Q-FUN-04-008","mockSet":2},{"unit":"FUN-05","type":"recall","difficulty":1,"stem":"Asexual spores formed inside a sac at the tip of an aerial hypha are called:","options":["conidiospores","sporangiospores","ascospores","zygospores"],"answer":1,"explanation":"Slide 22: **sporangiospores** hình thành **trong sporangium** ở đầu **sporangiophore**.","distractorNotes":["Conidia không nằm trong túi.","","Bào tử hữu tính trong ascus.","Bào tử hữu tính vách dày."],"vocab":["sporangiospore","sporangium"],"trap":"Conidia are formed in a sporangium","pool":"learn","source":"8. Molds.pptx slide 22","id":"Q-FUN-05-001"},{"unit":"FUN-05","type":"recall","difficulty":1,"stem":"A conidiospore (conidium) is best defined as:","options":["a motile spore with flagella","a unicellular or multicellular spore NOT enclosed in a sac","a sexual spore formed inside an ascus","a thick-walled spore formed after fusion of hyphae"],"answer":1,"explanation":"Slide 24: conidium là bào tử đơn/đa bào **không nằm trong túi**.","distractorNotes":["Đó là zoospore.","","Đó là ascosp
