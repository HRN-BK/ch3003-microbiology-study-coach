velope.\n\nCác thuốc ARV nhắm đúng các enzyme: **ức chế reverse transcriptase, integrase, protease**. [mở rộng]"},{"h":"4. Chu trình tan – lytic cycle (slide 30–31)","body":"- **Phage vào tế bào, nhân lên và phá hủy tế bào chủ** để phage mới thoát ra.\n- Mỗi phage mới lại tấn công tế bào khác → vài chu trình tan tiếp theo **phá hủy toàn bộ quần thể tế bào chủ chỉ trong vài giờ**.\n- Phage **chỉ nhân lên bằng chu trình tan** = **phage độc (virulent phage)** (vd T4).\n\nVí dụ T4 ở *E. coli* [fig]: (1) **bám** – sợi đuôi gắn thụ thể; (2) **xâm nhập** – lysozyme đuôi làm yếu thành, bao đuôi co, lõi đuôi bơm DNA; (3) **sinh tổng hợp** – DNA chủ bị phân hủy, tổng hợp DNA và protein phage; (4) **trưởng thành** – lắp đầu, đuôi, DNA; (5) **giải phóng** – **lysozyme** phá thành → ly giải."},{"h":"5. Chu trình tiềm tan – lysogenic cycle (slide 32–34)","body":"- **Phage lambda (λ)**: **phage ôn hòa (temperate phage)** – nhân lên được **cả bằng chu trình tan và tiềm tan**. Cấu trúc giống T4 nhưng đuôi chỉ có **một sợi đuôi ngắn**.\n- Trong tiềm tan: phage vào tế bào, **genome phage được sao chép nhưng tế bào chủ không bị phá hủy**.\n- Các bước: DNA λ vòng hóa → **tích hợp vào nhiễm sắc thể vi khuẩn** thành **prophage** → nhân đôi cùng NST chủ khi tế bào phân chia → quần thể **tế bào tiềm tan (lysogen)**.\n- **Cảm ứng (induction)**: tác nhân gây tổn thương DNA (UV, hóa chất) → prophage **cắt ra** → vào **chu trình tan**.\n- Hệ quả [mở rộng]: **miễn dịch với phage cùng loại**; **chuyển đổi tiềm tan (lysogenic conversion)** – gene phage làm vi khuẩn độc hơn (độc tố bạch hầu, độc tố tả, độc tố Shiga); **tải nạp chuyên biệt**.\n\n| | Tan (lytic) | Tiềm tan (lysogenic) |\n|---|---|---|\n| Kết cục tế bào chủ | **bị phá hủy** | **sống**, phân chia |\n| DNA phage | nhân lên, lắp hạt | **prophage** tích hợp, sao chép cùng NST |\n| Loại phage | độc (T4) và ôn hòa | chỉ **ôn hòa** (λ) |\n| Chuyển sang | – | tan khi **cảm ứng** |"}],"extension":[{"h":"Đếm phage bằng plaque assay","body":"Trộn phage pha loãng với vi khuẩn chủ trên thạch → mỗi phage tạo một **vết tan (plaque)** trong thảm vi khuẩn → đếm **PFU (plaque-forming units)**.\n\n> Công thức: **PFU/mL = số plaque ÷ (thể tích cấy mL × độ pha loãng)** – giống CFU (GRO-06).\n\nVí dụ: 0,1 mL dịch pha loãng 10⁻⁶ cho 150 plaque → 150 / (0,1 × 10⁻⁶) = **1,5 × 10⁹ PFU/mL**."},{"h":"Nhiễm virus tiềm ẩn ở người","body":"Herpes cũng có trạng thái **tiềm ẩn (latency)** trong tế bào thần kinh – giống ý tưởng tiềm tan: HHV-3 gây thủy đậu lúc nhỏ, nằm im ở hạch thần kinh, tái hoạt khi miễn dịch giảm → **zona**. HIV ở dạng provirus trong tế bào T nghỉ là lý do chưa chữa khỏi hoàn toàn."}],"keyCards":[{"title":"Host dependence and entry","bodyEn":"Viruses multiply only inside host cells; they **lack ribosomes**. Recognition by **lock & key**: viral surface proteins match specific host receptors. **T-even phages** puncture cell walls with their tail; some viruses enter by **endocytosis**; **enveloped viruses** enter by **fusion** with the plasma membrane.","glossVi":"Ổ khóa – chìa khóa."},{"title":"Biosynthesis and assembly","bodyEn":"Host provides **nucleotides, enzymes, ribosomes, tRNAs, amino acids, ATP**. **DNA viruses use host DNA polymerase**; **RNA viruses use viral polymerase**. Nucleic acids and capsomeres **assemble** into new virions. HIV: **reverse transcriptase** RNA → DNA, integration as **provirus**, budding.","glossVi":"Chủ cung cấp nguyên liệu."},{"title":"Lytic vs lysogenic","bodyEn":"**Lytic**: phage multiplies and **destroys** the host; successive cycles destroy a population in hours; **virulent phages** only lytic. **Lysogenic**: genome replicated but host **not destroyed** (**prophage**). **Phage lambda** is **temperate** (both cycles); like T4 but tail has **one short tail fiber**.","glossVi":"Tan vs tiềm tan."}],"traps":["RNA viruses use host RNA polymerase to copy their genome","Temperate phages can only undergo the lytic cycle","In lysogeny the host cell is lysed immediately"]},{"id":"VIR-04","title":"Viroids, virusoids and prions","priority":"M","difficulty":1,"minutes":15,"source":"11.Viruses_Viroids_Prions.pptx: slides 35–44","prereq":[],"hookVi":"Ở Philippines, hàng chục triệu cây dừa đã chết vì bệnh **cadang-cadang** – tác nhân chỉ là một **sợi RNA vòng trần chưa tới 400 nucleotide**, không có vỏ protein, không mã hóa protein nào. Còn bệnh **bò điên** thì thủ phạm lại là một **protein** không có gene. Đây là những tác nhân gây bệnh \"nhỏ hơn virus\".","predictQuestion":{"stem":"What is a viroid?","options":["A small virus with a DNA genome","A short piece of naked RNA with no protein coat","A misfolded protein","A bacterium without a wall"],"answer":1,"explanation":"Slide 37: viroid = **đoạn RNA trần ngắn (300–400 nt)**, **không có vỏ protein**."},"lesson":[{"h":"1. Viroid (slide 37)","body":"- **Đoạn RNA trần ngắn**, chỉ **300–400 nucleotide**, **không có vỏ protein**.\n- Các nucleotide thường **bắt cặp nội phân tử** → phân tử có **cấu trúc 3D khép kín, gấp nếp** → có lẽ giúp **chống bị enzyme tế bào phân hủy**.\n- Được **RNA polymerase của tế bào chủ** sao chép liên tục trong **nhân tế bào hoặc lục lạp**.\n- **RNA viroid là một ribozyme** cắt chuỗi RNA dài liên tục (sản phẩm sao chép cuộn lăn) thành các đoạn viroid.\n- RNA **không mã hóa protein nào**; có thể gây bệnh bằng **làm im lặng gene (gene silencing)**.\n- Chỉ gây bệnh ở **thực vật**."},{"h":"2. Virusoid (slide 37)","body":"- **Một số viroid được bao trong vỏ protein** gọi là **virusoids**.\n- Virusoid **chỉ gây bệnh khi tế bào đồng thời nhiễm một virus** (virus trợ giúp – helper virus cung cấp vỏ và chức năng đóng gói)."},{"h":"3. Bệnh cadang-cadang và phân loại viroid (slide 38–40)","body":"- **Cadang-cadang** (Philippines) – bệnh chết dừa: **Họ *Pospiviroidae***, **Chi *Cocadviroid***, **Loài Coconut cadang-cadang viroid**.\n\n| Họ | Chi | Vật chủ |\n|---|---|---|\n| ***Pospiviroidae*** | *Pospiviroid* | **khoai tây** (potato spindle tuber viroid) |\n| | *Hostuviroid* | **hoa bia (hop)** |\n| | *Cocadviroid* | **dừa** |\n| | *Apscaviroid* | **táo** |\n| | *Coleviroid* | **tía tô (Coleus/perilla)** |\n| ***Avsunviroidae*** | *Avsunviroid* | **bơ (avocado)** |\n| | *Pelamoviroid* | **đào (peach)** |\n\n- Tên viroid dùng hậu tố **-viroid** (chi) và **-viroidae** (họ). [mở rộng: *Pospiviroidae* sao chép trong **nhân**; *Avsunviroidae* sao chép trong **lục lạp** và có ribozyme đầu búa.]"},{"h":"4. Prion (slide 41–44)","body":"- **Prion là protein** (proteinaceous infectious particle) – **không có nucleic acid**.\n- Gây một số **bệnh thoái hóa não** (bệnh não xốp): **bò điên (BSE)**, **Creutzfeldt–Jakob (CJD)** ở người, **scrapie** ở cừu, kuru.\n- Lây qua **dụng cụ y tế nhiễm** hoặc **ăn phải mô nhiễm**.\n- Tiến triển **rất chậm**, **ủ bệnh ít nhất 10 năm** (theo slide; thực tế dao động rộng).\n- **Không bị phá hủy hay bất hoạt ở nhiệt độ nấu ăn thông thường**; kháng cả hấp tiệt trùng tiêu chuẩn (cần 134 °C lâu hơn, NaOH 1 N – liên hệ CTL). [mở rộng]\n- Cơ chế (slide 43–44): gene chủ mã hóa protein bình thường **PrPᶜ**; protein **sai cấu dạng PrPˢᶜ** tiếp xúc và **chuyển** PrPᶜ thành PrPˢᶜ → phản ứng dây chuyền → **tích tụ, kết tụ** → chết tế bào thần kinh, não thủng lỗ như bọt biển.\n\n| | Virus | Viroid | Virusoid | Prion |\n|---|---|---|---|---|\n| Nucleic acid | DNA hoặc RNA | **RNA trần 300–400 nt** | RNA | **không** |\n| Vỏ protein | có | **không** | **có** | – (chính là protein) |\n| Mã hóa protein | có | **không** | không | – |\n| Vật chủ | mọi nhóm | **thực vật** | thực vật (cần virus trợ giúp) | động vật, người |"}],"extension":[{"h":"Bò điên và an toàn thực phẩm","body":"Dịch BSE ở Anh (1986–1990s) bắt nguồn từ việc cho bò ăn **bột xương thịt** từ gia súc nhiễm. Người ăn thịt nhiễm → **vCJD**. Từ đó nhiều nước cấm thức ăn chăn nuôi chứa protein động vật nhai lại, loại bỏ mô não tủy khi giết mổ. Dụng cụ phẫu thuật thần kinh cần quy trình khử prion đặc biệt."}],"keyCards":[{"title":"Viroids","bodyEn":"Short pieces of **naked RNA, 300–400 nucleotides**, no protein coat; internally paired into a closed folded 3D structure that resists cellular enzymes. Replicated by **host RNA polymerase** in the **nucleus or chloroplasts**; viroid RNA is a **ribozyme** that cuts the continuous RNA; **codes for no proteins**; may cause disease by **gene silencing**.","glossVi":"RNA trần, không mã hóa protein."},{"title":"Virusoids and viroid taxonomy","bodyEn":"**Virusoids**: viroids enclosed in a protein coat; cause disease **only when the cell is also infected by a virus**. **Cadang-cadang** (coconut): *Pospiviroidae*, *Cocadviroid*. *Pospiviroidae*: Pospiviroid (potato), Hostuviroid (hop), Cocadviroid (coconut), Apscaviroid (apple), Coleviroid (perilla). *Avsunviroidae*: Avsunviroid (avocado), Pelamoviroid (peach).","glossVi":"Hai họ viroid."},{"title":"Prions","bodyEn":"**Proteins** causing degenerative **brain diseases**; transmitted by **contaminated medical equipment** or **ingestion of infected tissue**; very slow, **incubation ≥ 10 years** (lecture); **not inactivated at normal cooking temperatures**. Misfolded PrP converts normal PrP.","glossVi":"Protein gây bệnh não."}],"traps":["Viroids have a protein coat","Viroids encode proteins","Prions contain RNA","Cooking destroys prions"]},{"id":"IDT-01","title":"Phenotypic identification: Bergey's Manual, dichotomous keys, biochemical tests, cell-wall chemistry","priority":"H","difficulty":2,"minutes":25,"source":"12.Identification of Microorganisms.pptx: slides 1–15","prereq":[],"hookVi":"Phòng xét nghiệm nhận một mẫu phân bệnh nhân tiêu chảy, phân lập được một trực khuẩn Gram âm. Là *E. coli* vô hại hay *Salmonella*, *Shigella* gây bệnh? Không cần giải trình tự, chỉ vài ống thử **oxidase, lactose, indole, citrate** là đã thu hẹp đáng kể – đó là **định danh kiểu hình** theo khóa của **Bergey's Manual**.","predictQuestion":{"stem":"All Enterobacteriaceae are oxidase-negative. Which test separates Escherichia from Salmonella and Shigella in the lecture?","options":["Gram stain","Lactose fermentation with acid and gas","Oxidase test","Endospore stain"],"answer":1,"explanation":"Slide 11: *Escherichia, Enterobacter, Citrobacter* **lên men lactose tạo acid và khí**; *Salmonella, Shigella* thì không."},"lesson":[{"h":"1. Mục tiêu bài (slide 2–3)","body":"- **L.O.1**: giải thích các bước định danh một vi sinh vật dựa trên **đặc điểm hình thái, sinh lý, lý học và hóa học**.\n- **L.O.2**: giải thích các bước định danh dựa trên **trình tự nucleotide/protein đặc hiệu** (bài IDT-02).\n- Phân biệt: **phân loại (classification)** – sắp xếp vào nhóm; **danh pháp (nomenclature)** – đặt tên; **định danh (identification)** – gắn mẫu chưa biết vào nhóm đã mô tả."},{"h":"2. Bergey's Manual (slide 4–7)","body":"**Bergey's Manual of Determinative Bacteriology (1980–1984)** – **4 divisions/phyla**, 4 tập:\n\n| Tập | Nội dung |\n|---|---|\n| **Volume 1** | **Tất cả vi khuẩn Gram âm** (quan trọng y học và công nghiệp) |\n| **Volume 2** | **Tất cả vi khuẩn Gram dương** |\n| **Volume 3** | **Các vi khuẩn còn lại**, một số Gram âm và **archaea** |\n| **Volume 4** | **Actinomycetes** và các vi khuẩn khác |\n\n- Nhược điểm: **không cung cấp lịch sử tiến hóa rõ ràng** của vi khuẩn (slide 5).\n- Trong mỗi division, vi khuẩn chia nhóm theo **kiểu hình (phenotype)** (slide 6): **phản ứng Gram, hình dạng tế bào, cách sắp xếp, nhu cầu oxy, khả năng di động, đặc điểm dinh dưỡng và chuyển hóa**.\n- Nhắc lại BAC-07: 4 division theo thành tế bào – **Gracilicutes** (Gram âm, thành mỏng), **Firmicutes** (Gram dương, thành dày), **Tenericutes** (không thành – Mycoplasma), **Mendosicutes** (thành khác thường – archaea).\n\n**Ấn bản mới (current editions): 5 tập**, sắp xếp các ngành theo **quan hệ tiến hóa của trình tự 16S rDNA** (slide 7; đúng tên là *Bergey's Manual of Systematic Bacteriology*, 2nd ed.):\n\n| Tập | Năm | Nội dung |\n|---|---|---|\n| 1 | **2001** | **Archaea**, vi khuẩn phân nhánh sớm (deeply branching) & **quang tự dưỡng** |\n| 2 | **2005** | **Proteobacteria** (2A: phương pháp cơ bản; 2B: lớp **Gammaproteobacteria**; 2C: các lớp Proteobacteria khác) |\n| 3 | **2009** | **Firmicutes** |\n| 4 | **2011** | **Bacteroidetes, Spirochaetes, Tenericutes (Mollicutes)**, Acidobacteria, Fibrobacteres, Fusobacteria, … **Chlamydiae, Planctomycetes** |\n| 5 | **2012** | **Actinobacteria** |\n\n- Các lớp Proteobacteria đặt theo chữ Hy Lạp: **Alpha, Beta, Gamma, Delta, Epsilon** (ghi chú slide 9)."},{"h":"3. Quan sát hình thái (slide 8–9, 13)","body":"- **Hình thái khuẩn lạc (colony morphology)**: **hình dạng khuẩn lạc, màu hệ sợi (mycelium), khả năng tạo bào tử, màu bào tử, khả năng khuếch tán sắc tố vào môi trường**...\n- **Hình thái tế bào**: hình dạng tế bào sinh dưỡng, hình dạng bào tử...\n- Ví dụ: **Actinomycetes** (slide 8) – vi khuẩn Gram dương tạo **hệ sợi phân nhánh** và bào tử (*Streptomyces*) – vẫn là vi khuẩn dù trông giống nấm; **Firmicutes: *Bacillus*** (slide 9) – trực khuẩn Gram dương tạo nội bào tử.\n- **Đặc điểm nuôi cấy** (culture characteristics): nhiệt độ, pH, môi trường sinh trưởng."},{"h":"4. Phép thử sinh hóa & khóa phân đôi (slide 10–12)","body":"- **Khóa phân đôi (dichotomous key)**: chuỗi câu hỏi có/không; mỗi kết quả chọn một nhánh cho đến tên loài.\n- Ví dụ slide 10: **Gram âm → oxidase dương → không thủy phân urea → indole âm → không tạo acetoin (VP âm)** → *Pasteurella multocida*.\n\n| Phép thử | Phát hiện |\n|---|---|\n| **Oxidase** | enzyme **cytochrome c oxidase** |\n| **Catalase** | phân hủy H₂O₂ → O₂ (sủi bọt) |\n| **Lên men lactose** | tạo **acid** (đổi màu chỉ thị) và/hoặc **khí** (ống Durham) |\n| **Indole** | chuyển hóa **tryptophan → indole** (thuốc thử Kovac đỏ) |\n| **Methyl red (MR)** | lên men acid hỗn hợp, pH < 4,4 |\n| **Voges-Proskauer (VP)** | tạo **acetoin** (lên men butanediol) |\n| **Citrate** | dùng **citrate làm nguồn C duy nhất** |\n| **Urease** | thủy phân **urea → NH₃** |\n\n- **Bộ IMViC** (Indole, Methyl red, Voges-Proskauer, Citrate): *E. coli* **+ + − −**; *Enterobacter aerogenes* **− − + +**. [mở rộng]\n\n**Enterobacteriaceae (slide 11)**:\n- **Tất cả không có oxidase (oxidase âm)**: *Escherichia, Enterobacter, Shigella, Citrobacter, Salmonella*.\n- ***Escherichia, Enterobacter, Citrobacter*** **lên men lactose tạo acid và khí** → phân biệt với ***Salmonella, Shigella*** (không lên men lactose).\n- Các phép thử sinh hóa khác phân biệt các loài giữa các chi.\n\n**Bộ kit nhiều phép thử (slide 12, kiểu API 20E / Enterotube)**: 15 phản ứng chia **nhóm 3**, trọng số **4 – 2 – 1** theo thứ tự in; cộng trọng số của phản ứng dương trong mỗi nhóm → **mã 5 chữ số** → tra bảng. Ví dụ mã **62343** (và 62342) → *Citrobacter freundii* – một loài có thể có hơn một mã."},{"h":"5. Hóa phân loại thành tế bào (slide 13–15)","body":"**Thành phần hóa học thành tế bào**: peptidoglycan, glucosamine, **alanine, glutamic acid, glycine, arabinose, galactose**, **LL-α,ε-diaminopimelic acid (LL-DAP)** và **meso-α,ε-DAP (meso-DAP)**...\n- DAP và lysine đều có nhóm amin thứ hai, nhưng **DAP có 2 nhóm carboxyl**, lysine có 1 (slide 14).\n- **LL-DAP** và **meso-DAP** là **đồng phân lập thể**: ví dụ *Streptomyces* có **LL-DAP** (+ glycine), nhiều actinomycetes khác có **meso-DAP** – dùng để phân biệt các chi actinomycetes (thành tế bào typ I–IV). [mở rộng]\n- Đường đặc trưng (arabinose, galactose) trong dịch thủy phân tế bào cũng là dấu ấn phân loại."}],"extension":[{"h":"Định danh trong phòng xét nghiệm thực tế","body":"- **MALDI-TOF MS**: đo phổ khối protein ribosome của khuẩn lạc, so với thư viện → định danh trong vài phút; đang thay thế nhiều phép thử sinh hóa ở bệnh viện lớn.\n- Kiểm nghiệm thực phẩm theo ISO: *Salmonella* (tiền tăng sinh → tăng sinh chọn lọc → thạch XLD → khẳng định sinh hóa + huyết thanh), *E. coli* (MPN + indole ở 44 °C) – liên hệ GRO-06."}],"keyCards":[{"title":"Bergey's Manual","bodyEn":"**Determinative Bacteriology (1980–1984)**: 4 divisions — Vol 1 Gram-negative; Vol 2 Gram-positive; Vol 3 remaining bacteria, some Gram-negatives and archaea; Vol 4 actinomycetes. Does **not** give a clear evolutionary history. Groups by **Gram reaction, shape, arrangement, O₂ requirement, motility, nutrition/metabolism**. **Current editions: 5 volumes** by **16S rDNA** (2001 Archaea…; 2005 Proteobacteria; 2009 Firmicutes; 2011 Bacteroidetes…; 2012 Actinobacteria).","glossVi":"4 tập cũ (kiểu hình) vs 5 tập mới (16S)."},{"title":"Enterobacteriaceae","bodyEn":"All members are **oxidase-negative** (*Escherichia, Enterobacter, Shigella, Citrobacter, Salmonella*). *Escherichia, Enterobacter, Citrobacter* **ferment lactose to acid and gas**, distinguishing them from *Salmonella* and *Shigella*.","glossVi":"Oxidase âm; lactose tách nhóm."},{"title":"Morphology and chemotaxonomy","bodyEn":"Colony morphology (shape, mycelium color, spore formation, spore color, pigment diffusion), cell morphology (vegetative cell and spore shape), **cell-wall chemistry** (peptidoglycan, glucosamine, alanine, glutamic acid, glycine, arabinose, galactose, **LL-DAP vs meso-DAP**), culture characteristics.","glossVi":"Hình thái + hóa thành tế bào."}],"traps":["Salmonella ferments lactose","Enterobacteriaceae are oxidase-positive","The 1980–84 Bergey's gives a clear evolutionary history"]},{"id":"IDT-02","title":"Molecular identification: 16S/18S/ITS markers, PCR, sequencing, BLAST and phylogenetic trees","priority":"H","difficulty":2,"minutes":25,"source":"12.Identification of Microorganisms.pptx: slides 16–22","prereq":[],"hookVi":"Bạn phân lập được một xạ khuẩn tạo kháng sinh từ đất rừng Cát Tiên. Muốn công bố, bạn phải biết nó là loài gì. Hình thái và sinh hóa chỉ cho biết \"có thể là *Streptomyces*\". Giải trình tự **16S rDNA** rồi **BLAST** cho kết quả 471/471 nucleotide trùng khớp 100% với *Streptomyces flaveus* – đã đủ gọi tên loài chưa?","predictQuestion":{"stem":"Which gene is most commonly sequenced to identify bacteria?","options":["18S rDNA","16S rDNA","ITS","Actin"],"answer":1,"explanation":"Slide 17: **16S rDNA** (tiểu đơn vị nhỏ ribosome prokaryote). 18S cho nhân thực; ITS cho nấm."},"lesson":[{"h":"1. Quy trình định danh phân tử (slide 17)","body":"1. **Chọn gene đặc hiệu**: **16S rDNA, 23S rDNA, 18S rDNA, ITS (Internal Transcribed Spacer), 25S rDNA, rpoB**, …\n2. **Thiết kế mồi (primer design) & PCR** – khuếch đại vùng gene đích.\n3. **Giải trình tự đoạn PCR** (PCR fragment sequencing).\n4. **Tìm kiếm độ tương đồng trình tự trên cơ sở dữ liệu** (homology; **BLASTN** – nucleotide; **BLASTP** – protein).\n5. **Xây dựng cây phát sinh chủng loại (phylogenetic tree)**:\n   - **Sắp gióng đa trình tự (multiple sequence alignment)**;\n   - **Chọn mô hình tiến hóa và phương pháp dựng cây** (neighbor-joining, maximum likelihood… [mở rộng]);\n   - **Đánh giá độ tin cậy của cây** (bootstrap)."},{"h":"2. Chọn marker gene","body":"| Marker | Dùng cho | Ghi chú |\n|---|---|---|\n| **16S rDNA** | **vi khuẩn, archaea** | ~1500 bp; có vùng bảo tồn (gắn mồi chung) + vùng biến đổi V1–V9 (phân biệt) |\n| **23S rDNA** | vi khuẩn | tiểu đơn vị lớn |\n| **18S rDNA** | **nhân thực** (nấm, protist) | tiểu đơn vị nhỏ nhân thực |\n| **ITS** | **nấm** (mã vạch chuẩn) | vùng đệm giữa 18S–5.8S–28S, biến đổi mạnh |\n| **25S/26S rDNA** (D1/D2) | **nấm men** | tiểu đơn vị lớn |\n| **rpoB** | vi khuẩn | gene mã hóa protein (tiểu đơn vị β RNA polymerase), phân giải tốt hơn 16S giữa loài gần |\n\n- Marker tốt: **có vùng bảo tồn** (để so sánh, gắn mồi) **và vùng biến đổi** (để phân biệt).\n- \"S\" = **Svedberg** (hệ số lắng), không phải số nucleotide.\n- Hai loài gần có thể có 16S **giống hệt** → 16S đôi khi chỉ đủ đến **chi**. [mở rộng]"},{"h":"3. BLAST – Basic Local Alignment Search Tool (slide 18–22)","body":"- **BLAST** tìm các đoạn **căn chỉnh cục bộ** giữa **query** (trình tự của mình) và **subject** (trình tự trong cơ sở dữ liệu, vd NCBI GenBank).\n- Các cột kết quả:\n\n| Trường | Ý nghĩa |\n|---|---|\n| **Query length** | độ dài trình tự đưa vào |\n| **Query cover** | % độ dài query được căn chỉnh phủ |\n| **Percent identity** | % vị trí **giống hệt** trong đoạn căn chỉnh |\n| **Score / bit score** | điểm chất lượng căn chỉnh |\n| **E-value** | số kết quả có điểm tương đương kỳ vọng xuất hiện **ngẫu nhiên** – càng nhỏ càng có ý nghĩa (0.0 = rất nhỏ) |\n| **Accession** | mã bản ghi, vd JX293177.1 |\n\n> **Identity = số vị trí giống / độ dài căn chỉnh × 100%**; **Query cover = độ dài query được phủ / độ dài query × 100%**.\n\n**Ví dụ slide 20–22**: query **471 nt**, BLASTN; nhiều hit **100% query cover, 100% identity, E-value 0.0, score 870**. Hit đầu: ***Streptomyces flaveus* strain X418** (JX293177.1, subject dài **1503 nt**); đoạn subject **29–499** khớp query **1–471** (499 − 29 + 1 = 471); **Identities 471/471 (100%)**, **Gaps 0/471**, **Strand Plus/Plus**. Hit kế: *Streptomyces* sp. NEAU-P17 cũng 100%.\n\n**Kết luận đúng mức**: đoạn 16S 471 nt phù hợp với chi ***Streptomyces***; **chưa phân biệt được loài** vì nhiều loài/chủng cùng 100%. Cần trình tự dài hơn, gene khác (rpoB…) hoặc bằng chứng kiểu hình.\n\n- Ngưỡng tham khảo [mở rộng]: 16S **≥ 98,7%** thường xem là cùng loài; **≥ 94,5%** cùng chi."},{"h":"4. Cây phát sinh chủng loại","body":"- **Multiple sequence alignment**: xếp các vị trí tương đồng của nhiều trình tự vào cùng cột (Clustal, MUSCLE). [mở rộng]\n- **Mô hình tiến hóa** mô tả cách thay thế nucleotide (Jukes–Cantor, Kimura 2-parameter); **phương pháp** dựng cây: **neighbor-joining, maximum likelihood, maximum parsimony**. Phần mềm: **MEGA**.\n- **Độ tin cậy**: **bootstrap** – lấy mẫu lại các cột căn chỉnh (vd 1000 lần), dựng lại cây; giá trị 90 ở một nút = nhánh xuất hiện ở 90% lần lặp (**không** phải giống nhau 90%).\n- Đọc cây: độ gần = **độ dài nhánh** theo thước đo (substitutions/site), không phải vị trí trên/dưới trang. Nên đưa **chủng chuẩn (type strain)** vào cây."}],"extension":[{"h":"Metagenomics và giám sát","body":"- Giải trình tự **16S amplicon** trực tiếp từ mẫu (đất, ruột, nước thải) cho biết thành phần cộng đồng vi sinh **không cần nuôi cấy** – phần lớn vi khuẩn chưa nuôi cấy được.\n- Giải trình tự toàn bộ bộ gene (WGS) để truy vết dịch bệnh do thực phẩm (Listeria, Salmonella) và phát hiện gene kháng thuốc.\n- Trong công nghiệp: định danh chủng sản xuất (nấm men bia, xạ khuẩn kháng sinh, *Aspergillus*) bằng ITS/16S trước khi đăng ký chủng."}],"keyCards":[{"title":"Molecular workflow","bodyEn":"Choose specific genes (**16S, 23S, 18S rDNA, ITS, 25S rDNA, rpoB**); **primer design & PCR**; **sequence** the PCR fragment; search databases for similarity (**BLASTN, BLASTP**); build a **phylogenetic tree** (multiple sequence alignment, choose evolutionary model/method, determine reliability).","glossVi":"Gene → PCR → giải trình tự → BLAST → cây."},{"title":"Markers","bodyEn":"**16S rDNA**: bacteria/archaea (conserved + variable regions). **18S rDNA**: eukaryotes. **ITS**: fungi. **25S rDNA**: yeasts (large subunit). **rpoB**: protein-coding marker with higher resolution.","glossVi":"Chọn marker theo nhóm."},{"title":"Reading BLAST","bodyEn":"**Percent identity** = identical positions / alignment length; **query cover** = % of query aligned; **E-value** = expected random hits (smaller = more significant). Slide example: 471/471 (100%) to *Streptomyces flaveus* X418 and *Streptomyces* sp. — supports the **genus**, not necessarily the species. **Bootstrap** measures branch support.","glossVi":"Identity ≠ định danh loài chắc chắn."}],"traps":["100% identity over 471 nt proves the species","ITS is the main bacterial marker","Bootstrap 90 means 90% similarity","BLASTP compares nucleotide sequences"]},{"id":"APP-01","title":"Single-cell protein (SCP): definition, composition and microbial sources","priority":"M","difficulty":1,"minutes":20,"source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021): sections 1–3, 8","prereq":[],"hookVi":"Thế giới cần thêm hàng chục triệu tấn protein mỗi năm, trong khi **bột cá** – nguyên liệu chính của thức ăn thủy sản – ngày càng đắt và khan hiếm. Một bồn lên men 100 m³ nuôi vi khuẩn *Methylophilus* hay nấm men có thể tạo ra lượng protein bằng cả cánh đồng đậu nành rộng hàng trăm hecta – và không phụ thuộc mùa vụ. Đó là **protein đơn bào (SCP)**.","predictQuestion":{"stem":"What is the protein content of SCP on a dry-matter basis according to the reference?","options":["5–10%","20–30%","60–82%","95–100%"],"answer":2,"explanation":"Tài liệu: SCP có **60–82% protein** trên chất khô, ngoài ra còn carbohydrate, nucleic acid, chất béo, khoáng, vitamin."},"lesson":[{"h":"1. SCP là gì?","body":"- **Single-cell protein (SCP) / protein đơn bào**: **sinh khối vi sinh vật** (tế bào khô hoặc protein chiết từ tế bào) của **vi khuẩn, nấm men, nấm sợi, vi tảo** dùng làm **thực phẩm hoặc thức ăn chăn nuôi**.\n- Không phải protein tinh khiết: ngoài **protein 60–82% (chất khô)** còn có **carbohydrate, nucleic acid, chất béo, khoáng và vitamin**.\n- Giàu **amino acid thiết yếu** như **lysine**, methionine (thiếu ở nhiều nguồn thực vật) → **thay thế bột cá, bột đậu nành** đắt tiền.\n- Sản phẩm mục tiêu là **chính tế bào (sinh khối)** – khác ethanol (APP-03, chất chuyển hóa sơ cấp) và penicillin (APP-04, chất chuyển hóa thứ cấp).\n- Mycoprotein từ nấm sợi (*Fusarium venenatum* – Quorn™) cũng được xếp vào SCP dù không phải \"đơn bào\"."},{"h":"2. Ưu điểm dinh dưỡng và sản xuất","body":"- **Sinh trưởng rất nhanh**: vi khuẩn **20–120 phút** (30 phút–2 h), nấm men **40 phút–3 h**, tảo **3–6 h** (2–4 h), nấm sợi 2–4 h. Tài liệu có chỗ ghi vi khuẩn và nấm men nhân đôi \"5–15 phút\" – con số quá thấp, học theo khoảng 20 phút–2 h. [mở rộng]\n- **Hàm lượng protein cao (30–70%)** so với thực vật và động vật; dùng được **toàn bộ tế bào** (cây trồng, vật nuôi thì không).\n- **Hồ sơ amino acid**: SCP vi khuẩn **gần giống protein cá**; SCP nấm men **gần giống protein đậu nành**.\n- **Thiếu amino acid chứa lưu huỳnh (methionine, cysteine)**, giàu **lysine** → cần **bổ sung methionine, cysteine** khi làm thức ăn.\n- **Vitamin**: vi khuẩn giàu **B12**, tảo giàu **vitamin A**; nhóm B (riboflavin, thiamine, pyridoxine, niacin, folic acid, biotin...).\n- **Không phụ thuộc khí hậu, mùa vụ**, sản xuất quanh năm, ít đất; tận dụng **phụ phẩm, chất thải** làm cơ chất."},{"h":"3. Bốn nguồn vi sinh vật","body":"| Nguồn | Protein | Nucleic acid | Điểm mạnh | Hạn chế | Ví dụ |\n|---|---|---|---|---|---|\n| **Vi khuẩn** | cao (đến ~**80%**; *Pseudomonas* trên paraffin **69%**) | **cao nhất** (RNA) | thế hệ **20–120 phút**; dùng nhiều cơ chất (tinh bột, đường, **methanol, ethanol**, dầu mỏ); protein \"tốt hơn nấm men, nấm\" | RNA cao, **nội độc tố (endotoxin)**, dễ nhiễm, tế bào nhỏ khó thu | ***Methylophilus methylotrophus*** (**thế hệ 2 h**, Pruteen), *Bacillus*, *Cellulomonas*, *Rhodopseudomonas*, *Pseudomonas* |\n| **Tảo** | đến **70%** (SCP tảo ~**40%**) | **thấp: 3–8%** | **omega-3**, khoáng, vitamin, chlorophyll; dùng **năng lượng mặt trời, CO₂** | **mọc chậm, mật độ thấp 1–2 g/L**; thành cellulose khó tiêu | ***Spirulina*** (thực ra là **vi khuẩn lam**; người Aztec Mexico thu hoạch), ***Chlorella***, *Scenedesmus* |\n| **Nấm sợi** | **30–50%** | **7–10%** | hồ sơ amino acid đạt chuẩn **FAO**; giàu **lysine, threonine**; nhiều vitamin B; dễ lọc | thiếu **cysteine, methionine**; mọc nhanh hơn nấm men nhưng **dễ nhiễm tạp**; có thể tạo **độc tố nấm** | ***Fusarium venenatum*** (mycoprotein – giảm insulin và đường huyết), ***Paecilomyces variotii* (quy trình Pekilo, Phần Lan)** |\n| **Nấm men** | 45–55% [mở rộng] | cao | an toàn (GRAS), dễ tiêu hóa hơn nấm sợi | RNA cao | *Saccharomyces cerevisiae*, *Candida utilis*, ***Kluyveromyces fragilis*** (trên whey tạo được amino acid chứa S) |\n\n- **Quy trình Pekilo (Phần Lan)**: nuôi **nấm sợi *Paecilomyces variotii*** trên **đường pentose, dịch thủy phân gỗ, nước thải sulfite** (ngành giấy) → SCP cho **thức ăn gia súc**."}],"extension":[{"h":"SCP ở Việt Nam và thế giới","body":"- Công ty **Calysta, Unibio** sản xuất SCP từ **khí methane** bằng vi khuẩn *Methylococcus* cho thức ăn cá hồi, tôm.\n- **Men bia thải** (*S. cerevisiae*) từ các nhà máy bia Việt Nam được sấy làm thức ăn chăn nuôi – một dạng SCP tận dụng phụ phẩm.\n- **Spirulina** nuôi ở Ninh Thuận/Bình Thuận làm thực phẩm chức năng."}],"keyCards":[{"title":"SCP definition and composition","bodyEn":"**Single-cell protein** is microbial biomass (bacteria, yeasts, fungi, algae) used as food/feed. Protein **60–82% of dry matter**; also carbohydrates, nucleic acids, fats, minerals, vitamins. Rich in **lysine**; **deficient in S-amino acids (methionine, cysteine)**. Bacterial SCP resembles **fish protein**; yeast SCP resembles **soy protein**.","glossVi":"SCP 60–82% protein."},{"title":"Sources","bodyEn":"**Bacteria**: generation 20–120 min, e.g., *Methylophilus* (2 h); high RNA, endotoxins. **Algae**: protein up to 70%, **nucleic acid 3–8%**, omega-3, but slow growth (1–2 g/L); *Spirulina*, *Chlorella*. **Fungi**: protein **30–50%**, **nucleic acid 7–10%**, FAO-standard amino acids, rich in lysine and threonine; *Fusarium venenatum* mycoprotein; **Pekilo** process with ***Paecilomyces variotii*** (Finland).","glossVi":"Vi khuẩn, tảo, nấm."}],"traps":["SCP is pure protein","Algae have the highest nucleic acid content","Fungal SCP is rich in methionine and cysteine","Spirulina is a eukaryotic alga"]},{"id":"APP-02","title":"SCP production: substrates, C:N ratio, fermentation types, challenges and aquaculture use","priority":"M","difficulty":2,"minutes":25,"source":"Week-13 SCP reference (Sharif et al., Aquaculture 2021): sections 4–13","prereq":[],"hookVi":"Nước thải nhà máy đường, bia, sữa có **BOD rất cao** – thải thẳng ra sông gây ô nhiễm, xử lý thì tốn tiền. Nếu dùng chính dòng thải đó làm môi trường nuôi vi sinh vật tạo SCP, BOD giảm tới **~80%** và ta thu thêm protein. Nhưng muốn tế bào tạo protein, phải cấp đủ **nitrogen** theo đúng **tỉ lệ C:N**.","predictQuestion":{"stem":"Which C:N ratio is reported as most appropriate for SCP production media?","options":["1:1","10:1","100:1","1:10"],"answer":1,"explanation":"Tỉ lệ **C:N = 10:1** được báo cáo là thích hợp nhất (giống tỉ lệ trong tế bào vi sinh vật)."},"lesson":[{"h":"1. Cơ chất (substrate)","body":"- Vi sinh vật cần **mono- và disaccharide** làm \"viên gạch\" → carbohydrate là cơ chất phổ biến (dễ có, năng lượng cao).\n- Cơ chất khác: **rỉ đường (molasses), whey (váng sữa), tinh bột, alkane, hydrocarbon**, methanol, ethanol; phụ phẩm **nông nghiệp, công nghiệp**.\n- **Chi phí cơ chất = 45–75% tổng chi phí sản xuất SCP**; phần lớn là **nguồn carbon**, amonia chỉ **7–15%** tổng cơ chất.\n- **CO₂ khí quyển miễn phí** (cho tảo) nhưng tốn năng lượng **khuấy** để hòa tan vào dịch tảo đặc.\n- **Chất thải nông – công nghiệp**: rẻ, dồi dào, chiếm **20–30%** chi phí; dùng chúng **giảm BOD ~80%** và giảm chi phí xử lý chất thải. Chất thải rắn (**cellulose**) cần **tiền xử lý đặc biệt, đắt**.\n- **Hydrocarbon** (khí tự nhiên, dầu mỏ) chiếm **30–70%** chi phí; **không tái tạo**, đắt, **gây tranh cãi chính trị** vì cạnh tranh với nhiên liệu."},{"h":"2. Nguồn nitrogen và tỉ lệ C:N","body":"- Nguồn N: **amonia, muối amoni, nitrate**.\n- **C:N = 10:1** thích hợp nhất (bằng tỉ lệ trong tế bào vi sinh vật), tuy khác nhau giữa các loài.\n  - **Tỉ lệ cao hơn** (thừa C): **amonia cạn trước khi đường được dùng hết** → không đạt sinh khối mong muốn.\n  - **Tỉ lệ 1:1** (thừa N): phần lớn **amonia không vào được tế bào, bị lãng phí**.\n- Nhớ: protein cần **N**; khi N giới hạn, thêm đường không tạo thêm protein."},{"h":"3. Quy trình sản xuất công nghiệp (Hình 1)","body":"**Phát triển (development)**: **sàng lọc** chủng từ đất, không khí, nước → **tối ưu bằng đột biến, chọn lọc**, kỹ thuật di truyền → tối ưu điều kiện nuôi → xác định cấu trúc tế bào, con đường chuyển hóa → nâng cấp thiết bị, kỹ thuật quy trình → **bảo hộ, an toàn**, cấp phép.\n\n**Sản xuất**: chọn chủng → **lên men** (chìm hoặc rắn) trên cơ chất phù hợp → tăng sinh khối → **thu hoạch** → xử lý tiếp: **tinh sạch, phá tế bào, rửa, chiết protein** → sấy.\n\n**Thu hồi tế bào**: **vi khuẩn – ly tâm (centrifugation)**; **nấm sợi – lọc (filtration)**. Nên thu hồi tối đa nước vì chứa chất dinh dưỡng hòa tan."},{"h":"4. Ba kiểu lên men","body":"| Kiểu | Đặc điểm (theo tài liệu) |\n|---|---|\n| **Lên men chìm (submerged)** | cơ chất luôn ở **dạng lỏng** chứa đủ dinh dưỡng; trong **fermenter** vận hành **liên tục**, sinh khối thu liên tục; **ly tâm hoặc lọc rồi sấy**; cần **sục khí** và **làm mát** (sinh nhiệt) |\n| **Lên men bán rắn (semisolid)** | chuẩn bị cơ chất quan trọng (dạng rắn); **vốn đầu tư và chi phí vận hành cao**; hệ đa pha: trộn, khuấy, truyền O₂ từ bọt khí qua pha lỏng tới tế bào, truyền nhiệt; thiết bị **U-loop fermenter**; nguồn C: hydrocarbon khí, n-alkene, ethanol, methanol, polysaccharide, rỉ đường, nước thải bia |\n| **Lên men rắn (solid-state)** | cơ chất **rắn** (**cám mì, cám gạo**) trải trên **khay phẳng** sau khi cấy; **độ ẩm 60–65%**; sản phẩm: SCP, enzyme, thức ăn, acid hữu cơ, ethanol, sắc tố, vitamin B, hương liệu |\n\n- Lưu ý: \"chìm/rắn\" nói về **môi trường vật lý**; \"mẻ/fed-batch/liên tục\" nói về **chế độ cấp liệu** – hai trục khác nhau (nuôi chìm cũng có thể chạy mẻ). [mở rộng]"},{"h":"5. Thách thức khi dùng SCP","body":"- **Yếu tố kháng dinh dưỡng chính: nucleic acid cao** → tăng **acid uric huyết thanh** → **sỏi thận**. **70–80% nitrogen** ở dạng amino acid, phần còn lại là nucleic acid (đặc điểm của vi sinh vật mọc nhanh).\n- **Thành tế bào không tiêu hóa được** ở động vật dạ dày đơn và gia cầm.\n- Tế bào sống phải được **bất hoạt trước khi dùng** (màu, vị khó chịu; nguy cơ nhiễm trùng da, tiêu hóa, buồn nôn).\n- **Nấm sợi**: mọc nhanh hơn nấm men nhưng **nguy cơ nhiễm tạp cao hơn**. **Vi khuẩn**: **RNA cao, nguy cơ nhiễm tạp, nội độc tố**.\n- **Độc tố**: **mycotoxin** (nấm), **cyanotoxin** (vi khuẩn lam); chất gây ung thư khi đột biến.\n- Tảo \"không có độc tố\" (theo tài liệu) nhưng **mọc chậm, mật độ 1–2 g/L**.\n- Khắc phục: **tối ưu quy trình lên men**, chọn chủng và cơ chất phù hợp; **loại nucleic acid** bằng xử lý lý – hóa (vd sốc nhiệt kích hoạt RNase nội sinh [mở rộng])."},{"h":"6. Ứng dụng trong nuôi trồng thủy sản","body":"- SCP thay **bột cá / bột đậu nành** trong khẩu phần cá hồi, cá hồi vân, tôm... Ví dụ trong tài liệu:\n  - nấm men *K. marxianus, C. utilis, S. cerevisiae* thay bột cá/đậu nành đến **~24%** không ảnh hưởng tăng trưởng;\n  - khẩu phần cá hồi Đại Tây Dương chứa **36% SCP vi khuẩn**; SCP vi khuẩn (*Methylococcus*) chiếm tới **38%** protein khẩu phần cá hồi vân và **52%** ở cá hồi không ảnh hưởng xấu;\n  - bột biofloc đến **30%** trong khẩu phần tôm.\n- Kết quả phụ thuộc **loài, giai đoạn, loại SCP, khẩu phần nền** – không suy rộng cho mọi loài."}],"extension":[{"h":"Kinh tế tuần hoàn","body":"Mô hình **\"chất thải → SCP → thức ăn → thủy sản\"** giúp giảm BOD nước thải và giảm phụ thuộc bột cá nhập khẩu. Nhưng sản phẩm từ chất thải vẫn phải qua **kiểm tra an toàn** (kim loại nặng, độc tố, vi sinh vật gây bệnh). Liên hệ CTL: tế bào phải được **bất hoạt** (sấy, gia nhiệt) trước khi dùng."}],"keyCards":[{"title":"Substrates and costs","bodyEn":"Carbohydrates (mono/disaccharides), **molasses, whey, starch, alkanes, hydrocarbons**, agro-industrial wastes. **Substrate = 45–75% of total cost**, mostly the carbon source (ammonia 7–15%). Wastes are cheap (20–30% of cost) and reduce **BOD by ~80%**; hydrocarbons (30–70% of cost) are non-renewable and controversial.","glossVi":"Cơ chất 45–75% chi phí."},{"title":"C:N ratio and processes","bodyEn":"N sources: ammonia, ammonium salts, nitrate. **C:N = 10:1** is most appropriate; higher ratio → ammonia runs out before sugar; **1:1** → ammonia wasted. **Submerged** (liquid, continuous, centrifuge/filter, aeration + cooling), **semisolid** (high capital/operating cost, U-loop fermenter), **solid-state** (wheat/rice bran on flat beds, **moisture 60–65%**). Bacteria recovered by **centrifugation**, filamentous fungi by **filtration**.","glossVi":"C:N 10:1."},{"title":"Challenges","bodyEn":"Main anti-nutritional factor: **high nucleic acid** → serum **uric acid** → **kidney stones**; 70–80% of N is amino acid. Indigestible cell walls; live cells must be inactivated; fungi: contamination risk; bacteria: RNA, contamination, **endotoxins**; **mycotoxins, cyanotoxins**; algae slow (1–2 g/L).","glossVi":"Nucleic acid → acid uric."}],"traps":["A C:N ratio of 1:1 is optimal","Filamentous fungi are recovered by centrifugation","Solid-state fermentation needs no moisture"]},{"id":"APP-03","title":"Bioethanol production: alcoholic fermentation, yeasts and the Azolla case study","priority":"H","difficulty":2,"minutes":25,"source":"Week-14 Ethanol reference (Azolla filiculoides, Appl Biochem Biotechnol)","prereq":[],"hookVi":"Xăng E5 và E10 ở Việt Nam chứa 5–10% **ethanol sinh học** làm từ sắn. Thế hệ nhiên liệu sinh học tiếp theo dùng nguyên liệu **không cạnh tranh lương thực** – như **bèo hoa dâu *Azolla***, mọc dày đặc trên ao cá. Nhưng *Azolla* chứa cả **glucose và xylose** sau thủy phân, và không phải nấm men nào cũng lên men được xylose.","predictQuestion":{"stem":"What is the theoretical maximum ethanol yield from glucose (g ethanol per g glucose)?","options":["1.0 g/g","0.511 g/g","2.0 g/g","0.25 g/g"],"answer":1,"explanation":"C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂: 2 × 46,07 / 180,16 = **0,511 g/g**. Phần còn lại đi ra dưới dạng CO₂."},"lesson":[{"h":"1. Lên men rượu – cơ sở sinh hóa","body":"- **Đường phân (glycolysis)**: glucose → 2 pyruvate + **2 ATP (ròng)** + 2 NADH.\n- **Nhánh lên men rượu** (nấm men): pyruvate → **acetaldehyde + CO₂** (pyruvate decarboxylase) → acetaldehyde + NADH → **ethanol + NAD⁺** (alcohol dehydrogenase).\n- Ý nghĩa: bước tạo ethanol **tái sinh NAD⁺** để đường phân tiếp tục; **không tạo thêm ATP**.\n- Phương trình tổng: **C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂**.\n\n> **Hiệu suất lý thuyết** = 2 × 46,07 / 180,16 = **0,511 g ethanol/g glucose** (≈ 51,1%).\n\n- **Hiệu ứng Crabtree**: *S. cerevisiae* vẫn tạo ethanol **khi có O₂** nếu đường cao. Ethanol là **sản phẩm sơ cấp** (gắn chuyển hóa trung tâm, tạo trong pha sinh trưởng). Liên hệ FUN-02. [mở rộng]"},{"h":"2. Nguyên liệu Azolla filiculoides","body":"- ***Azolla*** là chi **dương xỉ thủy sinh nổi** (7 loài) – **không phải tảo**; cộng sinh với **vi khuẩn lam cố định đạm *Anabaena azollae*** → mọc tốt ở nước nghèo N; sinh khối lớn, rẻ, dễ thu hoạch.\n- Thành phần (Bảng 1): **carbohydrate tổng 47,7%**; **cellulose 11,3%, hemicellulose 14,0%, lignin 28,9%**; protein ~23%.\n- Là nguyên liệu **lignocellulose** → cần **tiền xử lý + đường hóa** để giải phóng đường đơn."},{"h":"3. Quy trình SHF – thủy phân và lên men tách riêng","body":"1. **Thủy phân acid nhiệt (thermal acid hydrolysis)**: tối ưu **14% (w/v) Azolla**, **200 mM H₂SO₄**, **121 °C, 60 phút** → **16,7 g/L** đường đơn (hiệu quả ~25%). So sánh HCl, HNO₃, H₂SO₄: **H₂SO₄ tốt nhất**. Quá 60 phút → xylose bị phân hủy.\n2. **Đường hóa bằng enzyme (enzymatic saccharification)**: so sánh Celluclast, **Viscozyme**, Cellic C-Tec2 → **Viscozyme** tốt nhất (chứa cellulase + hemicellulase); **16 U/mL**, **48 h** → **61,6 g/L** đường đơn (hiệu quả **92,2%**). Quá 16 U/mL không tăng thêm đáng kể.\n3. **Lên men**: 100 mL dịch thủy phân trong bình 250 mL, **bán yếm khí**, **30 °C, 150 rpm**, 0–72 h; ethanol đo bằng **HPLC**; sinh khối nấm men theo **OD₆₀₀** + đường chuẩn.\n\n- **SHF** (separate hydrolysis and fermentation): đường hóa trước, lên men sau – mỗi bước ở điều kiện tối ưu riêng. **SSF** (simultaneous saccharification and fermentation) làm đồng thời. [mở rộng]"},{"h":"4. So sánh bốn nấm men","body":"Dịch thủy phân có **glucose 27,8 g/L + xylose 33,2 g/L**.\n\n| Nấm men | Ethanol cực đại | Y_EtOH (g/g đường ban đầu) | Dùng đường |\n|---|---|---|---|\n| ***Kluyveromyces marxianus*** | **26,8 g/L** | **0,43** | **dùng hết cả glucose và xylose trong 60 h** |\n| *Candida lusitaniae* | 23,2 g/L | 0,37 | glucose + phần lớn xylose |\n| *Pichia stipitis* | 18,2 g/L | 0,29 | glucose + một phần xylose |\n| ***Saccharomyces cerevisiae*** | 13,7 g/L | 0,22 | **chỉ glucose**; **33,2 g/L xylose còn nguyên** |\n\n- Kết luận bài báo: ***K. marxianus*** phù hợp nhất cho dịch Azolla; ***S. cerevisiae*** (chủng tự nhiên) **cho hiệu suất thấp nhất** vì **chỉ dùng glucose**, không lên men đường **pentose (xylose)**.\n- Lưu ý: phần tóm tắt (abstract) bài báo đảo số của *S. cerevisiae* và *P. stipitis*; Hình 6 và kết luận cho số như bảng trên.\n- **Y_EtOH = [EtOH]max / [đường đơn ban đầu (glucose + xylose)]** (phương trình 3) – tính trên **đường ban đầu**, không phải đường đã tiêu thụ."},{"h":"5. Hai cơ sở hiệu suất","body":"> **Y trên đường tiêu thụ** = ethanol / (S₀ − S_f); **Y trên đường ban đầu** = ethanol / S₀ = Y_tiêu thụ × phần đường đã dùng.\n> **% lý thuyết** = Y thực / 0,511 × 100%.\n\nVí dụ: 100 g glucose, dùng 80 g, tạo 36 g ethanol → Y tiêu thụ = 0,45 g/g (**88%** lý thuyết); Y ban đầu = 0,36 g/g (**70,4%**)."}],"extension":[{"h":"Nhiên liệu sinh học thế hệ 1, 2, 3","body":"- **Thế hệ 1**: tinh bột, đường (sắn, mía, ngô) – cạnh tranh lương thực. Việt Nam: xăng **E5 RON92**, lộ trình E10.\n- **Thế hệ 2**: **lignocellulose** (rơm rạ, bã mía, Azolla) – cần tiền xử lý, enzyme cellulase; khó khăn là lên men **xylose** → dùng *K. marxianus*, *Scheffersomyces stipitis* hoặc *S. cerevisiae* biến đổi gene.\n- **Thế hệ 3**: vi tảo.\n- *K. marxianus* còn **chịu nhiệt** (đến 45 °C) – thích hợp **SSF** vì gần nhiệt độ tối ưu của cellulase."}],"keyCards":[{"title":"Alcoholic fermentation","bodyEn":"Glycolysis gives 2 pyruvate, **2 ATP net**, 2 NADH; pyruvate → acetaldehyde + CO₂ → ethanol, **regenerating NAD⁺**. C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂; theoretical yield **0.511 g/g**.","glossVi":"0,511 g/g."},{"title":"Azolla study process","bodyEn":"*Azolla filiculoides* = floating aquatic **fern** with N-fixing cyanobacterium *Anabaena azollae*; carbohydrate 47.7%. **SHF**: thermal acid hydrolysis (**14% w/v, 200 mM H₂SO₄, 121 °C, 60 min → 16.7 g/L**), enzymatic saccharification (**Viscozyme 16 U/mL, 48 h → 61.6 g/L**), fermentation (semianaerobic, 30 °C, 150 rpm; HPLC).","glossVi":"Tiền xử lý acid → Viscozyme → lên men."},{"title":"Yeast comparison","bodyEn":"*K. marxianus* **26.8 g/L (Y = 0.43)** – used glucose + xylose completely within 60 h (best); *C. lusitaniae* 23.2 g/L (0.37); *P. stipitis* 18.2 (0.29); *S. cerevisiae* 13.7 (0.22) – **used only glucose** (xylose left). Y_EtOH = max ethanol / initial monosaccharides.","glossVi":"K. marxianus tốt nhất."}],"traps":["The ethanol step produces extra ATP","Theoretical yield is 1 g ethanol per g glucose","Azolla is an alga","S. cerevisiae ferments xylose well"]},{"id":"APP-04","title":"Penicillin: structure, biosynthesis, fed-batch fermentation, extraction and uses","priority":"H","difficulty":2,"minutes":30,"source":"Week-15 Penicillin reference","prereq":[],"hookVi":"Năm 1943, cả nước Mỹ chỉ có vài chục gram penicillin; một bệnh nhân được cứu nhờ thu hồi thuốc từ **nước tiểu** để dùng lại. Chỉ hai năm sau, nhờ chủng ***Penicillium chrysogenum*** phân lập từ **quả dưa lưới mốc**, dịch ngâm ngô và **lên men chìm có cấp liệu**, sản lượng tăng lên hàng tấn. Penicillin là ví dụ kinh điển của **sản phẩm chuyển hóa thứ cấp**.","predictQuestion":{"stem":"Penicillin is classified as a secondary metabolite. When is it mainly produced?","options":["During rapid exponential growth (trophophase)","After the main growth phase, when growth slows (idiophase)","Only after all cells die","Before inoculation"],"answer":1,"explanation":"Chất chuyển hóa thứ cấp được tạo mạnh ở **idiophase**, khi tăng trưởng chậm lại nhưng tế bào vẫn sống, chuyển hóa."},"lesson":[{"h":"1. Cấu trúc penicillin","body":"- Nhân của penicillin tự nhiên: **6-aminopenicillanic acid (6-APA)** = **vòng thiazolidine** gắn (ngưng tụ) với **vòng β-lactam** (4 cạnh).\n- Các penicillin **khác nhau chủ yếu ở chuỗi bên R**, gắn vào nhân bằng **liên kết amide**.\n- *P. notatum* của **Fleming** tạo **penicillin F** (2-pentenyl penicillin); *P. chrysogenum* tạo **penicillin K** khi không có tiền chất.\n- **Penicillin G** (benzyl, chuỗi bên từ **phenylacetic acid**) và **penicillin V** (phenoxymethyl, từ **phenoxyacetic acid**) được sản xuất thương mại.\n- Nếu lên men **không thêm tiền chất chuỗi bên**: tạo hỗn hợp penicillin tự nhiên, chỉ **benzylpenicillin** tách được."},{"h":"2. Sinh tổng hợp (không qua ribosome)","body":"- Ba amino acid **L-α-aminoadipic acid (AAA), L-cysteine, L-valine** → **ACV synthetase** nối thành **tripeptide ACV** (δ-(L-α-aminoadipyl)-L-cysteinyl-D-valine) – **không qua ribosome**.\n- **Isopenicillin N synthase** đóng vòng (cần **O₂**) → **isopenicillin N** (có vòng β-lactam + thiazolidine).\n- **Acyltransferase** thay chuỗi bên aminoadipyl bằng chuỗi bên từ tiền chất (vd phenylacetyl-CoA) → **penicillin G**.\n- Tài liệu ghi \"cystine\" – đúng là **L-cysteine** (hình minh họa). [hiệu chỉnh]"},{"h":"3. Sinh tổng hợp định hướng vs bán tổng hợp","body":"| Khái niệm | Cách làm | Ví dụ |\n|---|---|---|\n| **Định hướng sinh tổng hợp (precursor feeding)** | thêm **tiền chất chuỗi bên** vào môi trường lên men | **phenylacetic acid → penicillin G** (thay vì penicillin K); phenoxyacetic acid → penicillin V |\n| **Bán tổng hợp (semi-synthetic)** | lấy penicillin lên men → **penicillin acylase** (thường từ *E. coli*, **cố định trên cột**) cắt chuỗi bên → **6-APA** → gắn chuỗi bên mới bằng hóa học | ampicillin, amoxicillin, methicillin |\n\n- Penicillin bán tổng hợp cải thiện: **bền acid**, **kháng β-lactamase** (mã hóa trên plasmid hoặc NST), **phổ kháng khuẩn rộng hơn**.\n- Tài liệu gọi cả penicillin nhờ tiền chất là \"semi-synthetic\"; chính xác hơn phân biệt như bảng."},{"h":"4. Cơ chế tác dụng và penicillinase","body":"- Penicillin gắn **PBP (penicillin-binding proteins) / transpeptidase** → ức chế **tạo liên kết chéo peptidoglycan** → thành tế bào yếu → **ly giải** khi vi khuẩn đang sinh trưởng (liên hệ BAC-03).\n- Hoạt tính chủ yếu trên **vi khuẩn Gram dương**; người không có peptidoglycan → độc tính chọn lọc; không có tác dụng với virus.\n- **Penicillinase (β-lactamase)**: **thủy phân vòng β-lactam** → **penicilloic acid** mất hoạt tính (tài liệu ghi nhầm \"carboxylated\"). Vi sinh vật tạo penicillinase phân bố rộng → **nhiễm tạp là trở ngại chính** trong lên men penicillin."},{"h":"5. Chủng, giống và bảo quản","body":"- Chủng năng suất cao phát triển từ ***P. chrysogenum*** hoang dại bằng **chọn lọc di truyền tuần tự** (đột biến UV, X-ray, nitrogen mustard...). *P. chrysogenum* **tốt hơn *P. notatum*** và **phù hợp lên men chìm**. (Chủng công nghiệp nay được xác định là *P. rubens*.)\n- Chủng năng suất cao **không ổn định di truyền** – năng suất càng cao càng kém ổn định → bảo quản: **huyền phù bào tử đông lạnh trong nitơ lỏng**; **đông khô**; **trộn đất/cát vô trùng rồi làm khô**.\n- **Nhân giống (inoculum)**: bào tử huyền phù trong nước hoặc **sodium lauryl sulfate 1:10.000** (chất thấm ướt vì bào tử **kỵ nước**) → bình → thùng giống; **24–27 °C, 2 ngày**, khuấy + sục khí để hệ sợi phát triển mạnh."},{"h":"6. Lên men sản xuất","body":"- **Hiếu khí**; sục khí **0,5–1,0 vvm**; **lên men chìm fed-batch trong bồn khuấy (stirred tank)**; **25–27 °C**; bồn **40.000–200.000 L** (lớn hơn khó cấp O₂).\n- **Môi trường**: phải cho (1) hệ sợi phát triển mạnh, (2) tích lũy kháng sinh tối đa, (3) chiết tách dễ, rẻ.\n  - Nguồn C: **lactose** (dùng chậm – tránh kìm hãm do glucose); glucose, sucrose, glycerol, sorbitol cũng dùng được (cấp từ từ).\n  - Nguồn N: amoni sulfate/acetate/nitrate; **corn steep liquor (dịch ngâm ngô)** – giàu amino acid, khoáng → hệ sợi và bào tử phát triển mạnh.\n  - Khoáng: K, P (KH₂PO₄), Mg, Fe, Cu (sulfate), S, Zn.\n  - **Tiền chất** phenylacetic acid (cấp dần vì độc ở nồng độ cao).\n- **Động học**: **pha sinh trưởng ~10 h**, **thời gian nhân đôi 6 h** → phần lớn sinh khối; O₂ quan trọng vì **độ nhớt tăng cản truyền O₂**. Sau đó **pha sản xuất** – tăng trưởng bị hạn chế bằng **cấp liệu** → penicillin tăng **tuyến tính từ ~48 đến 96 h**; pha sản xuất kéo dài **120–180 h**.\n- Năng suất cuối **3–5%** (so với carbohydrate tiêu thụ) ≈ **1500 IU/mL**.\n- Lên men **liên tục khó** do chủng không ổn định → hệ **\"batch fill and draw\"**: rút **20–40%** dịch, thay môi trường mới, lặp **đến 10 lần**.\n\n| Pha | Trophophase | Idiophase |\n|---|---|---|\n| Hoạt động chính | sinh trưởng hệ sợi | tạo penicillin |\n| Cấp liệu | dư dinh dưỡng | **cấp hạn chế** (fed-batch) |\n| O₂ | cần nhiều | vẫn cần (hô hấp + bước đóng vòng) |"},{"h":"7. Chiết tách và tinh sạch","body":"1. **Loại hệ sợi** (lọc chân không quay); penicillin **tiết ra môi trường**, **< 1%** gắn hệ sợi.\n2. **Acid hóa dịch đến pH 2,0–2,5** (H₃PO₄ hoặc H₂SO₄) → penicillin ở **dạng acid không ion hóa** (tài liệu ghi \"anionic\" là sai) → **chiết ngay** vào **dung môi hữu cơ**: **amyl acetate, butyl acetate, methyl isobutyl ketone**; làm **nhanh** vì penicillin **kém bền ở pH thấp**; thiết bị **Podbielniak counter-current extractor** (chiết ngược dòng).\n3. **Chiết ngược vào nước** bằng KOH/NaOH, **pH 7,0–7,5** (dạng muối ion hóa tan trong nước).\n4. Lặp acid hóa – chiết để tinh sạch; thu **sodium penicillin**; dung môi thu hồi bằng **chưng cất**.\n5. **Xử lý dịch thô**: **than hoạt tính** loại **pyrogen** (chất gây sốt); **lọc Seitz** loại vi khuẩn; **kết tinh** → bột trong lọ vô trùng, viên nén, siro.\n\n> **Thu hồi chung = tích các hệ số thu hồi từng bước** (vd 0,90 × 0,80 × 0,95 = 68,4%)."},{"h":"8. Ứng dụng","body":"- Chủ yếu diệt **vi khuẩn Gram dương** (ức chế tổng hợp thành) – điều trị nhiễm khuẩn ở người (liên cầu, phế cầu, giang mai…).\n- Penicillin cấp dược dùng làm nguyên liệu sản xuất **penicillin bán tổng hợp**."}],"extension":[{"h":"Kháng kháng sinh","body":"Vi khuẩn tiết **β-lactamase** (vd *Staphylococcus aureus*), thay đổi PBP (**MRSA** – PBP2a), giảm porin (Gram âm). Giải pháp: phối hợp **chất ức chế β-lactamase** (amoxicillin + **clavulanic acid** = Augmentin), dùng kháng sinh hợp lý. Việt Nam nằm trong nhóm nước có tỉ lệ kháng kháng sinh cao – liên hệ HIS-04 (Fleming đã cảnh báo từ 1945)."}],"keyCards":[{"title":"Structure and biosynthesis","bodyEn":"Natural penicillin nucleus **6-APA** = **thiazolidine ring fused to a β-lactam ring**; penicillins differ in the **R side chain** (amide link). Non-ribosomal: **L-α-aminoadipate + L-cysteine + L-valine → ACV tripeptide → isopenicillin N (O₂-dependent) → penicillin G** via acyltransferase. *P. notatum* → penicillin F; *P. chrysogenum* → penicillin K without precursor, **penicillin G with phenylacetic acid**.","glossVi":"6-APA; tiền chất phenylacetic."},{"title":"Fermentation","bodyEn":"**Aerobic, fed-batch submerged** fermentation in stirred tanks (40,000–200,000 L), **0.5–1.0 vvm**, **25–27 °C**. Medium: **lactose**, ammonium salts, **corn steep liquor**, minerals, precursor. Growth ~10 h (doubling 6 h); production phase 120–180 h (linear 48–96 h); yield 3–5% (~1500 IU/mL). High-yield strains are genetically unstable (store in liquid N₂, lyophilized, or on soil/sand). **Penicillinase** contamination is the main constraint.","glossVi":"Fed-batch, lactose, CSL."},{"title":"Recovery","bodyEn":"Remove mycelium (penicillin excreted; <1% bound). Acidify to **pH 2.0–2.5**, extract quickly into **amyl/butyl acetate or MIBK** (Podbielniak counter-current), back-extract into water at **pH 7.0–7.5** with KOH/NaOH; repeat; **sodium penicillin**; **charcoal removes pyrogens**, Seitz filtration, crystallization. **Penicillin acylase** (immobilized, *E. coli*) removes side chains → 6-APA → **semi-synthetic** penicillins (acid-stable, β-lactamase-resistant, broader spectrum).","glossVi":"Chiết pH 2–2,5 rồi pH 7–7,5."}],"traps":["6-APA is the complete penicillin G molecule","Penicillinase removes the side chain to give 6-APA","Penicillin production is anaerobic","Penicillin is extracted into solvent at pH 7.5"]}],"vocab":[{"unit":"HIS-01","term":"microorganism","vi":"vi sinh vật","def":"An organism too small to be seen clearly with the naked eye.","example":"Bacteria, yeasts and protozoa are microorganisms.","aliases":["microorganisms","microbe","microbes"]},{"unit":"HIS-01","term":"animalcules","vi":"\"động vật li ti\" (tên Leeuwenhoek gọi vi sinh vật)","def":"Leeuwenhoek's word for the living microbes he saw.","example":"Leeuwenhoek described animalcules in rainwater.","aliases":["animalcule"]},{"unit":"HIS-01","term":"cell theory","vi":"học thuyết tế bào","def":"All living things are composed of cells, and cells arise from pre-existing cells.","example":"Hooke's cork observation opened the way to the cell theory.","aliases":[]},{"unit":"HIS-01","term":"prokaryote","vi":"sinh vật nhân sơ","def":"A cell without a membrane-bound nucleus (bacteria, archaea).","example":"E. coli is a prokaryote.","aliases":["prokaryotes","prokaryotic"]},{"unit":"HIS-01","term":"eukaryote","vi":"sinh vật nhân thực","def":"A cell with a membrane-bound nucleus and organelles.","example":"Yeasts and molds are eukaryotes.","aliases":["eukaryotes","eukaryotic"]},{"unit":"HIS-01","term":"resolution","vi":"độ phân giải","def":"The ability of a lens to distinguish two close points as separate.","example":"The resolution of a light microscope is about 0.2 μm.","aliases":["resolving power"]},{"unit":"HIS-01","term":"virus","vi":"virus","def":"An acellular infectious particle that replicates only inside a host cell.","example":"A virus has no ribosomes.","aliases":["viruses"]},{"unit":"HIS-02","term":"spontaneous generation","vi":"thuyết tự sinh","def":"The idea that life can arise from nonliving matter.","example":"Needham believed microbes arose by spontaneous generation.","aliases":["abiogenesis"]},{"unit":"HIS-02","term":"biogenesis","vi":"thuyết sinh học (sự sống sinh từ sự sống)","def":"Living cells arise only from preexisting living cells (Virchow, 1858).","example":"Pasteur's flasks supported biogenesis.","aliases":[]},{"unit":"HIS-02","term":"swan-neck flask","vi":"bình cổ cong (cổ thiên nga)","def":"Pasteur's S-shaped flask that lets air in but traps dust and microbes.","example":"The broth in the swan-neck flask stayed sterile.","aliases":["S-shaped flask","S-neck flask"]},{"unit":"HIS-02","term":"vital force","vi":"sinh lực","def":"A hypothetical force in air that supporters of spontaneous generation believed was needed for life to arise.","example":"Needham said heat destroyed the vital force.","aliases":[]},{"unit":"HIS-02","term":"aseptic technique","vi":"kỹ thuật vô trùng","def":"Procedures that prevent contamination of sterile materials and cultures.","example":"Flaming the tube mouth is part of aseptic technique.","aliases":["aseptic"]},{"unit":"HIS-02","term":"turbid","vi":"đục (do vi sinh vật mọc)","def":"Cloudy; in broth it usually indicates microbial growth.","example":"The broth became turbid after two days.","aliases":[]},{"unit":"HIS-03","term":"fermentation","vi":"lên men","def":"Conversion of sugar to products such as alcohol by microbes, originally without air.","example":"Yeast fermentation produces ethanol and CO2.","aliases":[]},{"unit":"HIS-03","term":"pasteurization","vi":"thanh trùng (pasteur hóa)","def":"Mild heating that kills spoilage organisms and pathogens without damaging product quality.","example":"Milk pasteurization uses 72 °C for 15 s.","aliases":["pasteurize","pasteurized"]},{"unit":"HIS-03","term":"germ theory","vi":"thuyết mầm bệnh","def":"The theory that microorganisms cause many diseases.","example":"Koch's work supported the germ theory.","aliases":["germ theory of disease"]},{"unit":"HIS-03","term":"pathogen","vi":"tác nhân gây bệnh","def":"A microorganism that causes disease.","example":"Bacillus anthracis is a pathogen.","aliases":["pathogens","pathogenic"]},{"unit":"HIS-03","term":"Koch's postulates","vi":"các định đề Koch","def":"Experimental steps that relate a specific microbe to a specific disease.","example":"Koch's postulates require a pure culture.","aliases":[]},{"unit":"HIS-03","term":"pure culture","vi":"nuôi cấy thuần","def":"A culture containing only one kind of microorganism.","example":"A single colony gives a pure culture.","aliases":[]},{"unit":"HIS-03","term":"anthrax","vi":"bệnh than","def":"Disease caused by Bacillus anthracis.","example":"Koch linked anthrax to Bacillus anthracis in 1876.","aliases":[]},{"unit":"HIS-03","term":"Golden Age of Microbiology","vi":"thời kỳ vàng của vi sinh vật học","def":"The period 1857–1914 of rapid discoveries in microbiology.","example":"Koch's postulates date from the Golden Age of Microbiology.","aliases":["Golden Age"]},{"unit":"HIS-04","term":"vaccination","vi":"chủng ngừa, tiêm vaccine","def":"Inducing immunity by exposing the body to a harmless form of a pathogen.","example":"Jenner's vaccination protected against smallpox.","aliases":["vaccinate"]},{"unit":"HIS-04","term":"vaccine","vi":"vaccine","def":"A preparation that induces immunity to a disease.","example":"Pasteur's attenuated cultures were vaccines.","aliases":["vaccines"]},{"unit":"HIS-04","term":"immunity","vi":"miễn dịch","def":"The body's ability to resist a specific disease.","example":"Vaccination produces immunity.","aliases":[]},{"unit":"HIS-04","term":"attenuated","vi":"giảm độc lực","def":"Weakened so it no longer causes disease but still induces immunity.","example":"Old cholera cultures became attenuated.","aliases":["attenuation"]},{"unit":"HIS-04","term":"chemotherapy","vi":"hóa trị liệu","def":"Treatment of disease with chemical substances.","example":"Salvarsan was an early chemotherapy agent.","aliases":[]},{"unit":"HIS-04","term":"antibiotic","vi":"kháng sinh","def":"A substance produced by a microorganism that inhibits other microorganisms.","example":"Penicillin is an antibiotic.","aliases":["antibiotics"]},{"unit":"HIS-04","term":"penicillin","vi":"penicillin","def":"A β-lactam antibiotic from Penicillium that blocks peptidoglycan cross-linking.","example":"Penicillin was industrialized after 1940.","aliases":[]},{"unit":"HIS-04","term":"antibiotic resistance","vi":"kháng kháng sinh","def":"The ability of microbes to survive an antibiotic.","example":"Overuse of drugs selects for antibiotic resistance.","aliases":["antibiotic-resistant"]},{"unit":"HIS-04","term":"selective toxicity","vi":"độc tính chọn lọc","def":"Harming the microbe without harming the host.","example":"Ehrlich's magic bullet relied on selective toxicity.","aliases":["magic bullet"]},{"unit":"BAC-01","term":"coccus","vi":"cầu khuẩn","def":"A spherical bacterium.","example":"Staphylococcus is a coccus.","aliases":["cocci"]},{"unit":"BAC-01","term":"bacillus","vi":"trực khuẩn (hình que)","def":"A rod-shaped bacterium (shape term, lowercase).","example":"E. coli is a bacillus but not in the genus Bacillus.","aliases":["bacilli"]},{"unit":"BAC-01","term":"vibrio","vi":"phẩy khuẩn","def":"A curved, comma-shaped rod.","example":"Vibrio cholerae is a vibrio.","aliases":[]},{"unit":"BAC-01","term":"spirillum","vi":"xoắn khuẩn cứng","def":"A rigid helical bacterium that moves with external flagella.","example":"A spirillum has a corkscrew shape.","aliases":["spirilla"]},{"unit":"BAC-01","term":"spirochete","vi":"xoắn khuẩn mềm (xoắn thể)","def":"A flexible helical bacterium that moves with axial filaments.","example":"Treponema pallidum is a spirochete.","aliases":["spirochetes"]},{"unit":"BAC-01","term":"staphylococci","vi":"tụ cầu (cầu khuẩn chùm)","def":"Cocci arranged in grape-like clusters.","example":"Staphylococci divide in random planes.","aliases":["staphylococcus"]},{"unit":"BAC-01","term":"streptococci","vi":"liên cầu (cầu khuẩn chuỗi)","def":"Cocci arranged in chains.","example":"Streptococci divide in one plane.","aliases":["streptococcus"]},{"unit":"BAC-01","term":"tetrad","vi":"tứ cầu","def":"Four cocci formed by division in two planes.","example":"Micrococcus may form tetrads.","aliases":["tetrads"]},{"unit":"BAC-01","term":"sarcinae","vi":"bát cầu (khối 8)","def":"Cube-like packets of eight cocci formed by division in three planes.","example":"Sarcinae look like cubes.","aliases":["sarcina"]},{"unit":"BAC-01","term":"pleomorphic","vi":"đa hình","def":"Able to take many shapes.","example":"Corynebacterium is pleomorphic.","aliases":["monomorphic"]},{"unit":"BAC-02","term":"glycocalyx","vi":"lớp glycocalyx (lớp vỏ đường ngoài)","def":"A sticky polysaccharide/polypeptide layer outside the cell wall.","example":"The glycocalyx helps bacteria stick to teeth.","aliases":[]},{"unit":"BAC-02","term":"capsule","vi":"vỏ nhầy (bao)","def":"An organized glycocalyx firmly attached to the cell wall.","example":"The capsule protects S. pneumoniae from phagocytosis.","aliases":["capsules"]},{"unit":"BAC-02","term":"slime layer","vi":"lớp nhầy","def":"An unorganized, loosely attached glycocalyx.","example":"A slime layer is easily washed off.","aliases":[]},{"unit":"BAC-02","term":"biofilm","vi":"màng sinh học","def":"A community of microbes attached to a surface within an extracellular matrix.","example":"Dental plaque is a biofilm.","aliases":["biofilms"]},{"unit":"BAC-02","term":"EPS","vi":"chất polymer ngoại bào","def":"Extracellular polymeric substance; the glycocalyx of a biofilm.","example":"EPS protects cells within a biofilm.","aliases":["extracellular polymeric substance"]},{"unit":"BAC-02","term":"virulence","vi":"độc lực","def":"The degree to which a pathogen causes disease.","example":"Capsules increase virulence.","aliases":[]},{"unit":"BAC-02","term":"phagocytosis","vi":"thực bào","def":"Engulfment of particles or microbes by a cell such as a white blood cell.","example":"Capsules resist phagocytosis.","aliases":[]},{"unit":"BAC-02","term":"flagella","vi":"roi (tiên mao)","def":"Long rotating appendages that propel bacteria.","example":"Peritrichous flagella cover E. coli.","aliases":["flagellum","peritrichous","monotrichous","lophotrichous","amphitrichous"]},{"unit":"BAC-02","term":"archaella","vi":"roi của vi khuẩn cổ","def":"ATP-driven rotating motility structures of archaea.","example":"Archaella differ from bacterial flagella.","aliases":["archaellum"]},{"unit":"BAC-02","term":"axial filament","vi":"sợi trục","def":"Endoflagella under the outer sheath of spirochetes.","example":"Axial filaments give spirochetes a corkscrew motion.","aliases":["axial filaments","endoflagella"]},{"unit":"BAC-02","term":"fimbriae","vi":"tiêm mao (lông bám)","def":"Short, numerous, hairlike appendages used for attachment.","example":"Fimbriae help N. gonorrhoeae attach.","aliases":["fimbria"]},{"unit":"BAC-02","term":"pili","vi":"lông giới tính (pilus)","def":"Longer appendages (1–2 per cell) that join cells for DNA transfer.","example":"A pilus connects two cells before conjugation.","aliases":["pilus","sex pilus"]},{"unit":"BAC-02","term":"taxis","vi":"tính hướng (hóa hướng động…)","def":"Movement toward or away from a stimulus.","example":"Chemotaxis is a type of taxis.","aliases":["chemotaxis","phototaxis"]},{"unit":"BAC-03","term":"cell wall","vi":"thành tế bào","def":"A rigid layer outside the plasma membrane that gives shape and prevents osmotic lysis.","example":"The bacterial cell wall contains peptidoglycan.","aliases":[]},{"unit":"BAC-03","term":"peptidoglycan","vi":"peptidoglycan (murein)","def":"A mesh of NAG–NAM chains cross-linked by peptides.","example":"Gram-positive walls have many layers of peptidoglycan.","aliases":["murein"]},{"unit":"BAC-03","term":"NAG","vi":"N-acetylglucosamine","def":"One of the two sugars of the peptidoglycan backbone.","example":"NAG alternates with NAM.","aliases":["N-acetylglucosamine"]},{"unit":"BAC-03","term":"NAM","vi":"N-acetylmuramic acid","def":"The peptidoglycan sugar that carries the tetrapeptide.","example":"The tetrapeptide is attached to NAM.","aliases":["N-acetylmuramic acid"]},{"unit":"BAC-03","term":"transpeptidase","vi":"enzyme transpeptidase","def":"The enzyme that forms peptide cross-bridges; target of penicillin.","example":"Penicillin inactivates transpeptidase.","aliases":[]},{"unit":"BAC-03","term":"lysozyme","vi":"lysozyme","def":"An enzyme that hydrolyzes the β-1,4 bond between NAM and NAG.","example":"Lysozyme in tears attacks peptidoglycan.","aliases":[]},{"unit":"BAC-03","term":"teichoic acid","vi":"acid teichoic","def":"Polymers of glycerol or ribitol and phosphate in Gram-positive walls.","example":"Teichoic acids bind cations.","aliases":["teichoic acids","lipoteichoic acid","wall teichoic acid"]},{"unit":"BAC-03","term":"mycolic acid","vi":"acid mycolic","def":"A waxy lipid forming about 60% of the Mycobacterium wall.","example":"Mycolic acid makes Mycobacterium acid-fast.","aliases":[]},{"unit":"BAC-03","term":"acid-fast","vi":"kháng acid","def":"Retaining carbolfuchsin after acid-alcohol decolorization.","example":"Mycobacterium tuberculosis is acid-fast.","aliases":[]},{"unit":"BAC-03","term":"protoplast","vi":"thể nguyên sinh (protoplast)","def":"A wall-less Gram-positive cell.","example":"Lysozyme converts Gram-positive cells into protoplasts.","aliases":["spheroplast"]},{"unit":"BAC-04","term":"outer membrane","vi":"màng ngoài","def":"The lipid bilayer outside the thin peptidoglycan of Gram-negative bacteria.","example":"The outer membrane blocks lysozyme.","aliases":[]},{"unit":"BAC-04","term":"lipopolysaccharide","vi":"lipopolysaccharide (LPS)","def":"Molecule of lipid A, core polysaccharide and O polysaccharide in the outer membrane.","example":"LPS gives the outer membrane a negative charge.","aliases":["LPS"]},{"unit":"BAC-04","term":"lipid A","vi":"lipid A","def":"The lipid portion of LPS; an endotoxin.","example":"Lipid A causes fever.","aliases":[]},{"unit":"BAC-04","term":"endotoxin","vi":"nội độc tố","def":"Lipid A released from Gram-negative cells; causes fever and shock.","example":"Endotoxin is heat-stable.","aliases":["endotoxins"]},{"unit":"BAC-04","term":"porin","vi":"porin (kênh màng ngoài)","def":"A protein channel in the outer membrane for small molecules.","example":"Amino acids pass through porins.","aliases":["porins"]},{"unit":"BAC-04","term":"periplasmic space","vi":"khoang chu chất","def":"The space between the plasma membrane and the outer membrane.","example":"The periplasmic space contains degrading enzymes.","aliases":["periplasm"]},{"unit":"BAC-04","term":"Gram stain","vi":"nhuộm Gram","def":"Differential stain: crystal violet, iodine, alcohol, safranin.","example":"Gram-positive cells stay purple after the Gram stain.","aliases":["Gram-positive","Gram-negative"]},{"unit":"BAC-04","term":"counterstain","vi":"thuốc nhuộm phụ","def":"The second dye (safranin) that colors decolorized cells.","example":"Safranin is the counterstain.","aliases":[]},{"unit":"BAC-04","term":"mordant","vi":"chất cẩn màu","def":"A substance (iodine) that intensifies or fixes a stain.","example":"Iodine is the mordant in the Gram stain.","aliases":[]},{"unit":"BAC-04","term":"complement","vi":"bổ thể","def":"Host proteins that lyse cells and promote phagocytosis.","example":"The outer membrane helps evade complement.","aliases":[]},{"unit":"BAC-05","term":"plasma membrane","vi":"màng sinh chất","def":"The phospholipid bilayer with proteins that encloses the cytoplasm.","example":"Polymyxin damages the plasma membrane.","aliases":["cytoplasmic membrane"]},{"unit":"BAC-05","term":"phospholipid","vi":"phospholipid","def":"A lipid with a polar phosphate head and nonpolar fatty-acid tails.","example":"Phospholipids form a bilayer.","aliases":["phospholipids"]},{"unit":"BAC-05","term":"fluid mosaic","vi":"mô hình khảm lỏng","def":"Model in which membrane lipids and proteins move freely.","example":"The fluid mosaic model describes membranes.","aliases":["fluid mosaic model"]},{"unit":"BAC-05","term":"integral protein","vi":"protein xuyên màng","def":"A protein embedded in or spanning the membrane.","example":"Integral proteins form transport channels.","aliases":["integral proteins","peripheral protein","peripheral proteins"]},{"unit":"BAC-05","term":"selective permeability","vi":"tính thấm chọn lọc","def":"Allowing some substances to pass while blocking others.","example":"Selective permeability is a key membrane function.","aliases":["semipermeability","semipermeable"]},{"unit":"BAC-05","term":"chromatophores","vi":"thể mang sắc tố","def":"Membrane infoldings holding photosynthetic pigments in some bacteria.","example":"Photosynthetic enzymes lie in chromatophores.","aliases":["chromatophore"]},{"unit":"BAC-05","term":"simple diffusion","vi":"khuếch tán đơn giản","def":"Net movement from high to low concentration directly through the lipid bilayer.","example":"O2 enters by simple diffusion.","aliases":[]},{"unit":"BAC-05","term":"facilitated diffusion","vi":"khuếch tán được hỗ trợ","def":"Passive movement down a gradient through a carrier protein (permease).","example":"Glucose can enter by facilitated diffusion.","aliases":[]},{"unit":"BAC-05","term":"permease","vi":"permease (protein vận chuyển)","def":"A transporter protein that carries a solute across the membrane.","example":"Permeases carry amino acids.","aliases":["permeases"]},{"unit":"BAC-05","term":"osmosis","vi":"thẩm thấu","def":"Net movement of water across a selectively permeable membrane toward higher solute.","example":"Osmosis causes plasmolysis in salt.","aliases":[]},{"unit":"BAC-05","term":"hypertonic","vi":"ưu trương","def":"A solution with a higher solute concentration than the cell.","example":"Hypertonic salt solutions cause plasmolysis.","aliases":["hypotonic","isotonic"]},{"unit":"BAC-05","term":"plasmolysis","vi":"co nguyên sinh","def":"Shrinkage of the cytoplasm due to water loss.","example":"Salt causes plasmolysis.","aliases":[]},{"unit":"BAC-05","term":"active transport","vi":"vận chuyển chủ động","def":"Energy-requiring transport against a gradient using carrier proteins.","example":"Active transport accumulates nutrients.","aliases":[]},{"unit":"BAC-05","term":"group translocation","vi":"chuyển vị nhóm","def":"Transport in which the substance is chemically modified (e.g., phosphorylated) during transport.","example":"Glucose enters E. coli by group translocation.","aliases":[]},{"unit":"BAC-06","term":"cytoplasm","vi":"tế bào chất","def":"The substance inside the plasma membrane, about 80% water.","example":"Inclusions lie in the cytoplasm.","aliases":["cytosol"]},{"unit":"BAC-06","term":"nucleoid","vi":"vùng nhân","def":"The region containing the bacterial chromosome, without a membrane.","example":"The nucleoid holds circular DNA.","aliases":[]},{"unit":"BAC-06","term":"plasmid","vi":"plasmid","def":"Small circular extrachromosomal DNA that replicates independently.","example":"R plasmids carry resistance genes.","aliases":["plasmids"]},{"unit":"BAC-06","term":"ribosome","vi":"ribosome","def":"The site of protein synthesis; 70S in bacteria, 80S in eukaryotes.","example":"Bacterial ribosomes are 70S.","aliases":["ribosomes","70S","80S"]},{"unit":"BAC-06","term":"inclusions","vi":"thể vùi","def":"Reserve deposits or specialized structures in the cytoplasm.","example":"Volutin is an inclusion.","aliases":["inclusion"]},{"unit":"BAC-06","term":"volutin","vi":"hạt volutin (hạt dị sắc)","def":"Phosphate reserve granules that stain red with methylene blue.","example":"Volutin granules are metachromatic.","aliases":["metachromatic granules"]},{"unit":"BAC-06","term":"carboxysome","vi":"carboxysome","def":"Inclusion containing ribulose 1,5-diphosphate carboxylase for CO2 fixation.","example":"Cyanobacteria have carboxysomes.","aliases":["carboxysomes"]},{"unit":"BAC-06","term":"gas vacuole","vi":"không bào khí","def":"Inclusion of gas vesicles that provides buoyancy.","example":"Gas vacuoles help cells float.","aliases":["gas vacuoles"]},{"unit":"BAC-06","term":"magnetosome","vi":"thể từ","def":"Inclusion containing iron oxide (Fe3O4) that orients cells in a magnetic field.","example":"Magnetosomes act like a compass.","aliases":["magnetosomes"]},{"unit":"BAC-06","term":"endospore","vi":"nội bào tử","def":"A resistant dormant structure formed inside some Gram-positive bacteria.","example":"Clostridium botulinum forms endospores.","aliases":["endospores"]},{"unit":"BAC-06","term":"sporulation","vi":"sự tạo bào tử","def":"The process of endospore formation.","example":"Sporulation starts when nutrients are depleted.","aliases":["sporogenesis"]},{"unit":"BAC-06","term":"germination","vi":"sự nảy mầm (bào tử)","def":"Return of an endospore to the vegetative state.","example":"Heat can trigger germination.","aliases":[]},{"unit":"BAC-06","term":"vegetative cell","vi":"tế bào sinh dưỡng","def":"An actively growing cell, as opposed to a spore.","example":"An endospore germinates into a vegetative cell.","aliases":["vegetative cells"]},{"unit":"BAC-06","term":"dipicolinic acid","vi":"acid dipicolinic","def":"A compound that, with calcium, protects the endospore core.","example":"Dipicolinic acid contributes to heat resistance.","aliases":[]},{"unit":"BAC-07","term":"binary fission","vi":"phân đôi","def":"Division of one cell into two identical daughter cells.","example":"E. coli reproduces by binary fission.","aliases":[]},{"unit":"BAC-07","term":"budding","vi":"nảy chồi","def":"Reproduction by an outgrowth that enlarges and separates.","example":"Hyphomicrobium reproduces by budding.","aliases":[]},{"unit":"BAC-07","term":"fragmentation","vi":"đứt đoạn","def":"Breaking of filaments into pieces that grow into new cells.","example":"Filamentous bacteria can reproduce by fragmentation.","aliases":[]},{"unit":"BAC-07","term":"conjugation","vi":"tiếp hợp","def":"Transfer of DNA between cells through direct contact via a pilus.","example":"Conjugation can spread plasmids.","aliases":[]},{"unit":"BAC-07","term":"transformation","vi":"biến nạp","def":"Uptake of free DNA from the environment.","example":"Griffith observed transformation.","aliases":[]},{"unit":"BAC-07","term":"transduction","vi":"tải nạp","def":"Transfer of bacterial DNA by a bacteriophage.","example":"Transduction requires a phage.","aliases":[]},{"unit":"BAC-07","term":"Bergey's Manual","vi":"Cẩm nang Bergey","def":"The reference for bacterial classification and identification.","example":"Bergey's Manual groups bacteria by Gram reaction and shape.","aliases":["Bergey's Manual of Systematic Bacteriology"]},{"unit":"BAC-07","term":"16S rRNA","vi":"rRNA 16S","def":"The RNA of the small ribosomal subunit used to infer bacterial phylogeny.","example":"16S rRNA sequences define the three domains.","aliases":["rRNA"]},{"unit":"BAC-07","term":"phylogeny","vi":"phát sinh chủng loại","def":"The evolutionary history of a group of organisms.","example":"rRNA reveals bacterial phylogeny.","aliases":["phylogenetic"]},{"unit":"BAC-07","term":"Proteobacteria","vi":"ngành Proteobacteria","def":"A large phylum of mostly Gram-negative bacteria.","example":"E. coli belongs to the Proteobacteria.","aliases":[]},{"unit":"BAC-07","term":"Firmicutes","vi":"ngành Firmicutes","def":"Gram-positive bacteria with low G+C content.","example":"Bacillus is in the Firmicutes.","aliases":["Actinobacteria"]},{"unit":"BAC-07","term":"domain","vi":"miền (bậc phân loại cao nhất)","def":"The highest taxon: Bacteria, Archaea or Eukarya.","example":"Woese proposed three domains.","aliases":["domains"]},{"unit":"BAC-08","term":"archaea","vi":"vi khuẩn cổ","def":"Prokaryotes of the domain Archaea, lacking peptidoglycan.","example":"Many archaea live in extreme environments.","aliases":["archaeon","Archaea"]},{"unit":"BAC-08","term":"pseudomurein","vi":"pseudomurein (giả peptidoglycan)","def":"Archaeal wall polymer with NAT instead of NAM and no D-amino acids.","example":"Lysozyme cannot digest pseudomurein.","aliases":["pseudopeptidoglycan"]},{"unit":"BAC-08","term":"ether lipid","vi":"lipid liên kết ether","def":"Membrane lipid with branched isoprenoid chains ether-linked to glycerol.","example":"Archaeal membranes are made of ether lipids.","aliases":["ether-linked"]},{"unit":"BAC-08","term":"methanogen","vi":"vi sinh vật sinh methane","def":"Anaerobic archaeon that produces methane.","example":"Methanogens work in biogas digesters.","aliases":["methanogens"]},{"unit":"BAC-08","term":"extreme halophile","vi":"vi sinh vật cực ưa mặn","def":"An organism requiring very high salt concentrations.","example":"Halobacterium is an extreme halophile.","aliases":["extreme halophiles"]},{"unit":"BAC-08","term":"hyperthermophile","vi":"vi sinh vật ưa nhiệt cực độ","def":"An organism growing optimally above about 80 °C.","example":"Pyrodictium is a hyperthermophile.","aliases":["extreme thermophile","hyperthermophiles"]},{"unit":"FUN-01","term":"yeast","vi":"nấm men","def":"A unicellular fungus.","example":"Saccharomyces cerevisiae is a baker's yeast.","aliases":["yeasts"]},{"unit":"FUN-01","term":"fission","vi":"phân đôi","def":"Division of one cell into two by a cross wall.","example":"Schizosaccharomyces pombe divides by fission.","aliases":[]},{"unit":"FUN-01","term":"glucan","vi":"glucan","def":"A glucose polymer (β-1,3 with β-1,6 branches) forming the main yeast wall.","example":"Glucan gives the yeast wall strength.","aliases":[]},{"unit":"FUN-01","term":"mannan","vi":"mannan","def":"A mannose polymer linked to proteins (mannoproteins) in the outer yeast wall.","example":"Mannan forms mannoproteins.","aliases":["mannoprotein","mannoproteins"]},{"unit":"FUN-01","term":"chitin","vi":"chitin","def":"A polymer of N-acetylglucosamine (β-1,4); in yeast mainly in bud scars; main wall component of molds.","example":"Chitin is concentrated in bud scars.","aliases":[]},{"unit":"FUN-01","term":"bud scar","vi":"sẹo chồi","def":"A chitin-rich ring left on the mother cell after a bud separates.","example":"Old cells have many bud scars.","aliases":["bud scars"]},{"unit":"FUN-01","term":"invertase","vi":"invertase","def":"Enzyme that splits sucrose into glucose and fructose.","example":"Invertase lies in the periplasmic space.","aliases":[]},{"unit":"FUN-01","term":"ergosterol","vi":"ergosterol","def":"The main sterol of fungal membranes.","example":"Antifungal drugs target ergosterol.","aliases":[]},{"unit":"FUN-01","term":"vacuole","vi":"không bào","def":"Organelle storing enzymes, amino acids, polyphosphate and ions; regulates osmotic pressure.","example":"The yeast vacuole contains proteases.","aliases":[]},{"unit":"FUN-01","term":"peroxisome","vi":"peroxisome","def":"Organelle containing oxidizing enzymes.","example":"Peroxisomes break down hydrogen peroxide.","aliases":[]},{"unit":"FUN-01","term":"mitochondrion","vi":"ty thể","def":"Organelle of respiration with its own DNA.","example":"The citric acid cycle occurs in the mitochondrion.","aliases":["mitochondria"]},{"unit":"FUN-01","term":"cytoskeleton","vi":"bộ khung tế bào","def":"Network of microtubules and microfilaments.","example":"The cytoskeleton moves organelles.","aliases":[]},{"unit":"FUN-02","term":"facultative anaerobe","vi":"kỵ khí tùy nghi","def":"An organism that uses O2 when present but can grow without it by fermentation.","example":"S. cerevisiae is a facultative anaerobe.","aliases":["facultative anaerobes"]},{"unit":"FUN-02","term":"respiration","vi":"hô hấp","def":"ATP production using an electron transport chain and a final electron acceptor.","example":"Aerobic respiration uses O2.","aliases":["aerobic respiration"]},{"unit":"FUN-02","term":"citric acid cycle","vi":"chu trình acid citric (Krebs)","def":"Mitochondrial cycle oxidizing acetyl-CoA to CO2 and producing NADH and FADH2.","example":"Two acetyl-CoA give 6 NADH in the citric acid cycle.","aliases":["Krebs cycle","TCA cycle"]},{"unit":"FUN-02","term":"acetyl-CoA","vi":"acetyl-CoA","def":"A two-carbon acetyl group carried by coenzyme A; fuel of the citric acid cycle.","example":"Pyruvate is converted to acetyl-CoA.","aliases":[]},{"unit":"FUN-02","term":"mating type","vi":"kiểu giao phối","def":"Genetically determined compatibility class (a or α) of haploid yeast cells.","example":"Cells of opposite mating type fuse.","aliases":["mating types"]},{"unit":"FUN-02","term":"zygote","vi":"hợp tử","def":"Diploid cell formed by fusion of two haploid cel
